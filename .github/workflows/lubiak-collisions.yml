name: LUBIAK player collisions

on:
  push:
    paths:
      - '.lubiak-collisions-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply boy and broom mesh collisions
        run: node scripts/patch-lubiak-collisions.mjs
      - name: Commit collision implementation
        run: |
          if git diff --quiet -- web/lubiak/lubiak.js; then
            echo 'No collision patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js
          git commit -m 'Prevent LUBIAK djinn and broom passing through meshes'
          git pull --rebase origin main
          git push origin HEAD:main
