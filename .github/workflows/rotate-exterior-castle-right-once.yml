name: Rotate exterior castle right once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rotate-exterior-castle-right-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rotate exterior castle 90 degrees right
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/card_castle/castle_jester_overlay.js')
          s = p.read_text()
          old = "castleRoot.rotation.y+=Math.PI;castleRoot.updateMatrixWorld(true);castleRoot.userData.unoPlazaAligned=true;document.body.dataset.castleExteriorAlignment='gate-to-uno-plaza-180deg-v17'"
          new = "castleRoot.rotation.y+=Math.PI/2;castleRoot.updateMatrixWorld(true);castleRoot.userData.unoPlazaAligned=true;document.body.dataset.castleExteriorAlignment='gate-to-uno-plaza-right-90deg-v18'"
          if old not in s:
              raise SystemExit('Expected exterior alignment block not found; refusing broad edit')
          p.write_text(s.replace(old, new, 1))
      - name: Remove one-shot workflow
        run: rm .github/workflows/rotate-exterior-castle-right-once.yml
      - name: Commit fix to latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/card_castle/castle_jester_overlay.js .github/workflows/rotate-exterior-castle-right-once.yml
          git commit -m "Rotate exterior castle 90 degrees right"
          git push origin HEAD:main
