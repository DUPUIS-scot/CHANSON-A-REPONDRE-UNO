name: LUBIAK blackout recovery

on:
  push:
    paths:
      - '.github/workflows/lubiak-blackout-recovery.yml'
      - '.github/lubiak-blackout-recovery-now.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last stable LUBIAK runtime
        run: |
          git checkout 4356fa7c875e79e1d87a5a46ddde51247e5a79b4 -- web/lubiak/lubiak.js
          # Force fresh browser cache while preserving the stable runtime logic.
          sed -i 's/20260829-djinn-player-v1/20260830-blackout-recovery-v1/g' web/lubiak/lubiak.js
      - name: Commit recovery
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js
          git commit -m 'Restore stable LUBIAK runtime after blackout'
          git push
