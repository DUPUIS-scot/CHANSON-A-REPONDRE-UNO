name: LUBIAK capture first share preview v3
on:
  push:
    paths: ['.github/run-lubiak-share-preview-link-v3.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Apply capture-first preview flow
        run: node scripts/patch-lubiak-share-preview-link-v3.mjs
      - name: Validate
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_SHARE_PREVIEW_LINK_V3' web/lubiak/lubiak.js
          grep -q 'SHARE SOCIAL' web/lubiak/lubiak.js
          grep -q 'SAVE PNG' web/lubiak/lubiak.js
      - name: Commit and request deploy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/lubiak/lubiak.js
          if ! git diff --cached --quiet; then git commit -m 'Make LUBIAK sharing capture first with preview'; fi
          printf 'deploy %s\n' "$(date -u +%FT%TZ)" > .github/deploy-now.txt
          git add .github/deploy-now.txt
          git commit -m 'Deploy LUBIAK capture-first share preview'
          git push
