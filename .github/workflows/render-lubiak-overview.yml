name: Render LUBIAK Overview

on:
  push:
    paths:
      - '.github/workflows/render-lubiak-overview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify authoritative LUBIAK asset
        run: |
          set -euo pipefail
          src='assets/models/LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb'
          test -s "$src"
          echo "Rendering $src ($(stat -c%s "$src") bytes)"

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version

      - name: Create render script
        run: |
          cat > /tmp/render_lubiak.py <<'PY'
          import bpy, math, os
          from mathutils import Vector

          src = os.path.abspath('assets/models/LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb')
          out = os.path.abspath('LUBIAK_actual_elevated_overview.png')

          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.gltf(filepath=src)

          pts = []
          for obj in bpy.context.scene.objects:
              if obj.type == 'MESH' and obj.data and len(obj.data.vertices):
                  for c in obj.bound_box:
                      pts.append(obj.matrix_world @ Vector(c))
          if not pts:
              raise RuntimeError('No mesh bounds found after GLB import')

          mins = Vector((min(p.x for p in pts), min(p.y for p in pts), min(p.z for p in pts)))
          maxs = Vector((max(p.x for p in pts), max(p.y for p in pts), max(p.z for p in pts)))
          center = (mins + maxs) * 0.5
          radius = max((p-center).length for p in pts)
          print('BOUNDS_MIN', tuple(round(v,3) for v in mins))
          print('BOUNDS_MAX', tuple(round(v,3) for v in maxs))
          print('CENTER', tuple(round(v,3) for v in center), 'RADIUS', round(radius,3))

          direction = Vector((1.35, -1.55, 1.28)).normalized()
          cam_dist = max(radius * 3.7, 10.0)
          cam_pos = center + direction * cam_dist

          bpy.ops.object.camera_add(location=cam_pos)
          cam = bpy.context.object
          cam.data.lens = 52
          cam.data.sensor_width = 36
          cam.data.clip_start = max(radius / 5000.0, 0.01)
          cam.data.clip_end = max(radius * 20.0, 1000.0)
          cam.rotation_euler = (center - cam.location).to_track_quat('-Z', 'Y').to_euler()
          bpy.context.scene.camera = cam

          world = bpy.context.scene.world or bpy.data.worlds.new('World')
          bpy.context.scene.world = world
          world.use_nodes = True
          bg = world.node_tree.nodes.get('Background')
          bg.inputs['Color'].default_value = (0.055, 0.055, 0.055, 1)
          bg.inputs['Strength'].default_value = 0.5

          bpy.ops.object.light_add(type='SUN', location=center + Vector((0,0,radius*2)))
          sun = bpy.context.object
          sun.rotation_euler = (math.radians(32), math.radians(-18), math.radians(28))
          sun.data.energy = 2.2
          sun.data.angle = math.radians(18)

          for vec, energy, scale in [
              (Vector((-1.5, -0.4, 2.0)), 900, 3.5),
              (Vector((1.2, 1.5, 1.0)), 600, 2.5),
          ]:
              loc = center + vec.normalized() * radius * 2.2
              bpy.ops.object.light_add(type='AREA', location=loc)
              light = bpy.context.object
              light.data.energy = energy
              light.data.shape = 'DISK'
              light.data.size = max(radius * scale, 5.0)
              light.rotation_euler = (center - light.location).to_track_quat('-Z', 'Y').to_euler()

          sc = bpy.context.scene
          sc.render.engine = 'BLENDER_EEVEE'
          sc.eevee.use_gtao = True
          sc.eevee.gtao_distance = max(radius * 0.08, 2.0)
          sc.eevee.gtao_factor = 1.25
          sc.render.resolution_x = 1800
          sc.render.resolution_y = 1350
          sc.render.resolution_percentage = 100
          sc.render.image_settings.file_format = 'PNG'
          sc.render.image_settings.color_mode = 'RGBA'
          sc.render.film_transparent = False
          sc.render.filepath = out
          sc.view_settings.view_transform = 'Standard'
          sc.view_settings.look = 'Medium High Contrast'
          sc.view_settings.exposure = 0.0
          sc.view_settings.gamma = 1.0

          bpy.ops.render.render(write_still=True)
          print('RENDERED', out)
          PY

      - name: Render overview
        run: blender -b --python /tmp/render_lubiak.py

      - name: Upload overview
        uses: actions/upload-artifact@v4
        with:
          name: lubiak-actual-elevated-overview
          path: LUBIAK_actual_elevated_overview.png
          if-no-files-found: error
