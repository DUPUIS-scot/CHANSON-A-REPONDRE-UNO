name: WEB — Deploy Live Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/deploy-now.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: live-web-v3
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require main deployment event
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test -n "${GITHUB_SHA}"
          echo "Deploying main event: ${GITHUB_SHA:0:12}"

      - name: Download source snapshot
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-${GITHUB_SHA}.tar.gz"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" --output "$archive"
          tar -xzf "$archive" --strip-components=1
          rm -f "$archive"

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -d lib
          test -d web/enochian-terminal
          test -d web/enochian-test
          test -d scripts

      - name: Verify LUBIAK runtime integrity
        shell: bash
        run: |
          node --check web/lubiak/lubiak.js
          node --check web/lubiak/freak-street-2-addon.js
          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          def jpeg_size(path):
              data = Path(path).read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise SystemExit('LUBIAK panorama lacks JPEG SOI')
              i = 2
              while i + 4 <= len(data):
                  if data[i] != 0xff:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xff:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xd8, 0xd9) or 0xd0 <= marker <= 0xd7:
                      continue
                  if i + 2 > len(data):
                      break
                  length = struct.unpack('>H', data[i:i+2])[0]
                  if length < 2 or i + length > len(data):
                      raise SystemExit('LUBIAK panorama has a truncated JPEG segment')
                  if marker in (0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf):
                      h, w = struct.unpack('>HH', data[i+3:i+7])
                      return w, h
                  i += length
              raise SystemExit('LUBIAK panorama has no JPEG frame header')

          def glb_document(path):
              data = Path(path).read_bytes()
              magic, version, declared = struct.unpack('<4sII', data[:12])
              if magic != b'glTF' or version != 2 or declared != len(data):
                  raise SystemExit(f'invalid GLB length contract: {path}')
              n, t = struct.unpack('<II', data[12:20])
              return data, json.loads(data[20:20+n].decode().rstrip(' \0'))

          width, height = jpeg_size('web/lubiak/assets/lubiak-kathmandu-360.jpg')
          if (width, height) != (2048, 1024):
              raise SystemExit(f'invalid LUBIAK panorama dimensions: {(width,height)}')

          street, street_doc = glb_document('assets/models/lubiak_freak_street_2_ultralight.glb')
          if len(street_doc.get('meshes', [])) < 2 or len(street_doc.get('nodes', [])) < 10:
              raise SystemExit('Freak Street extension contract incomplete')

          dragon, dragon_doc = glb_document('assets/models/lubiak_dragon_guardian_web.glb')
          if len(dragon) >= 4_000_000 or len(dragon_doc.get('skins', [])) != 1:
              raise SystemExit('Dragon compression/rig contract failed')
          if 'guardian_45s' not in [a.get('name') for a in dragon_doc.get('animations', [])]:
              raise SystemExit('Dragon animation contract failed')
          if 'KHR_draco_mesh_compression' not in dragon_doc.get('extensionsRequired', []):
              raise SystemExit('Dragon Draco compression missing')

          required = {
              'web/vendor/draco/DRACOLoader.js': 10000,
              'web/vendor/draco/draco_decoder.js': 500000,
              'web/vendor/draco/draco_wasm_wrapper.js': 40000,
              'web/vendor/draco/draco_decoder.wasm': 200000,
          }
          for name, minimum in required.items():
              if Path(name).stat().st_size < minimum:
                  raise SystemExit(f'pinned Draco asset incomplete: {name}')

          runtime = Path('web/lubiak/lubiak.js').read_text()
          for contract in [
              "../vendor/draco/DRACOLoader.js",
              "timed out after",
              "renderConfirmedFrame",
              "webglcontextlost",
              "webglcontextrestored",
          ]:
              if contract not in runtime:
                  raise SystemExit(f'LUBIAK runtime contract missing: {contract}')
          print(f'LUBIAK verified: panorama={width}x{height}, street={len(street)}, dragon={len(dragon)}')
          PY

      - name: Verify Enochian source runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repair_enochian_stems.py
          python3 scripts/check_terminal_runtime_consolidation.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run Flutter regression suite
        run: flutter test --no-pub

      - name: Validate production configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          test -n "${AI_BACKEND_URL:-}"
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) exit 1 ;; esac
          case "$AI_BACKEND_URL" in https://*) ;; *) exit 1 ;; esac

      - name: Build Flutter web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
          TURNSTILE_SITE_KEY: 0x4AAAAAAERKLvJuMsQpWZhI
        run: |
          flutter build web --release --no-pub --no-wasm-dry-run --base-href "/" --dart-define=SKIP_AUTH_FOR_DEVELOPMENT=false --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --dart-define=AI_BACKEND_URL="$AI_BACKEND_URL" --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" --dart-define=APP_BUILD_SHA="${{ github.sha }}"

      - name: Promote canonical LUBIAK and geometry-safe Megapole GLBs
        shell: bash
        run: |
          set -euo pipefail
          models="build/web/assets/assets/models"
          safe="assets/models/textured-glb-comparison"
          test -s "assets/models/LUBIAK_master_optimized.glb"
          test -s "$safe/MEGAPOLE_PBR_TERRAIN_UPGRADED_WEB_OPTIMIZED.glb"
          cp "assets/models/LUBIAK_master_optimized.glb" "$models/LUBIAK_master_optimized.glb"
          cp "$safe/MEGAPOLE_PBR_TERRAIN_UPGRADED_WEB_OPTIMIZED.glb" "$models/SILMARI_LLION_MEGAPOLE_LUBIAK.glb"
          cmp -s "assets/models/LUBIAK_master_optimized.glb" "$models/LUBIAK_master_optimized.glb"
          cmp -s "$safe/MEGAPOLE_PBR_TERRAIN_UPGRADED_WEB_OPTIMIZED.glb" "$models/SILMARI_LLION_MEGAPOLE_LUBIAK.glb"
          echo "Promoted canonical baked-PBR LUBIAK and validated Megapole without runtime material rewriting"

      - name: Refresh LUBIAK textured runtime cache
        shell: bash
        run: |
          set -euo pipefail
          token="safe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 - "$token" <<'PY'
          from pathlib import Path
          import re, sys
          token = sys.argv[1]
          js_path = Path('build/web/lubiak/lubiak.js')
          html_path = Path('build/web/lubiak/index.html')
          js = js_path.read_text()
          js, n = re.subn(r"(LUBIAK_master_optimized\.glb\?v=)[^'\"\s]+", rf"\g<1>{token}", js)
          if n < 1: raise RuntimeError('LUBIAK master cache token not found')
          js_path.write_text(js)
          html = html_path.read_text()
          html, n = re.subn(r"(lubiak\.js\?v=)[^'\"\s]+", rf"\g<1>{token}", html)
          if n < 1: raise RuntimeError('LUBIAK script cache token not found')
          html_path.write_text(html)
          PY

      - name: Install Python build dependencies
        run: python3 -m pip install --user --disable-pip-version-check pillow

      - name: Upgrade Castle and Laboratory materials only
        shell: bash
        run: |
          set -euo pipefail
          models="build/web/assets/assets/models"
          PYTHONPATH=scripts python3 - <<'PY'
          from upgrade_castle_exterior_glb import upgrade as ext
          from upgrade_castle_interior_glb import upgrade as interior
          from upgrade_laboratory_interior_glb import upgrade as lab
          root='build/web/assets/assets/models/'
          ext(root+'castle_exterior.glb')
          interior(root+'castle_interior.glb')
          lab(root+'laboratory_interior.glb')
          print('Castle/Laboratory PBR passes complete; Megapole geometry untouched')
          PY

      - name: Install authoritative Enochian terminal runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web/enochian-terminal build/web/enochian-test
          cp -a web/enochian-terminal build/web/enochian-terminal
          cp -a web/enochian-test build/web/enochian-test
          test -s build/web/enochian-terminal/index.html
          test -s build/web/enochian-test/live-copy.html

      - name: Verify deployed Enochian terminal contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src="/enochian-test/live-copy.html?v=' build/web/enochian-terminal/index.html
          test -s build/web/enochian-test/live-copy.html
          test -s build/web/enochian-test/stem-four-channel-ui-v1.js
          node --check build/web/enochian-test/stem-four-channel-ui-v1.js
          python3 scripts/check_terminal_runtime_consolidation.py

      - name: Prepare Safari-compatible laboratory video
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          src="assets/videos/bureau_screen_loop.mp4"; out="build/web/assets/assets/videos/bureau_screen_loop.mp4"; tmp="build/web/assets/assets/videos/bureau_screen_loop.safari.tmp.mp4"
          test -s "$src"; mkdir -p "$(dirname "$out")"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$src")"; pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$src")"
          if [ "$codec" = "h264" ] && [ "$pix_fmt" = "yuv420p" ]; then cp "$src" "$out"; else ffmpeg -hide_banner -loglevel error -y -i "$src" -map 0:v:0 -an -vf "scale='min(1280,iw)':'min(720,ih)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2" -r 30 -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -movflags +faststart "$tmp" && mv "$tmp" "$out"; fi

      - name: Generate share previews and pages
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/web/assets/share-previews
          python3 scripts/generate_uno_texture_previews.py
          cp build/web/index.html build/web/404.html
          dart run scripts/generate_multideck_share_pages.dart --catalog assets/json/cards.json --brio assets/decks/chanson_a_repondre_brio/deck.json --build-dir build/web --public-base https://www.chanson-a-repondre-uno.scot/
          python3 scripts/apply_global_share_previews.py build/web https://www.chanson-a-repondre-uno.scot/

      - name: Verify every social preview and share page
        run: python3 scripts/verify_share_previews.py

      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/404.html
          test -f build/web/main.dart.js
          test -s build/web/enochian-terminal/index.html
          test -f build/web/card_castle/card_castle.html
          test -s build/web/assets/assets/models/castle_exterior.glb
          test -s build/web/assets/assets/models/castle_interior.glb
          test -s build/web/assets/assets/models/laboratory_interior.glb
          test -s build/web/assets/assets/models/LUBIAK_master_optimized.glb
          test -s build/web/assets/assets/models/SILMARI_LLION_MEGAPOLE_LUBIAK.glb
          cmp -s assets/models/textured-glb-comparison/LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb build/web/assets/assets/models/LUBIAK_master_optimized.glb
          cmp -s assets/models/textured-glb-comparison/MEGAPOLE_PBR_TERRAIN_UPGRADED_WEB_OPTIMIZED.glb build/web/assets/assets/models/SILMARI_LLION_MEGAPOLE_LUBIAK.glb
          grep -q "LUBIAK_master_optimized.glb?v=safe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" build/web/lubiak/lubiak.js
          grep -q "lubiak.js?v=safe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" build/web/lubiak/index.html
          node --check build/web/megapole/megapole-pbr-v8.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: build/web

  deploy:
    name: Deploy live
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
