name: WEB — Deploy Live Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: live-web-v2
  cancel-in-progress: false

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install and analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Test castle runtime ownership
        run: |
          flutter test \
            test/castle_jester_gatekeeper_integration_test.dart \
            test/castle_laboratory_video_ownership_test.dart \
            test/castle_laboratory_asset_contract_test.dart \
            test/castle_ios_laboratory_resilience_test.dart

      - name: Validate production configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          test -n "${AI_BACKEND_URL:-}"
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) exit 1 ;; esac
          case "$AI_BACKEND_URL" in https://*) ;; *) exit 1 ;; esac

      - name: Build Flutter web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
          TURNSTILE_SITE_KEY: 0x4AAAAAAERKLvJuMsQpWZhI
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --dart-define=SKIP_AUTH_FOR_DEVELOPMENT=false \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=AI_BACKEND_URL="$AI_BACKEND_URL" \
            --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" \
            --dart-define=APP_BUILD_SHA="${{ github.sha }}"

      - name: Prepare Safari-compatible laboratory video
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          src="assets/videos/bureau_screen_loop.mp4"
          out="build/web/assets/assets/videos/bureau_screen_loop.mp4"
          tmp="build/web/assets/assets/videos/bureau_screen_loop.safari.tmp.mp4"
          test -s "$src"
          mkdir -p "$(dirname "$out")"
          ffmpeg -hide_banner -loglevel error -y \
            -i "$src" \
            -map 0:v:0 -an \
            -vf "scale='min(1280,iw)':'min(720,ih)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2" \
            -r 30 \
            -c:v libx264 -preset fast -crf 23 \
            -profile:v main -level 4.0 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            "$tmp"
          mv "$tmp" "$out"
          test -s "$out"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")"
          pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$out")"
          test "$codec" = "h264"
          test "$pix_fmt" = "yuv420p"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,pix_fmt,width,height,r_frame_rate \
            -of default=nw=1 "$out"

      - name: Generate share previews and pages
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pillow
          mkdir -p build/web/assets/share-previews
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          out = Path('build/web/assets/share-previews')

          brio = Path('build/web/assets/assets/decks/chanson_a_repondre_brio/cards')
          for i in range(1, 17):
              card = f'{i:03d}'
              source = brio / f'{card}.jpeg'
              target = out / f'BRIO-{card}.jpg'
              with Image.open(source) as image:
                  fitted = ImageOps.fit(ImageOps.exif_transpose(image).convert('RGB'), (600, 900), method=Image.Resampling.LANCZOS)
                  fitted.save(target, 'JPEG', quality=60, optimize=True, progressive=True, subsampling=2)

          hp = Path('assets/hp')
          hp_sources = [
              'ChatGPT Image Aug 22, 2026, 10_59_05 AM.png',
              'ChatGPT Image Aug 22, 2026, 11_00_51 AM.png',
              'ChatGPT Image Aug 22, 2026, 11_08_07 AM.png',
              'ChatGPT Image Aug 22, 2026, 11_12_32 AM.png',
          ]
          for i, filename in enumerate(hp_sources, 1):
              card = f'{i:03d}'
              target = out / f'HP-{card}.jpg'
              with Image.open(hp / filename) as image:
                  fitted = ImageOps.fit(ImageOps.exif_transpose(image).convert('RGB'), (600, 900), method=Image.Resampling.LANCZOS)
                  fitted.save(target, 'JPEG', quality=58, optimize=True, progressive=True, subsampling=2)
          PY
          python3 scripts/generate_uno_texture_previews.py
          cp build/web/index.html build/web/404.html
          dart run scripts/generate_multideck_share_pages.dart \
            --catalog assets/json/cards.json \
            --brio assets/decks/chanson_a_repondre_brio/deck.json \
            --build-dir build/web \
            --public-base https://www.chanson-a-repondre-uno.scot/
          python3 scripts/apply_global_share_previews.py build/web https://www.chanson-a-repondre-uno.scot/

      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/404.html
          test -f build/web/main.dart.js
          test -f build/web/assets/assets/models/transcription_jester_rigged.glb
          test -s build/web/assets/assets/videos/bureau_screen_loop.mp4
          test -f build/web/assets/assets/hp/work_in_progress_ribbon.webp
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'UNO-*' | wc -l)" -eq 84
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'BRIO-*' | wc -l)" -eq 16
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'HP-*' | wc -l)" -eq 4
          test -f build/web/share/HP-001/index.html
          test -f build/web/share/HP-004/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: build/web

  deploy:
    name: Deploy live
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r '.sha')"
          test -n "$latest"
          test "$latest" != "null"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing stale Pages deployment: run=$GITHUB_SHA latest-main=$latest"
            exit 1
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

  report:
    name: Report live deployment
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish pages-live commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          state=success
          description="GitHub Pages deployment succeeded"
          if [ "$BUILD_RESULT" != "success" ] || [ "$DEPLOY_RESULT" != "success" ]; then
            state=failure
            description="GitHub Pages deployment failed: build=$BUILD_RESULT deploy=$DEPLOY_RESULT"
          fi
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg state "$state" \
            --arg target_url "$target_url" \
            --arg description "$description" \
            --arg context "pages-live" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}' \
            > /tmp/pages-status.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/pages-status.json
