name: WEB — Deploy Live Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: live-web-v2
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compress and repair Enochian stems
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          dir='assets/audio/stems/ai_comptroller'
          for src in "$dir"/ai_comptroller_{vocals,drums,bass,other}.mp3; do
            test -s "$src"
            tmp="${src%.mp3}.compressed.mp3"
            before=$(stat -c%s "$src")
            ffmpeg -hide_banner -loglevel error -y -i "$src" -map_metadata 0 -vn -c:a libmp3lame -b:a 64k -ar 44100 -ac 2 "$tmp"
            after=$(stat -c%s "$tmp")
            if [ "$after" -lt "$before" ]; then mv "$tmp" "$src"; else rm -f "$tmp"; fi
            echo "$(basename "$src"): $before -> $(stat -c%s "$src") bytes"
          done
          # repair_enochian_stems.py is the authoritative runtime contract.
          # Do not duplicate its markers here with stale grep assertions.
          python3 scripts/repair_enochian_stems.py

      - name: Persist compressed stems and runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/stems/ai_comptroller/*.mp3 web/enochian-test/live-copy.html web/enochian-terminal/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Compress Enochian stems and restore reliable playback'
            git push origin HEAD:main
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install and analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Run Flutter regression suite
        run: flutter test

      - name: Validate production configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          test -n "${AI_BACKEND_URL:-}"
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) exit 1 ;; esac
          case "$AI_BACKEND_URL" in https://*) ;; *) exit 1 ;; esac

      - name: Build Flutter web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
          TURNSTILE_SITE_KEY: 0x4AAAAAAERKLvJuMsQpWZhI
        run: |
          flutter build web --release --base-href "/" --dart-define=SKIP_AUTH_FOR_DEVELOPMENT=false --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --dart-define=AI_BACKEND_URL="$AI_BACKEND_URL" --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" --dart-define=APP_BUILD_SHA="${{ github.sha }}"

      - name: Prepare Safari-compatible laboratory video
        shell: bash
        run: |
          set -euo pipefail
          src="assets/videos/bureau_screen_loop.mp4"
          out="build/web/assets/assets/videos/bureau_screen_loop.mp4"
          tmp="build/web/assets/assets/videos/bureau_screen_loop.safari.tmp.mp4"
          test -s "$src"
          mkdir -p "$(dirname "$out")"
          ffmpeg -hide_banner -loglevel error -y -i "$src" -map 0:v:0 -an -vf "scale='min(1280,iw)':'min(720,ih)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2" -r 30 -c:v libx264 -preset fast -crf 23 -profile:v main -level 4.0 -pix_fmt yuv420p -movflags +faststart "$tmp"
          mv "$tmp" "$out"
          test -s "$out"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$out")" = "yuv420p"

      - name: Generate share previews and pages
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pillow
          mkdir -p build/web/assets/share-previews
          python3 scripts/generate_uno_texture_previews.py
          cp build/web/index.html build/web/404.html
          dart run scripts/generate_multideck_share_pages.dart --catalog assets/json/cards.json --brio assets/decks/chanson_a_repondre_brio/deck.json --build-dir build/web --public-base https://www.chanson-a-repondre-uno.scot/
          python3 scripts/apply_global_share_previews.py build/web https://www.chanson-a-repondre-uno.scot/

      - name: Verify every social preview and share page
        shell: bash
        run: python3 scripts/verify_share_previews.py

      - name: Browser smoke test for Search route
        shell: bash
        run: node scripts/verify_search_category_web.mjs

      - name: Browser smoke test for Play, Castle, and mobile Home
        shell: bash
        run: node scripts/verify_dealer_web.mjs

      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/404.html
          test -f build/web/main.dart.js
          test -f build/web/enochian/index.html
          test -f build/web/assets/assets/models/transcription_jester_rigged.glb
          test -s build/web/assets/assets/videos/bureau_screen_loop.mp4
          test -f build/web/assets/assets/hp/work_in_progress_ribbon.webp

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: build/web

  deploy:
    name: Deploy live
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
