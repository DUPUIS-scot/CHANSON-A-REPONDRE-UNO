name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Flutter web release
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --dart-define=SKIP_AUTH_FOR_DEVELOPMENT=false \
            --dart-define=APP_BUILD_SHA="${{ github.sha }}"

      - name: Add GitHub Pages fallback
        run: cp build/web/index.html build/web/404.html

      - name: Generate multi-deck card share previews
        run: |
          dart run scripts/generate_card_share_pages.dart \
            --catalog assets/json/cards.json \
            --brio assets/decks/chanson_a_repondre_brio/deck.json \
            --build-dir build/web \
            --public-base https://www.chanson-a-repondre-uno.scot/

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/404.html
          test -f build/web/main.dart.js
          test -f build/web/card_share.js

          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'UNO-*' | wc -l)" -eq 84
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'BRIO-*' | wc -l)" -eq 16
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d \( -name 'UNO-*' -o -name 'BRIO-*' \) | wc -l)" -eq 100
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'final-84-*' | wc -l)" -eq 84
          test "$(find build/web/share -type f -name 'index.html' | wc -l)" -eq 184

          test -f build/web/share/UNO-001/index.html
          test -f build/web/share/UNO-084/index.html
          test -f build/web/share/BRIO-001/index.html
          test -f build/web/share/BRIO-016/index.html
          test -f build/web/share/final-84-01/index.html
          test -f build/web/share/final-84-84/index.html

          grep -q 'Chanson à répondre UNO — Carte 001' build/web/share/UNO-001/index.html
          grep -q 'property="og:image"' build/web/share/UNO-001/index.html
          grep -q 'name="twitter:image"' build/web/share/UNO-084/index.html
          grep -q '/share/UNO-001/' build/web/share/UNO-001/index.html
          grep -q '#/cards/final-84-84' build/web/share/UNO-084/index.html

          grep -q 'Chanson à répondre BRIO — Carte 001' build/web/share/BRIO-001/index.html
          grep -q 'property="og:image"' build/web/share/BRIO-001/index.html
          grep -q 'name="twitter:image"' build/web/share/BRIO-016/index.html
          grep -q '/share/BRIO-001/' build/web/share/BRIO-001/index.html
          grep -q 'assets/assets/decks/chanson_a_repondre_brio/cards/001.jpeg' build/web/share/BRIO-001/index.html
          grep -q '#/cards/brio-016' build/web/share/BRIO-016/index.html

          grep -q '/share/UNO-001/' build/web/share/final-84-01/index.html
          grep -q 'rel="canonical"' build/web/share/final-84-01/index.html
          grep -q '/share/UNO-084/' build/web/share/final-84-84/index.html

          test -f build/web/assets/assets/models/jester_player.glb
          test -f build/web/assets/assets/models/search_castle.glb
          test -f build/web/card_castle/card_castle.html
          test "$(find build/web/assets/assets/cards/final_import -type f -name '*.png' | wc -l)" -eq 84

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
