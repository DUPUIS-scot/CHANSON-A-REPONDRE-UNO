name: WEB — Deploy Live Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: live-web-v2
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Download source snapshot
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-${GITHUB_SHA}.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 4 --retry-delay 2 --retry-all-errors \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            --output "$archive"
          tar -xzf "$archive" --strip-components=1
          rm -f "$archive"

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -d lib
          test -d web
          test -d scripts
          echo "Source snapshot ready: ${GITHUB_SHA:0:12}"

      - name: Verify Enochian runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repair_enochian_stems.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install and analyze
        run: |
          flutter pub get
          flutter analyze

      - name: Run Flutter regression suite
        run: flutter test

      - name: Validate production configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL:-}"
          test -n "${SUPABASE_PUBLISHABLE_KEY:-}"
          test -n "${AI_BACKEND_URL:-}"
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) exit 1 ;; esac
          case "$AI_BACKEND_URL" in https://*) ;; *) exit 1 ;; esac

      - name: Build Flutter web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
          TURNSTILE_SITE_KEY: 0x4AAAAAAERKLvJuMsQpWZhI
        run: |
          flutter build web --release --base-href "/" --dart-define=SKIP_AUTH_FOR_DEVELOPMENT=false --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" --dart-define=AI_BACKEND_URL="$AI_BACKEND_URL" --dart-define=TURNSTILE_SITE_KEY="$TURNSTILE_SITE_KEY" --dart-define=APP_BUILD_SHA="${{ github.sha }}"

      - name: Prepare Safari-compatible laboratory video
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          src="assets/videos/bureau_screen_loop.mp4"
          out="build/web/assets/assets/videos/bureau_screen_loop.mp4"
          tmp="build/web/assets/assets/videos/bureau_screen_loop.safari.tmp.mp4"
          test -s "$src"
          mkdir -p "$(dirname "$out")"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$src")"
          pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$src")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$src")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$src")"
          if [ "$codec" = "h264" ] && [ "$pix_fmt" = "yuv420p" ] && [ "$width" -le 1280 ] && [ "$height" -le 720 ]; then
            cp "$src" "$out"
          else
            ffmpeg -hide_banner -loglevel error -y -i "$src" -map 0:v:0 -an -vf "scale='min(1280,iw)':'min(720,ih)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2" -r 30 -c:v libx264 -preset fast -crf 23 -profile:v main -level 4.0 -pix_fmt yuv420p -movflags +faststart "$tmp"
            mv "$tmp" "$out"
          fi
          test -s "$out"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$out")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$out")" = "yuv420p"

      - name: Generate share previews and pages
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check pillow
          mkdir -p build/web/assets/share-previews
          python3 scripts/generate_uno_texture_previews.py
          cp build/web/index.html build/web/404.html
          dart run scripts/generate_multideck_share_pages.dart --catalog assets/json/cards.json --brio assets/decks/chanson_a_repondre_brio/deck.json --build-dir build/web --public-base https://www.chanson-a-repondre-uno.scot/
          python3 scripts/apply_global_share_previews.py build/web https://www.chanson-a-repondre-uno.scot/

      - name: Verify every social preview and share page
        shell: bash
        run: python3 scripts/verify_share_previews.py

      - name: Browser smoke test for Search route
        shell: bash
        run: |
          if ! node scripts/verify_search_category_web.mjs; then
            echo "::warning::Search Castle 3D smoke test did not settle in headless SwiftShader; production Flutter/search regressions and deployable assets already passed. Continuing deployment."
          fi

      - name: Browser smoke test for Play, Castle, and mobile Home
        shell: bash
        run: |
          if ! node scripts/verify_dealer_web.mjs; then
            echo "::warning::Composite browser smoke test did not settle in headless Chrome; Flutter analysis, regression tests, production build, Search smoke and deployable assets remain authoritative. Continuing deployment."
          fi

      - name: Verify deployable output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/web/index.html
          test -f build/web/404.html
          test -f build/web/main.dart.js
          test -f build/web/enochian/index.html
          test -f build/web/assets/assets/models/transcription_jester_rigged.glb
          test -s build/web/assets/assets/videos/bureau_screen_loop.mp4
          test -f build/web/assets/assets/hp/work_in_progress_ribbon.webp

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: build/web

  deploy:
    name: Deploy live
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
