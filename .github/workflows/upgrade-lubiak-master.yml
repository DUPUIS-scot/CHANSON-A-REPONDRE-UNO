name: Upgrade LUBIAK master PBR

on:
  push:
    branches: [main]
    paths:
      - '.github/upgrade-lubiak-master-now.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoders
        run: python -m pip install --disable-pip-version-check pillow pillow-heif pillow-avif-plugin
      - name: Decode Freak Street uploaded PBR sources
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          root = Path('assets/models/lubiak_pbr_refs')
          for name in ('albedo','normal','rough','height'):
              src = root / f'freak_street_{name}.jpg.b64'
              dst = root / f'freak_street_{name}.jpg'
              payload = ''.join(src.read_text().split())
              dst.write_bytes(base64.b64decode(payload, validate=True))
              print('decoded', dst, dst.stat().st_size)
          PY
      - name: Normalize and validate all LUBIAK PBR maps
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import base64
          from PIL import Image
          try:
              import pillow_avif  # noqa: F401
          except Exception:
              pass
          try:
              from pillow_heif import register_heif_opener
              register_heif_opener()
          except Exception:
              pass

          groups = {
              'palace': {
                  'albedo': 'palace_albedo.jpg',
                  'normal': 'palace_normal.jpg',
                  'rough': 'palace_dark.jpg',
                  'height': 'palace_clay.jpg',
              },
              'freak': {
                  'albedo': 'freak_street_albedo.jpg',
                  'normal': 'freak_street_normal.jpg',
                  'rough': 'freak_street_rough.jpg',
                  'height': 'freak_street_height.jpg',
              },
              'circus_exterior': {
                  'albedo': 'circus_exterior_albedo.jpg',
                  'normal': 'circus_exterior_normal.jpg',
                  'rough': 'circus_exterior_rough.jpg',
                  'height': 'circus_exterior_height.jpg',
              },
              'circus_interior': {
                  'albedo': 'circus_interior_albedo.jpg',
                  'normal': 'circus_interior_normal.jpg',
                  'rough': 'circus_interior_rough.jpg',
                  'height': 'circus_interior_height.jpg',
              },
          }
          source_root = Path('assets/models/lubiak_pbr_refs')
          out_root = Path('.tmp/lubiak_pbr')
          out_root.mkdir(parents=True, exist_ok=True)

          def candidates(raw):
              yield raw, 'raw'
              signatures = [
                  (b'\xff\xd8\xff', b'\xff\xd9', 'jpeg'),
                  (b'\x89PNG\r\n\x1a\n', None, 'png'),
                  (b'RIFF', None, 'webp'),
              ]
              for start, end, label in signatures:
                  i = raw.find(start)
                  if i >= 0:
                      if end:
                          j = raw.rfind(end)
                          if j >= i:
                              yield raw[i:j+len(end)], f'embedded-{label}'
                      else:
                          yield raw[i:], f'embedded-{label}'
              try:
                  text = raw.decode('ascii').strip()
                  if 'base64,' in text:
                      text = text.split('base64,', 1)[1]
                  compact = ''.join(text.split())
                  if len(compact) >= 32:
                      yield base64.b64decode(compact, validate=True), 'base64'
              except Exception:
                  pass

          available = []
          for group, refs in groups.items():
              paths = {role: source_root / name for role, name in refs.items()}
              present = [p.exists() for p in paths.values()]
              if not any(present):
                  print(f'{group}: source set absent; skipping')
                  continue
              if not all(present):
                  missing = [str(p) for p in paths.values() if not p.exists()]
                  raise RuntimeError(f'{group}: incomplete source set: {missing}')
              group_out = out_root / group
              group_out.mkdir(parents=True, exist_ok=True)
              for role, src in paths.items():
                  raw = src.read_bytes()
                  img = None
                  source_kind = None
                  last_error = None
                  for payload, kind in candidates(raw):
                      try:
                          probe = Image.open(BytesIO(payload)); probe.load()
                          img = probe; source_kind = kind; break
                      except Exception as exc:
                          last_error = exc
                  if img is None:
                      raise RuntimeError(f'Cannot decode {src}; last={last_error!r}')
                  out = group_out / f'{role}.jpg'
                  mode = 'RGB' if role in ('albedo','normal') else 'L'
                  img.convert(mode).save(out, 'JPEG', quality=95, optimize=True)
                  with Image.open(out) as check: check.verify()
                  print(f'{group}/{role}: {source_kind} -> {out} OK')
              available.append(group)

          for required in ('palace','freak'):
              if required not in available:
                  raise RuntimeError(f'{required} PBR source set is required')
          Path('.tmp/lubiak_pbr/available.txt').write_text('\n'.join(available) + '\n')
          print('available groups:', ', '.join(available))
          PY
      - name: Upgrade available region textures in LUBIAK master GLB
        run: |
          set -euo pipefail
          args=(--input assets/models/LUBIAK_master_optimized.glb --output assets/models/LUBIAK_master_optimized.upgraded.glb)
          has_group() { grep -qx "$1" .tmp/lubiak_pbr/available.txt; }
          if has_group palace; then args+=(--palace-albedo .tmp/lubiak_pbr/palace/albedo.jpg --palace-normal .tmp/lubiak_pbr/palace/normal.jpg --palace-rough .tmp/lubiak_pbr/palace/rough.jpg --palace-height .tmp/lubiak_pbr/palace/height.jpg); fi
          if has_group freak; then args+=(--freak-albedo .tmp/lubiak_pbr/freak/albedo.jpg --freak-normal .tmp/lubiak_pbr/freak/normal.jpg --freak-rough .tmp/lubiak_pbr/freak/rough.jpg --freak-height .tmp/lubiak_pbr/freak/height.jpg); fi
          if has_group circus_exterior; then args+=(--circus-exterior-albedo .tmp/lubiak_pbr/circus_exterior/albedo.jpg --circus-exterior-normal .tmp/lubiak_pbr/circus_exterior/normal.jpg --circus-exterior-rough .tmp/lubiak_pbr/circus_exterior/rough.jpg --circus-exterior-height .tmp/lubiak_pbr/circus_exterior/height.jpg); fi
          if has_group circus_interior; then args+=(--circus-interior-albedo .tmp/lubiak_pbr/circus_interior/albedo.jpg --circus-interior-normal .tmp/lubiak_pbr/circus_interior/normal.jpg --circus-interior-rough .tmp/lubiak_pbr/circus_interior/rough.jpg --circus-interior-height .tmp/lubiak_pbr/circus_interior/height.jpg); fi
          python scripts/upgrade_lubiak_master_glb.py "${args[@]}"
          test -s assets/models/LUBIAK_master_optimized.upgraded.glb
          mv assets/models/LUBIAK_master_optimized.upgraded.glb assets/models/LUBIAK_master_optimized.glb
      - name: Validate upgraded GLB structure
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, struct
          from pathlib import Path
          p = Path('assets/models/LUBIAK_master_optimized.glb')
          raw = p.read_bytes()
          if len(raw) < 20 or raw[:4] != b'glTF': raise RuntimeError('Invalid GLB header')
          magic, version, total = struct.unpack('<4sII', raw[:12])
          if version != 2 or total != len(raw): raise RuntimeError('Invalid GLB length/version')
          json_len, json_type = struct.unpack('<I4s', raw[12:20])
          if json_type != b'JSON': raise RuntimeError('Missing JSON chunk')
          doc = json.loads(raw[20:20+json_len].rstrip(b' \x00'))
          names = [i.get('name','') for i in doc.get('images',[])]
          required = [('palace','LUBIAK_PALACE_'),('freak','LUBIAK_FREAK_')]
          available = Path('.tmp/lubiak_pbr/available.txt').read_text().split()
          required += [('circus_exterior','LUBIAK_CIRCUS_EXTERIOR_'),('circus_interior','LUBIAK_CIRCUS_INTERIOR_')]
          for group,prefix in required:
              if group in available and not any(n.startswith(prefix) for n in names):
                  raise RuntimeError(f'{group} PBR images not embedded')
          print('GLB OK:', len(raw), 'bytes,', len(doc.get('materials',[])), 'materials,', len(doc.get('images',[])), 'images')
          PY
      - name: Commit upgraded master GLB
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/LUBIAK_master_optimized.glb
          if git diff --cached --quiet; then echo 'No GLB changes'; exit 0; fi
          git commit -m 'Bake Freak Street PBR into LUBIAK master'
          git pull --rebase origin main
          git push origin HEAD:main
