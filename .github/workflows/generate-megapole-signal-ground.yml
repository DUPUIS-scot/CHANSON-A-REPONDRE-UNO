name: Generate Megapole signal ground

on:
  push:
    paths:
      - '.megapole-signal-ground-trigger'
      - 'scripts/generate-megapole-signal-ground.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate signal mesh ember ground GLB
        run: node scripts/generate-megapole-signal-ground.mjs
      - name: Commit generated GLB
        run: |
          if git diff --quiet -- assets/models/SILMARI_LLION_MEGAPOLE_signal_ground.glb; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/SILMARI_LLION_MEGAPOLE_signal_ground.glb
          git commit -m 'Generate Megapole inverted signal ember terrain'
          git pull --rebase origin main
          git push origin HEAD:main
