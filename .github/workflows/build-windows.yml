name: Build Windows Desktop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        run: flutter pub get

      - name: Validate production configuration
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_URL)) { throw 'SUPABASE_URL is not configured.' }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_PUBLISHABLE_KEY)) { throw 'SUPABASE_PUBLISHABLE_KEY is not configured.' }
          if ([string]::IsNullOrWhiteSpace($env:AI_BACKEND_URL)) { throw 'AI_BACKEND_URL is not configured.' }

      - name: Build Windows release
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
          TURNSTILE_SITE_KEY: 0x4AAAAAAERKLvJuMsQpWZhI
        run: |
          $ErrorActionPreference = 'Stop'
          flutter build windows --release `
            --dart-define="SKIP_AUTH_FOR_DEVELOPMENT=false" `
            --dart-define="SUPABASE_URL=$env:SUPABASE_URL" `
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY" `
            --dart-define="AI_BACKEND_URL=$env:AI_BACKEND_URL" `
            --dart-define="TURNSTILE_SITE_KEY=$env:TURNSTILE_SITE_KEY" `
            --dart-define="APP_BUILD_SHA=${{ github.sha }}"

      - name: Verify Play background is bundled
        shell: pwsh
        run: |
          $asset = 'build\windows\x64\runner\Release\data\flutter_assets\assets\images\play_stage_background.jpg'
          if (-not (Test-Path $asset)) { throw "Play background asset missing from Windows build: $asset" }
          Write-Host "Verified Windows Play background asset: $asset"

      - name: Package Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "chanson-a-repondre-uno-windows-${{ github.sha }}.zip"
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath $zip -Force
          "WINDOWS_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: chanson-a-repondre-uno-windows-${{ github.sha }}
          path: ${{ env.WINDOWS_ZIP }}
          if-no-files-found: error
          retention-days: 14
