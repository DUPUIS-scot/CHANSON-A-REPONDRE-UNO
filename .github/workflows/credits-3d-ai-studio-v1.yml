name: Credits 3D AI Studio v1
on:
  push:
    paths: ['.github/run-credits-3d-ai-studio-v1.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add 3D AI Studio credit
        run: node scripts/patch-credits-3d-ai-studio-v1.mjs
      - name: Validate
        run: |
          grep -q '3D AI Studio — 3daistudio.com' lib/screens/credits_screen.dart
          grep -q "label: 'AI 3D generation / modelling'" lib/screens/credits_screen.dart
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/credits_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Credit 3D AI Studio in Generique Credits'
            git push
          fi
