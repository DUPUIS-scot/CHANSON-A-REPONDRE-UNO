name: Check 2JESTER Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/enochian-test/double-decker-special-v2.js'
      - 'web/enochian-test/double-decker-main-stem-link-v1.js'
      - 'web/enochian-test/double-jecker-radial-layout-v1.js'
      - 'web/enochian-test/double-jecker-reference-skin-v1.js'
      - 'web/enochian-test/double-jecker-output-v1.js'
      - 'web/enochian-test/double-jecker-signal-relay-v1.js'
      - 'web/enochian-test/double-jecker-turntable-shield-v1.js'
      - 'web/enochian-test/double-jester-portal-spinner-v1.js'
      - 'web/enochian-test/double-jecker-runtime-repair-v1.js'
      - 'web/enochian-test/double-jecker-performance-v2.js'
      - 'web/enochian-test/enochian-terminal-polish-v1.js'
      - 'web/enochian-test/enochian-ui-repairs-v1.js'
      - 'web/enochian-test/stem-four-channel-ui-v1.js'
      - 'web/enochian-terminal/index.html'
      - 'scripts/repair_enochian_stems.py'
      - 'test/enochian_terminal_authority_test.dart'
      - '.github/workflows/double-jecker-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download source snapshot
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-${GITHUB_SHA}.tar.gz"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" --output "$archive"
          tar -xzf "$archive" --strip-components=1
          rm -f "$archive"

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            web/enochian-test/double-decker-special-v2.js \
            web/enochian-test/double-decker-main-stem-link-v1.js \
            web/enochian-test/double-jecker-radial-layout-v1.js \
            web/enochian-test/double-jecker-reference-skin-v1.js \
            web/enochian-test/double-jecker-output-v1.js \
            web/enochian-test/double-jecker-signal-relay-v1.js \
            web/enochian-test/double-jecker-turntable-shield-v1.js \
            web/enochian-test/double-jester-portal-spinner-v1.js \
            web/enochian-test/double-jecker-runtime-repair-v1.js \
            web/enochian-test/double-jecker-performance-v2.js \
            web/enochian-test/enochian-terminal-polish-v1.js \
            web/enochian-test/enochian-ui-repairs-v1.js \
            web/enochian-test/stem-four-channel-ui-v1.js; do
            node --check "$file"
          done

      - name: Verify consolidated 2JESTER contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/repair_enochian_stems.py
          radial=web/enochian-test/double-jecker-radial-layout-v1.js
          link=web/enochian-test/double-decker-main-stem-link-v1.js
          guard=web/enochian-test/double-jecker-runtime-repair-v1.js
          perf=web/enochian-test/double-jecker-performance-v2.js
          polish=web/enochian-test/enochian-terminal-polish-v1.js
          shell=web/enochian-terminal/index.html

          grep -q "const VERSION='v10'" "$radial"
          grep -q "doubleJesterRadialPanelRectV10" "$radial"
          grep -q "const VERSION='v11'" "$link"
          ! grep -q "mainLevel('instruments')" "$link"
          grep -q "__enochDoubleJesterAuthority" "$guard"
          grep -q "const VERSION='v4'" "$perf"
          ! grep -q "if(row&&!split)" "$perf"
          ! grep -q "const coords={A:{vocals:\[30,17\]" "$polish"
          grep -q "double-jecker-radial-layout-v1.js?v=20260827-jester-radial-v10" "$shell"
          grep -q "double-jecker-runtime-repair-v1.js?v=20260827-jester-authority-v11" "$shell"
          grep -q "enochian-terminal-polish-v1.js?v=20260827-polish-v3" "$shell"

      - name: Report
        run: echo '2JESTER single geometry, four native stems, passive open authority and spinner crossfade verified.'
