name: Check 2JECKER Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/enochian-test/double-decker-special-v2.js'
      - 'web/enochian-test/double-decker-main-stem-link-v1.js'
      - 'web/enochian-test/double-jecker-radial-layout-v1.js'
      - 'web/enochian-test/double-jecker-reference-skin-v1.js'
      - 'web/enochian-test/double-jecker-output-v1.js'
      - 'web/enochian-test/double-jecker-signal-relay-v1.js'
      - 'web/enochian-test/double-jecker-turntable-shield-v1.js'
      - 'web/enochian-test/double-jecker-runtime-repair-v1.js'
      - 'web/enochian-test/double-jecker-performance-v2.js'
      - '.github/workflows/double-jecker-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download source snapshot
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-${GITHUB_SHA}.tar.gz"
          curl --fail --location --silent --show-error --retry 4 --retry-delay 2 --retry-all-errors \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" --output "$archive"
          tar -xzf "$archive" --strip-components=1
          rm -f "$archive"
          test -f web/enochian-test/double-jecker-radial-layout-v1.js

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            web/enochian-test/double-decker-special-v2.js \
            web/enochian-test/double-decker-main-stem-link-v1.js \
            web/enochian-test/double-jecker-radial-layout-v1.js \
            web/enochian-test/double-jecker-reference-skin-v1.js \
            web/enochian-test/double-jecker-output-v1.js \
            web/enochian-test/double-jecker-signal-relay-v1.js \
            web/enochian-test/double-jecker-turntable-shield-v1.js \
            web/enochian-test/double-jecker-runtime-repair-v1.js \
            web/enochian-test/double-jecker-performance-v2.js; do
            node --check "$file"
          done

      - name: Verify repaired platter contracts
        shell: bash
        run: |
          set -euo pipefail
          radial=web/enochian-test/double-jecker-radial-layout-v1.js
          skin=web/enochian-test/double-jecker-reference-skin-v1.js
          output=web/enochian-test/double-jecker-output-v1.js
          relay=web/enochian-test/double-jecker-signal-relay-v1.js
          link=web/enochian-test/double-decker-main-stem-link-v1.js
          guard=web/enochian-test/double-jecker-runtime-repair-v1.js
          perf=web/enochian-test/double-jecker-performance-v2.js

          grep -q "jeckerRadial==='v5'" "$radial"
          grep -q "width:min(74vmin,660px)" "$radial"
          grep -q "dds-center{position:static" "$radial"
          grep -q "dds-status.*display:none" "$radial"
          grep -q "content:'DECK A'" "$radial"
          grep -q "content:'DECK B'" "$radial"
          grep -q "vocals:\[27,17.5\]" "$radial"
          grep -q "vocals:\[27,67.5\]" "$radial"
          grep -q "jeckerReferenceSkin==='v5'" "$skin"
          grep -q "background:#090604" "$skin"
          ! grep -q "transparent 0 15.5%" "$skin"

          grep -q "jeckerOutput==='v2'" "$output"
          grep -q "api.state.outputNode" "$output"
          ! grep -q "masterGain.disconnect()" "$output"
          grep -q "SignalRelay?.version==='v3'" "$relay"
          grep -q "__enochExternalSignalSources" "$relay"
          ! grep -q "masterGain.disconnect()" "$relay"
          grep -q "stemJecker==='v10'" "$link"
          grep -q "UNLINK STEMS MIX" "$link"
          grep -q "RuntimeRepair?.version==='v3'" "$guard"
          grep -q "DoubleJeckerPerformance?.version==='v3'" "$perf"
          grep -q "data-dds-crossfader" "$perf"

      - name: Report
        run: echo '2JECKER reduced floating platter, open center, explicit A/B banks, compact controls and audio authority verified.'
