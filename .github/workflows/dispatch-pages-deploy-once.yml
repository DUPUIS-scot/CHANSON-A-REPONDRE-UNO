name: Dispatch Pages deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-pages-deploy-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch existing Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Remove one-shot dispatcher
        run: |
          rm .github/workflows/dispatch-pages-deploy-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dispatch-pages-deploy-once.yml
          git commit -m "Remove one-shot Pages deploy dispatcher"
          git push origin HEAD:main
