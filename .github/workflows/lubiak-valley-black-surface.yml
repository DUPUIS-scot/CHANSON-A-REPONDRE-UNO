name: LUBIAK valley on black surface

on:
  push:
    paths:
      - 'scripts/patch-lubiak-valley-black-surface.mjs'
      - '.github/workflows/lubiak-valley-black-surface.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply valley black-surface presentation
        run: node scripts/patch-lubiak-valley-black-surface.mjs
      - name: Validate runtime syntax and CSS contract
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_VALLEY_BLACK_SURFACE_V1' web/lubiak/lubiak.js
          grep -q '#stage{position:relative;background:#000}' web/lubiak/index.html
          grep -q 'mix-blend-mode:normal' web/lubiak/index.html
          ! grep -q "background:#050303 url('lubiak-kathmandu-night.svg" web/lubiak/index.html
      - name: Commit runtime change and trigger deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/index.html web/lubiak/lubiak.js
          if ! git diff --cached --quiet; then
            git commit -m 'Render Kathmandu valley only on LUBIAK black backdrop'
          fi
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-30T06:15:00+01:00
          source: chat
          scope: LUBIAK valley black-surface presentation
          reason: remove full viewport valley filter/background and render valley image only on authored black backdrop mesh
          EOF
          git add .github/deploy-now.txt
          git commit -m 'Deploy LUBIAK black backdrop valley rendering' || true
          git push
