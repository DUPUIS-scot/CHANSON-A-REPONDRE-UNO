name: Patch Enochian AI Comptroller stems once

on:
  push:
    paths:
      - '.github/workflows/patch-enochian-stems-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch AI Comptroller stem isolator
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/enochian-terminal/index.html')
          s = p.read_text(encoding='utf-8')
          if 'STEM ISOLATOR · AI COMPTROLLER' in s:
              print('Stem isolator already present')
              raise SystemExit(0)

          s = s.replace('v=20260824-loopinout-fullscreen', 'v=20260824-ai-comptroller-stems', 1)

          css_anchor = " .terminal-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}\n"
          css = """ .stem-isolator{border:1px solid #17332e;padding:9px;border-radius:6px;display:grid;gap:7px;background:#020706}\n .stem-isolator.disabled{opacity:.48}\n .stem-title{text-align:center;color:#9dece0;letter-spacing:.16em;font-size:9px}\n .stem-row{display:grid;grid-template-columns:88px minmax(0,1fr) 42px;gap:6px;align-items:center}\n .stem-toggle{min-width:0!important;padding:7px 5px!important;font-size:8px!important;white-space:nowrap!important}\n .stem-toggle.active{background:#083128!important;color:#63f5cf!important;border-color:#68d8bd!important;box-shadow:0 0 10px #40e6b422!important}\n .stem-range{width:100%;accent-color:#d5aa63}\n .stem-value{font-size:9px;color:#d5aa63;font-weight:800;text-align:right}\n .stem-note{font-size:7px;color:#789f99;text-align:center;line-height:1.35}\n"""
          if css_anchor not in s:
              raise SystemExit('CSS anchor missing')
          s = s.replace(css_anchor, css + css_anchor, 1)

          js_anchor = "  let fxMix=.5,lastPadX=.5,lastPadY=.5,activeInstant=null,instantSnapshot=null,instantOwner=null;\n"
          js = r'''  const stemFiles={
   vocals:'/assets/assets/audio/stems/ai_comptroller/ai_comptroller_vocals.mp3',
   drums:'/assets/assets/audio/stems/ai_comptroller/ai_comptroller_drums.mp3',
   bass:'/assets/assets/audio/stems/ai_comptroller/ai_comptroller_bass.mp3',
   other:'/assets/assets/audio/stems/ai_comptroller/ai_comptroller_other.mp3'
  };
  const stemMedia={},stemSources={},stemGains={};
  const stemState={vocals:{on:true,level:1},drums:{on:true,level:1},bass:{on:true,level:1},other:{on:true,level:1}};
  let stemsReady=false,stemMode=false,originalDeckConnected=true,lastStemSyncAt=0;
  Object.entries(stemFiles).forEach(([key,url])=>{const m=document.createElement('audio');m.preload='auto';m.src=url;m.crossOrigin='anonymous';m.setAttribute('aria-hidden','true');m.style.display='none';document.body.appendChild(m);stemMedia[key]=m});
  function isAiComptroller(){try{return typeof idx!=='undefined'&&idx===0}catch(_){return (q('name')?.textContent||'').trim()==='AI Comptroller'}}
  function stemGainValue(key){const st=stemState[key];return st.on?st.level:0}
  function applyStemGains(){Object.keys(stemGains).forEach(key=>{try{stemGains[key].gain.value=stemGainValue(key)}catch(_){}})}
  function setStemRate(){let rate=1;try{rate=a.playbackRate||1}catch(_){};Object.values(stemMedia).forEach(m=>{try{m.playbackRate=rate;m.preservesPitch=false;m.webkitPreservesPitch=false}catch(_){}})}
  function syncStemTimes(force=false){if(!stemMode)return;let master=0;try{master=a.currentTime||0}catch(_){};Object.values(stemMedia).forEach(m=>{try{if(force||Math.abs((m.currentTime||0)-master)>.045)m.currentTime=master}catch(_){}})}
  async function ensureStemGraph(){if(stemsReady)return;if(typeof ctx==='undefined'||!ctx||typeof low==='undefined'||!low)return;Object.keys(stemMedia).forEach(key=>{const node=ctx.createMediaElementSource(stemMedia[key]);const gain=ctx.createGain();gain.gain.value=stemGainValue(key);node.connect(gain).connect(low);stemSources[key]=node;stemGains[key]=gain});stemsReady=true;applyStemGains();try{log('STEMS READY · VOCALS / DRUMS / BASS / OTHER')}catch(_){}}
  function updateStemUi(){const box=q('stemIsolator');if(!box)return;const ai=isAiComptroller();box.classList.toggle('disabled',!ai);box.querySelectorAll('button,input').forEach(el=>el.disabled=!ai);const note=q('stemNote');if(note)note.textContent=ai?'BASS + OTHERS = INSTRUMENTS · ALL STEMS LOCKED TO MASTER TRANSPORT':'STEM ISOLATOR AVAILABLE ON AI COMPTROLLER';}
  async function setStemMode(){const ai=isAiComptroller();if(ai===stemMode){updateStemUi();return}stemMode=ai;try{await ensureAudio()}catch(_){};await ensureStemGraph();if(ai){try{if(originalDeckConnected&&src){src.disconnect();originalDeckConnected=false}}catch(_){};syncStemTimes(true);setStemRate();applyStemGains();if(!a.paused)Object.values(stemMedia).forEach(m=>Promise.resolve(m.play()).catch(()=>{}));try{log('STEM MODE · AI COMPTROLLER')}catch(_){}}else{Object.values(stemMedia).forEach(m=>{try{m.pause()}catch(_){}});try{if(!originalDeckConnected&&src&&low){src.connect(low);originalDeckConnected=true}}catch(_){};try{log('STEM MODE · OFF')}catch(_){}}updateStemUi()}
  const originalEnsureAudio=typeof ensureAudio==='function'?ensureAudio:null;
  if(originalEnsureAudio)ensureAudio=async function(){await originalEnsureAudio();await ensureStemGraph();if(isAiComptroller()&&!stemMode)await setStemMode();return ctx};
  const leftSide=q('track')&&q('track').closest('.side');
  if(leftSide&&!q('stemIsolator')){const box=document.createElement('div');box.id='stemIsolator';box.className='stem-isolator';box.innerHTML='<div class="stem-title">STEM ISOLATOR · AI COMPTROLLER</div><div class="stem-row"><button class="btn stem-toggle active" data-stem-toggle="vocals">VOCALS</button><input class="stem-range" data-stem-range="vocals" type="range" min="0" max="100" value="100"><output class="stem-value" data-stem-value="vocals">100%</output></div><div class="stem-row"><button class="btn stem-toggle active" data-stem-toggle="drums">DRUMS</button><input class="stem-range" data-stem-range="drums" type="range" min="0" max="100" value="100"><output class="stem-value" data-stem-value="drums">100%</output></div><div class="stem-row"><button class="btn stem-toggle active" data-stem-toggle="instruments">INSTRUMENTS</button><input class="stem-range" data-stem-range="instruments" type="range" min="0" max="100" value="100"><output class="stem-value" data-stem-value="instruments">100%</output></div><div id="stemNote" class="stem-note">BASS + OTHERS = INSTRUMENTS</div>';const trackSelect=q('track');trackSelect.insertAdjacentElement('afterend',box);
   box.querySelectorAll('[data-stem-toggle]').forEach(b=>b.onclick=async()=>{await ensureAudio();const key=b.dataset.stemToggle;if(key==='instruments'){const next=!(stemState.bass.on&&stemState.other.on);stemState.bass.on=next;stemState.other.on=next;b.classList.toggle('active',next)}else{stemState[key].on=!stemState[key].on;b.classList.toggle('active',stemState[key].on)}applyStemGains();try{log('STEM '+key.toUpperCase()+' · '+(b.classList.contains('active')?'ON':'OFF'))}catch(_){}});
   box.querySelectorAll('[data-stem-range]').forEach(r=>r.oninput=async()=>{await ensureAudio();const key=r.dataset.stemRange,level=Math.max(0,Math.min(1,(parseFloat(r.value)||0)/100));if(key==='instruments'){stemState.bass.level=level;stemState.other.level=level}else stemState[key].level=level;const out=box.querySelector('[data-stem-value="'+key+'"]');if(out)out.textContent=Math.round(level*100)+'%';applyStemGains()});
  }
  try{a.addEventListener('play',()=>{if(!stemMode)return;syncStemTimes(true);setStemRate();Object.values(stemMedia).forEach(m=>Promise.resolve(m.play()).catch(()=>{}))});a.addEventListener('pause',()=>{if(stemMode)Object.values(stemMedia).forEach(m=>m.pause())});a.addEventListener('seeking',()=>syncStemTimes(true));a.addEventListener('seeked',()=>syncStemTimes(true));a.addEventListener('ratechange',setStemRate);a.addEventListener('loadedmetadata',()=>setTimeout(setStemMode,0));q('track')?.addEventListener('change',()=>setTimeout(setStemMode,0));q('prev')?.addEventListener('click',()=>setTimeout(setStemMode,0));q('next')?.addEventListener('click',()=>setTimeout(setStemMode,0))}catch(_){}
  function stemDriftTick(now){if(stemMode&&!a.paused&&now-lastStemSyncAt>220){lastStemSyncAt=now;syncStemTimes(false);setStemRate()}requestAnimationFrame(stemDriftTick)}requestAnimationFrame(stemDriftTick);updateStemUi();
'''
          if js_anchor not in s:
              raise SystemExit('JS anchor missing')
          s = s.replace(js_anchor, js + js_anchor, 1)
          s = s.replace('FX MIX · LOOP IN/OUT · FULLSCREEN · TIME-BASED PLATTER', 'FX MIX · AI COMPTROLLER 4-STEM ISOLATOR · LOOP IN/OUT · FULLSCREEN · TIME-BASED PLATTER', 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'STEM ISOLATOR · AI COMPTROLLER' web/enochian-terminal/index.html
          grep -q 'ai_comptroller_vocals.mp3' web/enochian-terminal/index.html
          grep -q 'ai_comptroller_drums.mp3' web/enochian-terminal/index.html
          grep -q 'ai_comptroller_bass.mp3' web/enochian-terminal/index.html
          grep -q 'ai_comptroller_other.mp3' web/enochian-terminal/index.html
          grep -q 'src.disconnect()' web/enochian-terminal/index.html
          grep -q 'node.connect(gain).connect(low)' web/enochian-terminal/index.html
          grep -q "a.addEventListener('seeked'" web/enochian-terminal/index.html
          grep -q 'stemDriftTick' web/enochian-terminal/index.html

      - name: Commit stem isolator
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/enochian-terminal/index.html
          git commit -m 'Add AI Comptroller synchronized stem isolator'
          git push
