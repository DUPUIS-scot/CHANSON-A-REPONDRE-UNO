name: Fix interior Castle origin once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-interior-origin-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Recenter rotated interior and set entrance camera
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/card_castle/card_castle.html')
          source = path.read_text()

          old_transform = "interiorRoot.scale.setScalar(scale);interiorRoot.rotation.y=Math.PI*2.5;interiorRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);scene.add(interiorRoot);"
          new_transform = "interiorRoot.scale.setScalar(scale);interiorRoot.rotation.y=Math.PI*2.5;interiorRoot.position.set(0,0,0);interiorRoot.updateMatrixWorld(true);const rotatedBounds=new THREE.Box3().setFromObject(interiorRoot),rotatedCenter=rotatedBounds.getCenter(new THREE.Vector3());interiorRoot.position.set(-rotatedCenter.x,-rotatedBounds.min.y,-rotatedCenter.z);interiorRoot.updateMatrixWorld(true);scene.add(interiorRoot);"
          if old_transform not in source:
              raise SystemExit('Expected rotated interior transform not found; refusing broad edit')
          source = source.replace(old_transform, new_transform, 1)

          old_camera = "orbit.yaw=.15;orbit.pitch=.18;orbit.distance=29;orbit.target.set(0,6.7,0);updateOrbit()"
          new_camera = "orbit.yaw=.08;orbit.pitch=.045;orbit.distance=21.5;orbit.target.set(0,3.2,.8);updateOrbit()"
          camera_count = source.count(old_camera)
          if camera_count != 2:
              raise SystemExit(f'Expected 2 interior home camera blocks, found {camera_count}')
          source = source.replace(old_camera, new_camera)

          path.write_text(source)

      - name: Validate targeted Castle changes
        shell: python
        run: |
          from pathlib import Path
          source = Path('web/card_castle/card_castle.html').read_text()
          assert 'const rotatedBounds=new THREE.Box3().setFromObject(interiorRoot)' in source
          assert 'interiorRoot.position.set(-rotatedCenter.x,-rotatedBounds.min.y,-rotatedCenter.z)' in source
          assert source.count('orbit.yaw=.08;orbit.pitch=.045;orbit.distance=21.5;orbit.target.set(0,3.2,.8);updateOrbit()') == 2
          assert 'interiorRoot.rotation.y=Math.PI*2.5' in source

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-interior-origin-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/card_castle/card_castle.html .github/workflows/fix-interior-origin-once.yml
          git commit -m "Fix Castle interior origin and entrance camera"
          git push origin HEAD:main
