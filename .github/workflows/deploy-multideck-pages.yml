name: Validate Multi-Deck Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Run multi-deck share tests
        run: flutter test test/public_card_share_service_test.dart test/card_share_page_generator_test.dart test/card_share_target_test.dart test/restored_app_test.dart
      - name: Build Flutter web release
        run: flutter build web --release --base-href "/CHANSON-A-REPONDRE-UNO/" --dart-define=SKIP_AUTH_FOR_DEVELOPMENT=false --dart-define=APP_BUILD_SHA="${{ github.sha }}"
      - name: Generate lightweight BRIO and HP share previews
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick; fi
          mkdir -p build/web/assets/share-previews
          for index in $(seq 1 16); do
            card="$(printf '%03d' "$index")"; source="build/web/assets/assets/decks/chanson_a_repondre_brio/cards/${card}.jpeg"; target="build/web/assets/share-previews/BRIO-${card}.jpg"
            convert "$source" -auto-orient -resize '600x900^' -gravity center -extent 600x900 -strip -sampling-factor 4:2:0 -interlace Plane -quality 62 "$target"
          done
          hp_sources=(
            "ChatGPT Image Aug 22, 2026, 10_59_05 AM.png"
            "ChatGPT Image Aug 22, 2026, 11_00_51 AM.png"
            "ChatGPT Image Aug 22, 2026, 11_08_07 AM.png"
            "ChatGPT Image Aug 22, 2026, 11_12_32 AM.png"
          )
          for index in $(seq 1 4); do
            card="$(printf '%03d' "$index")"; source="build/web/assets/assets/hp/${hp_sources[$((index-1))]}"; target="build/web/assets/share-previews/HP-${card}.jpg"
            test -f "$source"
            convert "$source" -auto-orient -resize '600x900^' -gravity center -extent 600x900 -strip -sampling-factor 4:2:0 -interlace Plane -quality 60 "$target"
          done
      - run: cp build/web/index.html build/web/404.html
      - name: Generate canonical UNO BRIO and HP share pages
        run: dart run scripts/generate_multideck_share_pages.dart --catalog assets/json/cards.json --brio assets/decks/chanson_a_repondre_brio/deck.json --build-dir build/web --public-base https://dupuis-scot.github.io/CHANSON-A-REPONDRE-UNO/
      - name: Verify multi-deck share output
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'UNO-*' | wc -l)" -eq 84
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'BRIO-*' | wc -l)" -eq 16
          test "$(find build/web/share -mindepth 1 -maxdepth 1 -type d -name 'HP-*' | wc -l)" -eq 4
          test -f build/web/share/HP-001/index.html
          test -f build/web/share/HP-004/index.html
          grep -q 'Chanson à répondre HP — Carte 001' build/web/share/HP-001/index.html
          grep -q 'assets/share-previews/HP-001.jpg' build/web/share/HP-001/index.html
          grep -q 'property="og:image"' build/web/share/HP-001/index.html
          grep -q 'name="twitter:image"' build/web/share/HP-004/index.html
          grep -q '#/cards/hp-004' build/web/share/HP-004/index.html
          test "$(find build/web/assets/share-previews -type f -name 'HP-*.jpg' | wc -l)" -eq 4
          test -f build/web/assets/assets/models/jester_player.glb
          test -f build/web/assets/assets/models/play_jester_rigged.glb
          test -f build/web/assets/assets/models/castle_exterior.glb
          test -f build/web/card_castle/card_castle.html
