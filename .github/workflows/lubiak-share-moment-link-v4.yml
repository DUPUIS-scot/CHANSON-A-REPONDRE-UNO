name: LUBIAK share exact moment link v4
on:
  push:
    paths: ['.github/run-lubiak-share-moment-link-v4.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: node scripts/patch-lubiak-share-moment-link-v4.mjs
      - name: Validate
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_SHARE_MOMENT_LINK_V4' web/lubiak/lubiak.js
          grep -q "searchParams.set('moment'" web/lubiak/lubiak.js
          grep -q "applySharedLubiakMoment()" web/lubiak/lubiak.js
          ! grep -A120 'LUBIAK_SHARE_MOMENT_LINK_V4' web/lubiak/lubiak.js | grep -q 'files:'
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/lubiak/lubiak.js
          if ! git diff --cached --quiet; then git commit -m 'Share exact LUBIAK moment as link only'; fi
          git push
