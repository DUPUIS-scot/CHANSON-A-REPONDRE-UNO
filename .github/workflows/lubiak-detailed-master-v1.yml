name: LUBIAK detailed master v1

on:
  push:
    branches: [main]
    paths:
      - '.lubiak-detailed-master-v1-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply detailed LUBIAK master contract
        run: node scripts/patch-lubiak-detailed-master-v1.mjs
      - name: Validate single detailed environment
        shell: bash
        run: |
          set -euo pipefail
          node --check web/lubiak/lubiak.js
          grep -q 'textured-glb-comparison/LUBIAK_master_optimized_4_ELEMENT_PBR.glb' web/lubiak/lubiak.js
          ! grep -q 'LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb' web/lubiak/lubiak.js
          ! grep -q "'/assets/assets/models/LUBIAK.glb" web/lubiak/lubiak.js
          test "$(grep -c 'url:' web/lubiak/lubiak.js | head -n1)" -ge 1
          grep -q 'textured-glb-comparison/LUBIAK_master_optimized_4_ELEMENT_PBR.glb' web/lubiak/index.html
      - name: Request live deployment
        shell: bash
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-31T17:40:00+01:00
          source: chat
          workflow: WEB — Deploy Live Site
          scope: LUBIAK original detailed PBR master only
          reason: load LUBIAK_master_optimized_4_ELEMENT_PBR.glb directly as the sole environment and stop using the WEB_OPTIMIZED derivative
          EOF
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js web/lubiak/index.html .github/workflows/deploy-pages.yml .github/deploy-now.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Use original detailed LUBIAK PBR master only'
          git pull --rebase origin main
          git push origin HEAD:main
