name: LUBIAK broom 3D flight

on:
  push:
    paths:
      - '.lubiak-flight-navigation-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 3D flight navigation
        run: node scripts/patch-lubiak-flight-navigation.mjs
      - name: Commit and push safely
        run: |
          if git diff --quiet -- web/lubiak/lubiak.js; then
            echo 'No flight patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js
          git commit -m 'Enable full 3D broom flight navigation'
          git pull --rebase origin main
          git push origin HEAD:main
