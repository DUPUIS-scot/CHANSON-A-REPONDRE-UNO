name: LUBIAK authored PBR repair v1

on:
  push:
    branches: [main]
    paths:
      - '.lubiak-authored-pbr-repair-v1-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve authored LUBIAK PBR materials
        run: node scripts/repair-lubiak-authored-pbr-v1.mjs
      - name: Validate runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_master_optimized_4_ELEMENT_PBR.glb?v=20260831-authored-pbr-v1' web/lubiak/lubiak.js
          ! grep -q 'LUBIAK_TERRAIN_COAL_V2' web/lubiak/lubiak.js
          ! grep -q 'LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb' web/lubiak/index.html
      - name: Request live deployment
        shell: bash
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-31T18:15:00+01:00
          source: chat
          workflow: WEB — Deploy Live Site
          scope: LUBIAK original authored PBR textures
          reason: load original detailed LUBIAK PBR master directly and preserve its authored materials/maps without runtime coal/ember replacement
          EOF
      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js web/lubiak/index.html .github/deploy-now.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve authored LUBIAK PBR textures'
          git pull --rebase origin main
          git push origin HEAD:main
