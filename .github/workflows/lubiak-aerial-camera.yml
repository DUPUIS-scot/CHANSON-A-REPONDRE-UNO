name: LUBIAK aerial camera patch

on:
  push:
    paths:
      - '.lubiak-aerial-camera-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply aerial camera mode
        run: node scripts/patch-lubiak-aerial-camera.mjs
      - name: Commit and deploy implementation
        run: |
          if git diff --quiet -- web/lubiak/lubiak.js; then
            echo 'No aerial camera patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js
          git commit -m 'Implement LUBIAK aerial observation camera'
          git fetch origin main
          git rebase origin/main
          printf '%s\n' 'Deploy LUBIAK: ground-level walking, collision-safe 3D broom flight, dragon guardian behavior, and detachable aerial observation camera with return to third person.' > .deploy-trigger
          git add .deploy-trigger
          git commit -m 'Deploy complete LUBIAK gameplay update'
          git push origin HEAD:main
