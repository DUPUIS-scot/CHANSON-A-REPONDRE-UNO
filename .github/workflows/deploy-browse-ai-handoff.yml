name: Dispatch Browse AI handoff deploy

on:
  push:
    branches:
      - feature/browse-external-ai-handoff

permissions:
  contents: read
  actions: write

jobs:
  dispatch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production Pages workflow for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          response_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            -d "{\"ref\":\"${REF_NAME}\"}")"
          if [ "${response_code}" != '204' ]; then
            cat /tmp/dispatch-response.txt
            echo "::error::Workflow dispatch returned HTTP ${response_code}."
            exit 1
          fi
