name: LUBIAK exact WEB_OPTIMIZED v1

on:
  push:
    branches: [main]
    paths:
      - '.lubiak-exact-weboptimized-v1-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply ordered modular LUBIAK runtime
        run: node scripts/patch-lubiak-exact-weboptimized-v1.mjs
      - name: Validate ordered modular model contract
        shell: bash
        run: |
          set -euo pipefail
          node --check web/lubiak/lubiak.js
          node <<'NODE'
          const fs = require('fs');
          const runtimePath = 'web/lubiak/lubiak.js';
          const src = fs.readFileSync(runtimePath, 'utf8');
          if (!src.includes('LUBIAK_ORDERED_MODULAR_ENVIRONMENT_V1')) throw new Error('ordered modular marker missing');
          if (src.includes('LUBIAK_REASSEMBLED_MODULAR_WEB.glb')) throw new Error('combined modular master still referenced');
          if (src.includes('/assets/assets/models/LUBIAK.glb')) throw new Error('legacy LUBIAK.glb still referenced');
          const expected = [
            ['freak%20street.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/freak street.glb'],
            ['avenue.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/avenue.glb'],
            ['roof%20top.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/roof top.glb'],
            ['palace.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/palace.glb'],
            ['circus.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/circus.glb'],
            ['district.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/district.glb'],
            ['card%20room.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/card room.glb'],
            ['dragon%20lair.glb?v=20260903-modular-v3', 'assets/models/textured-glb-comparison/lubiak-assets/dragon lair.glb'],
          ];
          let lastIndex = -1;
          for (const [url, path] of expected) {
            const idx = src.indexOf(url);
            if (idx < 0) throw new Error(`missing runtime module URL: ${url}`);
            if (idx <= lastIndex) throw new Error(`module order violation at: ${url}`);
            lastIndex = idx;
            const stat = fs.statSync(path);
            if (!stat.isFile() || stat.size <= 0) throw new Error(`missing or empty module asset: ${path}`);
            console.log(`OK ${url} -> ${path} (${stat.size} bytes)`);
          }
          console.log('LUBIAK ordered modular contract verified');
          NODE
      - name: Request deployment
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-09-03T12:31:00+01:00
          source: chat
          workflow: WEB — Deploy Live Site
          scope: LUBIAK ordered modular environment
          reason: persistent terrain plus Freak Street -> Avenue -> Roof Top -> Palace -> Circus -> District 0 -> Card Room -> Dragon Lair
          EOF
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js web/lubiak/index.html .github/workflows/deploy-pages.yml .github/deploy-now.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy ordered modular LUBIAK environment'
          git pull --rebase origin main
          git push origin HEAD:main
