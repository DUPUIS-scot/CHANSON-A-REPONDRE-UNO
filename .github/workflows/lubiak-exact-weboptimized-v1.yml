name: LUBIAK exact WEB_OPTIMIZED v1

on:
  push:
    branches: [main]
    paths:
      - '.lubiak-exact-weboptimized-v1-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact WEB_OPTIMIZED runtime path
        run: node scripts/patch-lubiak-exact-weboptimized-v1.mjs
      - name: Validate exact model contract
        shell: bash
        run: |
          set -euo pipefail
          node --check web/lubiak/lubiak.js
          grep -q 'textured-glb-comparison/LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb' web/lubiak/lubiak.js
          ! grep -q '/assets/assets/models/LUBIAK.glb' web/lubiak/lubiak.js
          test -s assets/models/textured-glb-comparison/LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb
      - name: Request deployment
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-31T17:05:00+01:00
          source: chat
          workflow: WEB — Deploy Live Site
          scope: exact LUBIAK WEB_OPTIMIZED PBR display
          reason: load only LUBIAK_master_optimized_4_ELEMENT_PBR_WEB_OPTIMIZED.glb directly in LUBIAK and deploy
          EOF
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js .github/workflows/deploy-pages.yml .github/deploy-now.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Display exact LUBIAK WEB_OPTIMIZED PBR model'
          git pull --rebase origin main
          git push origin HEAD:main
