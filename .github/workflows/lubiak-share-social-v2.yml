name: LUBIAK social share capture v2
on:
  push:
    paths: ['.github/run-lubiak-share-social-v2.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Upgrade share capture
        run: node scripts/upgrade-lubiak-share-social-v2.mjs
      - name: Validate
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_SHARE_SOCIAL_COMPOSITION_V2' web/lubiak/lubiak.js
          grep -q '/assets/assets/images/app_logo.png' web/lubiak/lubiak.js
          grep -q 'www.chanson-a-repondre-uno.scot/lubiak/' web/lubiak/lubiak.js
          test -s assets/images/app_logo.png
      - name: Commit and request deploy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/lubiak/lubiak.js
          if ! git diff --cached --quiet; then git commit -m 'Upgrade LUBIAK social share capture'; fi
          printf 'deploy %s\n' "$(date -u +%FT%TZ)" > .github/deploy-now.txt
          git add .github/deploy-now.txt
          git commit -m 'Deploy LUBIAK social share capture'
          git push
