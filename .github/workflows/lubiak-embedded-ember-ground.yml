name: LUBIAK embedded ember ground

on:
  push:
    paths:
      - 'scripts/patch-lubiak-embedded-ember-ground.mjs'
      - '.github/workflows/lubiak-embedded-ember-ground.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply embedded ember material to neutral LUBIAK ground
        run: node scripts/patch-lubiak-embedded-ember-ground.mjs
      - name: Validate runtime syntax
        run: node --check web/lubiak/lubiak.js
      - name: Commit runtime change
        run: |
          if git diff --quiet -- web/lubiak/lubiak.js; then
            echo 'No runtime changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js
          git commit -m 'Apply ember coal material to LUBIAK gray ground'
          git push
