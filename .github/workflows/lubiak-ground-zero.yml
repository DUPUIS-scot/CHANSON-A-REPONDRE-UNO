name: LUBIAK circus and djinn ground zero

on:
  push:
    branches: [main]
    paths:
      - '.lubiak-ground-zero-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply circus and djinn ground-zero repair
        run: node scripts/patch-lubiak-ground-zero-circus.mjs
      - name: Validate runtime
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_CIRCUS_GROUND_ZERO_V1' web/lubiak/lubiak.js
          grep -q 'const targetY=0' web/lubiak/lubiak.js
      - name: Request deployment
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-30T03:00:00+01:00
          source: chat
          scope: LUBIAK circus + djinn ground zero
          reason: raise buried circus independently; lock walking djinn feet to world Y=0
          EOF
      - name: Commit and push repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js .github/deploy-now.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix LUBIAK circus and djinn ground zero'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
