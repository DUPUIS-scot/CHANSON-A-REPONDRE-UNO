name: LUBIAK shared plaza ground repair

on:
  push:
    branches: [main]
    paths:
      - '.lubiak-ground-zero-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared plaza-ground repair
        run: node scripts/patch-lubiak-ground-zero-circus.mjs
      - name: Validate runtime
        run: |
          node --check web/lubiak/lubiak.js
          node --check web/lubiak/lubiak-terrain-addon.js
          grep -q 'LUBIAK_PLAZA_DATUM_V2' web/lubiak/lubiak.js
          grep -q 'LUBIAK_CIRCUS_GROUND_ZERO_V2' web/lubiak/lubiak.js
          grep -q 'groundSurfaceBelow(playerRoot.position,6.5)' web/lubiak/lubiak.js
          grep -q 'new THREE.Vector3(envCenter.x, 0.025, envCenter.z)' web/lubiak/lubiak-terrain-addon.js
          if grep -q 'const targetY=0' web/lubiak/lubiak.js; then
            echo 'Hardcoded player ground zero is still present' >&2
            exit 1
          fi
      - name: Request deployment
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-30T03:18:00+01:00
          source: chat
          scope: LUBIAK shared plaza ground authority
          reason: unify master, circus, ember terrain, and djinn on one plaza datum; restore walkable-surface grounding
          EOF
      - name: Commit and push repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js web/lubiak/lubiak-terrain-addon.js .github/deploy-now.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix LUBIAK shared plaza ground authority'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
