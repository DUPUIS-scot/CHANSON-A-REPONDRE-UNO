name: LUBIAK asset integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lubiak-360-background.yml'
      - 'web/lubiak/assets/lubiak-kathmandu-360.jpg'
      - 'assets/models/lubiak_freak_street_2_ultralight.glb'
      - 'web/vendor/draco/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate panorama, Freak Street GLB, and pinned Draco
        shell: bash
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path
          from PIL import Image

          panorama = Path('web/lubiak/assets/lubiak-kathmandu-360.jpg')
          with Image.open(panorama) as image:
              image.load()
              if image.format != 'JPEG':
                  raise SystemExit('LUBIAK panorama is not a decodable JPEG')
              width, height = image.size
              if width < 2048 or height < 1024 or width != height * 2:
                  raise SystemExit(f'LUBIAK panorama is not 2:1 equirectangular: {image.size}')

          street_path = Path('assets/models/lubiak_freak_street_2_ultralight.glb')
          street = street_path.read_bytes()
          if len(street) < 20:
              raise SystemExit('Freak Street GLB is empty')
          magic, version, declared = struct.unpack('<4sII', street[:12])
          if magic != b'glTF' or version != 2 or declared != len(street):
              raise SystemExit(f'Freak Street GLB length mismatch: declared={declared}, actual={len(street)}')
          json_length, json_type = struct.unpack('<II', street[12:20])
          document = json.loads(street[20:20 + json_length].decode('utf-8').rstrip(' \0'))
          if len(document.get('meshes', [])) < 2 or len(document.get('nodes', [])) < 10:
              raise SystemExit('Freak Street GLB scene contract is incomplete')

          required = {
              'web/vendor/draco/DRACOLoader.js': 10000,
              'web/vendor/draco/draco_decoder.js': 500000,
              'web/vendor/draco/draco_wasm_wrapper.js': 40000,
              'web/vendor/draco/draco_decoder.wasm': 200000,
          }
          for name, minimum in required.items():
              size = Path(name).stat().st_size
              if size < minimum:
                  raise SystemExit(f'Pinned Draco asset is incomplete: {name} ({size} bytes)')

          print(f'LUBIAK integrity passed: panorama={width}x{height}, street={len(street)} bytes')
          PY
