name: LUBIAK Megapole gateway v2
on:
  push:
    paths: ['.github/run-lubiak-megapole-gateway-v2.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Activate Megapole passage
        run: node scripts/patch-lubiak-megapole-gateway-v2.mjs
      - name: Validate
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_MEGAPOLE_GATEWAY_V2' web/lubiak/lubiak.js
          grep -q "worldMode!=='exterior'" web/lubiak/lubiak.js
          grep -q 'openMegapoleInsideLubiak();' web/lubiak/lubiak.js
          grep -q 'DRAGON GATE' web/lubiak/lubiak.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/lubiak/lubiak.js
          if ! git diff --cached --quiet; then
            git commit -m 'Activate dragon passage to Megapole in all LUBIAK modes'
            git push
          fi
