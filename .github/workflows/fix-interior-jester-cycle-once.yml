name: Fix Castle interior and jester return once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-interior-jester-cycle-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore authoritative interior view and exterior state
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/card_castle/card_castle.html')
          source = path.read_text()

          old_switch = "function switchToInterior(){if(!state.interiorReady||!interiorRoot)return false;state.sceneMode='interior';document.body.dataset.sceneMode='interior';castleRoot.visible=false;interiorRoot.visible=true;cardGroup.visible=false;orbit.yaw=.08;orbit.pitch=.045;orbit.distance=21.5;orbit.target.set(0,3.2,.8);updateOrbit();return true}"
          new_switch = "function setInteriorStartingView(){orbit.yaw=0;orbit.pitch=.10;orbit.distance=24;orbit.target.set(0,7.9,-1.8);state.targetCamera=null;state.targetLook=null;updateOrbit();document.body.dataset.interiorStartingView='construction-panel-staircase-throne'}function switchToInterior(){if(!state.interiorReady||!interiorRoot)return false;state.sceneMode='interior';document.body.dataset.sceneMode='interior';castleRoot.visible=false;interiorRoot.visible=true;cardGroup.visible=false;setInteriorStartingView();return true}function switchToExterior(){if(!castleRoot)return false;state.sceneMode='exterior';state.entranceStarted=false;document.body.dataset.sceneMode='exterior';castleRoot.visible=true;if(interiorRoot)interiorRoot.visible=false;cardGroup.visible=true;state.targetCamera=null;state.targetLook=null;setDefaultView();updateSceneCount();return true}"
          if source.count(old_switch) != 1:
              raise SystemExit(f'Expected exactly one current switchToInterior block, found {source.count(old_switch)}')
          source = source.replace(old_switch, new_switch, 1)

          old_reset = "if(state.sceneMode==='interior'){orbit.yaw=.08;orbit.pitch=.045;orbit.distance=21.5;orbit.target.set(0,3.2,.8);updateOrbit()}else setDefaultView()"
          new_reset = "if(state.sceneMode==='interior')setInteriorStartingView();else setDefaultView()"
          if source.count(old_reset) != 1:
              raise SystemExit(f'Expected exactly one current reset block, found {source.count(old_reset)}')
          source = source.replace(old_reset, new_reset, 1)

          old_runtime = "window.__castleSearchRuntime={get scene(){return scene},get camera(){return camera},get renderer(){return renderer},get castleRoot(){return castleRoot},get interiorRoot(){return interiorRoot},orbit,updateOrbit,setCards};"
          new_runtime = "window.__castleSearchRuntime={get scene(){return scene},get camera(){return camera},get renderer(){return renderer},get castleRoot(){return castleRoot},get interiorRoot(){return interiorRoot},orbit,updateOrbit,setCards,switchToInterior,switchToExterior,setInteriorStartingView};"
          if source.count(old_runtime) != 1:
              raise SystemExit(f'Expected exactly one runtime export block, found {source.count(old_runtime)}')
          source = source.replace(old_runtime, new_runtime, 1)

          path.write_text(source)

      - name: Make gatekeeper restartable
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/card_castle/castle_jester_gatekeeper.js')
          source = path.read_text()
          old = "  setVisible(active){this.root.visible=Boolean(active&&this.ready);if(!active)this.clearHover()}\n  dispose(){this.dracoLoader?.dispose();this.scene?.remove(this.root)}"
          new = "  restartLoop(){\n    if(!this.ready)return;\n    this.clicked=false;\n    this.enterDispatched=false;\n    this.elapsed=0;\n    this.clickStarted=0;\n    this.clearHover();\n    this.resetBones();\n    this.root.rotation.y=BASE_ROTATION;\n    document.body.dataset.castleJesterState='looping';\n  }\n  setVisible(active){this.root.visible=Boolean(active&&this.ready);if(!active)this.clearHover()}\n  dispose(){this.dracoLoader?.dispose();this.scene?.remove(this.root)}"
          if source.count(old) != 1:
              raise SystemExit(f'Expected gatekeeper tail once, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source)

      - name: Stop camera override and restart jester on exterior return
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/card_castle/castle_jester_overlay.js')
          source = path.read_text()

          old_request = "function requestEntrance(){if(document.body.dataset.sceneMode==='interior')return;document.body.dataset.castleJesterState='opening-gate';armInteriorEntryFocus(activeRuntime);window.dispatchEvent(new CustomEvent('castleJesterEnter'))}"
          new_request = "function requestEntrance(){if(document.body.dataset.sceneMode==='interior')return;document.body.dataset.castleJesterState='opening-gate';window.dispatchEvent(new CustomEvent('castleJesterEnter'))}"
          if source.count(old_request) != 1:
              raise SystemExit(f'Expected current requestEntrance once, found {source.count(old_request)}')
          source = source.replace(old_request, new_request, 1)

          old_tail = "window.addEventListener('castleRuntimeReady',()=>tryInstall(),{passive:true});if(!tryInstall()){let attempts=0;const timer=setInterval(()=>{if(tryInstall()||attempts++>160)clearInterval(timer)},100)}\nwindow.addEventListener('beforeunload',()=>{if(frame)cancelAnimationFrame(frame);if(interiorFocusFrame)cancelAnimationFrame(interiorFocusFrame);gatekeeper?.dispose()},{once:true});"
          new_tail = "window.addEventListener('castleRuntimeReady',()=>tryInstall(),{passive:true});if(!tryInstall()){let attempts=0;const timer=setInterval(()=>{if(tryInstall()||attempts++>160)clearInterval(timer)},100)}\nlet previousSceneMode=document.body.dataset.sceneMode||'exterior';\nfunction restartExteriorJester(){if(document.body.dataset.sceneMode!=='exterior'||!gatekeeper)return;gatekeeper.restartLoop?.();placeAtGate(activeRuntime?.castleRoot,activeRuntime?.camera);gatekeeper.setVisible(true);document.body.dataset.castleJesterRestart='exterior-return-v1'}\nconst sceneModeObserver=new MutationObserver(()=>{const mode=document.body.dataset.sceneMode||'exterior';if(mode===previousSceneMode)return;const from=previousSceneMode;previousSceneMode=mode;if(from==='interior'&&mode==='exterior')restartExteriorJester()});\nsceneModeObserver.observe(document.body,{attributes:true,attributeFilter:['data-scene-mode']});\nwindow.addEventListener('beforeunload',()=>{sceneModeObserver.disconnect();if(frame)cancelAnimationFrame(frame);if(interiorFocusFrame)cancelAnimationFrame(interiorFocusFrame);gatekeeper?.dispose()},{once:true});"
          if source.count(old_tail) != 1:
              raise SystemExit(f'Expected overlay tail once, found {source.count(old_tail)}')
          source = source.replace(old_tail, new_tail, 1)
          path.write_text(source)

      - name: Validate Castle repair
        shell: python
        run: |
          from pathlib import Path

          castle = Path('web/card_castle/card_castle.html').read_text()
          gatekeeper = Path('web/card_castle/castle_jester_gatekeeper.js').read_text()
          overlay = Path('web/card_castle/castle_jester_overlay.js').read_text()

          assert "function setInteriorStartingView()" in castle
          assert "interiorStartingView='construction-panel-staircase-throne'" in castle
          assert "function switchToExterior()" in castle
          assert "switchToExterior,setInteriorStartingView" in castle
          assert "if(state.sceneMode==='interior')setInteriorStartingView();else setDefaultView()" in castle
          assert "restartLoop()" in gatekeeper
          assert "this.clicked=false" in gatekeeper
          assert "castleJesterState='looping'" in gatekeeper
          assert "armInteriorEntryFocus(activeRuntime)" not in overlay
          assert "restartExteriorJester" in overlay
          assert "from==='interior'&&mode==='exterior'" in overlay

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-interior-jester-cycle-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/card_castle/card_castle.html web/card_castle/castle_jester_gatekeeper.js web/card_castle/castle_jester_overlay.js .github/workflows/fix-interior-jester-cycle-once.yml
          git commit -m "Restore Castle interior view and jester return loop"
          git push origin HEAD:main
