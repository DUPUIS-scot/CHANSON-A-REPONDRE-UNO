name: Patch Enochian play transport once

on:
  push:
    paths:
      - '.github/workflows/patch-enochian-play-only-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reliable play transport
        shell: python
        run: |
          from pathlib import Path
          p = Path('web/enochian-terminal/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v=20260824-runtime-fixes-v3', 'v=20260824-canonical-play-v4', 1)
          if 'RELIABLE BASE TRANSPORT' not in s:
              anchor = "  const top=d.querySelector('.top');\n"
              patch = r'''  // RELIABLE BASE TRANSPORT: base deck play cannot depend on optional stems.
          const reliablePlay=q('play');
          if(reliablePlay){
           reliablePlay.onclick=async()=>{
            try{
             if(typeof a==='undefined'||!a)return;
             if(a.paused){
              try{if(typeof originalEnsureAudio==='function'&&originalEnsureAudio)await originalEnsureAudio();else if(typeof ensureAudio==='function')await ensureAudio()}catch(_){}
              try{if(typeof disablePitchPreservation==='function')disablePitchPreservation()}catch(_){}
              try{if(typeof applyPlaybackRate==='function')applyPlaybackRate()}catch(_){}
              await a.play();
              try{if(typeof setStemMode==='function')Promise.resolve(setStemMode()).catch(()=>{})}catch(_){}
             }else a.pause();
            }catch(error){
             try{log('PLAY ERROR · '+(error&&error.message?error.message:'UNKNOWN'))}catch(_){}
             try{if(a.paused)await a.play()}catch(_){}
            }
           };
          }
'''
              if anchor not in s:
                  raise SystemExit('Terminal action anchor missing')
              s = s.replace(anchor, patch + anchor, 1)
          p.write_text(s, encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          grep -q 'RELIABLE BASE TRANSPORT' web/enochian-terminal/index.html
          grep -q '20260824-canonical-play-v4' web/enochian-terminal/index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/enochian-terminal/index.html
          git commit -m 'Restore Enochian play transport'
          git push
