name: Check Render Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/render-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Validate backend URL
        env:
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          if [ -z "$AI_BACKEND_URL" ]; then
            echo "AI_BACKEND_URL is not configured in GitHub Actions secrets or variables."
            exit 1
          fi

      - name: Wait for Render diagnostics endpoint
        env:
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          for attempt in $(seq 1 18); do
            echo "Attempt $attempt/18"
            if curl --fail --silent --show-error --max-time 20 \
              "$AI_BACKEND_URL/diagnostics" > /tmp/diagnostics.json; then
              jq . /tmp/diagnostics.json
              exit 0
            fi
            sleep 10
          done
          echo "Render diagnostics endpoint did not become ready in time."
          exit 1

      - name: Health
        env:
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$AI_BACKEND_URL/health" | jq .

      - name: Readiness
        env:
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$AI_BACKEND_URL/ready" | jq .

      - name: Diagnostics
        env:
          AI_BACKEND_URL: ${{ secrets.AI_BACKEND_URL || vars.AI_BACKEND_URL }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$AI_BACKEND_URL/diagnostics" | jq .
