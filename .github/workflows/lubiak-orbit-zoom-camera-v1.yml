name: LUBIAK touch mouse orbit zoom
on:
  push:
    paths: ['.github/run-lubiak-orbit-zoom-camera-v1.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: node scripts/patch-lubiak-orbit-zoom-camera-v1.mjs
      - name: Validate
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_CAMERA_ORBIT_ZOOM_V1' web/lubiak/lubiak.js
          grep -q "addEventListener('wheel'" web/lubiak/lubiak.js
          grep -q 'orbitPinchDistance' web/lubiak/lubiak.js
      - name: Commit and deploy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/lubiak/lubiak.js
          if ! git diff --cached --quiet; then git commit -m 'Use camera-only touch mouse orbit and zoom'; fi
          printf 'deploy %s\n' "$(date -u +%FT%TZ)" > .github/deploy-now.txt
          git add .github/deploy-now.txt
          git commit -m 'Deploy LUBIAK camera orbit zoom'
          git push
