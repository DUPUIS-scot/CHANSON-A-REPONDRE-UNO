name: Normalize terminal stems

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-terminal-stems-v4
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/normalize_terminal_stems.py
            assets/audio/stems/
            web/enochian-test/live-copy.html
            pubspec.yaml

      - name: Check audio tools
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Normalize terminal stems
        shell: bash
        run: python3 .github/scripts/normalize_terminal_stems.py

      - name: Commit normalized library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/stems pubspec.yaml web/enochian-test/live-copy.html
          if git diff --cached --quiet; then
            echo 'Terminal stem library already normalized.'
            exit 0
          fi
          git commit -m 'Normalize terminal stem library'
          git push origin HEAD:main
