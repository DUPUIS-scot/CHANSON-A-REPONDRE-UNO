name: Normalize terminal stems

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: normalize-terminal-stems-v6
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts/normalize_terminal_stems.py
            assets/audio/stems/
            web/enochian-test/live-copy.html
            pubspec.yaml

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Normalize terminal stems
        shell: bash
        run: python3 .github/scripts/normalize_terminal_stems.py

      - name: Commit normalized library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/stems pubspec.yaml web/enochian-test/live-copy.html
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize terminal stem library'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'Terminal stem library already normalized.'
          fi

      - name: Deploy normalized main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy-pages.yml --ref main
