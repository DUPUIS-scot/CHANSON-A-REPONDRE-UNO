name: LUBIAK djinn broom authority repair

on:
  push:
    branches: [main]
    paths:
      - '.lubiak-djinn-broom-authority-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply djinn broom authority repair
        run: node scripts/patch-lubiak-djinn-broom-authority.mjs
      - name: Validate runtime
        run: |
          node --check web/lubiak/lubiak.js
          grep -q 'DA_NOBLE_Y2K_HAND_GRIP_SOCKET' web/lubiak/lubiak.js
          grep -q 'LUBIAK_DJINN_BROOM_AUTHORITY_V1' web/lubiak/lubiak.js
          grep -q 'walkBlend = 0;' web/lubiak/lubiak.js
      - name: Request deployment
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-30T04:40:00+01:00
          source: chat
          scope: LUBIAK djinn + DA NOBLE Y2K broom
          reason: hand-authoritative walk grip and isolated mount/flight pose ownership
          EOF
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js .github/deploy-now.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix LUBIAK djinn and broom rig authority'
          git pull --rebase origin main
          git push origin HEAD:main
