name: Apply Enochian music spring fix

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Enochian deck lab
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('web/enochian-test/index.html')
          s = p.read_text()
          s = re.sub(r'<a class="home-link" href="/" aria-label="[^"]*"[^>]*>.*?</a>', '<a class="home-link" href="/" aria-label="Home" title="Home">⌂</a>', s, count=1)
          s = re.sub(r'\.home-link\{[^}]*\}', '.home-link{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border:1px solid var(--line2);border-radius:5px;background:#06110f;color:#a9eee7;text-decoration:none;font-size:20px;line-height:1;letter-spacing:0}', s, count=1)
          s = re.sub(r'\.platter\{position:absolute;inset:8px;border-radius:50%;background:[^}]+?transform:rotate\(var\(--rot\)\);overflow:hidden\}', '.platter{position:absolute;inset:8px;border-radius:50%;background:#020403;border:4px solid #233a36;box-shadow:0 0 0 7px #020303,0 0 0 9px #28463f,0 0 42px #45e7c033,inset 0 0 45px #000;overflow:hidden}\\n.platter:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,#06100e 0 4px,#172a26 5px 6px,#040807 7px 12px),repeating-conic-gradient(from 0deg,#d5aa6318 0 1deg,transparent 1deg 11deg);transform:rotate(var(--rot));transform-origin:50% 50%;will-change:transform;z-index:0}', s, count=1)
          s = re.sub(r'\.disc\{position:absolute;inset:([0-9]+%);', r'.disc{position:absolute;inset:\1;z-index:1;', s, count=1)
          s = re.sub(r'\.platter-art\{[^}]*\}', '.platter-art{width:100%;height:100%;object-fit:contain;object-position:center;display:block;transform:none!important;filter:none}', s, count=1)
          s = re.sub(r'uno_jester_headphones\.webp\?v=[^"\']+', 'uno_jester_headphones.webp?v=20260823-music-spring', s)
          s = s.replace('<span>BASS</span><b id="b0">00000000</b>', '<span>NOTE</span><b id="b0">00000000</b>')
          s = s.replace('<span>MID</span><b id="b1">00000000</b>', '<span>CHROMA</span><b id="b1">00000000</b>')
          s = s.replace('<span>HIGH</span><b id="b2">00000000</b>', '<span>LEVEL</span><b id="b2">00000000</b>')
          s = re.sub(r'an\.fftSize=\d+;an\.smoothingTimeConstant=[0-9.]+;', 'an.fftSize=1024;an.smoothingTimeConstant=.12;', s, count=1)
          s = s.replace('let beatBase=0,beatPeak=0,rot=0,', 'let beatBase=0,beatPeak=0,prevSpectrum=null,rot=0,', 1)
          signal = r'''function signal(){
            if(!an||!ctx)return{vals:[0,0,0,0],note:'—',chroma:'—'};
            const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);
            const nyquist=ctx.sampleRate/2,binHz=nyquist/d.length;
            let peakBin=0,peakMag=0,total=0,flux=0;const chroma=new Float32Array(12);
            for(let i=1;i<d.length;i++){const mag=d[i],freq=i*binHz;total+=mag;if(prevSpectrum)flux+=Math.max(0,mag-prevSpectrum[i]);if(freq>=55&&freq<=4200&&mag>peakMag){peakMag=mag;peakBin=i}if(freq>=55&&freq<=5000&&mag>4){const midi=Math.round(69+12*Math.log2(freq/440));const pc=((midi%12)+12)%12;chroma[pc]+=mag*mag}}
            prevSpectrum=d.slice();const freq=peakBin*binHz;const midi=freq>0?Math.max(0,Math.min(127,Math.round(69+12*Math.log2(freq/440)))):0;const pc=((midi%12)+12)%12,noteNames=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];let chromaPc=0;for(let i=1;i<12;i++)if(chroma[i]>chroma[chromaPc])chromaPc=i;const level=Math.min(255,Math.round(total/Math.max(1,d.length)*2.25));if(!beatBase)beatBase=flux;const onset=Math.max(0,flux-beatBase*1.22);beatBase=beatBase*.90+flux*.10;beatPeak=Math.max(Math.min(255,onset*.055),beatPeak*.52);const noteVal=Math.round(midi/127*255),chromaVal=Math.round(chromaPc/11*255),beat=Math.round(beatPeak);const octave=midi?Math.floor(midi/12)-1:'';return{vals:[noteVal,chromaVal,level,beat],note:midi?noteNames[pc]+octave:'—',chroma:noteNames[chromaPc]};
          }'''
          s = re.sub(r'function signal\(\)\{.*?\}\nfunction draw', signal + '\nfunction draw', s, count=1, flags=re.S)
          s = re.sub(r"const vals=signal\(\);vals\.forEach\(\(n,i\)=>\{\$\('b'\+i\)\.textContent=n\.toString\(2\)\.padStart\(8,'0'\);\$\('g'\+i\)\.src=glyphUrl\(n%21\)\}\);", "const music=signal(),vals=music.vals;vals.forEach((n,i)=>{$('b'+i).textContent=(i===0?music.note+' ':i===1?music.chroma+' ':'')+n.toString(2).padStart(8,'0');$('g'+i).src=glyphUrl(n%21)});", s, count=1)
          if 'function restorePadCenter()' not in s:
              s = s.replace("$('padActivate').onclick=async()=>", "function restorePadCenter(){setPad(.5,.5,false);if(!ctx)return;a.playbackRate=baseRate;const hz=filterHzFromSlider(+$('filter').value);filter.frequency.value=hz;drive.curve=curve(+$('drive').value/100);delay.delayTime.value=+$('delay').value;fb.gain.value=+$('fb').value;wet.gain.value=+$('wet').value;$('padReadout').textContent='X 50 · Y 50'}\\n$('padActivate').onclick=async()=>", 1)
          s = re.sub(r"\$\('xyPad'\)\.onpointermove=e=>\{if\(!\$\('xyPad'\)\.hasPointerCapture\(e\.pointerId\)\)return;const r=\$\('xyPad'\)\.getBoundingClientRect\(\);setPad\(\(e\.clientX-r\.left\)/r\.width,1-\(e\.clientY-r\.top\)/r\.height,true\)\};(?:\$\('xyPad'\)\.onpointerup=.*?;)?(?:\$\('xyPad'\)\.onpointercancel=.*?;)?(?:\$\('xyPad'\)\.onlostpointercapture=.*?;)?setPad\(\.5,\.5,false\);", "$('xyPad').onpointermove=e=>{if(!$('xyPad').hasPointerCapture(e.pointerId))return;const r=$('xyPad').getBoundingClientRect();setPad((e.clientX-r.left)/r.width,1-(e.clientY-r.top)/r.height,true)};$('xyPad').onpointerup=e=>{try{$('xyPad').releasePointerCapture(e.pointerId)}catch(_){ }restorePadCenter()};$('xyPad').onpointercancel=()=>restorePadCenter();$('xyPad').onlostpointercapture=()=>restorePadCenter();setPad(.5,.5,false);", s, count=1, flags=re.S)
          p.write_text(s)
          PY
          python3 - <<'PY' > /tmp/enochian.js
          from pathlib import Path
          s=Path('web/enochian-test/index.html').read_text()
          print(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/enochian.js
          git rm .github/workflows/apply-enochian-music-spring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/enochian-test/index.html
          git commit -m "Fix Enochian transcription platter pad and home icon"
          git push origin HEAD:main
      - name: Deploy live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches -d '{"ref":"main"}'
