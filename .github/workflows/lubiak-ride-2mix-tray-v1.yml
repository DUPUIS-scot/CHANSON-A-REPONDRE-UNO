name: LUBIAK ride 2MIX tray v1
on:
  push:
    paths: ['.lubiak-ride-2mix-tray-v1-trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: node scripts/patch-lubiak-ride-2mix-tray-v1.mjs
      - run: node --check web/lubiak/lubiak.js
      - name: Trigger live deployment
        run: |
          cat > .github/deploy-now.txt <<'EOF'
          deploy-request: 2026-08-30
          source: chat
          scope: LUBIAK RIDE 2MIX-style flight tray
          EOF
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/lubiak/lubiak.js .github/deploy-now.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Style LUBIAK ride HUD like Terminal 2MIX'
          git push
