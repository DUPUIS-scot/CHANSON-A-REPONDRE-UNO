name: LUBIAK circus easy exit
on:
  push:
    paths: ['.github/run-lubiak-circus-exit-v1.txt']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: node scripts/patch-lubiak-circus-exit-v1.mjs
      - run: |
          node --check web/lubiak/lubiak.js
          grep -q 'LUBIAK_CIRCUS_EXIT_BUTTON_V1' web/lubiak/lubiak.js
      - name: Commit and deploy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/lubiak/lubiak.js
          if ! git diff --cached --quiet; then git commit -m 'Add easy EXIT CIRCUS control'; fi
          printf 'deploy %s\n' "$(date -u +%FT%TZ)" > .github/deploy-now.txt
          git add .github/deploy-now.txt
          git commit -m 'Deploy LUBIAK circus exit'
          git push
