name: Fix Pages preview timeout once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pages-preview-timeout-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Make preview dependency install tolerant of slow apt mirrors
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/deploy-pages.yml')
          source = path.read_text()

          old_timeout = "      - name: Generate lightweight card previews\n        timeout-minutes: 8"
          new_timeout = "      - name: Generate lightweight card previews\n        timeout-minutes: 12"
          if source.count(old_timeout) != 1:
              raise SystemExit(f'Expected preview timeout block once, found {source.count(old_timeout)}')
          source = source.replace(old_timeout, new_timeout, 1)

          old_install = """          if ! command -v convert >/dev/null 2>&1; then
            timeout 90s sudo apt-get update -qq
            timeout 120s sudo apt-get install -y --no-install-recommends imagemagick
          fi
"""
          new_install = """          if ! command -v convert >/dev/null 2>&1; then
            echo \"ImageMagick is not preinstalled; installing with mirror retries.\"
            timeout 240s sudo apt-get update -qq -o Acquire::Retries=5
            timeout 240s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 imagemagick
          fi
"""
          if source.count(old_install) != 1:
              raise SystemExit(f'Expected ImageMagick install block once, found {source.count(old_install)}')
          source = source.replace(old_install, new_install, 1)

          path.write_text(source)

      - name: Validate workflow repair
        shell: python
        run: |
          from pathlib import Path
          source = Path('.github/workflows/deploy-pages.yml').read_text()
          assert 'timeout-minutes: 12' in source
          assert 'timeout 240s sudo apt-get update -qq -o Acquire::Retries=5' in source
          assert 'timeout 240s sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 imagemagick' in source
          assert 'timeout 90s sudo apt-get update -qq' not in source

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-pages-preview-timeout-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-pages.yml .github/workflows/fix-pages-preview-timeout-once.yml
          git commit -m "Fix Pages preview generation timeout"
          git push origin HEAD:main
