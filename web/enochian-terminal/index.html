const terminalLive=document.getElementById('terminalLive');
function innerDocument(){try{return terminalLive.contentDocument?.getElementById('deck')?.contentDocument||null}catch(_){return null}}
function installReliableNavigation(){try{const d=innerDocument();if(!d)return false;const go=hash=>{try{window.top.location.href='https://www.chanson-a-repondre-uno.scot/'+hash}catch(_){window.location.href='https://www.chanson-a-repondre-uno.scot/'+hash}};const home=d.querySelector('.home-link');if(home){home.href='/#/home';home.onclick=e=>{e.preventDefault();go('#/home');return false}}const avatar=d.querySelector('.avatar');if(avatar){avatar.style.cursor='pointer';avatar.setAttribute('role','link');avatar.setAttribute('tabindex','0');avatar.setAttribute('title','DJ WHO');avatar.setAttribute('aria-label','Open DJ WHO');avatar.onclick=e=>{e.preventDefault();go('#/djwho');return false};avatar.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('#/djwho')}}}return !!(home&&avatar)}catch(_){return false}}
function installConsoleAuthority(){try{const d=innerDocument(),log=d?.getElementById('log');if(!log||log.dataset.consoleAuthority==='v1')return !!log;log.dataset.consoleAuthority='v1';const purge=()=>{[...log.children].forEach(row=>{if(!row.classList.contains('signal-flow-line')&&!/^\[\d{2}:\d{2}(?:\.\d)?\]/.test((row.textContent||'').trim()))return;if(!row.classList.contains('signal-flow-line')&&/^\[\d{2}:\d{2}(?:\.\d)?\]/.test((row.textContent||'').trim()))row.remove()})};new MutationObserver(purge).observe(log,{childList:true});purge();return true}catch(_){return false}}
function installReliableFullscreen(){try{const liveWin=terminalLive.contentWindow,liveDoc=terminalLive.contentDocument;if(!liveWin||!liveDoc)return;const deck=liveDoc.getElementById('deck');const active=()=>!!(liveDoc.fullscreenElement||liveDoc.webkitFullscreenElement||liveDoc.body.classList.contains('outer-fullscreen'));const sync=()=>{const on=active();liveDoc.body.classList.toggle('outer-fullscreen',on);try{const d=deck&&deck.contentDocument;if(!d)return;d.documentElement.classList.toggle('terminal-fullscreen',on);const normal=d.querySelector('[data-terminal-fullscreen]');if(normal){normal.classList.toggle('active',on);normal.textContent=on?'EXIT FULL SCREEN':'FULL SCREEN';normal.setAttribute('aria-pressed',String(on))}const ios=d.getElementById('iosFullscreen');if(ios){ios.classList.toggle('active',on);ios.textContent=on?'✕':'⛶';ios.title=on?'Exit full screen':'Full screen';ios.setAttribute('aria-label',on?'Exit full screen':'Full screen');ios.setAttribute('aria-pressed',String(on))}setTimeout(()=>deck.contentWindow.dispatchEvent(new Event('resize')),50)}catch(_){}};liveWin.__enochToggleFullscreen=async()=>{try{if(active()){if(liveDoc.fullscreenElement&&liveDoc.exitFullscreen)await liveDoc.exitFullscreen();else if(liveDoc.webkitFullscreenElement&&liveDoc.webkitExitFullscreen)liveDoc.webkitExitFullscreen();else liveDoc.body.classList.remove('outer-fullscreen')}else{const el=liveDoc.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();else liveDoc.body.classList.add('outer-fullscreen')}}catch(_){liveDoc.body.classList.toggle('outer-fullscreen')}sync()};liveDoc.addEventListener('fullscreenchange',sync);liveDoc.addEventListener('webkitfullscreenchange',sync);sync()}catch(_){}}
function syncResponsiveLayout(){window.syncEnochianTargetViewport?.(terminalLive);window.syncEnochianIphoneLandscape?.(terminalLive)}
window.addEventListener('resize',syncResponsiveLayout);window.addEventListener('orientationchange',()=>setTimeout(syncResponsiveLayout,80));
terminalLive.addEventListener('load',()=>{window.installEnochianTargetViewport?.(terminalLive);window.installEnochianIphoneLandscapeV2?.(terminalLive);window.installEnochianStemSeparatorControl?.(terminalLive);window.installEnochianTransportStemSync?.(terminalLive);window.installEnochianAnalyserDataBus?.(terminalLive);window.installEnochianAnalyserSignalGlide?.(terminalLive);window.installEnochianAnalyserSignal3D?.(terminalLive);window.installEnochianSculptAudioMod?.(terminalLive);window.installEnochianAnalyserExpandOverlay?.(terminalLive);window.installEnochianCompositeAnalyser?.(terminalLive);window.installEnochianConsoleBottom?.(terminalLive);window.installEnochianSocialLast15Share?.(terminalLive);let tries=0,t=setInterval(()=>{const nav=installReliableNavigation(),consoleReady=installConsoleAuthority();installReliableFullscreen();syncResponsiveLayout();try{if(innerDocument()?.getElementById('iosFullscreen')&&nav&&consoleReady)clearInterval(t)}catch(_){}if(++tries>240)clearInterval(t)},50)});
</script></body></html>
