 (function(){

  function tokenFor(v,i,vals,depth){

  }
  function clearLiveText(){stream='';lastTextAt=0;const text=q('modText')||d.querySelector('.mod textarea');if(text)text.value='';const glyphBox=q('modGlyphs')||d.querySelector('.mod-glyphs');if(glyphBox)glyphBox.textContent=''}
