/script><script src="/enochian-test/sculpt-audio-mod.js?v=20260824-v2"></script><script src="/enochian-test/authoritative-runtime.js?v=20260824-v4"></script><script src="/enochian-test/outer-analyser-panel.js?v=20260824-v2"></script><script src="/enochian-test/console-bottom.js?v=20260824-v3"></script><script src="/enochian-test/social-last15-share.js?v=20260824-v3"></script><script src="/enochian-test/ios-touch-tuning.js?v=20260824-v1"></script><script>
const terminalLive=document.getElementById('terminalLive');
function innerDocument(){try{return terminalLive.contentDocument?.getElementById('deck')?.contentDocument||null}catch(_){return null}}
function installReliableNavigation(){try{const d=innerDocument();if(!d)return false;const go=hash=>{try{window.top.location.href='https://www.chanson-a-repondre-uno.scot/'+hash}catch(_){window.location.href='https://www.chanson-a-repondre-uno.scot/'+hash}};const home=d.querySelector('.home-link');if(home){home.href='/#/home';home.onclick=e=>{e.preventDefault();go('#/home');return false}}const avatar=d.querySelector('.avatar');if(avatar){avatar.style.cursor='pointer';avatar.setAttribute('role','link');avatar.setAttribute('tabindex','0');avatar.setAttribute('title','DJ WHO');avatar.setAttribute('aria-label','Open DJ WHO');avatar.onclick=e=>{e.preventDefault();go('#/djwho');return false};avatar.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('#/djwho')}}}return !!(home&&avatar)}catch(_){return false}}
function installConsoleAuthority(){try{const d=innerDocument(),log=d?.getElementById('log');if(!log||log.dataset.consoleAuthority==='v2')return !!log;log.dataset.consoleAuthority='v2';const purge=()=>{[...log.children].forEach(row=>{if(row.classList.contains('signal-flow-line'))return;if(/^\[\d{2}:\d{2}(?:\.\d)?\]/.test((row.textContent||'').trim()))row.remove()})};new MutationObserver(purge).observe(log,{childList:true});purge();return true}catch(_){return false}}
function outerFullscreenActive(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
function syncOuterFullscreen(){const on=outerFullscreenActive();try{const liveDoc=terminalLive.contentDocument,deck=liveDoc?.getElementById('deck'),d=deck?.contentDocument;if(!d)return;d.documentElement.classList.toggle('terminal-fullscreen',on);const normal=d.querySelector('[data-terminal-fullscreen]');if(normal){normal.classList.toggle('active',on);normal.textContent=on?'EXIT FULL SCREEN':'FULL SCREEN';normal.setAttribute('aria-pressed',String(on))}const ios=d.getElementById('iosFullscreen');if(ios){ios.classList.toggle('active',on);ios.textContent=on?'✕':'⛶';ios.title=on?'Exit full screen':'Full screen';ios.setAttribute('aria-label',on?'Exit full screen':'Full screen');ios.setAttribute('aria-pressed',String(on))}setTimeout(()=>deck.contentWindow.dispatchEvent(new Event('resize')),50)}catch(_){}}
function installReliableFullscreen(){try{const liveWin=terminalLive.contentWindow;if(!liveWin)return;liveWin.__enochToggleFullscreen=async()=>{try{if(outerFullscreenActive()){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}else{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}}catch(_){}syncOuterFullscreen()};liveWin.outerFullscreenActive=outerFullscreenActive;syncOuterFullscreen()}catch(_){}}
document.addEventListener('fullscreenchange',syncOuterFullscreen);document.addEventListener('webkitfullscreenchange',syncOuterFullscreen);
function syncResponsiveLayout(){window.syncEnochianTargetViewport?.(terminalLive);window.syncEnochianIphoneLandscape?.(terminalLive)}
window.addEventListener('resize',syncResponsiveLayout);window.addEventListener('orientationchange',()=>setTimeout(syncResponsiveLayout,80));
terminalLive.addEventListener('load',()=>{window.installEnochianTargetViewport?.(terminalLive);window.installEnochianIphoneLandscapeV2?.(terminalLive);window.installEnochianAnalyserDataBus?.(terminalLive);window.installEnochianAnalyserSignalGlide?.(terminalLive);window.installEnochianAnalyserSignal3D?.(terminalLive);window.installEnochianSculptAudioMod?.(terminalLive);window.installEnochianCompositeAnalyser?.(terminalLive);window.installEnochianAuthoritativeRuntime?.(terminalLive);window.installEnochianOuterAnalyserPanel?.(terminalLive);window.installEnochianConsoleBottom?.(terminalLive);window.installEnochianSocialLast15Share?.(terminalLive);window.installEnochianIOSTouchTuning?.(terminalLive);let tries=0,t=setInterval(()=>{const nav=installReliableNavigation(),consoleReady=installConsoleAuthority();installReliableFullscreen();syncResponsiveLayout();try{if(innerDocument()?.getElementById('iosFullscreen')&&nav&&consoleReady&&document.documentElement.dataset.outerAnalyserPanel==='v2')clearInterval(t)}catch(_){}if(++tries>240)clearInterval(t)},50)});
</script></body></html>
