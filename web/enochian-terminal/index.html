const terminalLive=document.getElementById('terminalLive');
function installReliableFullscreen(){
  try{
    const liveWin=terminalLive.contentWindow;
    const liveDoc=terminalLive.contentDocument;
    if(!liveWin||!liveDoc)return;
    const deck=liveDoc.getElementById('deck');
    const active=()=>!!(liveDoc.fullscreenElement||liveDoc.webkitFullscreenElement||liveDoc.body.classList.contains('outer-fullscreen'));
    const sync=()=>{
      const on=active();
      liveDoc.body.classList.toggle('outer-fullscreen',on);
      try{
        const d=deck&&deck.contentDocument;
        if(!d)return;
        d.documentElement.classList.toggle('terminal-fullscreen',on);
        const normal=d.querySelector('[data-terminal-fullscreen]');
        if(normal){normal.classList.toggle('active',on);normal.textContent=on?'EXIT FULL SCREEN':'FULL SCREEN';normal.setAttribute('aria-pressed',String(on));}
        const ios=d.getElementById('iosFullscreen');
        if(ios){ios.classList.toggle('active',on);ios.textContent=on?'✕':'⛶';ios.title=on?'Exit full screen':'Full screen';ios.setAttribute('aria-label',on?'Exit full screen':'Full screen');ios.setAttribute('aria-pressed',String(on));}
        setTimeout(()=>deck.contentWindow.dispatchEvent(new Event('resize')),50);
      }catch(_){ }
    };
    liveWin.__enochToggleFullscreen=async()=>{
      try{
        if(active()){
          if(liveDoc.fullscreenElement&&liveDoc.exitFullscreen)await liveDoc.exitFullscreen();
          else if(liveDoc.webkitFullscreenElement&&liveDoc.webkitExitFullscreen)liveDoc.webkitExitFullscreen();
          else liveDoc.body.classList.remove('outer-fullscreen');
        }else{
          const el=liveDoc.documentElement;
          if(el.requestFullscreen)await el.requestFullscreen();
          else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
          else liveDoc.body.classList.add('outer-fullscreen');
        }
      }catch(_){
        liveDoc.body.classList.toggle('outer-fullscreen');
      }
      sync();
    };
    liveDoc.addEventListener('fullscreenchange',sync);
    liveDoc.addEventListener('webkitfullscreenchange',sync);
    sync();
  }catch(_){ }
}
terminalLive.addEventListener('load',()=>{
  window.installEnochianTargetViewport?.(terminalLive);
  window.installEnochianIphoneLandscapeV2?.(terminalLive);
  window.installEnochianStemSeparatorControl?.(terminalLive);
  let tries=0;const t=setInterval(()=>{installReliableFullscreen();try{if(terminalLive.contentDocument?.getElementById('deck')?.contentDocument?.getElementById('iosFullscreen'))clearInterval(t)}catch(_){ }if(++tries>120)clearInterval(t)},50);
});
</script></body></html>
