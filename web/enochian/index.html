<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Enochian Terminal · DJ WHO Laboratory</title>
<meta name="description" content="Interactive full-screen DJ WHO Enochian turntable and offline substitution terminal.">
<style>
:root{color-scheme:dark;--bg:#020505;--panel:#050a0a;--line:#203b3a;--cyan:#62e6dc;--green:#46f5be;--gold:#d4a45d;--text:#c8f9f2;--dim:#72a9a4;--danger:#ff7a66}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010303;color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(100,255,240,.02) 0 1px,transparent 1px 4px);mix-blend-mode:screen}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 25%,#061313 0,#020606 42%,#010202 100%)}
header{display:grid;grid-template-columns:170px 1fr 170px;align-items:center;gap:10px;border:1px solid var(--line);background:#030707;padding:8px 10px}.brand{font-size:clamp(22px,2vw,34px);font-weight:800;letter-spacing:.04em;color:#a8ece4}.heading{text-align:center;letter-spacing:.25em;font-size:clamp(12px,1.3vw,18px);color:#91d7d1}.sync-wrap{text-align:right}.btn{appearance:none;border:1px solid #315f5a;background:#06100f;color:#9de8df;border-radius:5px;padding:8px 11px;font:inherit;cursor:pointer;min-height:36px}.btn:hover,.btn:focus-visible{outline:none;border-color:var(--cyan);color:white}.btn.active{color:#07110f;background:var(--green);border-color:var(--green);font-weight:800}.btn.gold{border-color:#745c31;color:#d9bd85}.btn.small{padding:6px 9px;min-height:32px}.main{min-height:0;display:grid;grid-template-columns:190px minmax(0,1fr) 170px;grid-template-rows:150px minmax(0,1fr) 150px;gap:8px}
.panel{border:1px solid var(--line);background:linear-gradient(180deg,#050b0b,#020505);min-width:0;min-height:0;overflow:hidden}.left{grid-row:1/3;padding:10px;display:flex;flex-direction:column;gap:8px}.now{border:1px solid #18302f;padding:10px}.eyebrow{font-size:10px;letter-spacing:.12em;color:var(--dim)}.track{margin-top:6px;font-size:15px;color:#d7fff9}.artist{font-size:11px;color:var(--dim);margin-top:3px}.timeline{font-size:11px;color:var(--dim);margin-top:10px}.bar{height:4px;background:#0b1716;margin-top:5px}.bar i{display:block;height:100%;background:var(--green);width:0}.transport{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.volume{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}.volume input,.pitch input{width:100%;accent-color:var(--gold)}.widget-min{margin-top:auto}.pitch{grid-row:2/3;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}.pitch input{writing-mode:vertical-lr;direction:rtl;height:170px;width:28px}.pitch .value{font-size:13px;color:#b5eee8}.speed-buttons{display:grid;gap:4px;width:100%}.speed-buttons .btn{width:100%}
.wavepanel{grid-column:2/3;grid-row:1/2;padding:8px 10px;display:grid;grid-template-rows:auto 1fr;gap:5px}.wave-title{text-align:center;letter-spacing:.26em;font-size:12px;color:#86d6cf}.code-grid{position:relative;overflow:hidden;font-family:Georgia,serif;color:#7ad8d0;display:grid;grid-template-columns:repeat(16,1fr);grid-auto-rows:1fr;gap:1px;align-items:center;text-align:center;font-size:clamp(13px,1.3vw,22px);text-shadow:0 0 8px #48d5cc55}.wave-svg{position:absolute;inset:42% 0 auto;height:28%;width:100%;pointer-events:none}.right{grid-column:3/4;grid-row:1/3;padding:10px;display:flex;flex-direction:column;gap:8px}.metric{border-bottom:1px solid #18302f;padding-bottom:7px}.metric b{display:block;color:#abeee7;font-size:13px;margin-top:3px}.signal{display:flex;gap:2px;height:26px;align-items:end}.signal i{display:block;width:4px;background:var(--green);height:30%}
.deckzone{grid-column:2/3;grid-row:2/3;display:grid;place-items:center;position:relative;background:radial-gradient(circle at 50% 50%,#07100f 0,#020505 65%,#010303 100%)}.platter-wrap{width:min(56vh,70%);aspect-ratio:1;position:relative}.platter{position:absolute;inset:0;border-radius:50%;cursor:grab;touch-action:none;background:radial-gradient(circle,#07100f 0 7%,#0d1817 7.5% 14%,#050808 14.5% 64%,#121b1a 64.5% 70%,#020404 70.5% 100%);border:3px solid #2a4946;box-shadow:0 0 0 8px #080d0c,0 0 0 10px #1d302e,0 0 30px #45dfd51a,inset 0 0 28px #000}.platter:active{cursor:grabbing}.ring{position:absolute;inset:7%;border-radius:50%;border:1px solid #265e59;display:grid;place-items:center;will-change:transform}.ring2{inset:16%;border-color:#7d6034}.ring3{inset:27%;border-color:#244b47}.letters{position:absolute;inset:0;border-radius:50%;pointer-events:none}.glyph-mark{position:absolute;left:50%;top:50%;transform-origin:0 0;color:var(--gold);font-family:Georgia,serif;font-size:clamp(11px,1.2vw,18px)}.glyph-mark.cyan{color:#79ddd5}.center{position:absolute;inset:35%;border-radius:50%;display:grid;place-items:center;border:1px solid var(--cyan);box-shadow:0 0 20px #49e5d83b inset;background:radial-gradient(circle,#0d2020,#030707 72%);color:#8af5ec;font-size:clamp(20px,3vw,44px);pointer-events:none}.tonearm{position:absolute;right:6%;top:12%;width:12%;height:50%;border-right:6px solid #939a94;border-bottom:6px solid #939a94;border-radius:0 0 50% 0;transform:rotate(-15deg);transform-origin:top right;box-shadow:2px 2px 0 #4b3a20}.scratch{position:absolute;right:4%;bottom:8%;border:1px solid #254a46;padding:7px 10px;font-size:11px;color:#83d8d1}.skip{position:absolute;bottom:3%;display:flex;gap:8px}.skip.leftskip{left:6%}.skip.rightskip{right:6%}.track-name{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#9cded8;white-space:nowrap}
.translate{grid-column:1/4;grid-row:3/4;display:grid;grid-template-columns:1fr 120px 1fr;gap:8px;padding:8px}.translate .box{display:grid;grid-template-rows:auto 1fr auto;gap:5px}.translate label{font-size:10px;letter-spacing:.1em;color:#75c8c1}.translate textarea,.out{width:100%;min-height:0;border:1px solid #214441;background:#010303;color:#a7eee7;padding:8px;font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:none}.out{font-family:Georgia,serif;color:#77ddd4;font-size:18px;letter-spacing:.1em;overflow:auto}.actions{display:flex;gap:6px;justify-content:center}.seal{display:grid;place-items:center;color:#6b5a39;font-size:38px;opacity:.8}.footer{border-top:1px solid #182c2b;padding-top:4px;text-align:center;color:#537b78;letter-spacing:.25em;font-size:9px}.yt-host{position:fixed;width:1px;height:1px;left:-20px;top:-20px;opacity:.001;pointer-events:none}
@media(max-width:900px){html,body{overflow:auto;height:auto}.app{min-height:100vh;height:auto}.main{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}.left{grid-column:1;grid-row:auto}.wavepanel{grid-column:1;grid-row:auto;min-height:170px}.right{grid-column:1;grid-row:auto;display:grid;grid-template-columns:repeat(3,1fr)}.deckzone{grid-column:1;grid-row:auto;min-height:520px}.pitch{display:none}.translate{grid-column:1;grid-row:auto;grid-template-columns:1fr}.seal{display:none}header{grid-template-columns:1fr auto}.heading{display:none}.platter-wrap{width:min(78vw,430px)}.main{min-height:auto}.translate{min-height:310px}}
</style>
</head>
<body>
<div class="app" id="app">
<header><div class="brand">DJ WHO</div><div class="heading">ENOCHIAN TERMINAL · DJ WHO LABORATORY</div><div class="sync-wrap"><button class="btn active" id="syncBtn">● SYNC ON</button></div></header>
<div class="main">
<section class="panel left"><div class="now"><div class="eyebrow">NOW PLAYING</div><div class="track" id="trackName">AI Comptroller</div><div class="artist">DJ WHO</div><div class="timeline"><span id="cur">00:00</span> / <span id="dur">00:00</span></div><div class="bar"><i id="progress"></i></div></div><div class="transport"><button class="btn small" id="prev">◀◀</button><button class="btn small active" id="play">Ⅱ</button><button class="btn small" id="next">▶▶</button></div><div class="volume"><span>🔊</span><input id="vol" type="range" min="0" max="100" value="80"></div><select id="trackSelect" class="btn"><option value="C0zocqpnIpY">AI Comptroller</option><option value="6v3YRGccqZE">Caesar-Spitter</option><option value="XT60H_iOIvQ">The Kraken</option><option value="lw4S2kb1_Ew">HELIOGABAL//DESIGN</option><option value="IV2IY5Faldc">Vivid Void</option></select><button class="btn widget-min" id="minBtn">⌄ MINIMIZE WIDGET</button></section>
<section class="panel pitch"><div class="eyebrow">PITCH</div><div class="value" id="pitchValue">0.00%</div><input id="pitch" type="range" min="50" max="200" value="100" step="10"><button class="btn small" id="pitchReset">RESET</button><div class="eyebrow">SPEED</div><div class="speed-buttons"><button class="btn small" data-speed="0.5">1/2</button><button class="btn small active" data-speed="1">1×</button><button class="btn small" data-speed="2">2×</button></div></section>
<section class="panel wavepanel"><div class="wave-title">ENOCHIAN CODING WAVE</div><div class="code-grid" id="codeGrid"><svg class="wave-svg" viewBox="0 0 1000 140" preserveAspectRatio="none"><path id="wavePath" d="M0 70 L1000 70" fill="none" stroke="#46f5be" stroke-width="3"/></svg></div></section>
<section class="panel right"><div class="metric"><span class="eyebrow">TIME</span><b id="timeMetric">00:00.000</b></div><div class="metric"><span class="eyebrow">BPM</span><b id="bpm">128.00</b></div><div class="metric"><span class="eyebrow">KEY</span><b id="key">A MINOR</b></div><div class="metric"><span class="eyebrow">MODE</span><b>VISUAL SYNC</b></div><div class="metric"><span class="eyebrow">SIGNAL</span><div class="signal" id="signal"></div></div><button class="btn gold small" id="syncOff">SYNC OFF</button></section>
<section class="panel deckzone"><div class="platter-wrap"><div class="platter" id="platter" tabindex="0" aria-label="Interactive Enochian turntable"><div class="ring" id="ring1"></div><div class="ring ring2" id="ring2"></div><div class="ring ring3" id="ring3"></div><div class="letters" id="letters"></div><div class="center">✶</div></div><div class="tonearm"></div></div><div class="scratch" id="scratchState">SCRATCH ● ON</div><div class="skip leftskip"><button class="btn small" id="back10">≪ −10s</button></div><div class="skip rightskip"><button class="btn small" id="fwd10">+10s ≫</button></div><div class="track-name" id="deckName">AI COMPTROLLER</div></section>
<section class="panel translate"><div class="box"><label>ENGLISH → ENOCHIAN</label><textarea id="english" placeholder="HELLO WORLD"></textarea><div class="out" id="glyphOut"></div><div class="actions"><button class="btn small" id="clearEnglish">CLEAR</button><button class="btn small" data-copy="glyphOut">▣ COPY</button></div></div><div class="seal">✥</div><div class="box"><label>ENOCHIAN → ENGLISH</label><textarea id="cipher" class="out"></textarea><div class="out" id="englishOut"></div><div class="actions"><button class="btn small" id="clearCipher">CLEAR</button><button class="btn small active" data-copy="englishOut">▣ COPY</button></div></div></section>
</div>
<div class="footer">THE LANGUAGE IS NOT DEAD. · IT WAITS FOR INTERPRETERS.</div>
</div>
<div id="ytPlayer" class="yt-host"></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const glyphs=['⟆','⟑','⟒','⟓','⟔','⟕','⟖','⟗','⟘','⟙','⟚','⟛','⟜','⟝','⟞','⟟','⟠','⟡','⟢','⟣','⟤','⟥','⟦','⟧','⟨','⟩'];
const enc=Object.fromEntries([...letters].map((c,i)=>[c,glyphs[i]]));const dec=Object.fromEntries(glyphs.map((g,i)=>[g,letters[i]]));const $=id=>document.getElementById(id);
const tracks=[['AI Comptroller','C0zocqpnIpY'],['Caesar-Spitter','6v3YRGccqZE'],['The Kraken','XT60H_iOIvQ'],['HELIOGABAL//DESIGN','lw4S2kb1_Ew'],['Vivid Void','IV2IY5Faldc']];let index=0,player=null,sync=true,drag=false,lastAngle=0,rotation=0,raf=0;
function encodeText(t){return [...t.toUpperCase()].map(c=>enc[c]??c).join('')}function decodeText(t){return [...t].map(c=>dec[c]??c).join('')}
function translate(){const g=encodeText($('english').value);$('glyphOut').textContent=g;$('cipher').value=g;$('englishOut').textContent=decodeText(g)}$('english').addEventListener('input',translate);$('cipher').addEventListener('input',()=>{$('englishOut').textContent=decodeText($('cipher').value)});$('clearEnglish').onclick=()=>{$('english').value='';$('glyphOut').textContent=''};$('clearCipher').onclick=()=>{$('cipher').value='';$('englishOut').textContent=''};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText($(b.dataset.copy).textContent)}catch{}});
function buildGlyphs(){const host=$('letters');for(let i=0;i<26;i++){const a=(360/26)*i-90;const e=document.createElement('span');e.className='glyph-mark';e.textContent=letters[i];e.style.transform=`rotate(${a}deg) translateX(42%) rotate(${-a}deg)`;host.appendChild(e)}for(let i=0;i<26;i++){const a=(360/26)*i-90;const e=document.createElement('span');e.className='glyph-mark cyan';e.textContent=glyphs[i];e.style.transform=`rotate(${a}deg) translateX(29%) rotate(${-a}deg)`;host.appendChild(e)}const cg=$('codeGrid');for(let i=0;i<96;i++){const s=document.createElement('span');s.textContent=glyphs[(i*7+i%5)%26];cg.appendChild(s)}const sig=$('signal');for(let i=0;i<18;i++){const x=document.createElement('i');x.style.height=(25+(i*17)%75)+'%';sig.appendChild(x)}}buildGlyphs();
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('ytPlayer',{height:'1',width:'1',videoId:tracks[index][1],playerVars:{playsinline:1,controls:0,rel:0},events:{onReady:()=>{player.setVolume(80);player.playVideo()},onStateChange:e=>{$('play').textContent=e.data===YT.PlayerState.PLAYING?'Ⅱ':'▶'}}})};
function loadTrack(i){index=(i+tracks.length)%tracks.length;const [name,id]=tracks[index];$('trackName').textContent=name;$('deckName').textContent=name.toUpperCase();$('trackSelect').value=id;if(player)player.loadVideoById(id)}$('trackSelect').onchange=()=>loadTrack(tracks.findIndex(t=>t[1]===$('trackSelect').value));$('prev').onclick=()=>loadTrack(index-1);$('next').onclick=()=>loadTrack(index+1);$('play').onclick=()=>{if(!player)return;player.getPlayerState()===YT.PlayerState.PLAYING?player.pauseVideo():player.playVideo()};$('vol').oninput=()=>player&&player.setVolume(+$('vol').value);$('back10').onclick=()=>player&&player.seekTo(Math.max(0,player.getCurrentTime()-10),true);$('fwd10').onclick=()=>player&&player.seekTo(Math.min(player.getDuration(),player.getCurrentTime()+10),true);
function setSpeed(v){if(player&&player.setPlaybackRate)player.setPlaybackRate(v);$('pitch').value=Math.round(v*100);$('pitchValue').textContent=((v-1)*100).toFixed(2)+'%';document.querySelectorAll('[data-speed]').forEach(b=>b.classList.toggle('active',+b.dataset.speed===v))}$('pitch').oninput=()=>setSpeed(+$('pitch').value/100);$('pitchReset').onclick=()=>setSpeed(1);document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.speed));
function setSync(on){sync=on;$('syncBtn').classList.toggle('active',on);$('syncBtn').textContent=on?'● SYNC ON':'○ SYNC ON';$('scratchState').textContent=on?'SCRATCH ● ON':'SCRATCH ○ OFF'}$('syncBtn').onclick=()=>setSync(!sync);$('syncOff').onclick=()=>setSync(false);
function angle(e){const r=$('platter').getBoundingClientRect();const p=e.touches?e.touches[0]:e;return Math.atan2(p.clientY-(r.top+r.height/2),p.clientX-(r.left+r.width/2))*180/Math.PI}function start(e){if(!sync)return;drag=true;lastAngle=angle(e);$('platter').setPointerCapture?.(e.pointerId)}function move(e){if(!drag||!player)return;const a=angle(e),d=a-lastAngle;lastAngle=a;rotation+=d;const seek=Math.max(0,Math.min(player.getDuration()||0,(player.getCurrentTime()||0)+d/5));player.seekTo(seek,true);$('scratchState').textContent='SCRATCH '+(d>=0?'+':'')+d.toFixed(1)+'°'}function end(){drag=false;$('scratchState').textContent='SCRATCH ● ON'}$('platter').addEventListener('pointerdown',start);$('platter').addEventListener('pointermove',move);$('platter').addEventListener('pointerup',end);$('platter').addEventListener('pointercancel',end);
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function frame(t){const cur=player?player.getCurrentTime()||0:0,dur=player?player.getDuration()||0:0,state=player?player.getPlayerState():0,playing=state===1;rotation+=playing&&!drag?0.38:0;$('ring1').style.transform=`rotate(${rotation}deg)`;$('ring2').style.transform=`rotate(${-rotation*.55}deg)`;$('ring3').style.transform=`rotate(${rotation*.28}deg)`;$('cur').textContent=fmt(cur);$('dur').textContent=fmt(dur);$('progress').style.width=(dur?cur/dur*100:0)+'%';$('timeMetric').textContent=fmt(cur)+'.'+String(Math.floor((cur%1)*1000)).padStart(3,'0');$('bpm').textContent=(124+Math.sin(cur*.08)*4).toFixed(2);$('key').textContent=['A MINOR','D DORIAN','E MINOR','C MINOR'][index%4];const pts=[];for(let x=0;x<=1000;x+=12){const y=70+Math.sin((x*.022)+(cur*2.2))*18+Math.sin((x*.067)-(cur*1.1))*9;pts.push((x?'L':'M')+x+' '+y.toFixed(1))}$('wavePath').setAttribute('d',pts.join(' '));const sig=$('signal').children;for(let i=0;i<sig.length;i++)sig[i].style.height=(18+Math.abs(Math.sin(cur*2+i*.7))*82)+'%';const cells=$('codeGrid').querySelectorAll('span');cells.forEach((c,i)=>{if(((Math.floor(cur*7)+i*3)%29)===0)c.textContent=glyphs[(i+Math.floor(cur))%26]});raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame);
$('minBtn').onclick=()=>document.querySelector('.left').classList.toggle('collapsed');
</script>
</body>
</html>
