<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#03070c}
    #scene canvas{display:block;touch-action:none}
    #navigation{position:absolute;z-index:2;padding:8px 11px;border:1px solid #8d6e12;border-radius:8px;background:#05090ddd;color:#ffc928;font:700 11px/1.45 system-ui;pointer-events:none;box-shadow:0 8px 24px #000a}
    #navigation{left:12px;top:12px;width:132px}
    #navigation span{display:block;color:#cbd6df;font-weight:500}
    #castle-controls{position:absolute;z-index:4;right:12px;top:12px;display:flex;gap:7px;align-items:flex-start;font:700 11px system-ui}
    #castle-controls button,#castle-controls select{border:1px solid #b77d0c;border-radius:7px;background:#071019ee;color:#ffc928;padding:8px 10px;font:inherit;cursor:pointer}
    #fullscreen-controls{display:none;gap:7px;align-items:center}
    body.fullscreen-castle #fullscreen-controls{display:flex}
    body.fullscreen-castle #enter-fullscreen{display:none}
    #focused-summary{display:flex;align-items:center;gap:7px;max-width:210px;padding:5px 8px;border:1px solid #b77d0c;border-radius:8px;background:#05090dee;color:#fff}
    #focused-summary img{width:34px;height:48px;object-fit:contain;border-radius:3px}
    #focused-summary span{max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="navigation">NAVIGATION
    <span>Glisser · orbite</span>
    <span>Maj/clic droit · pan</span>
    <span>Molette · zoom</span>
    <span>WASD / flèches · visite</span>
  </div>
  <div id="castle-controls">
    <button id="castle-dj-who" type="button">DJ WHO</button>
    <button id="enter-fullscreen" type="button">⛶ PLEIN ÉCRAN 3D</button>
    <div id="fullscreen-controls">
      <button id="exit-fullscreen" type="button">✕ QUITTER</button>
      <button id="castle-home" type="button">⌂ ACCUEIL</button>
      <select id="castle-category" aria-label="Catégorie"></select>
      <button id="previous-card" type="button">←</button>
      <div id="focused-summary">
        <img id="focused-thumbnail" alt="">
        <span id="focused-title">Aucune carte</span>
      </div>
      <button id="open-focused-card" type="button">AGRANDIR</button>
      <button id="next-card" type="button">→</button>
    </div>
  </div>
  <script src="../vendor/three.min.js"></script>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('scene');
    const state = {
      cards: [], meshes: [], textures: new Map(), focusedCardId: null,
      shuffleSeed: 0, disposed: false, pointerDown: null, dragging: false,
      targetLook: null, targetCamera: null, loadQueue: [], activeLoads: 0,
      touches: new Map(), pinch: null, activeCategory: 'TOUTES',
      fullscreenActive: false, fallbackElements: null, lastFrame: 0
    };
    let scene, camera, renderer, raycaster, pointer, cardGroup, materials;
    const keys=new Set();
    const orbit = {yaw:0,pitch:.31,distance:48,target:new THREE.Vector3(0,12,0)};

    function emit(type,payload={}) {
      parent.postMessage(JSON.stringify({type,...payload}), location.origin);
    }

    function init() {
      if (!window.THREE || !hasWebGL()) {
        emit('rendererError',{reason:'webgl-unavailable'});
        return;
      }
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070a);
      scene.fog = new THREE.Fog(0x05070a,38,105);
      camera = new THREE.PerspectiveCamera(48,1,.1,240);
      renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1,1.6));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure=1.24;
      renderer.shadowMap.enabled=true;
      renderer.shadowMap.type=THREE.PCFSoftShadowMap;
      root.appendChild(renderer.domElement);
      raycaster = new THREE.Raycaster();
      pointer = new THREE.Vector2();
      cardGroup = new THREE.Group();
      scene.add(cardGroup);
      buildMaterials();
      buildAtmosphere();
      buildLights();
      buildCastle();
      document.body.dataset.rendererInstanceId=
        `castle-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      document.body.dataset.sceneObjectCount=String(scene.children.length);
      installEvents();
      resize();
      updateOrbit();
      animate();
      document.body.dataset.rendererStatus='ready';
      emit('rendererReady');
    }

    function hasWebGL() {
      try {
        const canvas=document.createElement('canvas');
        return !!(window.WebGLRenderingContext &&
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch (_) { return false; }
    }

    function proceduralTexture(kind) {
      const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
      const ctx=canvas.getContext('2d');
      const palettes={
        stone:['#686861','#454842','#77776d'],
        rock:['#292d2e','#15191b','#3a3c39'],
        grass:['#303c25','#1d2819','#485033'],
        slate:['#252f39','#111820','#3b4651']
      };
      const colors=palettes[kind];ctx.fillStyle=colors[0];ctx.fillRect(0,0,256,256);
      let seed=kind.length*9187;
      const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
      if(kind==='stone'){
        ctx.strokeStyle='#202521aa';ctx.lineWidth=4;
        for(let y=0;y<256;y+=34){
          const shift=(Math.floor(y/34)%2)*24;
          ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(256,y);ctx.stroke();
          for(let x=-shift;x<256;x+=48){
            ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+34);ctx.stroke();
          }
        }
      }
      for(let i=0;i<220;i++){
        ctx.fillStyle=colors[1+Math.floor(random()*2)]+'55';
        const radius=1+random()*5;
        ctx.beginPath();ctx.arc(random()*256,random()*256,radius,0,Math.PI*2);ctx.fill();
      }
      const texture=new THREE.CanvasTexture(canvas);
      texture.wrapS=texture.wrapT=THREE.RepeatWrapping;
      texture.repeat.set(kind==='stone'?3:2,kind==='stone'?3:2);
      texture.colorSpace=THREE.SRGBColorSpace;
      texture.anisotropy=2;
      return texture;
    }

    function buildMaterials() {
      materials={
        stone:new THREE.MeshStandardMaterial({map:proceduralTexture('stone'),color:0xa7a69a,roughness:.93,metalness:.02}),
        stoneDark:new THREE.MeshStandardMaterial({map:proceduralTexture('stone'),color:0x575b58,roughness:.98}),
        rock:new THREE.MeshStandardMaterial({map:proceduralTexture('rock'),color:0x535754,roughness:1}),
        grass:new THREE.MeshStandardMaterial({map:proceduralTexture('grass'),color:0x66724a,roughness:1}),
        slate:new THREE.MeshStandardMaterial({map:proceduralTexture('slate'),color:0x4a5967,roughness:.82,metalness:.08}),
        path:new THREE.MeshStandardMaterial({color:0x71634c,roughness:1}),
        wood:new THREE.MeshStandardMaterial({color:0x3d2117,roughness:.88}),
        gold:new THREE.MeshStandardMaterial({color:0xd99a21,emissive:0x3a1a00,roughness:.4,metalness:.36}),
        window:new THREE.MeshStandardMaterial({color:0xffb13b,emissive:0xff6a00,emissiveIntensity:2.6,roughness:.45}),
        door:new THREE.MeshStandardMaterial({color:0x160c08,roughness:1}),
      };
    }

    function architecturalMesh(geometry,material,position,rotation) {
      const result=new THREE.Mesh(geometry,material);
      result.position.set(...position);
      if(rotation)result.rotation.set(...rotation);
      result.castShadow=true;result.receiveShadow=true;
      scene.add(result);return result;
    }

    function box(x,y,z,sx,sy,sz,material=materials.stone,rotationY=0) {
      return architecturalMesh(
        new THREE.BoxGeometry(sx,sy,sz),material,[x,y,z],[0,rotationY,0]
      );
    }

    function battlements(x,y,z,length,axis='x',material=materials.stone) {
      const count=Math.max(2,Math.floor(length/2.25));
      const geometry=new THREE.BoxGeometry(1.25,1.25,1.15);
      const instances=new THREE.InstancedMesh(geometry,material,count);
      const matrix=new THREE.Matrix4();
      for(let i=0;i<count;i++){
        const offset=-length/2+(i+.5)*(length/count);
        matrix.makeTranslation(
          x+(axis==='x'?offset:0),y,z+(axis==='z'?offset:0)
        );
        instances.setMatrixAt(i,matrix);
      }
      instances.castShadow=true;instances.receiveShadow=true;scene.add(instances);
    }

    function wall(x,y,z,sx,sy,sz,axis='x',material=materials.stone) {
      box(x,y,z,sx,sy,sz,material);
      battlements(x,y+sy/2+.65,z,axis==='x'?sx:sz,axis,material);
    }

    function warmWindow(x,y,z,sx=.55,sy=1.05,rotationY=0) {
      box(x,y,z,sx,sy,.08,materials.window,rotationY);
    }

    function tower(x,z,height=13,radius=3.1,roof=true) {
      architecturalMesh(
        new THREE.CylinderGeometry(radius*.9,radius,height,14),
        materials.stone,[x,5+height/2,z]
      );
      battlements(x,5+height+.55,z,radius*1.7,'x',materials.stone);
      if(roof){
        architecturalMesh(
          new THREE.ConeGeometry(radius*1.15,4.2,14),
          materials.slate,[x,7+height,z]
        );
      }
      warmWindow(x,8+height*.45,z+radius+.03,.48,1.1);
      warmWindow(x-1.1,8+height*.68,z+radius-.25,.42,.9);
    }

    function stairs(x,y,z,count,width,direction=1) {
      const geometry=new THREE.BoxGeometry(width,.34,.9);
      const instances=new THREE.InstancedMesh(geometry,materials.path,count);
      const matrix=new THREE.Matrix4();
      for(let i=0;i<count;i++){
        matrix.makeTranslation(x,y+i*.3,z+direction*i*.72);
        instances.setMatrixAt(i,matrix);
      }
      instances.castShadow=true;instances.receiveShadow=true;scene.add(instances);
    }

    function buildAtmosphere() {
      const sky=new THREE.Mesh(
        new THREE.SphereGeometry(150,24,16),
        new THREE.ShaderMaterial({
          side:THREE.BackSide,
          uniforms:{top:{value:new THREE.Color(0x173958)},bottom:{value:new THREE.Color(0x03070d)}},
          vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
          fragmentShader:'varying float h;uniform vec3 top;uniform vec3 bottom;void main(){gl_FragColor=vec4(mix(bottom,top,smoothstep(-.2,.8,h)),1.0);}'
        })
      );
      scene.add(sky);
      const moon=new THREE.Mesh(
        new THREE.SphereGeometry(3.2,20,14),
        new THREE.MeshBasicMaterial({color:0xb7c9dc})
      );
      moon.position.set(-48,48,-75);scene.add(moon);
    }

    function buildLights() {
      scene.add(new THREE.HemisphereLight(0x8bb7d8,0x15100d,1.9));
      scene.add(new THREE.AmbientLight(0x405b72,.68));
      const moon=new THREE.DirectionalLight(0xbfd7ed,3.25);
      moon.position.set(-28,48,34);moon.castShadow=true;
      moon.shadow.mapSize.set(1536,1536);
      moon.shadow.camera.left=-45;moon.shadow.camera.right=45;
      moon.shadow.camera.top=50;moon.shadow.camera.bottom=-25;
      scene.add(moon);
      [[0,8,20],[-13,10,14],[13,10,14],[-7,17,6],[7,20,-4],[-12,25,-9]]
        .forEach(([x,y,z],index)=>{
          const lamp=new THREE.PointLight(0xff9a32,index===0?55:28,19,2);
          lamp.position.set(x,y,z);scene.add(lamp);
          architecturalMesh(
            new THREE.SphereGeometry(.16,8,6),materials.window,[x,y,z]
          );
        });
    }

    function buildCastle() {
      const rock=architecturalMesh(
        new THREE.CylinderGeometry(27,40,16,11),materials.rock,[0,-3,0]
      );
      rock.rotation.y=.18;
      for(let i=0;i<18;i++){
        const angle=i/18*Math.PI*2;
        architecturalMesh(
          new THREE.DodecahedronGeometry(3.2+(i%3),0),materials.rock,
          [Math.sin(angle)*(29+i%4),-1+(i%3),Math.cos(angle)*(25+i%5)],
          [i*.31,i*.17,0]
        );
      }
      architecturalMesh(
        new THREE.CylinderGeometry(27,28,1.3,12),materials.grass,[0,5.2,0]
      );
      architecturalMesh(
        new THREE.CylinderGeometry(20,22,2.2,10),materials.grass,[0,10.8,-2]
      );
      architecturalMesh(
        new THREE.CylinderGeometry(14,16,2.4,9),materials.grass,[-2,17.1,-7]
      );

      wall(0,8.2,18.3,42,6,2.2);
      wall(-22,8.4,1.5,2.2,6.4,33,'z');
      wall(22,8.4,1.5,2.2,6.4,33,'z');
      wall(0,9,-15.2,38,7.2,2.2);
      tower(-21,15,14,3.6,true);tower(21,15,14,3.6,true);
      tower(-22,-13,13,3.3,true);tower(22,-13,13,3.3,true);

      box(0,10.7,18.6,9,11,5,materials.stone);
      tower(-5,17.7,13,2.7,false);tower(5,17.7,13,2.7,false);
      box(0,8.5,21.15,3.3,6.2,.35,materials.door);
      warmWindow(-2.25,12.4,21.2,.55,1.4);
      warmWindow(2.25,12.4,21.2,.55,1.4);
      battlements(0,16.75,18.6,9,'x');

      box(0,5.7,25,8,.7,11,materials.path);
      stairs(-12,6,15,15,4.2,-1);
      stairs(12,6,-2,17,4.2,-1);

      wall(-3,13.5,8,31,5.4,2);
      wall(-15,13.3,-1,2,5.2,17,'z');
      wall(14,13.3,-2,2,5.2,15,'z');
      box(-4,11.4,1,24,.8,13,materials.path);
      tower(-15,8,12,2.8,false);tower(14,7,12,2.8,false);

      box(1,19.1,-3.8,24,8.2,11,materials.stoneDark);
      battlements(1,23.85,1.1,24,'x',materials.stone);
      for(let x=-9;x<=10;x+=3.8)warmWindow(x,19.4,1.78,.52,1.25);

      box(-7,24.2,-10,11,14,10,materials.stone);
      battlements(-7,31.85,-5.1,11,'x');
      box(6,23,-11,13,11.5,9,materials.stoneDark);
      architecturalMesh(
        new THREE.ConeGeometry(8.8,5.2,4),materials.slate,[6,31.35,-11],[0,Math.PI/4,0]
      );
      tower(-13,-13,15,3.1,true);tower(14,-14,17,3.2,true);

      for(let x=-10;x<=8;x+=4)warmWindow(x,25,-4.7,.5,1.2);
      warmWindow(-7,28.5,-4.7,.65,1.5);
      box(-7,34,-10,.16,5,.16,materials.wood);
      const flag=box(-5.6,35.2,-9.95,2.8,1.45,.08,materials.gold);
      flag.rotation.z=-.08;
    }

    function anchors() {
      const out=[];
      const row=(x1,x2,y,z,count,normal=[0,0,1])=>{
        for(let i=0;i<count;i++){
          const t=count===1?.5:i/(count-1);
          out.push({position:[x1+(x2-x1)*t,y,z],normal});
        }
      };
      row(-18.5,18.5,9.3,19.52,15);
      row(-15.5,15.5,7.1,13.2,12);
      row(-13.2,11.2,14.4,9.08,15);
      row(-9.5,10.5,20.2,1.78,12);
      for(let i=0;i<10;i++){
        out.push({position:[-23.15,9+i%2*3,-9+i*2.35],normal:[-1,0,0]});
      }
      for(let i=0;i<10;i++){
        out.push({position:[23.15,9+i%2*3,-9+i*2.35],normal:[1,0,0]});
      }
      row(-14,11,27.5,-4.72,10);
      return out;
    }

    function seeded(cards,seed) {
      const copy=cards.slice(); let value=seed || 1;
      for(let i=copy.length-1;i>0;i--){
        value=(value*1664525+1013904223)>>>0;
        const j=value%(i+1);
        [copy[i],copy[j]]=[copy[j],copy[i]];
      }
      return copy;
    }

    function clearCards() {
      state.meshes.forEach(mesh=>{
        mesh.geometry.dispose();
        [...new Set(mesh.material)].forEach(item=>item.dispose());
      });
      state.meshes=[]; cardGroup.clear(); state.loadQueue=[];
    }

    function setCards(cards,focusedCardId,shuffleSeed,animateFocus=false,activeCategory='TOUTES') {
      state.cards=cards; state.focusedCardId=focusedCardId; state.shuffleSeed=shuffleSeed;
      state.activeCategory=activeCategory;
      document.body.dataset.cardCount=String(cards.length);
      document.body.dataset.textureCount='0';
      document.body.dataset.firstCardId=cards[0]?.id || '';
      clearCards();
      const points=anchors();
      seeded(cards,shuffleSeed).slice(0,points.length).forEach((card,index)=>addCard(card,points[index]));
      document.body.dataset.meshCount=String(state.meshes.length);
      updateCategoryControl();
      if(focusedCardId) focusCard(focusedCardId,animateFocus);
      pumpTextures();
    }

    function addCard(card,anchor) {
      const h=3.2,w=Math.max(.9,Math.min(2.5,h*(card.aspectRatio || .66)));
      const edge=materials.gold.clone();
      edge.color.set(0xb6aa8e);edge.emissive.set(0x120a00);
      const face=new THREE.MeshStandardMaterial({
        color:0x2c1e18,roughness:.68,metalness:.02
      });
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,.08),[edge,edge,edge,edge,face,edge]);
      mesh.position.fromArray(anchor.position);
      mesh.userData.card=card;
      mesh.userData.anchorNormal=new THREE.Vector3().fromArray(anchor.normal||[0,0,1]);
      mesh.castShadow=true;
      cardGroup.add(mesh); state.meshes.push(mesh);
      state.loadQueue.push({mesh,card});
    }

    function pumpTextures() {
      while(state.activeLoads<4 && state.loadQueue.length){
        const item=state.loadQueue.shift();
        if(state.textures.has(item.card.thumbnailUrl)){
          applyTexture(item.mesh,state.textures.get(item.card.thumbnailUrl));
          continue;
        }
        state.activeLoads++;
        new THREE.TextureLoader().load(item.card.thumbnailUrl,texture=>{
          texture.colorSpace=THREE.SRGBColorSpace;
          texture.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
          state.textures.set(item.card.thumbnailUrl,texture);
          applyTexture(item.mesh,texture);
          state.activeLoads--; pumpTextures();
        },undefined,()=>{
          state.activeLoads--; pumpTextures();
        });
      }
    }

    function applyTexture(mesh,texture) {
      if(!state.meshes.includes(mesh)) return;
      mesh.material[4].map=texture;
      mesh.material[4].color.set(0xffffff);
      mesh.material[4].needsUpdate=true;
      const loaded=state.meshes.filter(item=>item.material[4].map).length;
      document.body.dataset.textureCount=String(loaded);
    }

    function focusCard(cardId,animate=true) {
      state.focusedCardId=cardId;
      document.body.dataset.focusedCardId=cardId || '';
      document.body.dataset.focusMode=animate?'animated':'immediate';
      document.body.dataset.focusSettled=animate?'false':'true';
      let selected=null;
      state.meshes.forEach(mesh=>{
        const active=mesh.userData.card.id===cardId;
        mesh.scale.setScalar(active?1.15:1);
        [0,1,2,3,5].forEach(i=>{
          mesh.material[i].color.set(active?0xffc928:0xb6aa8e);
          mesh.material[i].emissive.set(active?0x8a3b00:0x120a00);
          mesh.material[i].emissiveIntensity=active?1.8:.35;
        });
        if(active) selected=mesh;
      });
      updateFocusedSummary(selected?.userData.card || null);
      if(!selected) return;
      const look=selected.position.clone();
      const cameraTarget=look.clone()
        .addScaledVector(selected.userData.anchorNormal,10)
        .add(new THREE.Vector3(0,2.4,0));
      if(animate){state.targetLook=look;state.targetCamera=cameraTarget}
      else{
        orbit.target.copy(look);
        camera.position.copy(cameraTarget);
        syncOrbitFromCamera();
      }
    }

    function pick(event) {
      const rect=renderer.domElement.getBoundingClientRect();
      pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
      pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(pointer,camera);
      return raycaster.intersectObjects(state.meshes,false)[0]?.object;
    }

    function updateCategoryControl() {
      const control=document.getElementById('castle-category');
      const categories=['TOUTES',...new Set(state.cards.map(card=>card.category.toUpperCase()))];
      control.replaceChildren(...categories.map(category=>{
        const option=document.createElement('option');
        option.value=category;option.textContent=category;
        option.selected=category===state.activeCategory;
        return option;
      }));
    }

    function updateFocusedSummary(card) {
      document.getElementById('focused-title').textContent=card?.category||'Aucune carte';
      const thumbnail=document.getElementById('focused-thumbnail');
      thumbnail.src=card?.thumbnailUrl||'';
      thumbnail.alt=card?`${card.category} card`:'';
    }

    function moveCardFocus(delta) {
      const ids=state.meshes.map(mesh=>mesh.userData.card.id);
      if(!ids.length)return;
      let index=Math.max(0,ids.indexOf(state.focusedCardId));
      index=(index+delta+ids.length)%ids.length;
      focusCard(ids[index],true);
      emit('cardSelected',{cardId:ids[index]});
    }

    function setFullscreenUi(active) {
      state.fullscreenActive=active;
      document.body.classList.toggle('fullscreen-castle',active);
      emit('fullscreenChanged',{active});
      setTimeout(resize,0);
    }

    function setFrameFallback(active) {
      if(active){
        const frame=window.frameElement;
        if(frame&&typeof frame.showPopover==='function'){
          frame.setAttribute('popover','manual');
          try{frame.showPopover()}catch(_){}
        }
        const elements=[];
        let current=frame;
        while(current&&elements.length<7){
          elements.push(current);
          const root=current.getRootNode?.();
          const next=current.parentElement||(root&&root.host)||null;
          if(!next||next===parent.document.body||next===parent.document.documentElement)break;
          current=next;
        }
        state.fallbackElements=elements.map(element=>({
          element,cssText:element.style.cssText
        }));
        elements.forEach((element,index)=>{
          element.style.setProperty('z-index','2147483647','important');
          element.style.setProperty('transform','none','important');
          element.style.setProperty('overflow','visible','important');
          element.style.setProperty('clip-path','none','important');
          element.style.setProperty('contain','none','important');
          element.style.setProperty('pointer-events','auto','important');
          element.style.setProperty('background','#03070c','important');
          if(index<3){
            element.style.setProperty('position','fixed','important');
            element.style.setProperty('inset','0','important');
            element.style.setProperty('width','100vw','important');
            element.style.setProperty('height','100vh','important');
          }
        });
      }else if(state.fallbackElements){
        const frame=window.frameElement;
        if(frame&&typeof frame.hidePopover==='function'){
          try{frame.hidePopover()}catch(_){}
        }
        state.fallbackElements.forEach(({element,cssText})=>{
          element.style.cssText=cssText;
        });
        state.fallbackElements=null;
      }
    }

    function activateFullscreenFallback() {
      setFrameFallback(true);
      setFullscreenUi(true);
      emit('fullscreenFallbackRequested');
    }

    async function enterCastleFullscreen() {
      if(state.fullscreenActive)return;
      try{
        if(!document.documentElement.requestFullscreen)throw new Error('unsupported');
        await Promise.race([
          document.documentElement.requestFullscreen(),
          new Promise((_,reject)=>setTimeout(()=>reject(new Error('fullscreen-timeout')),650))
        ]);
        setTimeout(()=>{
          if(!document.fullscreenElement&&!state.fullscreenActive){
            activateFullscreenFallback();
          }
        },120);
      }catch(_){
        activateFullscreenFallback();
      }
    }

    async function exitCastleFullscreen() {
      if(document.fullscreenElement){
        await document.exitFullscreen().catch(()=>{});
      }else if(state.fullscreenActive){
        setFrameFallback(false);
        emit('fullscreenFallbackExit');
        setFullscreenUi(false);
      }
    }

    function openFocusedCard() {
      if(!state.focusedCardId)return;
      const cardId=state.focusedCardId;
      emit('cardLongPressed',{cardId});
      void exitCastleFullscreen();
    }

    function installEvents() {
      addEventListener('resize',resize);
      const canvas=renderer.domElement;
      canvas.addEventListener('pointerdown',event=>{
        if(event.pointerType==='touch'){
          state.touches.set(event.pointerId,{x:event.clientX,y:event.clientY});
          if(state.touches.size===2){
            const [a,b]=[...state.touches.values()];
            state.pinch={
              distance:Math.hypot(a.x-b.x,a.y-b.y),
              orbitDistance:orbit.distance,
              center:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},
              target:orbit.target.clone()
            };
          }
        }
        state.dragging=false;
        state.pointerDown={
          x:event.clientX,y:event.clientY,t:performance.now(),mesh:pick(event),
          yaw:orbit.yaw,pitch:orbit.pitch,target:orbit.target.clone(),
          panning:event.button===1||event.button===2||event.shiftKey
        };
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove',event=>{
        if(event.pointerType==='touch'&&state.touches.has(event.pointerId)){
          state.touches.set(event.pointerId,{x:event.clientX,y:event.clientY});
          if(state.touches.size===2&&state.pinch){
            const [a,b]=[...state.touches.values()];
            const distance=Math.max(20,Math.hypot(a.x-b.x,a.y-b.y));
            const center={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
            orbit.distance=Math.max(
              14,Math.min(80,state.pinch.orbitDistance*state.pinch.distance/distance)
            );
            const scale=orbit.distance*.0018;
            const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
            const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
            orbit.target.copy(state.pinch.target)
              .addScaledVector(right,-(center.x-state.pinch.center.x)*scale)
              .addScaledVector(up,(center.y-state.pinch.center.y)*scale);
            state.dragging=true;state.targetCamera=null;return;
          }
        }
        const down=state.pointerDown;if(!down)return;
        const dx=event.clientX-down.x,dy=event.clientY-down.y;
        if(Math.hypot(dx,dy)>7)state.dragging=true;
        if(state.dragging){
          if(down.panning){
            const scale=orbit.distance*.0018;
            const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
            const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
            orbit.target.copy(down.target)
              .addScaledVector(right,-dx*scale)
              .addScaledVector(up,dy*scale);
          }else{
            orbit.yaw=down.yaw-dx*.008;
            orbit.pitch=Math.max(-.05,Math.min(1.15,down.pitch+dy*.006));
          }
          state.targetCamera=null;
        }
      });
      canvas.addEventListener('pointerup',event=>{
        if(event.pointerType==='touch'){
          state.touches.delete(event.pointerId);
          if(state.touches.size<2)state.pinch=null;
        }
        const down=state.pointerDown;state.pointerDown=null;
        if(!down || state.dragging || !down.mesh)return;
        const card=down.mesh.userData.card;
        if(performance.now()-down.t>520){
          state.focusedCardId=card.id;openFocusedCard();
        }
        else{focusCard(card.id,true);emit('cardSelected',{cardId:card.id})}
      });
      canvas.addEventListener('wheel',event=>{
        event.preventDefault();
        orbit.distance=Math.max(14,Math.min(80,orbit.distance+event.deltaY*.025));
        state.targetCamera=null;
      },{passive:false});
      canvas.addEventListener('contextmenu',event=>event.preventDefault());
      document.getElementById('enter-fullscreen').addEventListener('click',enterCastleFullscreen);
      document.getElementById('castle-dj-who').addEventListener('click',()=>{
        void exitCastleFullscreen();setTimeout(()=>emit('djWhoRequested'),60);
      });
      document.getElementById('exit-fullscreen').addEventListener('click',exitCastleFullscreen);
      document.getElementById('castle-home').addEventListener('click',()=>{
        void exitCastleFullscreen();setTimeout(()=>emit('homeRequested'),60);
      });
      document.getElementById('castle-category').addEventListener('change',event=>{
        emit('categorySelected',{category:event.target.value});
      });
      document.getElementById('previous-card').addEventListener('click',()=>moveCardFocus(-1));
      document.getElementById('next-card').addEventListener('click',()=>moveCardFocus(1));
      document.getElementById('open-focused-card').addEventListener('click',openFocusedCard);
      document.addEventListener('fullscreenchange',()=>{
        setFullscreenUi(Boolean(document.fullscreenElement));
      });
      addEventListener('keydown',event=>{
        if(event.key==='Escape'&&state.fullscreenActive){
          void exitCastleFullscreen();event.preventDefault();return;
        }
        if(['w','a','s','d','W','A','S','D'].includes(event.key)){
          keys.add(event.key.toLowerCase());event.preventDefault();return;
        }
        if(!['ArrowLeft','ArrowRight','Enter'].includes(event.key))return;
        const ids=state.meshes.map(mesh=>mesh.userData.card.id);
        if(!ids.length)return;
        let index=Math.max(0,ids.indexOf(state.focusedCardId));
        if(event.key==='Enter'){openFocusedCard();return}
        index+=event.key==='ArrowRight'?1:-1;
        index=Math.max(0,Math.min(ids.length-1,index));
        focusCard(ids[index],true);emit('cardSelected',{cardId:ids[index]});
      });
      addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
      canvas.addEventListener('webglcontextlost',event=>{
        event.preventDefault();emit('rendererError',{reason:'context-lost'});
      });
    }

    function updateOrbit() {
      const cp=Math.cos(orbit.pitch);
      camera.position.set(
        orbit.target.x+Math.sin(orbit.yaw)*cp*orbit.distance,
        orbit.target.y+Math.sin(orbit.pitch)*orbit.distance,
        orbit.target.z+Math.cos(orbit.yaw)*cp*orbit.distance
      );
      camera.lookAt(orbit.target);
    }

    function syncOrbitFromCamera() {
      const delta=camera.position.clone().sub(orbit.target);
      orbit.distance=Math.max(14,Math.min(80,delta.length()));
      orbit.pitch=Math.asin(delta.y/orbit.distance);
      orbit.yaw=Math.atan2(delta.x,delta.z);
    }

    function resize() {
      if(!renderer)return;
      const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);
      camera.aspect=width/height;camera.updateProjectionMatrix();renderer.setSize(width,height);
    }

    function animate(now=performance.now()) {
      if(state.disposed)return;
      requestAnimationFrame(animate);
      const delta=Math.min(.25,Math.max(0,(now-(state.lastFrame||now))/1000));
      state.lastFrame=now;
      if(state.targetCamera&&state.targetLook){
        const cameraAlpha=1-Math.exp(-5.2*delta);
        const targetAlpha=1-Math.exp(-6.1*delta);
        camera.position.lerp(state.targetCamera,cameraAlpha);
        orbit.target.lerp(state.targetLook,targetAlpha);
        camera.lookAt(orbit.target);
        if(camera.position.distanceTo(state.targetCamera)<.08){
          camera.position.copy(state.targetCamera);
          orbit.target.copy(state.targetLook);
          syncOrbitFromCamera();
          state.targetCamera=null;
          state.targetLook=null;
          document.body.dataset.focusSettled='true';
        }
      } else {
        if(keys.size){
          const forward=new THREE.Vector3();
          camera.getWorldDirection(forward);forward.y=0;forward.normalize();
          const right=new THREE.Vector3().crossVectors(forward,camera.up).normalize();
          const move=new THREE.Vector3();
          if(keys.has('w'))move.add(forward);
          if(keys.has('s'))move.sub(forward);
          if(keys.has('d'))move.add(right);
          if(keys.has('a'))move.sub(right);
          if(move.lengthSq())orbit.target.add(move.normalize().multiplyScalar(.14));
        }
        updateOrbit();
      }
      state.meshes.forEach(mesh=>{
        const target=camera.position.clone();target.y=mesh.position.y;mesh.lookAt(target);
      });
      renderer.render(scene,camera);
    }

    function dispose() {
      state.disposed=true;clearCards();
      state.textures.forEach(texture=>texture.dispose());
      renderer?.dispose();
    }

    addEventListener('message',event=>{
      if(event.origin!==location.origin || typeof event.data!=='string')return;
      let data;try{data=JSON.parse(event.data)}catch(_){return}
      if(data.type==='setCards')setCards(
        data.cards||[],
        data.focusedCardId,
        data.shuffleSeed||0,
        data.animateFocus===true,
        data.activeCategory||'TOUTES'
      );
      if(data.type==='focusCard')focusCard(data.cardId||'',data.animate!==false);
      if(data.type==='enterFullscreen')enterCastleFullscreen();
      if(data.type==='exitFullscreen')exitCastleFullscreen();
      if(data.type==='setInAppFullscreen'){
        if(data.active!==true)setFrameFallback(false);
        setFullscreenUi(data.active===true);
      }
      if(data.type==='dispose')dispose();
    });
    init();
  })();
  </script>
</body>
</html>
