<html lang="en">
<head>
  <meta charset="utf-8">

  <style>

    #scene::before{background:linear-gradient(180deg,#06142308 38%,#02060b20 76%,#0005 100%);mix-blend-mode:multiply}
    #scene::after{box-shadow:inset 0 0 min(15vw,170px) #0008,inset 0 -10vh 14vh #0004;background:radial-gradient(ellipse at 47% 40%,transparent 52%,#01040912 79%,#0004 100%)}
    @keyframes castle-door-flash{0%,100%{filter:brightness(1)}45%{filter:brightness(1.8)}55%{filter:brightness(.92)}}
    body.castle-door-hover #scene::after{animation:castle-door-flash .58s steps(2,end) infinite;background:radial-gradient(circle at 46.5% 64%,rgba(255,213,92,.92) 0 1.1%,rgba(255,128,28,.38) 3.5%,rgba(255,113,20,.12) 7%,transparent 14%),radial-gradient(circle at 53.5% 64%,rgba(255,213,92,.92) 0 1.1%,rgba(255,128,28,.38) 3.5%,rgba(255,113,20,.12) 7%,transparent 14%),radial-gradient(ellipse at 50% 64%,rgba(255,164,54,.16) 0 7%,transparent 21%),radial-gradient(ellipse at 47% 40%,transparent 52%,#01040912 79%,#0004 100%)}
    #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:radial-gradient(circle,#122436,#03070c 72%);color:#dce9f3;font:700 13px system-ui;letter-spacing:.12em;pointer-events:none}

    #castle-entrance-transition{position:fixed;inset:0;z-index:2147483646;background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s}
    #castle-entrance-transition video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
    body.entrance-video-active #castle-entrance-transition{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s ease}
    .castle-toolbar{position:absolute;z-index:4;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:14px;pointer-events:none}
    .castle-toolbar-group{display:flex;gap:14px;align-items:flex-start;pointer-events:auto}
    .castle-control{position:relative;display:flex;align-items:center;min-width:224px;height:74px;padding:0 20px 0 86px;border:1px solid #b07a2b;border-radius:7px;background:linear-gradient(180deg,rgba(10,17,25,.96),rgba(4,9,14,.96));color:#f4d89d;box-shadow:0 10px 25px #0009,inset 0 0 0 1px rgba(232,184,94,.18);cursor:pointer;font-family:Georgia,'Times New Roman',serif;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;color-scheme:dark}
    .castle-control::before,.castle-control::after{content:"";position:absolute;pointer-events:none}
    .castle-control::before{inset:5px;border:1px solid rgba(224,168,72,.55);clip-path:polygon(6% 0,94% 0,100% 28%,100% 72%,94% 100%,6% 100%,0 72%,0 28%)}
    .castle-control::after{width:8px;height:8px;background:#162332;border:1px solid #a66d27;transform:rotate(45deg);left:50%;bottom:-6px;margin-left:-5px}
    .castle-control:hover,.castle-control:focus-visible{transform:translateY(-2px);border-color:#d8a649;box-shadow:0 14px 30px #000b,0 0 20px rgba(195,128,39,.18),inset 0 0 0 1px rgba(245,199,109,.3);outline:none}
    .control-medallion{position:absolute;left:14px;top:50%;width:58px;height:58px;margin-top:-29px;border-radius:50%;display:grid;place-items:center;border:2px solid #9e6928;background:radial-gradient(circle at 45% 38%,#142233 0,#09121c 58%,#05090e 100%);box-shadow:0 0 0 4px rgba(16,22,29,.9),0 0 0 5px rgba(177,117,42,.45),0 4px 12px #0008;color:#f2c46f;font:700 30px/1 system-ui}
    .control-copy{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
    .control-title{font-size:19px;line-height:1.05;letter-spacing:.02em;color:#f1d39a;text-transform:uppercase}
    .control-subtitle{font:400 12px/1.2 system-ui;color:#d3d7dc;letter-spacing:.01em;text-transform:none}
    #fullscreen-controls{display:none}
    body.fullscreen-castle #fullscreen-controls{display:block}
    body.fullscreen-castle #enter-fullscreen{display:none}
    @media(max-width:980px){
      .castle-toolbar{top:10px;left:10px;right:10px;gap:8px}
      .castle-toolbar-group{gap:8px}
      .castle-control{min-width:0;width:64px;height:64px;padding:0;border-radius:8px;justify-content:center}
      .castle-control::after{display:none}
      .control-medallion{position:static;width:48px;height:48px;margin:0;font-size:25px}
      .control-copy{display:none}
    }
  </style>
  <script type="importmap">
    {"imports":{"three":"../vendor/three.module.js"}}
  </script>
</head>
<body data-renderer-status="loading">
  <div id="scene"></div>
  <div id="loading">LOADING 3D CASTLE…</div>
  <div id="castle-entrance-transition" aria-hidden="true"><video id="castle-entrance-video" muted playsinline webkit-playsinline preload="auto"></video></div>
  <div class="castle-toolbar">
    <div class="castle-toolbar-group">
      <button id="back-to-categories" class="castle-control" type="button" aria-label="Catégories">
        <span class="control-medallion">▱</span>

      </button>
    </div>
    <div id="castle-controls" class="castle-toolbar-group">

  </div>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from '../vendor/GLTFLoader.js';

  window.THREE = THREE;
  const root = document.getElementById('scene');
  const CASTLE_URL = new URL(
    '../assets/assets/models/search_castle.glb',
    document.baseURI,
  ).href;
  const INTERIOR_URL = new URL(
    '../assets/assets/models/castle_interior.glb',
    document.baseURI,
  ).href;
  const ENTRANCE_VIDEO_URL = new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;
  const entranceTransition=document.getElementById('castle-entrance-transition');
  const entranceVideo=document.getElementById('castle-entrance-video');
  const abort = new AbortController();
  const listen = (target,type,handler,options={}) =>
    target.addEventListener(type,handler,{...options,signal:abort.signal});
  const clamp = THREE.MathUtils.clamp;
  const LONG_PRESS_MS=600;
  const TAP_SLOP_PX=9;
  const state = {
    cards: [], meshes: [], textures: new Map(), focusedCardId: null,
    shuffleSeed: 0, disposed: false, pointerDown: null, dragging: false,
    targetLook: null, targetCamera: null, loadQueue: [], activeLoads: 0,
    touches: new Map(), pinch: null, activeCategory: 'ALL',
    fullscreenActive: false, fallbackElements: null, lastFrame: 0,
    frame: 0, visible: true, ready: false, generation: 0,
    surfaceAnchors: [], longPressTimer: 0,
    sceneMode:'exterior', interiorReady:false, interiorLoadPromise:null,
  };
  const keys = new Set();
  const orbit = {
    yaw: .72, pitch: .34, distance: 59,
    target: new THREE.Vector3(0,8,0),
  };
  let scene,camera,renderer,raycaster,pointer,cardGroup,castleRoot,interiorRoot;
  let resizeObserver,intersectionObserver;
  const atmosphere={mist:[],warmLights:[],highQuality:false};
  const cardGeometry = new THREE.BoxGeometry(1.08,1.62,.035);
  const cardForward = new THREE.Vector3(0,0,1);

  function emit(type,payload={}) {
    parent.postMessage(JSON.stringify({type,...payload}),location.origin);
  }

  function hasWebGL() {
    try {
      const canvas=document.createElement('canvas');
      return Boolean(window.WebGLRenderingContext &&
        (canvas.getContext('webgl2')||canvas.getContext('webgl')));
    } catch (_) { return false; }
  }

  async function init() {
    if(!hasWebGL()){
      document.body.dataset.rendererStatus='failed';
      emit('rendererError',{reason:'webgl-unavailable'});
      return;
    }
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x02060b);
    scene.fog=new THREE.FogExp2(0x0a1824,.0108);
    camera=new THREE.PerspectiveCamera(43,1,.1,180);
    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.42;
    atmosphere.highQuality=matchMedia('(min-width: 900px)').matches &&
      (navigator.hardwareConcurrency||4)>=4 && devicePixelRatio<=2.25;
    renderer.shadowMap.enabled=atmosphere.highQuality;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    root.appendChild(renderer.domElement);
    raycaster=new THREE.Raycaster();
    pointer=new THREE.Vector2();
    cardGroup=new THREE.Group();
    scene.add(cardGroup);
    buildEnvironment();
    buildLights();
    try {
      await loadCastle();
    } catch(error) {
      document.body.dataset.rendererStatus='failed';
      document.body.dataset.modelAsset=CASTLE_URL;
      document.body.dataset.modelError=String(error?.message||error);
      console.error('Search castle GLB failed to load.',{url:CASTLE_URL,error});
      emit('rendererError',{reason:'castle-load-failed'});
      dispose();
      return;
    }
    state.interiorLoadPromise=loadInterior().catch(error=>{
      document.body.dataset.interiorReady='false';
      document.body.dataset.interiorError=String(error?.message||error);
      console.warn('Castle interior GLB failed to preload.',{url:INTERIOR_URL,error});
      return null;
    });
    document.body.dataset.rendererInstanceId=
      `castle-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    document.body.dataset.atmosphere='scottish-cinematic-night';
    document.body.dataset.atmosphereQuality=atmosphere.highQuality?'high':'efficient';
    document.body.dataset.modelAsset=CASTLE_URL;
    document.body.dataset.interiorModelAsset=INTERIOR_URL;
    document.body.dataset.entranceVideoAsset=ENTRANCE_VIDEO_URL;
    document.body.dataset.sceneMode='exterior';
    installEvents();
    resizeObserver=new ResizeObserver(resize);
    resizeObserver.observe(root);
    intersectionObserver=new IntersectionObserver(([entry])=>{
      state.visible=entry.isIntersecting;
      if(state.visible)resume();else pause();
    });
    intersectionObserver.observe(document.documentElement);
    resize();
    updateOrbit();
    state.ready=true;
    document.body.classList.add('ready');
    document.body.dataset.rendererStatus='ready';
    if(state.cards.length){
      setCards(
        state.cards,
        state.focusedCardId,
        state.shuffleSeed,
        false,
        state.activeCategory,
      );
    }
    updateSceneCount();
    resume();
    emit('rendererReady');
  }

  function buildEnvironment() {
    const ground=new THREE.Mesh(
      new THREE.CircleGeometry(67,64),
      new THREE.MeshStandardMaterial({color:0x0a1112,roughness:.82,metalness:.025}),
    );
    ground.rotation.x=-Math.PI/2;
    ground.position.y=-.12;
    ground.receiveShadow=atmosphere.highQuality;
    scene.add(ground);
    const sky=new THREE.Mesh(
      new THREE.SphereGeometry(130,24,16),
      new THREE.ShaderMaterial({
        side:THREE.BackSide,
        uniforms:{top:{value:new THREE.Color(0x102a42)},middle:{value:new THREE.Color(0x091827)},bottom:{value:new THREE.Color(0x010409)}},
        vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
        fragmentShader:'varying float h;uniform vec3 top;uniform vec3 middle;uniform vec3 bottom;void main(){vec3 low=mix(bottom,middle,smoothstep(-.42,.18,h));vec3 colour=mix(low,top,smoothstep(.08,.92,h));gl_FragColor=vec4(colour,1.0);}',
      }),
    );
    scene.add(sky);
    const moon=new THREE.Mesh(
      new THREE.SphereGeometry(6.4,32,24),
      new THREE.MeshBasicMaterial({color:0xdde9f3,fog:false,toneMapped:false}),
    );
    moon.position.set(-70,18,-40);
    scene.add(moon);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({
      map:radialTexture('rgba(207,226,242,.28)'),transparent:true,
      depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,toneMapped:false,
    }));
    halo.position.copy(moon.position);halo.scale.set(27,27,1);scene.add(halo);

    const cloudTexture=buildCloudTexture();
    [
      [-62,20,-37,42,12,.62],[-78,15,-34,34,9,.42],
      [-45,26,-49,38,10,.26],[28,19,-76,54,13,.18],
    ].forEach(([x,y,z,w,h,opacity])=>{
      const cloud=new THREE.Sprite(new THREE.SpriteMaterial({
        map:cloudTexture,transparent:true,opacity,depthWrite:false,
        color:0x708399,fog:false,toneMapped:false,
      }));
      cloud.position.set(x,y,z);cloud.scale.set(w,h,1);scene.add(cloud);
    });

    const mistTexture=radialTexture('rgba(153,181,198,.38)',768,192);
    [
      [-26,2,-4,42,8,.18],[24,3,-8,46,9,.15],[-14,6,-22,54,10,.12],
      [7,1,23,36,7,.11],
    ].forEach(([x,y,z,w,h,opacity])=>{
      const mist=new THREE.Sprite(new THREE.SpriteMaterial({
        map:mistTexture,transparent:true,opacity,depthWrite:false,
        color:0x8ea9bb,fog:true,toneMapped:false,
      }));
      mist.position.set(x,y,z);mist.scale.set(w,h,1);scene.add(mist);atmosphere.mist.push(mist);
    });
  }

  function radialTexture(colour,width=256,height=256) {
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const context=canvas.getContext('2d');
    const gradient=context.createRadialGradient(width*.5,height*.5,0,width*.5,height*.5,Math.max(width,height)*.5);
    gradient.addColorStop(0,colour);gradient.addColorStop(.38,colour);gradient.addColorStop(1,'rgba(0,0,0,0)');
    context.fillStyle=gradient;context.fillRect(0,0,width,height);
    const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;return texture;
  }

  function buildCloudTexture() {
    const canvas=document.createElement('canvas');canvas.width=512;canvas.height=160;
    const context=canvas.getContext('2d');context.clearRect(0,0,512,160);
    let seed=317;
    for(let index=0;index<34;index++){
      seed=(seed*1664525+1013904223)>>>0;const x=(seed%500)+6;
      seed=(seed*1664525+1013904223)>>>0;const y=48+(seed%62);
      seed=(seed*1664525+1013904223)>>>0;const radius=26+(seed%54);
      const gradient=context.createRadialGradient(x,y,0,x,y,radius);
      gradient.addColorStop(0,'rgba(225,235,242,.33)');gradient.addColorStop(1,'rgba(18,31,44,0)');
      context.fillStyle=gradient;context.fillRect(x-radius,y-radius,radius*2,radius*2);
    }
    const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;return texture;
  }

  function buildLights() {
    scene.add(new THREE.HemisphereLight(0xb4d0e4,0x22262b,2.45));
    scene.add(new THREE.AmbientLight(0x7590a5,.62));
    const moon=new THREE.DirectionalLight(0xcbdff0,9.6);
    moon.position.set(-26,44,30);
    moon.target.position.set(0,7,0);scene.add(moon.target);
    moon.castShadow=atmosphere.highQuality;
    moon.shadow.mapSize.set(1024,1024);moon.shadow.bias=-.00022;moon.shadow.normalBias=.035;
    moon.shadow.camera.left=-30;moon.shadow.camera.right=30;moon.shadow.camera.top=34;moon.shadow.camera.bottom=-16;
    moon.shadow.camera.near=8;moon.shadow.camera.far=95;
    scene.add(moon);
    const rim=new THREE.DirectionalLight(0x789fc1,1.45);
    rim.position.set(30,22,-26);
    scene.add(rim);
    const architecturalLights=[
      [0,5,18,32,26],[-10,4,16,19,20],[10,4,16,19,20],
      [0,2,24,22,19],[-17,3,13,14,16],[17,3,13,14,16],
      [0,8,6,24,22],[-11,8,6,16,17],[11,8,6,16,17],
      [-19,7,1,13,15],[19,7,1,13,15],
      [-12,13,-6,14,16],[0,16,-8,17,18],[12,13,-6,14,16],
    ];
    architecturalLights
      .slice(0,atmosphere.highQuality?architecturalLights.length:10)
      .forEach(([x,y,z,intensity,distance])=>{
      const warm=new THREE.PointLight(0xffa34d,intensity,distance,2.15);
      warm.position.set(x,y,z);scene.add(warm);atmosphere.warmLights.push(warm);
    });
    if(atmosphere.highQuality){
      addArchitecturalSpot([0,12,25],[0,5,12],0xffa45b,34,.58);
      addArchitecturalSpot([-15,15,13],[-8,5,7],0xffb06a,22,.52);
    }
    document.body.dataset.warmLightCount=String(atmosphere.warmLights.length);
    document.body.dataset.moonIntensity=String(moon.intensity);
  }

  function addArchitecturalSpot(position,target,colour,intensity,angle) {
    const light=new THREE.SpotLight(colour,intensity,38,angle,.72,1.65);
    light.position.fromArray(position);light.target.position.fromArray(target);
    light.castShadow=true;light.shadow.mapSize.set(1024,1024);
    light.shadow.bias=-.00018;light.shadow.normalBias=.045;
    light.shadow.camera.near=3;light.shadow.camera.far=48;
    scene.add(light,light.target);atmosphere.warmLights.push(light);
  }

  function loadCastle() {
    return new Promise((resolve,reject)=>{
      new GLTFLoader().load(CASTLE_URL,gltf=>{
        if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}
        castleRoot=gltf.scene;
        let meshCount=0;
        castleRoot.traverse(object=>{
          if(object.isMesh){
            meshCount++;
            object.castShadow=atmosphere.highQuality;
            object.receiveShadow=atmosphere.highQuality;
            const materials=Array.isArray(object.material)?object.material:[object.material];
            materials.filter(Boolean).forEach(material=>{
              if(!material.isMeshStandardMaterial&&!material.isMeshPhysicalMaterial)return;
              const subtlyDamp=/(bridge|court|floor|ground|path|stair|walk)/i.test(
                `${object.name||''} ${material.name||''}`,
              );
              material.roughness=clamp(material.roughness??.86,subtlyDamp ? .64 : .7,.94);
              material.metalness=clamp(material.metalness??0,0,.08);
              material.envMapIntensity=atmosphere.highQuality ? .62 : .44;
              if(material.emissive?.getHex()!==0){
                material.emissiveIntensity=clamp((material.emissiveIntensity||1)*1.18,.6,2.2);
              }
              material.needsUpdate=true;
            });
          }
        });
        const bounds=new THREE.Box3().setFromObject(castleRoot);
        const size=bounds.getSize(new THREE.Vector3());
        const center=bounds.getCenter(new THREE.Vector3());
        const scale=42/Math.max(size.x,size.z,.001);
        castleRoot.scale.setScalar(scale);
        castleRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
        scene.add(castleRoot);
        castleRoot.updateMatrixWorld(true);
        state.surfaceAnchors=deriveSurfaceAnchors(84);
        document.body.dataset.castleMeshCount=String(meshCount);
        document.body.dataset.castleAnimations=String(gltf.animations.length);
        document.body.dataset.surfaceAnchorCount=String(state.surfaceAnchors.length);
        if(state.surfaceAnchors.length<84){
          reject(new Error(`Only ${state.surfaceAnchors.length} castle surface anchors were found.`));
          return;
        }
        resolve();
      },event=>{
        if(event.total)document.body.dataset.modelProgress=
          String(Math.round(event.loaded/event.total*100));
      },reject);
    });
  }

  function loadInterior(){
    return new Promise((resolve,reject)=>{
      new GLTFLoader().load(INTERIOR_URL,gltf=>{
        if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}
        interiorRoot=gltf.scene;
        interiorRoot.visible=false;
        interiorRoot.traverse(object=>{
          if(!object.isMesh)return;
          object.castShadow=atmosphere.highQuality;
          object.receiveShadow=atmosphere.highQuality;
          const materials=Array.isArray(object.material)?object.material:[object.material];
          materials.filter(Boolean).forEach(material=>{
            if(!material.isMeshStandardMaterial&&!material.isMeshPhysicalMaterial)return;
            material.roughness=clamp(material.roughness??.82,.58,.96);
            material.metalness=clamp(material.metalness??0,0,.14);
            material.needsUpdate=true;
          });
        });
        const bounds=new THREE.Box3().setFromObject(interiorRoot);
        const size=bounds.getSize(new THREE.Vector3());
        const center=bounds.getCenter(new THREE.Vector3());
        const scale=34/Math.max(size.x,size.z,.001);
        interiorRoot.scale.setScalar(scale);
        interiorRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
        scene.add(interiorRoot);
        state.interiorReady=true;
        document.body.dataset.interiorReady='true';
        document.body.dataset.interiorAnimations=String(gltf.animations.length);
        resolve(interiorRoot);
      },undefined,reject);
    });
  }

  function disposeObject(rootObject) {
    rootObject?.traverse(object=>{
      object.geometry?.dispose?.();
      const items=Array.isArray(object.material)?object.material:[object.material];
      items.filter(Boolean).forEach(material=>{
        Object.values(material).forEach(value=>value?.isTexture&&value.dispose());
        material.dispose?.();
      });
    });
  }

  function deriveSurfaceAnchors(limit) {
    const candidates=[];
    const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
    const ab=new THREE.Vector3(),ac=new THREE.Vector3();
    const center=new THREE.Vector3(),normal=new THREE.Vector3(),radial=new THREE.Vector3();
    const establishingDirection=new THREE.Vector3(Math.sin(.72),0,Math.cos(.72));
    castleRoot.traverse(object=>{
      if(!object.isMesh||!object.geometry?.attributes?.position)return;
      const geometry=object.geometry,position=geometry.attributes.position,index=geometry.index;
      const triangleCount=Math.floor((index?.count||position.count)/3);
      const stride=Math.max(1,Math.floor(triangleCount/42000));
      for(let triangle=0;triangle<triangleCount;triangle+=stride){
        const offset=triangle*3;
        const ia=index?index.getX(offset):offset;
        const ib=index?index.getX(offset+1):offset+1;
        const ic=index?index.getX(offset+2):offset+2;
        a.fromBufferAttribute(position,ia).applyMatrix4(object.matrixWorld);
        b.fromBufferAttribute(position,ib).applyMatrix4(object.matrixWorld);
        c.fromBufferAttribute(position,ic).applyMatrix4(object.matrixWorld);
        ab.subVectors(b,a);ac.subVectors(c,a);normal.crossVectors(ab,ac);
        if(normal.lengthSq()<1e-7)continue;
        normal.normalize();center.copy(a).add(b).add(c).multiplyScalar(1/3);
        if(center.y<1.5||center.y>22||Math.abs(normal.y)>.58)continue;
        radial.set(center.x,0,center.z);
        if(radial.lengthSq()<2)continue;
        radial.normalize();
        if(normal.dot(radial)<0)normal.negate();
        if(normal.dot(radial)<.16)continue;
        candidates.push({
          position:center.clone().addScaledVector(normal,.045),
          normal:normal.clone(),
          score:normal.dot(establishingDirection)+center.y*.006,
          sector:(Math.floor((Math.atan2(center.x,center.z)+Math.PI)/(Math.PI*2)*12)+12)%12,
          level:clamp(Math.floor((center.y-1.5)/3),0,6),
        });
      }
    });
    candidates.sort((left,right)=>right.score-left.score);
    const out=[];
    const usedBuckets=new Set();
    for(const candidate of candidates){
      const bucket=`${candidate.sector}:${candidate.level}`;
      if(usedBuckets.has(bucket))continue;
      usedBuckets.add(bucket);out.push(candidate);
      if(out.length>=limit)return out;
    }
    for(const spacing of [2.2,1.75,1.35]){
      const minimum=spacing*spacing;
      for(const candidate of candidates){
        if(out.includes(candidate))continue;
        if(out.some(anchor=>anchor.position.distanceToSquared(candidate.position)<minimum))continue;
        out.push(candidate);
        if(out.length>=limit)return out;
      }
    }
    return out;
  }

  function seeded(cards,seed) {
    const copy=cards.slice();let value=seed||1;
    for(let i=copy.length-1;i>0;i--){
      value=(value*1664525+1013904223)>>>0;
      const j=value%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }

  function clearCards() {
    state.generation++;
    state.meshes.forEach(mesh=>{
      [...new Set(mesh.material)].forEach(material=>material.dispose());
      cardGroup.remove(mesh);
    });
    state.meshes=[];state.loadQueue=[];state.activeLoads=0;
  }

  function setCards(cards,focusedCardId,shuffleSeed,animateFocus=false,activeCategory='ALL') {
    state.cards=cards;state.focusedCardId=focusedCardId;state.shuffleSeed=shuffleSeed;
    state.activeCategory=activeCategory;
    document.body.dataset.cardCount=String(cards.length);
    document.body.dataset.activeCategory=activeCategory;
    document.body.dataset.cardCategories=[...new Set(
      cards.map(card=>card.category.toUpperCase()),
    )].join('|');
    document.body.dataset.textureCount='0';
    document.body.dataset.textureErrorCount='0';
    document.body.dataset.textureRequestCount='0';
    document.body.dataset.firstCardId=cards[0]?.id||'';
    document.body.dataset.firstTextureUrl='';
    if(!state.ready||!state.surfaceAnchors.length)return;
    clearCards();
    const points=state.surfaceAnchors;
    seeded(cards,shuffleSeed).slice(0,points.length)
      .forEach((card,index)=>addCard(card,points[index]));
    document.body.dataset.meshCount=String(state.meshes.length);
    state.meshes.forEach(queueRecto);
    if(focusedCardId)focusCard(focusedCardId,animateFocus);
    pumpTextures();
    updateSceneCount();
    resume();
  }

  function addCard(card,anchor) {
    const subdued=card.isMatch===false;
    const accent=categoryAccent(card.category);
    const edge=new THREE.MeshStandardMaterial({
      color:subdued?0x46515a:accent,roughness:.48,metalness:.24,
      emissive:subdued?0x000000:accent,emissiveIntensity:subdued?0:.12,
    });
    const face=new THREE.MeshStandardMaterial({color:subdued?0x171516:0x2a1c18,roughness:.64,metalness:.02,transparent:subdued,opacity:subdued ? .38 : 1});
    const back=new THREE.MeshStandardMaterial({color:subdued?0x151011:0x241712,roughness:.7,transparent:subdued,opacity:subdued ? .38 : 1});
    const mesh=new THREE.Mesh(cardGeometry,[edge,edge,edge,edge,face,back]);
    mesh.position.copy(anchor.position);
    mesh.quaternion.setFromUnitVectors(cardForward,anchor.normal);
    mesh.userData.card=card;
    mesh.userData.type='card';
    mesh.userData.cardId=card.id;
    mesh.userData.isMatch=!subdued;
    mesh.userData.anchorPosition=anchor.position.clone();
    mesh.userData.anchorNormal=anchor.normal.clone();
    mesh.userData.textureUrl='';
    mesh.castShadow=false;
    cardGroup.add(mesh);state.meshes.push(mesh);
  }

  function categoryAccent(category='') {
    const key=category.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
    if(key.includes('CLASSIQUE')||key.includes('THEAT'))return 0xa46c48;
    if(key.includes('ART'))return 0xb39a72;
    if(key.includes('CYBER')||key.includes('TECH'))return 0x4e8ba5;
    if(key.includes('POET'))return 0x76629c;
    if(key.includes('NATURE')||key.includes('SAUVAGE'))return 0x64805e;
    return 0x7d8c96;
  }

  function queueRecto(mesh) {
    const card=mesh.userData.card;
    const url=card.rectoUrl||card.thumbnailUrl;
    if(!document.body.dataset.firstTextureUrl)document.body.dataset.firstTextureUrl=url||'';
    if(mesh.userData.textureUrl===url&&mesh.material[4].map)return;
    mesh.userData.textureUrl=url;
    state.loadQueue.push({mesh,url,generation:state.generation});
    document.body.dataset.textureQueueCount=String(state.loadQueue.length);
  }

  function pumpTextures() {
    while(state.activeLoads<12&&state.loadQueue.length){
      const item=state.loadQueue.shift();
      if(item.generation!==state.generation||!state.meshes.includes(item.mesh)||item.mesh.userData.textureUrl!==item.url)continue;
      const cached=state.textures.get(item.url);
      if(cached){applyTexture(item.mesh,item.url,cached);continue}
      state.activeLoads++;
      document.body.dataset.textureRequestCount=String(
        Number(document.body.dataset.textureRequestCount||0)+1,
      );
      document.body.dataset.textureQueueCount=String(state.loadQueue.length);
      try {
        new THREE.TextureLoader().load(item.url,texture=>{
          texture.colorSpace=THREE.SRGBColorSpace;
          texture.anisotropy=Math.min(6,renderer.capabilities.getMaxAnisotropy());
          state.textures.set(item.url,texture);
          if(item.generation===state.generation){
            applyTexture(item.mesh,item.url,texture);state.activeLoads--;
          }
          pumpTextures();
        },undefined,error=>{
          console.warn(`Search card texture failed: ${item.url}`,error);
          document.body.dataset.textureErrorCount=String(
            Number(document.body.dataset.textureErrorCount||0)+1,
          );
          if(item.generation===state.generation)state.activeLoads--;
          pumpTextures();
        });
      } catch(error) {
        console.warn(`Search card texture rejected: ${item.url}`,error);
        document.body.dataset.textureErrorCount=String(
          Number(document.body.dataset.textureErrorCount||0)+1,
        );
        if(item.generation===state.generation)state.activeLoads--;
      }
    }
  }

  function applyTexture(mesh,url,texture) {
    if(!state.meshes.includes(mesh)||mesh.userData.textureUrl!==url)return;
    mesh.material[4].map=texture;
    mesh.material[4].color.set(0xffffff);
    mesh.material[4].needsUpdate=true;
    mesh.material[5].map=texture;
    mesh.material[5].color.set(0xffffff);
    mesh.material[5].needsUpdate=true;
    const loaded=state.meshes.filter(item=>item.material[4].map).length;
    document.body.dataset.textureCount=String(loaded);
    resume();
  }

  function focusCard(cardId,animate=true) {
    state.focusedCardId=cardId;
    document.body.dataset.focusedCardId=cardId||'';
    document.body.dataset.focusMode=animate?'animated':'immediate';
    document.body.dataset.focusSettled=animate?'false':'true';
    let selected=null;
    state.meshes.forEach(mesh=>{
      const active=mesh.userData.card.id===cardId;
      mesh.scale.setScalar(active?1.06:1);
      mesh.position.copy(mesh.userData.anchorPosition)
        .addScaledVector(mesh.userData.anchorNormal,active ? .11 : 0);
      mesh.material.slice(0,4).forEach(material=>{
        const accent=categoryAccent(mesh.userData.card.category);
        material.color.set(active?0xffc928:mesh.userData.isMatch?accent:0x46515a);
        material.emissive.set(active?0x6b2f00:mesh.userData.isMatch?accent:0x000000);
        material.emissiveIntensity=active?1.3:mesh.userData.isMatch ? .12 : 0;
      });
      if(active)selected=mesh;
    });
    pumpTextures();
    if(!selected)return;
    const look=selected.position.clone();
    const cameraTarget=look.clone()
      .addScaledVector(selected.userData.anchorNormal,10)
      .add(new THREE.Vector3(0,2.2,0));
    if(animate){state.targetLook=look;state.targetCamera=cameraTarget}
    else{orbit.target.copy(look);camera.position.copy(cameraTarget);syncOrbitFromCamera()}
    resume();
  }

  function pick(event) {
    if(state.sceneMode==='interior')return null;
    const rect=renderer.domElement.getBoundingClientRect();
    pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
    pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(pointer,camera);
    return raycaster.intersectObjects(state.meshes,false)[0]?.object;
  }

  function moveCardFocus(delta) {
    if(state.sceneMode==='interior')return;
    const ids=state.meshes.map(mesh=>mesh.userData.card.id);if(!ids.length)return;
    let index=Math.max(0,ids.indexOf(state.focusedCardId));
    index=(index+delta+ids.length)%ids.length;
    focusCard(ids[index],true);emit('cardSelected',{cardId:ids[index]});
  }

  function setFullscreenUi(active) {
    state.fullscreenActive=active;
    document.body.classList.toggle('fullscreen-castle',active);
    emit('fullscreenChanged',{active});setTimeout(resize,0);
  }

  function setFrameFallback(active) {
    if(active){
      const frame=window.frameElement;
      if(frame&&typeof frame.showPopover==='function'){
        frame.setAttribute('popover','manual');try{frame.showPopover()}catch(_){}
      }
      const elements=[];let current=frame;
      while(current&&elements.length<7){
        elements.push(current);const tree=current.getRootNode?.();
        const next=current.parentElement||(tree&&tree.host)||null;
        if(!next||next===parent.document.body||next===parent.document.documentElement)break;
        current=next;
      }
      state.fallbackElements=elements.map(element=>({element,cssText:element.style.cssText}));
      elements.forEach((element,index)=>{
        element.style.setProperty('z-index','2147483647','important');
        element.style.setProperty('transform','none','important');
        element.style.setProperty('overflow','visible','important');
        element.style.setProperty('clip-path','none','important');
        element.style.setProperty('contain','none','important');
        element.style.setProperty('pointer-events','auto','important');
        element.style.setProperty('background','#03070c','important');
        if(index<3){
          element.style.setProperty('position','fixed','important');
          element.style.setProperty('inset','0','important');
          element.style.setProperty('width','100vw','important');
          element.style.setProperty('height','100vh','important');
        }
      });
    }else if(state.fallbackElements){
      const frame=window.frameElement;
      if(frame&&typeof frame.hidePopover==='function')try{frame.hidePopover()}catch(_){}
      state.fallbackElements.forEach(({element,cssText})=>element.style.cssText=cssText);
      state.fallbackElements=null;
    }
  }

  function activateFullscreenFallback(){setFrameFallback(true);setFullscreenUi(true);emit('fullscreenFallbackRequested')}
  async function enterCastleFullscreen(){
    if(state.fullscreenActive)return;
    try{
      if(!document.documentElement.requestFullscreen)throw new Error('unsupported');
      await Promise.race([document.documentElement.requestFullscreen(),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),650))]);
      setTimeout(()=>{if(!document.fullscreenElement&&!state.fullscreenActive)activateFullscreenFallback()},120);
    }catch(_){activateFullscreenFallback()}
  }
  async function exitCastleFullscreen(){
    if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});
    else if(state.fullscreenActive){setFrameFallback(false);emit('fullscreenFallbackExit');setFullscreenUi(false)}
  }
  async function requestCategories(){
    await exitCastleFullscreen();
    setFrameFallback(false);
    setFullscreenUi(false);
    emit('categoriesRequested');
  }

  function openCardById(cardId){
    if(state.sceneMode==='interior')return;
    if(!cardId||!state.meshes.some(mesh=>mesh.userData.cardId===cardId))return;
    document.body.dataset.lastLongPressedCardId=cardId;
    emit('cardLongPressed',{cardId});
    void exitCastleFullscreen();
  }
  function openFocusedCard(){openCardById(state.focusedCardId)}

  function cancelLongPress(){
    if(state.longPressTimer)clearTimeout(state.longPressTimer);
    state.longPressTimer=0;
  }

  function clampTarget() {
    if(state.sceneMode==='interior'){
      orbit.target.x=clamp(orbit.target.x,-12,12);
      orbit.target.y=clamp(orbit.target.y,0,12);
      orbit.target.z=clamp(orbit.target.z,-12,12);
      return;
    }
    orbit.target.x=clamp(orbit.target.x,-28,28);
    orbit.target.y=clamp(orbit.target.y,0,24);
    orbit.target.z=clamp(orbit.target.z,-28,28);
  }

  function playEntranceVideo(){
    if(state.sceneMode!=='exterior'||!entranceVideo||document.body.classList.contains('entrance-video-active'))return;
    entranceVideo.muted=true;
    entranceVideo.playsInline=true;
    entranceVideo.setAttribute('webkit-playsinline','');
    entranceVideo.preload='auto';
    entranceVideo.pause();
    entranceVideo.src=ENTRANCE_VIDEO_URL;
    entranceVideo.load();
    document.body.classList.add('entrance-video-active');
    entranceTransition?.setAttribute('aria-hidden','false');
    try{entranceVideo.currentTime=0}catch(_){}
    const playback=entranceVideo.play();
    playback?.catch?.(()=>finishEntranceVideo());
  }
  async function finishEntranceVideo(){
    if(!entranceVideo)return;
    entranceVideo.pause();
    try{
      if(!state.interiorReady&&state.interiorLoadPromise)await state.interiorLoadPromise;
      if(state.interiorReady)enterInterior();
    }finally{
      document.body.classList.remove('entrance-video-active');
      entranceTransition?.setAttribute('aria-hidden','true');
    }
  }
  function enterInterior(){
    if(!state.interiorReady||!interiorRoot)return false;
    state.sceneMode='interior';
    castleRoot.visible=false;
    cardGroup.visible=false;
    interiorRoot.visible=true;
    document.body.classList.remove('castle-door-hover');
    renderer.domElement.style.cursor='';
    document.body.dataset.castleDoorHover='false';
    document.body.dataset.sceneMode='interior';
    orbit.yaw=0;orbit.pitch=.18;orbit.distance=12;orbit.target.set(0,3.1,0);
    state.targetCamera=null;state.targetLook=null;
    updateOrbit();resume();return true;
  }
  function leaveInterior(){
    if(state.sceneMode!=='interior')return false;
    state.sceneMode='exterior';
    interiorRoot.visible=false;
    castleRoot.visible=true;
    cardGroup.visible=true;
    document.body.dataset.sceneMode='exterior';
    orbit.yaw=.72;orbit.pitch=.34;orbit.distance=59;orbit.target.set(0,8,0);
    state.targetCamera=null;state.targetLook=null;
    updateOrbit();resume();return true;
  }

  function isCastleDoorHit(event){
    if(state.sceneMode!=='exterior')return false;
    const rect=renderer.domElement.getBoundingClientRect();
    const x=(event.clientX-rect.left)/Math.max(1,rect.width);
    const y=(event.clientY-rect.top)/Math.max(1,rect.height);
    return x>=.42&&x<=.58&&y>=.48&&y<=.78;
  }

  function setCastleDoorHover(event){
    if(state.sceneMode!=='exterior')return;
    const active=isCastleDoorHit(event);
    document.body.classList.toggle('castle-door-hover',active);
    renderer.domElement.style.cursor=active?'pointer':'';
    document.body.dataset.castleDoorHover=active?'true':'false';
  }

  function installEvents() {
    const canvas=renderer.domElement;
    listen(canvas,'dblclick',event=>{
      event.preventDefault();
      if(isCastleDoorHit(event)&&!pick(event))playEntranceVideo();
    });
    if(entranceVideo)listen(entranceVideo,'ended',finishEntranceVideo);
    if(entranceTransition)listen(entranceTransition,'click',finishEntranceVideo);
    listen(canvas,'pointerdown',event=>{
      event.preventDefault();
      if(event.pointerType==='touch'){
        state.touches.set(event.pointerId,{x:event.clientX,y:event.clientY});
        if(state.touches.size===2){
          const [a,b]=[...state.touches.values()];
          state.pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),orbitDistance:orbit.distance,center:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},target:orbit.target.clone()};
        }
      }
      state.dragging=false;
      const picked=pick(event);
      document.body.dataset.pointerDown=String(event.pointerId);
      document.body.dataset.pickedCardId=picked?.userData.cardId||'';
      state.pointerDown={pointerId:event.pointerId,cardId:picked?.userData.cardId||'',x:event.clientX,y:event.clientY,t:performance.now(),mesh:picked,yaw:orbit.yaw,pitch:orbit.pitch,target:orbit.target.clone(),panning:event.button===1||event.button===2||event.shiftKey};
      cancelLongPress();
      if(state.pointerDown.mesh&&
          (event.pointerType==='touch'||event.button===0)&&
          !event.shiftKey&&state.touches.size<2){
        const down=state.pointerDown;
        document.body.dataset.longPressState='timer-started';
        state.longPressTimer=setTimeout(()=>{
          state.longPressTimer=0;
          if(state.pointerDown===down&&!state.dragging){
            down.longPressFired=true;
            down.suppressNavigation=true;
            document.body.dataset.longPressState='detected';
            openCardById(down.cardId);
          }
        },LONG_PRESS_MS);
      }
      canvas.setPointerCapture(event.pointerId);
      resume();
    });
    listen(canvas,'pointermove',event=>{
      setCastleDoorHover(event);
      const down=state.pointerDown;
      if(down?.longPressFired||down?.suppressNavigation){
        event.preventDefault();
        return;
      }
      if(event.pointerType==='touch'&&state.touches.has(event.pointerId)){
        state.touches.set(event.pointerId,{x:event.clientX,y:event.clientY});
        if(state.touches.size===2&&state.pinch){
          const [a,b]=[...state.touches.values()];
          const distance=Math.max(20,Math.hypot(a.x-b.x,a.y-b.y));
          const center={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
          const minDistance=state.sceneMode==='interior'?5:24;
          const maxDistance=state.sceneMode==='interior'?28:90;
          orbit.distance=clamp(state.pinch.orbitDistance*state.pinch.distance/distance,minDistance,maxDistance);
          const scale=orbit.distance*.0018;
          const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
          const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
          orbit.target.copy(state.pinch.target).addScaledVector(right,-(center.x-state.pinch.center.x)*scale).addScaledVector(up,(center.y-state.pinch.center.y)*scale);
          clampTarget();state.dragging=true;state.targetCamera=null;resume();return;
        }
      }
      if(!down)return;
      const dx=event.clientX-down.x,dy=event.clientY-down.y;
      if(Math.hypot(dx,dy)>TAP_SLOP_PX){state.dragging=true;document.body.dataset.longPressState='cancelled-movement';cancelLongPress()}
      if(state.dragging){
        if(down.panning){
          const scale=orbit.distance*.0018;
          const right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0);
          const up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
          orbit.target.copy(down.target).addScaledVector(right,-dx*scale).addScaledVector(up,dy*scale);clampTarget();
        }else{
          orbit.yaw=down.yaw-dx*.008;
          orbit.pitch=clamp(down.pitch+dy*.006,.06,1.18);
        }
        state.targetCamera=null;
        resume();
      }
    });
    listen(canvas,'pointerleave',event=>{
      document.body.classList.remove('castle-door-hover');
      renderer.domElement.style.cursor='';
      document.body.dataset.castleDoorHover='false';
      const down=state.pointerDown;
      if(down&&down.pointerId===event.pointerId&&!down.longPressFired){
        document.body.dataset.longPressState='cancelled-leave';cancelLongPress();
      }
    });
    const release=event=>{
      event.preventDefault();
      if(event.pointerType==='touch'){
        state.touches.delete(event.pointerId);if(state.touches.size<2)state.pinch=null;
      }
      const down=state.pointerDown;const wasDragging=state.dragging;
      cancelLongPress();
      state.pointerDown=null;state.dragging=false;
      if(down?.longPressFired)document.body.dataset.longPressState='released';
      const tappedDoor=state.sceneMode==='exterior'&&event.type==='pointerup'&&down&&!wasDragging&&!down.longPressFired&&!down.mesh&&isCastleDoorHit(event);
      if(tappedDoor){playEntranceVideo();resume();return}
      if(state.sceneMode==='interior'||event.type==='pointercancel'||!down||wasDragging||!down.mesh||down.longPressFired){resume();return}
      const cardId=down.cardId;
      focusCard(cardId,true);emit('cardSelected',{cardId});
    };
    listen(canvas,'pointerup',release);listen(canvas,'pointercancel',release);
    listen(canvas,'wheel',event=>{event.preventDefault();const minDistance=state.sceneMode==='interior'?5:24;const maxDistance=state.sceneMode==='interior'?28:90;orbit.distance=clamp(orbit.distance+event.deltaY*.025,minDistance,maxDistance);state.targetCamera=null;resume()},{passive:false});
    listen(canvas,'contextmenu',event=>event.preventDefault());
    listen(document.getElementById('enter-fullscreen'),'click',enterCastleFullscreen);
    listen(document.getElementById('exit-fullscreen'),'click',exitCastleFullscreen);
    listen(document.getElementById('castle-reset'),'click',resetView);
    listen(document.getElementById('back-to-categories'),'click',requestCategories);
    listen(document,'fullscreenchange',()=>setFullscreenUi(Boolean(document.fullscreenElement)));
    listen(document,'visibilitychange',()=>document.hidden?pause():resume());
    listen(window,'keydown',event=>{
      if(event.key==='Escape'&&document.body.classList.contains('entrance-video-active')){finishEntranceVideo();event.preventDefault();return}
      if(event.key==='Escape'&&state.sceneMode==='interior'){leaveInterior();event.preventDefault();return}
      if(event.key==='Escape'&&state.fullscreenActive){void exitCastleFullscreen();event.preventDefault();return}
      if(['w','a','s','d','W','A','S','D'].includes(event.key)){keys.add(event.key.toLowerCase());resume();event.preventDefault();return}
      if(!['ArrowLeft','ArrowRight','Enter'].includes(event.key))return;
      if(event.key==='Enter'){openFocusedCard();return}
      moveCardFocus(event.key==='ArrowRight'?1:-1);event.preventDefault();
    });
    listen(window,'keyup',event=>keys.delete(event.key.toLowerCase()));
    listen(canvas,'webglcontextlost',event=>{event.preventDefault();emit('rendererError',{reason:'context-lost'})});
    listen(window,'pagehide',dispose,{once:true});
  }

  function updateOrbit() {
    const cp=Math.cos(orbit.pitch);
    camera.position.set(orbit.target.x+Math.sin(orbit.yaw)*cp*orbit.distance,orbit.target.y+Math.sin(orbit.pitch)*orbit.distance,orbit.target.z+Math.cos(orbit.yaw)*cp*orbit.distance);
    camera.lookAt(orbit.target);
  }
  function syncOrbitFromCamera(){
    const delta=camera.position.clone().sub(orbit.target);
    const minDistance=state.sceneMode==='interior'?5:24;
    const maxDistance=state.sceneMode==='interior'?28:90;
    orbit.distance=clamp(delta.length(),minDistance,maxDistance);
    orbit.pitch=clamp(Math.asin(delta.y/orbit.distance),.06,1.18);
    orbit.yaw=Math.atan2(delta.x,delta.z);
  }
  function resetView(){
    if(state.sceneMode==='interior'){leaveInterior();return}
    orbit.yaw=.72;orbit.pitch=.34;orbit.distance=59;orbit.target.set(0,8,0);
    state.targetCamera=null;state.targetLook=null;focusCard('',false);resume();
  }
  function resize(){
    if(!renderer)return;
    const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);
    camera.aspect=width/height;camera.fov=width<700?49:43;
    camera.updateProjectionMatrix();renderer.setSize(width,height,false);
    resume();
  }
  function updateSceneCount(){
    let count=0;scene?.traverse(()=>count++);
    document.body.dataset.sceneObjectCount=String(count);
  }

  function animate(now=performance.now()) {
    state.frame=0;
    if(state.disposed||!state.visible||document.hidden)return;
    const delta=Math.min(.25,Math.max(0,(now-(state.lastFrame||now))/1000));state.lastFrame=now;
    if(state.targetCamera&&state.targetLook){
      const cameraAlpha=1-Math.exp(-5.2*delta),targetAlpha=1-Math.exp(-6.1*delta);
      camera.position.lerp(state.targetCamera,cameraAlpha);orbit.target.lerp(state.targetLook,targetAlpha);camera.lookAt(orbit.target);
      if(camera.position.distanceTo(state.targetCamera)<.08){
        camera.position.copy(state.targetCamera);orbit.target.copy(state.targetLook);syncOrbitFromCamera();
        state.targetCamera=null;state.targetLook=null;document.body.dataset.focusSettled='true';
      }
    }else{
      if(keys.size){
        const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();
        const right=new THREE.Vector3().crossVectors(forward,camera.up).normalize();const move=new THREE.Vector3();
        if(keys.has('w'))move.add(forward);if(keys.has('s'))move.sub(forward);if(keys.has('d'))move.add(right);if(keys.has('a'))move.sub(right);
        if(move.lengthSq())orbit.target.add(move.normalize().multiplyScalar(.14));clampTarget();
      }
      updateOrbit();
    }
    renderer.render(scene,camera);
    if(state.targetCamera||keys.size||state.dragging){
      state.frame=requestAnimationFrame(animate);
    }
  }
  function resume(){if(!state.ready||state.disposed||!state.visible||document.hidden||state.frame)return;state.lastFrame=performance.now();state.frame=requestAnimationFrame(animate)}
  function pause(){if(state.frame)cancelAnimationFrame(state.frame);state.frame=0}

  function dispose() {
    if(state.disposed)return;state.disposed=true;pause();cancelLongPress();abort.abort();
    entranceVideo?.pause();
    resizeObserver?.disconnect();intersectionObserver?.disconnect();clearCards();
    state.textures.forEach(texture=>texture.dispose());state.textures.clear();
    cardGeometry.dispose();
    if(castleRoot){scene?.remove(castleRoot);disposeObject(castleRoot)}
    if(interiorRoot){scene?.remove(interiorRoot);disposeObject(interiorRoot)}
    if(cardGroup)scene?.remove(cardGroup);
    disposeObject(scene);
    renderer?.renderLists.dispose();renderer?.dispose();renderer?.forceContextLoss();renderer?.domElement.remove();
  }

  listen(window,'message',event=>{
    if(event.origin!==location.origin||typeof event.data!=='string')return;
    let data;try{data=JSON.parse(event.data)}catch(_){return}
    if(data.type==='setCards')setCards(data.cards||[],data.focusedCardId,data.shuffleSeed||0,data.animateFocus===true,data.activeCategory||'ALL');
    if(data.type==='focusCard')focusCard(data.cardId||'',data.animate!==false);
    if(data.type==='enterFullscreen')enterCastleFullscreen();
    if(data.type==='exitFullscreen')exitCastleFullscreen();
    if(data.type==='setInAppFullscreen'){
      if(data.active!==true)setFrameFallback(false);setFullscreenUi(data.active===true);
    }
    if(data.type==='dispose')dispose();
  });

  init();
  </script>
</body>
