<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}
    #scene canvas{display:block;width:100%;height:100%;touch-action:none}
    #scene::before,#scene::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none}
    #scene::before{background:linear-gradient(180deg,#06142308 38%,#02060b20 76%,#0005 100%);mix-blend-mode:multiply}
    #scene::after{box-shadow:inset 0 0 min(15vw,170px) #0008,inset 0 -10vh 14vh #0004;background:radial-gradient(ellipse at 47% 40%,transparent 52%,#01040912 79%,#0004 100%)}
    #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:radial-gradient(circle,#122436,#03070c 72%);color:#dce9f3;font:700 13px system-ui;letter-spacing:.12em;pointer-events:none}
    body.ready #loading{display:none}
    #castle-entrance-transition{position:fixed;inset:0;z-index:2147483646;background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s}
    #castle-entrance-transition video{width:100%;height:100%;display:block;object-fit:cover;background:#000}
    body.entrance-video-active #castle-entrance-transition{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s ease}
    .castle-toolbar{position:absolute;z-index:4;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:14px;pointer-events:none}
    .castle-toolbar-group{display:flex;gap:14px;align-items:flex-start;pointer-events:auto}
    .castle-control{position:relative;display:flex;align-items:center;min-width:224px;height:74px;padding:0 20px 0 86px;border:1px solid #b07a2b;border-radius:7px;background:linear-gradient(180deg,rgba(10,17,25,.96),rgba(4,9,14,.96));color:#f4d89d;box-shadow:0 10px 25px #0009,inset 0 0 0 1px rgba(232,184,94,.18);cursor:pointer;font-family:Georgia,'Times New Roman',serif;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;color-scheme:dark}
    .castle-control::before,.castle-control::after{content:"";position:absolute;pointer-events:none}
    .castle-control::before{inset:5px;border:1px solid rgba(224,168,72,.55);clip-path:polygon(6% 0,94% 0,100% 28%,100% 72%,94% 100%,6% 100%,0 72%,0 28%)}
    .castle-control::after{width:8px;height:8px;background:#162332;border:1px solid #a66d27;transform:rotate(45deg);left:50%;bottom:-6px;margin-left:-5px}
    .castle-control:hover,.castle-control:focus-visible{transform:translateY(-2px);border-color:#d8a649;box-shadow:0 14px 30px #000b,0 0 20px rgba(195,128,39,.18),inset 0 0 0 1px rgba(245,199,109,.3);outline:none}
    .control-medallion{position:absolute;left:14px;top:50%;width:58px;height:58px;margin-top:-29px;border-radius:50%;display:grid;place-items:center;border:2px solid #9e6928;background:radial-gradient(circle at 45% 38%,#142233 0,#09121c 58%,#05090e 100%);box-shadow:0 0 0 4px rgba(16,22,29,.9),0 0 0 5px rgba(177,117,42,.45),0 4px 12px #0008;color:#f2c46f;font:700 30px/1 system-ui}
    .control-copy{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
    .control-title{font-size:19px;line-height:1.05;letter-spacing:.02em;color:#f1d39a;text-transform:uppercase}
    .control-subtitle{font:400 12px/1.2 system-ui;color:#d3d7dc;letter-spacing:.01em;text-transform:none}
    #fullscreen-controls{display:none}
    body.fullscreen-castle #fullscreen-controls{display:block}
    body.fullscreen-castle #enter-fullscreen{display:none}
    @media(max-width:980px){
      .castle-toolbar{top:10px;left:10px;right:10px;gap:8px}
      .castle-toolbar-group{gap:8px}
      .castle-control{min-width:0;width:64px;height:64px;padding:0;border-radius:8px;justify-content:center}
      .castle-control::after{display:none}
      .control-medallion{position:static;width:48px;height:48px;margin:0;font-size:25px}
      .control-copy{display:none}
    }
  </style>

<body data-renderer-status="loading">
  <div id="scene"></div>
  <div id="loading">LOADING 3D CASTLE…</div>
  <div id="castle-entrance-transition" aria-hidden="true"><video id="castle-entrance-video" playsinline preload="auto"></video></div>
  <div class="castle-toolbar">
    <div class="castle-toolbar-group">
      <button id="back-to-categories" class="castle-control" type="button" aria-label="Catégories">
        <span class="control-medallion">▱</span>
        <span class="control-copy"><span class="control-title">CATÉGORIES</span><span class="control-subtitle">Explorer les thèmes</span></span>
      </button>
    </div>
    <div id="castle-controls" class="castle-toolbar-group">
      <button id="castle-reset" class="castle-control" type="button" aria-label="Réinitialiser la vue">
        <span class="control-medallion">↻</span>
        <span class="control-copy"><span class="control-title">RÉINITIALISER</span><span class="control-subtitle">Réinitialiser la vue</span></span>
      </button>
      <button id="enter-fullscreen" class="castle-control" type="button" aria-label="Plein écran">
        <span class="control-medallion">⛶</span>
        <span class="control-copy"><span class="control-title">PLEIN ÉCRAN</span><span class="control-subtitle">Voir en plein écran</span></span>
      </button>
      <div id="fullscreen-controls">
        <button id="exit-fullscreen" class="castle-control" type="button" aria-label="Quitter le plein écran">
          <span class="control-medallion">✕</span>
          <span class="control-copy"><span class="control-title">QUITTER</span><span class="control-subtitle">Quitter le plein écran</span></span>
        </button>
      </div>
    </div>
  </div>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from '../vendor/GLTFLoader.js';

  window.THREE = THREE;
  const root = document.getElementById('scene');
  const CASTLE_URL = new URL('../assets/assets/models/search_castle.glb',document.baseURI).href;
  const INTERIOR_URL = new URL('../assets/assets/models/castle_interior.glb',document.baseURI).href;
  const ENTRANCE_VIDEO_URL = new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;
  const entranceTransition=document.getElementById('castle-entrance-transition');
  const entranceVideo=document.getElementById('castle-entrance-video');
  const abort = new AbortController();
  const listen = (target,type,handler,options={}) => target.addEventListener(type,handler,{...options,signal:abort.signal});
  const clamp = THREE.MathUtils.clamp;
  const LONG_PRESS_MS=600;
  const TAP_SLOP_PX=9;
  const state = {
    cards: [], meshes: [], textures: new Map(), focusedCardId: null,
    shuffleSeed: 0, disposed: false, pointerDown: null, dragging: false,
    targetLook: null, targetCamera: null, loadQueue: [], activeLoads: 0,
    touches: new Map(), pinch: null, activeCategory: 'ALL',
    fullscreenActive: false, fallbackElements: null, lastFrame: 0,
    frame: 0, visible: true, ready: false, generation: 0,
    surfaceAnchors: [], longPressTimer: 0, sceneMode:'exterior',
    interiorReady:false, entranceTransitionActive:false,
  };
  const keys = new Set();
  const orbit = { yaw:.72, pitch:.34, distance:59, target:new THREE.Vector3(0,8,0) };
  let scene,camera,renderer,raycaster,pointer,cardGroup,castleRoot,interiorRoot;
  let resizeObserver,intersectionObserver;
  const atmosphere={mist:[],warmLights:[],highQuality:false};
  const cardGeometry = new THREE.BoxGeometry(1.08,1.62,.035);
  const cardForward = new THREE.Vector3(0,0,1);

  function emit(type,payload={}) { parent.postMessage(JSON.stringify({type,...payload}),location.origin); }
  function hasWebGL(){try{const canvas=document.createElement('canvas');return Boolean(window.WebGLRenderingContext&&(canvas.getContext('webgl2')||canvas.getContext('webgl')))}catch(_){return false}}

  async function init() {
    if(!hasWebGL()){document.body.dataset.rendererStatus='failed';emit('rendererError',{reason:'webgl-unavailable'});return}
    scene=new THREE.Scene();scene.background=new THREE.Color(0x02060b);scene.fog=new THREE.FogExp2(0x0a1824,.0108);
    camera=new THREE.PerspectiveCamera(43,1,.1,180);
    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.42;
    atmosphere.highQuality=matchMedia('(min-width: 900px)').matches&&(navigator.hardwareConcurrency||4)>=4&&devicePixelRatio<=2.25;
    renderer.shadowMap.enabled=atmosphere.highQuality;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
    raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();cardGroup=new THREE.Group();scene.add(cardGroup);
    buildEnvironment();buildLights();
    try{await loadCastle()}catch(error){document.body.dataset.rendererStatus='failed';document.body.dataset.modelAsset=CASTLE_URL;document.body.dataset.modelError=String(error?.message||error);emit('rendererError',{reason:'castle-load-failed'});dispose();return}
    void preloadInterior();
    entranceVideo.src=ENTRANCE_VIDEO_URL;entranceVideo.load();
    document.body.dataset.rendererInstanceId=`castle-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    document.body.dataset.atmosphere='scottish-cinematic-night';document.body.dataset.atmosphereQuality=atmosphere.highQuality?'high':'efficient';
    document.body.dataset.modelAsset=CASTLE_URL;document.body.dataset.interiorModelAsset=INTERIOR_URL;document.body.dataset.entranceVideoAsset=ENTRANCE_VIDEO_URL;
    installEvents();resizeObserver=new ResizeObserver(resize);resizeObserver.observe(root);
    intersectionObserver=new IntersectionObserver(([entry])=>{state.visible=entry.isIntersecting;if(state.visible)resume();else pause()});intersectionObserver.observe(document.documentElement);
    resize();updateOrbit();state.ready=true;document.body.classList.add('ready');document.body.dataset.rendererStatus='ready';
    if(state.cards.length)setCards(state.cards,state.focusedCardId,state.shuffleSeed,false,state.activeCategory);
    updateSceneCount();resume();emit('rendererReady');
  }

  function buildEnvironment(){
    const ground=new THREE.Mesh(new THREE.CircleGeometry(67,64),new THREE.MeshStandardMaterial({color:0x0a1112,roughness:.82,metalness:.025}));ground.rotation.x=-Math.PI/2;ground.position.y=-.12;ground.receiveShadow=atmosphere.highQuality;scene.add(ground);
    const sky=new THREE.Mesh(new THREE.SphereGeometry(130,24,16),new THREE.MeshBasicMaterial({color:0x07111c,side:THREE.BackSide}));scene.add(sky);
  }
  function buildLights(){scene.add(new THREE.HemisphereLight(0xb4d0e4,0x22262b,2.45));scene.add(new THREE.AmbientLight(0x7590a5,.62));const moon=new THREE.DirectionalLight(0xcbdff0,9.6);moon.position.set(-26,44,30);scene.add(moon);const warm=new THREE.PointLight(0xffa34d,32,26,2.15);warm.position.set(0,5,18);scene.add(warm);atmosphere.warmLights.push(warm)}

  function prepareModel(rootObject,{interior=false}={}){
    rootObject.traverse(object=>{if(object.isMesh){object.castShadow=atmosphere.highQuality;object.receiveShadow=atmosphere.highQuality;const materials=Array.isArray(object.material)?object.material:[object.material];materials.filter(Boolean).forEach(material=>{if(material.isMeshStandardMaterial||material.isMeshPhysicalMaterial){material.roughness=clamp(material.roughness??.82,.58,.95);material.metalness=clamp(material.metalness??0,0,.12);material.envMapIntensity=interior?.38:.55;material.needsUpdate=true}})}})
  }
  function normalizeModel(rootObject,targetSpan){const bounds=new THREE.Box3().setFromObject(rootObject);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());const scale=targetSpan/Math.max(size.x,size.z,.001);rootObject.scale.setScalar(scale);rootObject.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);return {bounds,size,scale}}
  function loadCastle(){return new Promise((resolve,reject)=>{new GLTFLoader().load(CASTLE_URL,gltf=>{if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}castleRoot=gltf.scene;prepareModel(castleRoot);normalizeModel(castleRoot,42);scene.add(castleRoot);castleRoot.updateMatrixWorld(true);state.surfaceAnchors=deriveSurfaceAnchors(84);document.body.dataset.castleAnimations=String(gltf.animations.length);document.body.dataset.surfaceAnchorCount=String(state.surfaceAnchors.length);if(state.surfaceAnchors.length<84){reject(new Error(`Only ${state.surfaceAnchors.length} castle surface anchors were found.`));return}resolve()},undefined,reject)})}
  function preloadInterior(){return new Promise((resolve,reject)=>{new GLTFLoader().load(INTERIOR_URL,gltf=>{if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}interiorRoot=gltf.scene;prepareModel(interiorRoot,{interior:true});normalizeModel(interiorRoot,34);interiorRoot.visible=false;scene.add(interiorRoot);state.interiorReady=true;document.body.dataset.interiorReady='true';document.body.dataset.interiorAnimations=String(gltf.animations.length);resolve()},undefined,error=>{document.body.dataset.interiorReady='false';document.body.dataset.interiorError=String(error?.message||error);reject(error)})})}
  function disposeObject(rootObject){rootObject?.traverse(object=>{object.geometry?.dispose?.();const items=Array.isArray(object.material)?object.material:[object.material];items.filter(Boolean).forEach(material=>{Object.values(material).forEach(value=>value?.isTexture&&value.dispose());material.dispose?.()})})}
  function deriveSurfaceAnchors(limit){const out=[];const box=new THREE.Box3().setFromObject(castleRoot);const center=box.getCenter(new THREE.Vector3());for(let i=0;i<limit;i++){const angle=(i/limit)*Math.PI*2;const radius=15+(i%4)*1.2;out.push({position:new THREE.Vector3(center.x+Math.sin(angle)*radius,2+(i%7)*2.2,center.z+Math.cos(angle)*radius),normal:new THREE.Vector3(Math.sin(angle),0,Math.cos(angle)).normalize()})}return out}
  function seeded(cards,seed){const copy=cards.slice();let value=seed||1;for(let i=copy.length-1;i>0;i--){value=(value*1664525+1013904223)>>>0;const j=value%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
  function clearCards(){state.generation++;state.meshes.forEach(mesh=>{[...new Set(mesh.material)].forEach(material=>material.dispose());cardGroup.remove(mesh)});state.meshes=[];state.loadQueue=[];state.activeLoads=0}
  function setCards(cards,focusedCardId,shuffleSeed,animateFocus=false,activeCategory='ALL'){state.cards=cards;state.focusedCardId=focusedCardId;state.shuffleSeed=shuffleSeed;state.activeCategory=activeCategory;if(!state.ready||!state.surfaceAnchors.length)return;clearCards();seeded(cards,shuffleSeed).slice(0,state.surfaceAnchors.length).forEach((card,index)=>addCard(card,state.surfaceAnchors[index]));if(focusedCardId)focusCard(focusedCardId,animateFocus);resume()}
  function addCard(card,anchor){const edge=new THREE.MeshStandardMaterial({color:0x7d8c96,roughness:.48,metalness:.24});const face=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.64});const back=new THREE.MeshStandardMaterial({color:0x241712,roughness:.7});const mesh=new THREE.Mesh(cardGeometry,[edge,edge,edge,edge,face,back]);mesh.position.copy(anchor.position);mesh.quaternion.setFromUnitVectors(cardForward,anchor.normal);mesh.userData.card=card;mesh.userData.cardId=card.id;mesh.userData.anchorPosition=anchor.position.clone();mesh.userData.anchorNormal=anchor.normal.clone();cardGroup.add(mesh);state.meshes.push(mesh);const url=card.rectoUrl||card.thumbnailUrl;if(url)new THREE.TextureLoader().load(url,texture=>{texture.colorSpace=THREE.SRGBColorSpace;mesh.material[4].map=texture;mesh.material[4].needsUpdate=true})}
  function focusCard(cardId,animate=true){state.focusedCardId=cardId;let selected=null;state.meshes.forEach(mesh=>{const active=mesh.userData.card.id===cardId;mesh.scale.setScalar(active?1.06:1);mesh.position.copy(mesh.userData.anchorPosition).addScaledVector(mesh.userData.anchorNormal,active?.11:0);if(active)selected=mesh});if(!selected)return;const look=selected.position.clone();const cameraTarget=look.clone().addScaledVector(selected.userData.anchorNormal,10).add(new THREE.Vector3(0,2.2,0));if(animate){state.targetLook=look;state.targetCamera=cameraTarget}else{orbit.target.copy(look);camera.position.copy(cameraTarget);syncOrbitFromCamera()}resume()}
  function pick(event){const rect=renderer.domElement.getBoundingClientRect();pointer.x=((event.clientX-rect.left)/rect.width)*2-1;pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);return raycaster.intersectObjects(state.meshes,false)[0]?.object}
  function setFullscreenUi(active){state.fullscreenActive=active;document.body.classList.toggle('fullscreen-castle',active);emit('fullscreenChanged',{active});setTimeout(resize,0)}
  async function enterCastleFullscreen(){if(state.fullscreenActive)return;try{await document.documentElement.requestFullscreen();setFullscreenUi(true)}catch(_){setFullscreenUi(true);emit('fullscreenFallbackRequested')}}
  async function exitCastleFullscreen(){if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{});setFullscreenUi(false)}
  async function requestCategories(){await exitCastleFullscreen();emit('categoriesRequested')}
  function openCardById(cardId){if(!cardId)return;emit('cardLongPressed',{cardId});void exitCastleFullscreen()}
  function openFocusedCard(){openCardById(state.focusedCardId)}
  function cancelLongPress(){if(state.longPressTimer)clearTimeout(state.longPressTimer);state.longPressTimer=0}
  function clampTarget(){const limit=state.sceneMode==='interior'?12:28;orbit.target.x=clamp(orbit.target.x,-limit,limit);orbit.target.y=clamp(orbit.target.y,0,state.sceneMode==='interior'?14:24);orbit.target.z=clamp(orbit.target.z,-limit,limit)}

  function switchToInterior(){
    if(!state.interiorReady||!interiorRoot)return false;
    state.sceneMode='interior';castleRoot.visible=false;cardGroup.visible=false;interiorRoot.visible=true;
    scene.background.set(0x060504);scene.fog=new THREE.FogExp2(0x100b07,.018);
    orbit.yaw=0;orbit.pitch=.18;orbit.distance=14;orbit.target.set(0,3.2,0);state.targetCamera=null;state.targetLook=null;updateOrbit();
    document.body.dataset.sceneMode='interior';resume();return true;
  }
  function switchToExterior(){state.sceneMode='exterior';if(castleRoot)castleRoot.visible=true;if(interiorRoot)interiorRoot.visible=false;cardGroup.visible=true;scene.background.set(0x02060b);scene.fog=new THREE.FogExp2(0x0a1824,.0108);resetView();document.body.dataset.sceneMode='exterior';resume()}
  async function beginEntranceTransition(){
    if(state.entranceTransitionActive||state.sceneMode!=='exterior')return;
    state.entranceTransitionActive=true;document.body.dataset.entranceState='starting';
    try{if(!state.interiorReady)await preloadInterior()}catch(_){state.entranceTransitionActive=false;document.body.dataset.entranceState='interior-load-failed';return}
    document.body.classList.add('entrance-video-active');entranceTransition?.setAttribute('aria-hidden','false');entranceVideo.currentTime=0;document.body.dataset.entranceState='video';
    try{await entranceVideo.play()}catch(_){finishEntranceTransition()}
  }
  function finishEntranceTransition(){
    if(!state.entranceTransitionActive)return;
    entranceVideo?.pause();switchToInterior();document.body.classList.remove('entrance-video-active');entranceTransition?.setAttribute('aria-hidden','true');state.entranceTransitionActive=false;document.body.dataset.entranceState='interior';
  }

  function installEvents(){
    const canvas=renderer.domElement;
    if(entranceVideo)listen(entranceVideo,'ended',finishEntranceTransition);
    listen(canvas,'dblclick',event=>{event.preventDefault();if(state.sceneMode==='exterior'&&!pick(event))void beginEntranceTransition()});
    listen(canvas,'pointerdown',event=>{event.preventDefault();state.dragging=false;const picked=state.sceneMode==='exterior'?pick(event):null;state.pointerDown={pointerId:event.pointerId,cardId:picked?.userData.cardId||'',x:event.clientX,y:event.clientY,mesh:picked,yaw:orbit.yaw,pitch:orbit.pitch,target:orbit.target.clone(),panning:event.button===1||event.button===2||event.shiftKey};if(picked){const down=state.pointerDown;state.longPressTimer=setTimeout(()=>{if(state.pointerDown===down&&!state.dragging){down.longPressFired=true;openCardById(down.cardId)}},LONG_PRESS_MS)}canvas.setPointerCapture(event.pointerId);resume()});
    listen(canvas,'pointermove',event=>{const down=state.pointerDown;if(!down)return;const dx=event.clientX-down.x,dy=event.clientY-down.y;if(Math.hypot(dx,dy)>TAP_SLOP_PX){state.dragging=true;cancelLongPress()}if(state.dragging){orbit.yaw=down.yaw-dx*.008;orbit.pitch=clamp(down.pitch+dy*.006,.04,1.18);state.targetCamera=null;resume()}});
    const release=event=>{event.preventDefault();const down=state.pointerDown;const wasDragging=state.dragging;cancelLongPress();state.pointerDown=null;state.dragging=false;if(!down||wasDragging||down.longPressFired)return;if(down.mesh){focusCard(down.cardId,true);emit('cardSelected',{cardId:down.cardId});return}if(state.sceneMode==='exterior')void beginEntranceTransition()};
    listen(canvas,'pointerup',release);listen(canvas,'pointercancel',release);
    listen(canvas,'wheel',event=>{event.preventDefault();orbit.distance=clamp(orbit.distance+event.deltaY*.025,state.sceneMode==='interior'?5:24,state.sceneMode==='interior'?24:90);state.targetCamera=null;resume()},{passive:false});
    listen(document.getElementById('enter-fullscreen'),'click',enterCastleFullscreen);listen(document.getElementById('exit-fullscreen'),'click',exitCastleFullscreen);listen(document.getElementById('castle-reset'),'click',()=>state.sceneMode==='interior'?switchToExterior():resetView());listen(document.getElementById('back-to-categories'),'click',requestCategories);
    listen(document,'fullscreenchange',()=>setFullscreenUi(Boolean(document.fullscreenElement)));listen(document,'visibilitychange',()=>document.hidden?pause():resume());
    listen(window,'keydown',event=>{if(event.key==='Escape'&&state.entranceTransitionActive){finishEntranceTransition();event.preventDefault();return}if(event.key==='Escape'&&state.sceneMode==='interior'){switchToExterior();event.preventDefault();return}if(['w','a','s','d','W','A','S','D'].includes(event.key)){keys.add(event.key.toLowerCase());resume();event.preventDefault();return}if(event.key==='Enter'&&state.sceneMode==='exterior')openFocusedCard()});listen(window,'keyup',event=>keys.delete(event.key.toLowerCase()));listen(window,'pagehide',dispose,{once:true});
  }

  function updateOrbit(){const cp=Math.cos(orbit.pitch);camera.position.set(orbit.target.x+Math.sin(orbit.yaw)*cp*orbit.distance,orbit.target.y+Math.sin(orbit.pitch)*orbit.distance,orbit.target.z+Math.cos(orbit.yaw)*cp*orbit.distance);camera.lookAt(orbit.target)}
  function syncOrbitFromCamera(){const delta=camera.position.clone().sub(orbit.target);orbit.distance=clamp(delta.length(),state.sceneMode==='interior'?5:24,state.sceneMode==='interior'?24:90);orbit.pitch=clamp(Math.asin(delta.y/orbit.distance),.04,1.18);orbit.yaw=Math.atan2(delta.x,delta.z)}
  function resetView(){orbit.yaw=.72;orbit.pitch=.34;orbit.distance=59;orbit.target.set(0,8,0);state.targetCamera=null;state.targetLook=null;focusCard('',false);resume()}
  function resize(){if(!renderer)return;const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);camera.aspect=width/height;camera.fov=width<700?49:43;camera.updateProjectionMatrix();renderer.setSize(width,height,false);resume()}
  function updateSceneCount(){let count=0;scene?.traverse(()=>count++);document.body.dataset.sceneObjectCount=String(count)}
  function animate(now=performance.now()){state.frame=0;if(state.disposed||!state.visible||document.hidden)return;const delta=Math.min(.25,Math.max(0,(now-(state.lastFrame||now))/1000));state.lastFrame=now;if(state.targetCamera&&state.targetLook){camera.position.lerp(state.targetCamera,1-Math.exp(-5.2*delta));orbit.target.lerp(state.targetLook,1-Math.exp(-6.1*delta));camera.lookAt(orbit.target);if(camera.position.distanceTo(state.targetCamera)<.08){camera.position.copy(state.targetCamera);orbit.target.copy(state.targetLook);syncOrbitFromCamera();state.targetCamera=null;state.targetLook=null}}else{if(keys.size){const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();const right=new THREE.Vector3().crossVectors(forward,camera.up).normalize();const move=new THREE.Vector3();if(keys.has('w'))move.add(forward);if(keys.has('s'))move.sub(forward);if(keys.has('d'))move.add(right);if(keys.has('a'))move.sub(right);if(move.lengthSq())orbit.target.add(move.normalize().multiplyScalar(state.sceneMode==='interior'?.08:.14));clampTarget()}updateOrbit()}renderer.render(scene,camera);if(state.targetCamera||keys.size||state.dragging)state.frame=requestAnimationFrame(animate)}
  function resume(){if(!state.ready||state.disposed||!state.visible||document.hidden||state.frame)return;state.lastFrame=performance.now();state.frame=requestAnimationFrame(animate)}
  function pause(){if(state.frame)cancelAnimationFrame(state.frame);state.frame=0}
  function dispose(){if(state.disposed)return;state.disposed=true;pause();cancelLongPress();abort.abort();entranceVideo?.pause();resizeObserver?.disconnect();intersectionObserver?.disconnect();clearCards();cardGeometry.dispose();if(castleRoot){scene?.remove(castleRoot);disposeObject(castleRoot)}if(interiorRoot){scene?.remove(interiorRoot);disposeObject(interiorRoot)}disposeObject(scene);renderer?.renderLists.dispose();renderer?.dispose();renderer?.forceContextLoss();renderer?.domElement.remove()}
  listen(window,'message',event=>{if(event.origin!==location.origin||typeof event.data!=='string')return;let data;try{data=JSON.parse(event.data)}catch(_){return}if(data.type==='setCards')setCards(data.cards||[],data.focusedCardId,data.shuffleSeed||0,data.animateFocus===true,data.activeCategory||'ALL');if(data.type==='focusCard')focusCard(data.cardId||'',data.animate!==false);if(data.type==='enterFullscreen')enterCastleFullscreen();if(data.type==='exitFullscreen')exitCastleFullscreen();if(data.type==='dispose')dispose()});
  init();
