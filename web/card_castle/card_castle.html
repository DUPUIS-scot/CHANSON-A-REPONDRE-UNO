<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
    #hint{position:absolute;left:12px;bottom:10px;padding:7px 10px;border:1px solid #8d6e12;border-radius:8px;background:#090806cc;color:#ffc928;font:600 12px system-ui;pointer-events:none}
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="hint">Château 3D • glisser pour tourner • molette pour zoomer • appui long : plein écran</div>
  <script src="../vendor/three.min.js"></script>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('scene');
    const state = {
      cards: [], meshes: [], textures: new Map(), focusedCardId: null,
      shuffleSeed: 0, disposed: false, pointerDown: null, dragging: false,
      targetLook: null, targetCamera: null, loadQueue: [], activeLoads: 0
    };
    let scene, camera, renderer, raycaster, pointer, cardGroup;
    const orbit = {yaw:0,pitch:.35,distance:45,target:new THREE.Vector3(0,10,0)};

    function emit(type,payload={}) {
      parent.postMessage(JSON.stringify({type,...payload}), location.origin);
    }

    function init() {
      if (!window.THREE || !hasWebGL()) {
        emit('rendererError',{reason:'webgl-unavailable'});
        return;
      }
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05070a);
      scene.fog = new THREE.Fog(0x05070a,38,105);
      camera = new THREE.PerspectiveCamera(48,1,.1,240);
      renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1,1.6));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      root.appendChild(renderer.domElement);
      raycaster = new THREE.Raycaster();
      pointer = new THREE.Vector2();
      cardGroup = new THREE.Group();
      scene.add(cardGroup);
      buildLights();
      buildCastle();
      installEvents();
      resize();
      updateOrbit();
      animate();
      document.body.dataset.rendererStatus='ready';
      emit('rendererReady');
    }

    function hasWebGL() {
      try {
        const canvas=document.createElement('canvas');
        return !!(window.WebGLRenderingContext &&
          (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch (_) { return false; }
    }

    function material(color,roughness=.9) {
      return new THREE.MeshStandardMaterial({color,roughness,metalness:.04});
    }

    function cube(x,y,z,sx,sy,sz,color=0x4d4a43) {
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material(color));
      mesh.position.set(x,y,z);
      scene.add(mesh);
      return mesh;
    }

    function buildLights() {
      scene.add(new THREE.HemisphereLight(0xa9c4d8,0x26170d,1.3));
      const moon=new THREE.DirectionalLight(0xffdda0,2.2);
      moon.position.set(-18,38,26);
      scene.add(moon);
      [[-14,8,15],[14,10,10],[0,14,-10],[-22,7,-5],[22,7,-5]].forEach(p=>{
        const lamp=new THREE.PointLight(0xffa928,20,25,2);
        lamp.position.set(...p);
        scene.add(lamp);
      });
    }

    function buildCastle() {
      const rock=new THREE.Mesh(new THREE.CylinderGeometry(28,38,15,9),material(0x20211f));
      rock.position.y=-3; rock.rotation.y=.22; scene.add(rock);
      const grass=new THREE.Mesh(new THREE.CylinderGeometry(26,28,.8,9),material(0x28321c));
      grass.position.y=4.9; grass.rotation.y=.22; scene.add(grass);
      cube(0,7,15,42,5,2); cube(0,9,-16,36,7,2);
      cube(-22,8,0,2,6,32); cube(22,8,0,2,6,32);
      cube(0,10,17,8,9,5,0x5d5950);
      cube(0,5.4,2,32,.8,22,0x34312b);
      cube(-6,12,-4,23,3,16,0x565249);
      cube(5,16,-9,19,3,13,0x514d45);
      cube(5,20,-13,13,9,7,0x656056);
      cube(-8,22,-11,11,13,10,0x5c574e);
      [[-21,16,11],[21,16,11],[-21,-15,13],[21,-15,13],[-10,-20,16],[14,-20,16]]
        .forEach(([x,z,h])=>{
          const tower=new THREE.Mesh(new THREE.CylinderGeometry(2.8,3.2,h,18),material(0x57534c));
          tower.position.set(x,5+h/2,z); scene.add(tower);
          const roof=new THREE.Mesh(new THREE.ConeGeometry(3.4,4.5,18),material(0x1d242b));
          roof.position.set(x,7+h,z); scene.add(roof);
        });
      for(let x=-18;x<=18;x+=4) {
        cube(x,12.2,16.2,1.5,2,1.3,0x625d53);
        cube(x,13.8,-16.2,1.4,2,1.3,0x625d53);
      }
    }

    function anchors() {
      const out=[];
      const zones=[
        [0,12,18,9,2,1.9],[0,11,14,15,1.8,2.2],
        [-15,10,7,10,1.7,1.5],[15,10,7,10,1.7,1.5],
        [-6,15,-3,12,1.8,1.8],[5,20,-9,13,1.8,1.8],
        [-8,27,-11,8,2,2],[21,14,-4,9,1.6,2.2],[-21,14,-4,9,1.6,2.2]
      ];
      zones.forEach(([cx,cy,cz,count,dx,dz])=>{
        for(let i=0;i<count;i++){
          const row=Math.floor(i/5),col=i%5;
          out.push({position:[cx+(col-2)*dx,cy+row*2.2,cz-row*dz]});
        }
      });
      return out;
    }

    function seeded(cards,seed) {
      const copy=cards.slice(); let value=seed || 1;
      for(let i=copy.length-1;i>0;i--){
        value=(value*1664525+1013904223)>>>0;
        const j=value%(i+1);
        [copy[i],copy[j]]=[copy[j],copy[i]];
      }
      return copy;
    }

    function clearCards() {
      state.meshes.forEach(mesh=>{
        mesh.geometry.dispose();
        mesh.material.forEach(item=>item.dispose());
      });
      state.meshes=[]; cardGroup.clear(); state.loadQueue=[];
    }

    function setCards(cards,focusedCardId,shuffleSeed) {
      state.cards=cards; state.focusedCardId=focusedCardId; state.shuffleSeed=shuffleSeed;
      document.body.dataset.cardCount=String(cards.length);
      document.body.dataset.textureCount='0';
      clearCards();
      const points=anchors();
      seeded(cards,shuffleSeed).slice(0,points.length).forEach((card,index)=>addCard(card,points[index]));
      if(focusedCardId) focusCard(focusedCardId,false);
      pumpTextures();
    }

    function addCard(card,anchor) {
      const h=3.2,w=Math.max(.9,Math.min(2.5,h*(card.aspectRatio || .66)));
      const edge=material(0xf2ead7),face=material(0x301c12);
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,.08),[edge,edge,edge,edge,face,edge]);
      mesh.position.fromArray(anchor.position);
      mesh.userData.card=card;
      cardGroup.add(mesh); state.meshes.push(mesh);
      state.loadQueue.push({mesh,card});
    }

    function pumpTextures() {
      while(state.activeLoads<4 && state.loadQueue.length){
        const item=state.loadQueue.shift();
        if(state.textures.has(item.card.thumbnailUrl)){
          applyTexture(item.mesh,state.textures.get(item.card.thumbnailUrl));
          continue;
        }
        state.activeLoads++;
        new THREE.TextureLoader().load(item.card.thumbnailUrl,texture=>{
          texture.colorSpace=THREE.SRGBColorSpace;
          texture.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
          state.textures.set(item.card.thumbnailUrl,texture);
          applyTexture(item.mesh,texture);
          state.activeLoads--; pumpTextures();
        },undefined,()=>{
          state.activeLoads--; pumpTextures();
        });
      }
    }

    function applyTexture(mesh,texture) {
      if(!state.meshes.includes(mesh)) return;
      mesh.material[4].map=texture;
      mesh.material[4].color.set(0xffffff);
      mesh.material[4].needsUpdate=true;
      const loaded=state.meshes.filter(item=>item.material[4].map).length;
      document.body.dataset.textureCount=String(loaded);
    }

    function focusCard(cardId,animate=true) {
      state.focusedCardId=cardId;
      let selected=null;
      state.meshes.forEach(mesh=>{
        const active=mesh.userData.card.id===cardId;
        mesh.scale.setScalar(active?1.15:1);
        [0,1,2,3,5].forEach(i=>mesh.material[i].color.set(active?0xffc928:0xf2ead7));
        if(active) selected=mesh;
      });
      if(!selected) return;
      const look=selected.position.clone();
      const cameraTarget=look.clone().add(new THREE.Vector3(0,3.5,8));
      if(animate){state.targetLook=look;state.targetCamera=cameraTarget}
      else{
        orbit.target.copy(look);
        camera.position.copy(cameraTarget);
        syncOrbitFromCamera();
      }
    }

    function pick(event) {
      const rect=renderer.domElement.getBoundingClientRect();
      pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
      pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(pointer,camera);
      return raycaster.intersectObjects(state.meshes,false)[0]?.object;
    }

    function installEvents() {
      addEventListener('resize',resize);
      const canvas=renderer.domElement;
      canvas.addEventListener('pointerdown',event=>{
        state.dragging=false;
        state.pointerDown={x:event.clientX,y:event.clientY,t:performance.now(),mesh:pick(event),yaw:orbit.yaw,pitch:orbit.pitch};
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove',event=>{
        const down=state.pointerDown;if(!down)return;
        const dx=event.clientX-down.x,dy=event.clientY-down.y;
        if(Math.hypot(dx,dy)>7)state.dragging=true;
        if(state.dragging){
          orbit.yaw=down.yaw-dx*.008;
          orbit.pitch=Math.max(-.05,Math.min(1.15,down.pitch+dy*.006));
          state.targetCamera=null;
        }
      });
      canvas.addEventListener('pointerup',event=>{
        const down=state.pointerDown;state.pointerDown=null;
        if(!down || state.dragging || !down.mesh)return;
        const card=down.mesh.userData.card;
        if(performance.now()-down.t>520)emit('cardLongPressed',{cardId:card.id});
        else{focusCard(card.id,true);emit('cardSelected',{cardId:card.id})}
      });
      canvas.addEventListener('wheel',event=>{
        event.preventDefault();
        orbit.distance=Math.max(14,Math.min(80,orbit.distance+event.deltaY*.025));
        state.targetCamera=null;
      },{passive:false});
      addEventListener('keydown',event=>{
        if(!['ArrowLeft','ArrowRight','a','d','A','D','Enter'].includes(event.key))return;
        const ids=state.meshes.map(mesh=>mesh.userData.card.id);
        if(!ids.length)return;
        let index=Math.max(0,ids.indexOf(state.focusedCardId));
        if(event.key==='Enter'){emit('cardLongPressed',{cardId:ids[index]});return}
        index+=['ArrowRight','d','D'].includes(event.key)?1:-1;
        index=Math.max(0,Math.min(ids.length-1,index));
        focusCard(ids[index],true);emit('cardSelected',{cardId:ids[index]});
      });
      canvas.addEventListener('webglcontextlost',event=>{
        event.preventDefault();emit('rendererError',{reason:'context-lost'});
      });
    }

    function updateOrbit() {
      const cp=Math.cos(orbit.pitch);
      camera.position.set(
        orbit.target.x+Math.sin(orbit.yaw)*cp*orbit.distance,
        orbit.target.y+Math.sin(orbit.pitch)*orbit.distance,
        orbit.target.z+Math.cos(orbit.yaw)*cp*orbit.distance
      );
      camera.lookAt(orbit.target);
    }

    function syncOrbitFromCamera() {
      const delta=camera.position.clone().sub(orbit.target);
      orbit.distance=Math.max(14,Math.min(80,delta.length()));
      orbit.pitch=Math.asin(delta.y/orbit.distance);
      orbit.yaw=Math.atan2(delta.x,delta.z);
    }

    function resize() {
      if(!renderer)return;
      const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);
      camera.aspect=width/height;camera.updateProjectionMatrix();renderer.setSize(width,height);
    }

    function animate() {
      if(state.disposed)return;
      requestAnimationFrame(animate);
      if(state.targetCamera&&state.targetLook){
        camera.position.lerp(state.targetCamera,.055);
        orbit.target.lerp(state.targetLook,.065);
        camera.lookAt(orbit.target);
        if(camera.position.distanceTo(state.targetCamera)<.08){
          camera.position.copy(state.targetCamera);
          orbit.target.copy(state.targetLook);
          syncOrbitFromCamera();
          state.targetCamera=null;
          state.targetLook=null;
        }
      } else updateOrbit();
      state.meshes.forEach(mesh=>{
        const target=camera.position.clone();target.y=mesh.position.y;mesh.lookAt(target);
      });
      renderer.render(scene,camera);
    }

    function dispose() {
      state.disposed=true;clearCards();
      state.textures.forEach(texture=>texture.dispose());
      renderer?.dispose();
    }

    addEventListener('message',event=>{
      if(event.origin!==location.origin || typeof event.data!=='string')return;
      let data;try{data=JSON.parse(event.data)}catch(_){return}
      if(data.type==='setCards')setCards(data.cards||[],data.focusedCardId,data.shuffleSeed||0);
      if(data.type==='dispose')dispose();
    });
    init();
  })();
  </script>
</body>
</html>
