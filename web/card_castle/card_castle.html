  <style>

    #scene::after{box-shadow:inset 0 0 min(15vw,170px) #0008,inset 0 -10vh 14vh #0004;background:radial-gradient(ellipse at 47% 40%,transparent 52%,#01040912 79%,#0004 100%)}
    #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:radial-gradient(circle,#122436,#03070c 72%);color:#dce9f3;font:700 13px system-ui;letter-spacing:.12em;pointer-events:none}

    #castle-entrance-transition{position:fixed;inset:0;z-index:2147483646;background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s}

    @media (orientation:portrait){#castle-entrance-transition video{object-fit:contain;max-width:100vw;max-height:100vh}}

    .castle-toolbar{position:absolute;z-index:4;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:14px;pointer-events:none}

    .castle-control{position:relative;display:flex;align-items:center;min-width:224px;height:74px;padding:0 20px 0 86px;border:1px solid #b07a2b;border-radius:7px;background:linear-gradient(180deg,rgba(10,17,25,.96),rgba(4,9,14,.96));color:#f4d89d;box-shadow:0 10px 25px #0009,inset 0 0 0 1px rgba(232,184,94,.18);cursor:pointer;font-family:Georgia,'Times New Roman',serif;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;color-scheme:dark}
    .castle-control::before,.castle-control::after{content:"";position:absolute;pointer-events:none}

      .control-copy{display:none}
    }

  <script type="module">
  import * as THREE from 'three';

  import { CastleJesterGatekeeper } from './castle_jester_gatekeeper.js';

  window.THREE = THREE;
  const root = document.getElementById('scene');
  const CASTLE_URL = new URL('../assets/assets/models/search_castle.glb',document.baseURI).href;
  const INTERIOR_URL = new URL('../assets/assets/models/castle_interior.glb',document.baseURI).href;
  const CASTLE_JESTER_URL = new URL('../assets/assets/models/play_jester_rigged.glb',document.baseURI).href;

  const entranceTransition=document.getElementById('castle-entrance-transition');

  const abort = new AbortController();

  const state = {cards:[],meshes:[],textures:new Map(),focusedCardId:null,shuffleSeed:0,disposed:false,pointerDown:null,dragging:false,targetLook:null,targetCamera:null,loadQueue:[],activeLoads:0,touches:new Map(),pinch:null,activeCategory:'ALL',fullscreenActive:false,fallbackElements:null,lastFrame:0,frame:0,visible:true,ready:false,generation:0,surfaceAnchors:[],longPressTimer:0,sceneMode:'exterior',interiorReady:false,interiorLoadPromise:null};
  const keys = new Set();
  const orbit = {yaw:.72,pitch:.34,distance:59,target:new THREE.Vector3(0,8,0)};
  let scene,camera,renderer,raycaster,pointer,cardGroup,castleRoot,interiorRoot,gatekeeper;
  let resizeObserver,intersectionObserver;
  const atmosphere={mist:[],warmLights:[],highQuality:false};
  const cardGeometry = new THREE.BoxGeometry(1.08,1.62,.035);
  const cardForward = new THREE.Vector3(0,0,1);

  function emit(type,payload={}) { parent.postMessage(JSON.stringify({type,...payload}),location.origin); }
  function hasWebGL(){try{const canvas=document.createElement('canvas');return Boolean(window.WebGLRenderingContext&&(canvas.getContext('webgl2')||canvas.getContext('webgl')))}catch(_){return false}}

    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.42;

    document.body.dataset.rendererInstanceId=`castle-${Date.now()}-${Math.random().toString(16).slice(2)}`;document.body.dataset.atmosphere='scottish-cinematic-night';document.body.dataset.atmosphereQuality=atmosphere.highQuality?'high':'efficient';document.body.dataset.modelAsset=CASTLE_URL;document.body.dataset.interiorModelAsset=INTERIOR_URL;document.body.dataset.castleJesterAsset=CASTLE_JESTER_URL;document.body.dataset.entranceVideoAsset=ENTRANCE_VIDEO_URL;document.body.dataset.sceneMode='exterior';
    installEvents();resizeObserver=new ResizeObserver(resize);resizeObserver.observe(root);intersectionObserver=new IntersectionObserver(([entry])=>{state.visible=entry.isIntersecting;if(state.visible)resume();else pause()});intersectionObserver.observe(document.documentElement);resize();updateOrbit();state.ready=true;document.body.classList.add('ready');document.body.dataset.rendererStatus='ready';if(state.cards.length)setCards(state.cards,state.focusedCardId,state.shuffleSeed,false,state.activeCategory);updateSceneCount();resume();emit('rendererReady');

    const sky=new THREE.Mesh(new THREE.SphereGeometry(130,24,16),new THREE.ShaderMaterial({side:THREE.BackSide,uniforms:{top:{value:new THREE.Color(0x102a42)},middle:{value:new THREE.Color(0x091827)},bottom:{value:new THREE.Color(0x010409)}},vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'varying float h;uniform vec3 top;uniform vec3 middle;uniform vec3 bottom;void main(){vec3 low=mix(bottom,middle,smoothstep(-.42,.18,h));vec3 colour=mix(low,top,smoothstep(.08,.92,h));gl_FragColor=vec4(colour,1.0);}'}));scene.add(sky);

  function buildLights(){scene.add(new THREE.HemisphereLight(0xb4d0e4,0x22262b,2.45));scene.add(new THREE.AmbientLight(0x7590a5,.62));const moon=new THREE.DirectionalLight(0xcbdff0,9.6);moon.position.set(-26,44,30);moon.target.position.set(0,7,0);scene.add(moon.target,moon);const rim=new THREE.DirectionalLight(0x789fc1,1.45);rim.position.set(30,22,-26);scene.add(rim)}

  function loadCastle(){return new Promise((resolve,reject)=>{new GLTFLoader().load(CASTLE_URL,gltf=>{if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}castleRoot=gltf.scene;castleRoot.traverse(object=>{if(object.isMesh){object.castShadow=atmosphere.highQuality;object.receiveShadow=atmosphere.highQuality}});const bounds=new THREE.Box3().setFromObject(castleRoot);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());const scale=42/Math.max(size.x,size.z,.001);castleRoot.scale.setScalar(scale);castleRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);scene.add(castleRoot);castleRoot.updateMatrixWorld(true);state.surfaceAnchors=deriveSurfaceAnchors(84);if(state.surfaceAnchors.length<84){reject(new Error(`Only ${state.surfaceAnchors.length} castle surface anchors were found.`));return}resolve()},undefined,reject)})}
  function loadInterior(){return new Promise((resolve,reject)=>{new GLTFLoader().load(INTERIOR_URL,gltf=>{if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}interiorRoot=gltf.scene;interiorRoot.visible=false;const bounds=new THREE.Box3().setFromObject(interiorRoot);const size=bounds.getSize(new THREE.Vector3());const center=bounds.getCenter(new THREE.Vector3());const scale=34/Math.max(size.x,size.z,.001);interiorRoot.scale.setScalar(scale);interiorRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);scene.add(interiorRoot);state.interiorReady=true;document.body.dataset.interiorReady='true';resolve(interiorRoot)},undefined,reject)})}
  function disposeObject(rootObject){rootObject?.traverse(object=>{object.geometry?.dispose?.();const items=Array.isArray(object.material)?object.material:[object.material];items.filter(Boolean).forEach(material=>{Object.values(material).forEach(value=>value?.isTexture&&value.dispose());material.dispose?.()})})}

  function deriveSurfaceAnchors(limit){const candidates=[];const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),ab=new THREE.Vector3(),ac=new THREE.Vector3(),center=new THREE.Vector3(),normal=new THREE.Vector3(),radial=new THREE.Vector3();const establishingDirection=new THREE.Vector3(Math.sin(.72),0,Math.cos(.72));castleRoot.traverse(object=>{if(!object.isMesh||!object.geometry?.attributes?.position)return;const geometry=object.geometry,position=geometry.attributes.position,index=geometry.index;const triangleCount=Math.floor((index?.count||position.count)/3);const stride=Math.max(1,Math.floor(triangleCount/42000));for(let triangle=0;triangle<triangleCount;triangle+=stride){const offset=triangle*3;const ia=index?index.getX(offset):offset;const ib=index?index.getX(offset+1):offset+1;const ic=index?index.getX(offset+2):offset+2;a.fromBufferAttribute(position,ia).applyMatrix4(object.matrixWorld);b.fromBufferAttribute(position,ib).applyMatrix4(object.matrixWorld);c.fromBufferAttribute(position,ic).applyMatrix4(object.matrixWorld);ab.subVectors(b,a);ac.subVectors(c,a);normal.crossVectors(ab,ac);if(normal.lengthSq()<1e-7)continue;normal.normalize();center.copy(a).add(b).add(c).multiplyScalar(1/3);if(center.y<1.5||center.y>22||Math.abs(normal.y)>.58)continue;radial.set(center.x,0,center.z);if(radial.lengthSq()<2)continue;radial.normalize();if(normal.dot(radial)<0)normal.negate();if(normal.dot(radial)<.16)continue;candidates.push({position:center.clone().addScaledVector(normal,.045),normal:normal.clone(),score:normal.dot(establishingDirection)+center.y*.006,sector:(Math.floor((Math.atan2(center.x,center.z)+Math.PI)/(Math.PI*2)*12)+12)%12,level:clamp(Math.floor((center.y-1.5)/3),0,6)})}});candidates.sort((l,r)=>r.score-l.score);const out=[];const used=new Set();for(const candidate of candidates){const bucket=`${candidate.sector}:${candidate.level}`;if(used.has(bucket))continue;used.add(bucket);out.push(candidate);if(out.length>=limit)return out}for(const sp   function seeded(cards,seed){const copy=cards.slice();let value=seed||1;for(let i=copy.length-1;i>0;i--){value=(value*1664525+1013904223)>>>0;const j=value%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
  function clearCards(){state.generation++;state.meshes.forEach(mesh=>{[...new Set(mesh.material)].forEach(material=>material.dispose());cardGroup.remove(mesh)});state.meshes=[];state.loadQueue=[];state.activeLoads=0}
  function setCards(cards,focusedCardId,shuffleSeed,animateFocus=false,activeCategory='ALL'){state.cards=cards;state.focusedCardId=focusedCardId;state.shuffleSeed=shuffleSeed;state.activeCategory=activeCategory;clearCards();const points=state.surfaceAnchors.slice(0,Math.min(cards.length,state.surfaceAnchors.length));seeded(cards,shuffleSeed).slice(0,points.length).forEach((card,index)=>addCard(card,points[index]));state.meshes.forEach(queueRecto);if(focusedCardId)focusCard(focusedCardId,animateFocus);pumpTextures();updateSceneCount();resume()}
  function addCard(card,anchor){const edge=new THREE.MeshStandardMaterial({color:0x7d8c96,roughness:.48,metalness:.24});const face=new THREE.MeshStandardMaterial({color:0x2a1c18,roughness:.64,metalness:.02});const back=new THREE.MeshStandardMaterial({color:0x241712,roughness:.7});const mesh=new THREE.Mesh(cardGeometry,[edge,edge,edge,edge,face,back]);mesh.position.copy(anchor.position);mesh.quaternion.setFromUnitVectors(cardForward,anchor.normal);mesh.userData.card=card;mesh.userData.type='card';mesh.userData.cardId=card.id;mesh.userData.anchorPosition=anchor.position.clone();mesh.userData.anchorNormal=anchor.normal.clone();mesh.userData.textureUrl='';cardGroup.add(mesh);state.meshes.push(mesh)}
  function queueRecto(mesh){const card=mesh.userData.card;const url=card.rectoUrl||card.thumbnailUrl;mesh.userData.textureUrl=url;state.loadQueue.push({mesh,url,generation:state.generation})}

  function pick(event){if(state.sceneMode==='interior')return null;const rect=renderer.domElement.getBoundingClientRect();pointer.x=((event.clientX-rect.left)/rect.width)*2-1;pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);return raycaster.intersectObjects(state.meshes,false)[0]?.object}

  function playEntranceVideo(){if(state.sceneMode!=='exterior'||!entranceVideo||document.body.classList.contains('entrance-video-active'))return;gatekeeper?.setVisible(false);entranceVideo.muted=true;entranceVideo.playsInline=true;entranceVideo.src=ENTRANCE_VIDEO_URL;entranceVideo.load();document.body.classList.add('entrance-video-active');entranceTransition?.setAttribute('aria-hidden','false');try{entranceVideo.currentTime=0}catch(_){}const playback=entranceVideo.play();playback?.catch?.(()=>finishEntranceVideo())}

  function leaveInterior(){if(state.sceneMode!=='interior')return false;state.sceneMode='exterior';interiorRoot.visible=false;castleRoot.visible=true;cardGroup.visible=true;gatekeeper?.setVisible(true);document.body.dataset.sceneMode='exterior';orbit.yaw=.72;orbit.pitch=.34;orbit.distance=59;orbit.target.set(0,8,0);state.targetCamera=null;state.targetLook=null;updateOrbit();resume();return true}

  function installEvents(){

    listen(canvas,'pointerup',release);listen(canvas,'pointercancel',release);
    listen(canvas,'wheel',event=>{event.preventDefault();const minDistance=state.sceneMode==='interior'?5:24;const maxDistance=state.sceneMode==='interior'?28:90;orbit.distance=clamp(orbit.distance+event.deltaY*.025,minDistance,maxDistance);state.targetCamera=null;resume()},{passive:false});
    listen(canvas,'contextmenu',event=>event.preventDefault());listen(document.getElementById('enter-fullscreen'),'click',()=>document.documentElement.requestFullscreen?.());listen(document.getElementById('exit-fullscreen'),'click',()=>document.exitFullscreen?.());listen(document.getElementById('castle-reset'),'click',()=>{orbit.yaw=.72;orbit.pitch=.34;orbit.distance=59;orbit.target.set(0,8,0);state.targetCamera=null;state.targetLook=null;resume()});listen(document.getElementById('back-to-categories'),'click',()=>emit('categoriesRequested'));listen(document,'visibilitychange',()=>document.hidden?pause():resume());listen(window,'keydown',event=>{if(event.key==='Escape'&&state.sceneMode==='interior'){leaveInterior();event.preventDefault();return}if(['w','a','s','d','W','A','S','D'].includes(event.key)){keys.add(event.key.toLowerCase());resume();event.preventDefault()}});listen(window,'keyup',event=>keys.delete(event.key.toLowerCase()));listen(window,'pagehide',dispose,{once:true});
  }

  function clampTarget(){if(state.sceneMode==='interior'){orbit.target.x=clamp(orbit.target.x,-12,12);orbit.target.y=clamp(orbit.target.y,0,12);orbit.target.z=clamp(orbit.target.z,-12,12);return}orbit.target.x=clamp(orbit.target.x,-28,28);orbit.target.y=clamp(orbit.target.y,0,24);orbit.target.z=clamp(orbit.target.z,-28,28)}
  function updateOrbit(){const cp=Math.cos(orbit.pitch);camera.position.set(orbit.target.x+Math.sin(orbit.yaw)*cp*orbit.distance,orbit.target.y+Math.sin(orbit.pitch)*orbit.distance,orbit.target.z+Math.cos(orbit.yaw)*cp*orbit.distance);camera.lookAt(orbit.target)}
  function syncOrbitFromCamera(){const delta=camera.position.clone().sub(orbit.target);orbit.distance=clamp(delta.length(),state.sceneMode==='interior'?5:24,state.sceneMode==='interior'?28:90);orbit.pitch=clamp(Math.asin(delta.y/orbit.distance),.06,1.18);orbit.yaw=Math.atan2(delta.x,delta.z)}
  function resize(){if(!renderer)return;const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);camera.aspect=width/height;camera.fov=width<700?49:43;camera.updateProjectionMatrix();renderer.setSize(width,height,false);resume()}
  function updateSceneCount(){let count=0;scene?.traverse(()=>count++);document.body.dataset.sceneObjectCount=String(count)}

  function animate(now=performance.now()){
    state.frame=0;if(state.disposed||!state.visible||document.hidden)return;const delta=Math.min(.25,Math.max(0,(now-(state.lastFrame||now))/1000));state.lastFrame=now;
    if(state.targetCamera&&state.targetLook){const cameraAlpha=1-Math.exp(-5.2*delta),targetAlpha=1-Math.exp(-6.1*delta);camera.position.lerp(state.targetCamera,cameraAlpha);orbit.target.lerp(state.targetLook,targetAlpha);camera.lookAt(orbit.target);if(camera.position.distanceTo(state.targetCamera)<.08){camera.position.copy(state.targetCamera);orbit.target.copy(state.targetLook);syncOrbitFromCamera();state.targetCamera=null;state.targetLook=null}}else{if(keys.size){const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();const right=new THREE.Vector3().crossVectors(forward,camera.up).normalize();const move=new THREE.Vector3();if(keys.has('w'))move.add(forward);if(keys.has('s'))move.sub(forward);if(keys.has('d'))move.add(right);if(keys.has('a'))move.sub(right);if(move.lengthSq())orbit.target.add(move.normalize().multiplyScalar(.14));clampTarget()}updateOrbit()}
    if(state.sceneMode==='exterior')gatekeeper?.update(delta);
    renderer.render(scene,camera);
    if(state.targetCamera||keys.size||state.dragging||state.sceneMode==='exterior')state.frame=requestAnimationFrame(animate);
  }
  function resume(){if(!state.ready||state.disposed||!state.visible||document.hidden||state.frame)return;state.lastFrame=performance.now();state.frame=requestAnimationFrame(animate)}
  function pause(){if(state.frame)cancelAnimationFrame(state.frame);state.frame=0}
  function dispose(){if(state.disposed)return;state.disposed=true;pause();abort.abort();entranceVideo?.pause();resizeObserver?.disconnect();intersectionObserver?.disconnect();clearCards();state.textures.forEach(texture=>texture.dispose());state.textures.clear();cardGeometry.dispose();gatekeeper?.dispose();if(castleRoot){scene?.remove(castleRoot);disposeObject(castleRoot)}if(interiorRoot){scene?.remove(interiorRoot);disposeObject(interiorRoot)}if(cardGroup)scene?.remove(cardGroup);disposeObject(scene);renderer?.renderLists.dispose();renderer?.dispose();renderer?.forceContextLoss();renderer?.domElement.remove()}

  listen(window,'message',event=>{if(event.origin!==location.origin||typeof event.data!=='string')return;let data;try{data=JSON.parse(event.data)}catch(_){return}if(data.type==='setCards')setCards(data.cards||[],data.focusedCardId,data.shuffleSeed||0,data.animateFocus===true,data.activeCategory||'ALL');if(data.type==='focusCard')focusCard(data.cardId||'',data.animate!==false);if(data.type==='dispose')dispose()});
  init();
  </script>
</body>
