    .castle-toolbar{position:absolute;z-index:4;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:14px;pointer-events:none}
    .castle-toolbar-group{display:flex;gap:14px;align-items:flex-start;pointer-events:auto}
    .castle-control{position:relative;display:flex;align-items:center;min-width:224px;height:74px;padding:0 20px 0 86px;border:1px solid #b07a2b;border-radius:7px;background:linear-gradient(180deg,rgba(10,17,25,.96),rgba(4,9,14,.96));color:#f4d89d;box-shadow:0 10px 25px #0009,inset 0 0 0 1px rgba(232,184,94,.18);cursor:pointer;font-family:Georgia,'Times New Roman',serif;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;color-scheme:dark}

  <script type="module">
  import * as THREE from 'three';

  window.THREE=THREE;

  const CASTLE_URL=new URL('../assets/assets/models/castle_exterior.glb',document.baseURI).href;
  const INTERIOR_URL=new URL('../assets/assets/models/castle_interior.glb',document.baseURI).href;
  const ENTRANCE_VIDEO_URL=new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;

  const entranceTransition=document.getElementById('castle-entrance-transition');

  const abort=new AbortController();

  const state={cards:[],meshes:[],textures:new Map(),focusedCardId:null,shuffleSeed:0,disposed:false,pointerDown:null,dragging:false,targetLook:null,targetCamera:null,loadQueue:[],activeLoads:0,touches:new Map(),pinch:null,activeCategory:'ALL',fullscreenActive:false,lastFrame:0,frame:0,visible:true,ready:false,generation:0,surfaceAnchors:[],longPressTimer:0,sceneMode:'exterior',interiorReady:false,interiorLoadPromise:null,entranceStarted:false};

  let resizeObserver,intersectionObserver;
  const atmosphere={mist:[],warmLights:[],highQuality:false};
  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);

  function emit(type,payload={}){parent.postMessage(JSON.stringify({type,...payload}),location.origin)}

    const logoGround=new THREE.Mesh(new THREE.PlaneGeometry(44,26),new THREE.MeshStandardMaterial({map:groundTexture,color:0xffffff,transparent:true,opacity:.92,roughness:.88,metalness:.01}));logoGround.rotation.x=-Math.PI/2;logoGround.position.set(0,-.105,12.5);logoGround.receiveShadow=false;scene.add(logoGround);document.body.dataset.logoForecourt='contained-app-logo-ground';

  }

  function buildLights(){
    scene.add(new THREE.HemisphereLight(0xc6d9e8,0x24282d,2.95));scene.add(new THREE.AmbientLight(0x879fb2,.82));
    const moon=new THREE.DirectionalLight(0xdbe9f4,8.3);moon.position.set(-24,42,28);moon.target.position.set(0,6,0);scene.add(moon.target);moon.castShadow=atmosphere.highQuality;scene.add(moon);
    const rim=new THREE.DirectionalLight(0x8eb7d7,2.0);rim.position.set(30,18,-20);scene.add(rim);
    [[0,5,18,16,22],[-10,4,15,9,17],[10,4,15,9,17]].forEach(([x,y,z,intensity,distance])=>{const warm=new THREE.PointLight(0xffa34d,intensity,distance,2.1);warm.position.set(x,y,z);scene.add(warm);atmosphere.warmLights.push(warm)});
  }

  function sanitiseCastle(rootObject){
    const bounds=new THREE.Box3().setFromObject(rootObject),size=bounds.getSize(new THREE.Vector3());

  function loadCastle(){return new Promise((resolve,reject)=>{new GLTFLoader().load(CASTLE_URL,gltf=>{if(state.disposed){reject(new Error('disposed'));return}castleRoot=gltf.scene;sanitiseCastle(castleRoot);const bounds=new THREE.Box3().setFromObject(castleRoot),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),scale=39/Math.max(size.x,size.z,.001);castleRoot.scale.setScalar(scale);castleRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);scene.add(castleRoot);castleRoot.updateMatrixWorld(true);state.surfaceAnchors=deriveSurfaceAnchors(84);document.body.dataset.surfaceAnchorCount=String(state.surfaceAnchors.length);document.body.dataset.castleAnimations=String(gltf.animations.length);resolve()},undefined,reject)})}

  function loadInterior(){return new Promise((resolve,reject)=>{new GLTFLoader().load(INTERIOR_URL,gltf=>{if(state.disposed){reject(new Error('disposed'));return}interiorRoot=gltf.scene;interiorRoot.visible=false;interiorRoot.traverse(o=>{if(o.isMesh){o.castShadow=atmosphere.highQuality;o.receiveShadow=atmosphere.highQuality}});const bounds=new THREE.Box3().setFromObject(interiorRoot),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),scale=34/Math.max(size.x,size.z,.001);interiorRoot.scale.setScalar(scale);interiorRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);scene.add(interiorRoot);state.interiorReady=true;document.body.dataset.interiorReady='true';document.body.dataset.interiorAnimations=String(gltf.animations.length);resolve(interiorRoot)},undefined,reject)})}

  function deriveSurfaceAnchors(limit){const out=[];castleRoot.traverse(object=>{if(out.length>=limit||!object.isMesh||object.visible===false)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3());if(center.y>1.5&&center.y<22){const normal=center.clone().setY(0).normalize();if(normal.lengthSq())out.push({position:center.clone().addScaledVector(normal,.08),normal})}});while(out.length<limit){const i=out.length,a=i/limit*Math.PI*2;out.push({position:new THREE.Vector3(Math.sin(a)*18,4+(i%5)*2,Math.cos(a)*18),normal:new THREE.Vector3(Math.sin(a),0,Math.cos(a)).normalize()})}return out.slice(0,limit)}
  function seeded(cards,seed){const copy=cards.slice();let value=seed||1;for(let i=copy.length-1;i>0;i--){value=(value*1664525+1013904223)>>>0;const j=value%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
  function clearCards(){state.generation++;state.meshes.forEach(mesh=>{[...new Set(mesh.material)].forEach(material=>material.dispose());cardGroup.remove(mesh)});state.meshes=[];state.loadQueue=[];state.activeLoads=0}
  function setCards(cards,focusedCardId,shuffleSeed,animateFocus=false,activeCategory='ALL'){state.cards=cards;state.focusedCardId=focusedCardId;state.shuffleSeed=shuffleSeed;state.activeCategory=activeCategory;document.body.dataset.cardCount=String(cards.length);if(!state.ready||!state.surfaceAnchors.length)return;clearCards();seeded(cards,shuffleSeed).slice(0,state.surfaceAnchors.length).forEach((card,index)=>addCard(card,state.surfaceAnchors[index],index));updateSceneCount();if(animateFocus&&focusedCardId){const mesh=state.meshes.find(candidate=>candidate.userData.card.id===focusedCardId);if(mesh)focusMesh(mesh)}}
  function addCard(card,anchor,index){const mats=[0,1,2,3,4,5].map((_,i)=>new THREE.MeshStandardMaterial({color:i===4?0xf0eadf:0x0c1115,roughness:.7}));const mesh=new THREE.Mesh(cardGeometry,mats);mesh.userData.card=card;mesh.scale.setScalar(1.5+(index%7)*.04);mesh.position.copy(anchor.position);orientOnSurface(mesh,anchor.normal);mesh.renderOrder=2;cardGroup.add(mesh);state.meshes.push(mesh);queueTexture(mesh,card.imagePath,state.generation)}
  function orientOnSurface(mesh,normal){const up=Math.abs(normal.y)>.9?new THREE.Vector3(0,0,1):new THREE.Vector3(0,1,0),right=new THREE.Vector3().crossVectors(up,normal).normalize(),correctedUp=new THREE.Vector3().crossVectors(normal,right).normalize(),matrix=new THREE.Matrix4().makeBasis(right,correctedUp,normal);mesh.quaternion.setFromRotationMatrix(matrix);if(cardForward.clone().applyQuaternion(mesh.quaternion).dot(normal)<.98)mesh.rotateY(Math.PI)}

  async function ensureInteriorReady(){if(state.interiorReady&&interiorRoot)return true;if(!state.interiorLoadPromise)state.interiorLoadPromise=loadInterior().catch(()=>null);await state.interiorLoadPromise;return Boolean(state.interiorReady&&interiorRoot)}

  function pointerToNdc(event){const rect=renderer.domElement.getBoundingClientRect();pointer.set(((event.clientX-rect.left)/Math.max(1,rect.width))*2-1,-((event.clientY-rect.top)/Math.max(1,rect.height))*2+1)}

  function installEvents(){

    listen(renderer.domElement,'pointercancel',event=>{clearTimeout(state.longPressTimer);state.pointerDown=null;state.dragging=false;if(event.pointerType==='touch')state.touches.delete(event.pointerId);if(state.touches.size<2)state.pinch=null});
    listen(renderer.domElement,'wheel',event=>{event.preventDefault();orbit.distance=clamp(orbit.distance+event.deltaY*.022,12,86);updateOrbit()},{passive:false});
    listen(window,'keydown',event=>{keys.add(event.key.toLowerCase());if(event.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});listen(window,'keyup',event=>keys.delete(event.key.toLowerCase()));
    listen(document,'fullscreenchange',()=>{state.fullscreenActive=Boolean(document.fullscreenElement);document.body.classList.toggle('fullscreen-castle',state.fullscreenActive);setTimeout(resize,0)});
    listen(window,'castleJesterEnter',()=>beginEntranceSequence());
    document.getElementById('castle-reset')?.addEventListener('click',()=>{orbit.yaw=.72;orbit.pitch=.28;orbit.distance=52;orbit.target.set(0,6.8,0);state.targetCamera=null;state.targetLook=null;updateOrbit()},{signal:abort.signal});
    document.getElementById('enter-fullscreen')?.addEventListener('click',()=>document.documentElement.requestFullscreen?.(),{signal:abort.signal});
    document.getElementById('exit-fullscreen')?.addEventListener('click',()=>document.exitFullscreen?.(),{signal:abort.signal});
    document.getElementById('back-to-categories')?.addEventListener('click',()=>emit('backToCategories'),{signal:abort.signal});
    listen(window,'message',event=>{if(event.origin!==location.origin)return;let message=event.data;try{if(typeof message==='string')message=JSON.parse(message)}catch(_){return}if(!message||typeof message!=='object')return;if(message.type==='setCards')setCards(message.cards||[],message.focusedCardId||null,message.shuffleSeed||0,false,message.activeCategory||'ALL');else if(message.type==='focusCard'){const mesh=state.meshes.find(candidate=>candidate.userData.card.id===message.cardId);if(mesh)focusMesh(mesh)}else if(message.type==='enterCastle')beginEntranceSequence()});
  }

  function updateOrbit(){if(!camera)return;const cosPitch=Math.cos(orbit.pitch);camera.position.set(orbit.target.x+Math.sin(orbit.yaw)*cosPitch*orbit.distance,orbit.target.y+Math.sin(orbit.pitch)*orbit.distance,orbit.target.z+Math.cos(orbit.yaw)*cosPitch*orbit.distance);camera.lookAt(orbit.target)}
  function resize(){if(!renderer||!camera)return;const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix()}
  function animate(time=0){if(state.disposed||!state.visible)return;const delta=Math.min((time-state.lastFrame)/1000,.05)||.016;state.lastFrame=time;state.frame++;if(state.targetCamera){camera.position.lerp(state.targetCamera,1-Math.pow(.00035,delta));orbit.target.lerp(state.targetLook,1-Math.pow(.00035,delta));camera.lookAt(orbit.target);if(camera.position.distanceTo(state.targetCamera)<.04){state.targetCamera=null;state.targetLook=null}}else if(keys.size){const speed=delta*8;if(keys.has('arrowleft')||keys.has('a'))orbit.yaw+=speed*.16;if(keys.has('arrowright')||keys.has('d'))orbit.yaw-=speed*.16;if(keys.has('arrowup')||keys.has('w'))orbit.distance=clamp(orbit.distance-speed,12,86);if(keys.has('arrowdown')||keys.has('s'))orbit.distance=clamp(orbit.distance+speed,12,86);updateOrbit()}atmosphere.warmLights.forEach((light,index)=>{if(!light.userData.baseIntensity)light.userData.baseIntensity=light.intensity;light.intensity=light.userData.baseIntensity*(.92+.08*Math.sin(time*.004+index*1.73))});renderer.render(scene,camera);requestAnimationFrame(animate)}
  function resume(){if(!state.disposed)requestAnimationFrame(animate)}function pause(){state.lastFrame=0}
  function dispose(){if(state.disposed)return;state.disposed=true;abort.abort();resizeObserver?.disconnect();intersectionObserver?.disconnect();clearTimeout(state.longPressTimer);clearCards();cardGeometry.dispose();renderer?.dispose()}

  init();
  </script>
  <script id="castle-jester-gatekeeper-bridge" type="module" src="./castle_jester_overlay.js"></script>
