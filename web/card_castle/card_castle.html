<!doctype html>
<html lang="en">
<head>

  <style>
    html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}

    #scene::before{background:linear-gradient(180deg,#06142308 38%,#02060b20 76%,#0005 100%);mix-blend-mode:multiply}
    #scene::after{box-shadow:inset 0 0 min(15vw,170px) #0008,inset 0 -10vh 14vh #0004;background:radial-gradient(ellipse at 47% 40%,transparent 52%,#01040912 79%,#0004 100%)}
    @keyframes castle-door-flash{0%,100%{filter:brightness(1)}45%{filter:brightness(1.8)}55%{filter:brightness(.92)}}
    body.castle-door-hover #scene::after{animation:castle-door-flash .58s steps(2,end) infinite;background:radial-gradient(circle at 46.5% 64%,rgba(255,213,92,.92) 0 1.1%,rgba(255,128,28,.38) 3.5%,rgba(255,113,20,.12) 7%,transparent 14%),radial-gradient(circle at 53.5% 64%,rgba(255,213,92,.92) 0 1.1%,rgba(255,128,28,.38) 3.5%,rgba(255,113,20,.12) 7%,transparent 14%),radial-gradient(ellipse at 50% 64%,rgba(255,164,54,.16) 0 7%,transparent 21%),radial-gradient(ellipse at 47% 40%,transparent 52%,#01040912 79%,#0004 100%)}
    #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:radial-gradient(circle,#122436,#03070c 72%);color:#dce9f3;font:700 13px system-ui;letter-spacing:.12em;pointer-events:none}
    body.ready #loading{display:none}
    #castle-entrance-transition{position:fixed;inset:0;z-index:2147483646;background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s}
    #castle-entrance-transition video{width:100%;height:100%;display:block;object-fit:cover;object-position:center center;background:#000}
    @media (orientation:portrait){#castle-entrance-transition video{object-fit:contain;max-width:100vw;max-height:100vh}}
    body.entrance-video-active #castle-entrance-transition{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s ease}
    .castle-toolbar{position:absolute;z-index:4;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:14px;pointer-events:none}
    .castle-toolbar-group{display:flex;gap:14px;align-items:flex-start;pointer-events:auto}
    .castle-control{position:relative;display:flex;align-items:center;min-width:224px;height:74px;padding:0 20px 0 86px;border:1px solid #b07a2b;border-radius:7px;background:linear-gradient(180deg,rgba(10,17,25,.96),rgba(4,9,14,.96));color:#f4d89d;box-shadow:0 10px 25px #0009,inset 0 0 0 1px rgba(232,184,94,.18);cursor:pointer;font-family:Georgia,'Times New Roman',serif;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;color-scheme:dark}
    .castle-control::before,.castle-control::after{content:"";position:absolute;pointer-events:none}
    .castle-control::before{inset:5px;border:1px solid rgba(224,168,72,.55);clip-path:polygon(6% 0,94% 0,100% 28%,100% 72%,94% 100%,6% 100%,0 72%,0 28%)}
    .castle-control::after{width:8px;height:8px;background:#162332;border:1px solid #a66d27;transform:rotate(45deg);left:50%;bottom:-6px;margin-left:-5px}
    .castle-control:hover,.castle-control:focus-visible{transform:translateY(-2px);border-color:#d8a649;box-shadow:0 14px 30px #000b,0 0 20px rgba(195,128,39,.18),inset 0 0 0 1px rgba(245,199,109,.3);outline:none}
    .control-medallion{position:absolute;left:14px;top:50%;width:58px;height:58px;margin-top:-29px;border-radius:50%;display:grid;place-items:center;border:2px solid #9e6928;background:radial-gradient(circle at 45% 38%,#142233 0,#09121c 58%,#05090e 100%);box-shadow:0 0 0 4px rgba(16,22,29,.9),0 0 0 5px rgba(177,117,42,.45),0 4px 12px #0008;color:#f2c46f;font:700 30px/1 system-ui}
    .control-copy{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
    .control-title{font-size:19px;line-height:1.05;letter-spacing:.02em;color:#f1d39a;text-transform:uppercase}
    .control-subtitle{font:400 12px/1.2 system-ui;color:#d3d7dc;letter-spacing:.01em;text-transform:none}
    #fullscreen-controls{display:none}
    body.fullscreen-castle #fullscreen-controls{display:block}
    body.fullscreen-castle #enter-fullscreen{display:none}
    @media(max-width:980px){
      .castle-toolbar{top:10px;left:10px;right:10px;gap:8px}
      .castle-toolbar-group{gap:8px}
      .castle-control{min-width:0;width:64px;height:64px;padding:0;border-radius:8px;justify-content:center}
      .castle-control::after{display:none}
      .control-medallion{position:static;width:48px;height:48px;margin:0;font-size:25px}
      .control-copy{display:none}
    }
  </style>

<body data-renderer-status="loading">
  <div id="scene"></div>
  <div id="loading">LOADING 3D CASTLE…</div>

  </div>
  <script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from '../vendor/GLTFLoader.js';

  window.THREE = THREE;
  const root = document.getElementById('scene');
  const CASTLE_URL = new URL(
    '../assets/assets/models/search_castle.glb',
    document.baseURI,
  ).href;
  const INTERIOR_URL = new URL(
    '../assets/assets/models/castle_interior.glb',
    document.baseURI,
  ).href;
  const ENTRANCE_VIDEO_URL = new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;
  const entranceTransition=document.getElementById('castle-entrance-transition');
  const entranceVideo=document.getElementById('castle-entrance-video');
  const abort = new AbortController();
  const listen = (target,type,handler,options={}) =>
    target.addEventListener(type,handler,{...options,signal:abort.signal});
  const clamp = THREE.MathUtils.clamp;
  const LONG_PRESS_MS=600;
  const TAP_SLOP_PX=9;
  const state = {
    cards: [], meshes: [], textures: new Map(), focusedCardId: null,
    shuffleSeed: 0, disposed: false, pointerDown: null, dragging: false,
    targetLook: null, targetCamera: null, loadQueue: [], activeLoads: 0,
    touches: new Map(), pinch: null, activeCategory: 'ALL',
    fullscreenActive: false, fallbackElements: null, lastFrame: 0,
    frame: 0, visible: true, ready: false, generation: 0,
    surfaceAnchors: [], longPressTimer: 0,
    sceneMode:'exterior', interiorReady:false, interiorLoadPromise:null,
  };
  const keys = new Set();
  const orbit = {
    yaw: .72, pitch: .34, distance: 59,
    target: new THREE.Vector3(0,8,0),
  };
  let scene,camera,renderer,raycaster,pointer,cardGroup,castleRoot,interiorRoot;
  let resizeObserver,intersectionObserver;
  const atmosphere={mist:[],warmLights:[],highQuality:false};
  const cardGeometry = new THREE.BoxGeometry(1.08,1.62,.035);
  const cardForward = new THREE.Vector3(0,0,1);

  function emit(type,payload={}) {
    parent.postMessage(JSON.stringify({type,...payload}),location.origin);
  }

  function hasWebGL() {
    try {
      const canvas=document.createElement('canvas');
      return Boolean(window.WebGLRenderingContext &&
        (canvas.getContext('webgl2')||canvas.getContext('webgl')));
    } catch (_) { return false; }
  }

  async function init() {
    if(!hasWebGL()){
      document.body.dataset.rendererStatus='failed';
      emit('rendererError',{reason:'webgl-unavailable'});
      return;
    }
    scene=new THREE.Scene();
    scene.background=new THREE.Color(0x02060b);
    scene.fog=new THREE.FogExp2(0x0a1824,.0108);
    camera=new THREE.PerspectiveCamera(43,1,.1,180);
    renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.42;
    atmosphere.highQuality=matchMedia('(min-width: 900px)').matches &&
      (navigator.hardwareConcurrency||4)>=4 && devicePixelRatio<=2.25;
    renderer.shadowMap.enabled=atmosphere.highQuality;
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    root.appendChild(renderer.domElement);
    raycaster=new THREE.Raycaster();
    pointer=new THREE.Vector2();
    cardGroup=new THREE.Group();
    scene.add(cardGroup);
    buildEnvironment();
    buildLights();
    try {
      await loadCastle();
    } catch(error) {
      document.body.dataset.rendererStatus='failed';
      document.body.dataset.modelAsset=CASTLE_URL;
      document.body.dataset.modelError=String(error?.message||error);
      console.error('Search castle GLB failed to load.',{url:CASTLE_URL,error});
      emit('rendererError',{reason:'castle-load-failed'});
      dispose();
      return;
    }
    state.interiorLoadPromise=loadInterior().catch(error=>{
      document.body.dataset.interiorReady='false';
      document.body.dataset.interiorError=String(error?.message||error);
      console.warn('Castle interior GLB failed to preload.',{url:INTERIOR_URL,error});
      return null;
    });
    document.body.dataset.rendererInstanceId=
      `castle-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    document.body.dataset.atmosphere='scottish-cinematic-night';
    document.body.dataset.atmosphereQuality=atmosphere.highQuality?'high':'efficient';
    document.body.dataset.modelAsset=CASTLE_URL;
    document.body.dataset.interiorModelAsset=INTERIOR_URL;
    document.body.dataset.entranceVideoAsset=ENTRANCE_VIDEO_URL;
    document.body.dataset.sceneMode='exterior';
    installEvents();
    resizeObserver=new ResizeObserver(resize);
    resizeObserver.observe(root);
    intersectionObserver=new IntersectionObserver(([entry])=>{
      state.visible=entry.isIntersecting;
      if(state.visible)resume();else pause();
    });
    intersectionObserver.observe(document.documentElement);
    resize();
    updateOrbit();
    state.ready=true;
    document.body.classList.add('ready');
    document.body.dataset.rendererStatus='ready';
    if(state.cards.length){
      setCards(
        state.cards,
        state.focusedCardId,
        state.shuffleSeed,
        false,
        state.activeCategory,
      );
    }
    updateSceneCount();
    resume();
    emit('rendererReady');
  }

  function buildEnvironment() {
    const ground=new THREE.Mesh(
      new THREE.CircleGeometry(67,64),
      new THREE.MeshStandardMaterial({color:0x0a1112,roughness:.82,metalness:.025}),
    );
    ground.rotation.x=-Math.PI/2;
    ground.position.y=-.12;
    ground.receiveShadow=atmosphere.highQuality;
    scene.add(ground);
    buildLogoForecourt();
    const sky=new THREE.Mesh(
      new THREE.SphereGeometry(130,24,16),
      new THREE.ShaderMaterial({
        side:THREE.BackSide,
        uniforms:{top:{value:new THREE.Color(0x102a42)},middle:{value:new THREE.Color(0x091827)},bottom:{value:new THREE.Color(0x010409)}},
        vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
        fragmentShader:'varying float h;uniform vec3 top;uniform vec3 middle;uniform vec3 bottom;void main(){vec3 low=mix(bottom,middle,smoothstep(-.42,.18,h));vec3 colour=mix(low,top,smoothstep(.08,.92,h));gl_FragColor=vec4(colour,1.0);}',
      }),
    );
    scene.add(sky);
    const moon=new THREE.Mesh(
      new THREE.SphereGeometry(6.4,32,24),
      new THREE.MeshBasicMaterial({color:0xdde9f3,fog:false,toneMapped:false}),
    );
    moon.position.set(-70,18,-40);
    scene.add(moon);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({
      map:radialTexture('rgba(207,226,242,.28)'),transparent:true,
      depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,toneMapped:false,
    }));
    halo.position.copy(moon.position);halo.scale.set(27,27,1);scene.add(halo);

    const cloudTexture=buildCloudTexture();
    [
      [-62,20,-37,42,12,.62],[-78,15,-34,34,9,.42],
      [-45,26,-49,38,10,.26],[28,19,-76,54,13,.18],
    ].forEach(([x,y,z,w,h,opacity])=>{
      const cloud=new THREE.Sprite(new THREE.SpriteMaterial({
        map:cloudTexture,transparent:true,opacity,depthWrite:false,
        color:0x708399,fog:false,toneMapped:false,
      }));
      cloud.position.set(x,y,z);cloud.scale.set(w,h,1);scene.add(cloud);
    });

    const mistTexture=radialTexture('rgba(153,181,198,.38)',768,192);
    [
      [-26,2,-4,42,8,.18],[24,3,-8,46,9,.15],[-14,6,-22,54,10,.12],
      [7,1,23,36,7,.11],
    ].forEach(([x,y,z,w,h,opacity])=>{
      const mist=new THREE.Sprite(new THREE.SpriteMaterial({
        map:mistTexture,transparent:true,opacity,depthWrite:false,
        color:0x8ea9bb,fog:true,toneMapped:false,
      }));
      mist.position.set(x,y,z);mist.scale.set(w,h,1);scene.add(mist);atmosphere.mist.push(mist);
    });
  }

  function buildLogoForecourt() {
    const group=new THREE.Group();
    group.name='chanson-a-repondre-uno-forecourt';
    group.position.set(0,-.055,15.5);

    const base=new THREE.Mesh(
      new THREE.CylinderGeometry(24.5,24.5,.16,96),
      new THREE.MeshStandardMaterial({color:0x171515,roughness:.86,metalness:.025}),
    );
    base.scale.z=.62;
    base.receiveShadow=atmosphere.highQuality;
    group.add(base);

    const rimMaterial=new THREE.MeshStandardMaterial({
      color:0x8a632b,roughness:.52,metalness:.28,
    });
    [1,.91,.79].forEach((scale,index)=>{
      const rim=new THREE.Mesh(new THREE.TorusGeometry(24.1-index*1.35,.16,10,96),rimMaterial);
      rim.rotation.x=Math.PI/2;
      rim.scale.y=.62;
      rim.position.y=.12+index*.025;
      rim.receiveShadow=atmosphere.highQuality;
      group.add(rim);
    });

    const emblemCanvas=document.createElement('canvas');
    emblemCanvas.width=2048;emblemCanvas.height=1280;
    const context=emblemCanvas.getContext('2d');
    context.clearRect(0,0,emblemCanvas.width,emblemCanvas.height);
    context.save();
    context.translate(emblemCanvas.width/2,emblemCanvas.height/2);
    context.scale(1,.64);
    const gradient=context.createRadialGradient(-220,-180,60,0,0,900);
    gradient.addColorStop(0,'#7c281e');
    gradient.addColorStop(.58,'#50170f');
    gradient.addColorStop(1,'#24100c');
    context.fillStyle=gradient;
    context.beginPath();
    context.arc(0,0,900,0,Math.PI*2);
    context.fill();
    context.lineWidth=48;
    context.strokeStyle='#b18442';
    context.stroke();
    context.lineWidth=14;
    context.strokeStyle='rgba(239,206,133,.72)';
    context.beginPath();
    context.arc(0,0,818,0,Math.PI*2);
    context.stroke();
    context.restore();

    context.textAlign='center';
    context.textBaseline='middle';
    context.lineJoin='round';
    context.shadowColor='rgba(0,0,0,.82)';
    context.shadowBlur=22;
    context.shadowOffsetY=18;
    context.font='700 126px Georgia, Times New Roman, serif';
    context.lineWidth=16;
    context.strokeStyle='#21130b';
    context.strokeText('CHANSON À RÉPONDRE',1024,335);
    context.fillStyle='#d5ad64';
    context.fillText('CHANSON À RÉPONDRE',1024,335);

    context.font='900 510px Arial Black, Impact, sans-serif';
    context.lineWidth=42;
    context.strokeStyle='#24150c';
    context.strokeText('UNO',1024,760);
    context.lineWidth=14;
    context.strokeStyle='#f0cf88';
    context.strokeText('UNO',1024,760);
    context.fillStyle='#b98a43';
    context.fillText('UNO',1024,760);

    context.globalAlpha=.18;
    context.strokeStyle='#f0d49b';
    context.lineWidth=3;
    for(let x=90;x<1960;x+=58){
      context.beginPath();context.moveTo(x,98);context.lineTo(x-240,1180);context.stroke();
    }
    context.globalAlpha=1;

    const texture=new THREE.CanvasTexture(emblemCanvas);
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);
    const plaque=new THREE.Mesh(
      new THREE.CircleGeometry(22.75,96),
      new THREE.MeshStandardMaterial({map:texture,roughness:.68,metalness:.055}),
    );
    plaque.rotation.x=-Math.PI/2;
    plaque.scale.y=.62;
    plaque.position.y=.16;
    plaque.receiveShadow=atmosphere.highQuality;
    group.add(plaque);

    const entranceStrip=new THREE.Mesh(
      new THREE.BoxGeometry(9,.12,18),
      new THREE.MeshStandardMaterial({color:0x29221b,roughness:.9,metalness:.015}),
    );
    entranceStrip.position.set(0,.04,-13.6);
    entranceStrip.receiveShadow=atmosphere.highQuality;
    group.add(entranceStrip);

    scene.add(group);
    document.body.dataset.logoForecourt='chanson-a-repondre-uno';
  }

  function radialTexture(colour,width=256,height=256) {
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const context=canvas.getContext('2d');
    const gradient=context.createRadialGradient(width*.5,height*.5,0,width*.5,height*.5,Math.max(width,height)*.5);
    gradient.addColorStop(0,colour);gradient.addColorStop(.38,colour);gradient.addColorStop(1,'rgba(0,0,0,0)');
    context.fillStyle=gradient;context.fillRect(0,0,width,height);
    const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;return texture;
  }

  function buildCloudTexture() {
    const canvas=document.createElement('canvas');canvas.width=512;canvas.height=160;
    const context=canvas.getContext('2d');context.clearRect(0,0,512,160);
    let seed=317;
    for(let index=0;index<34;index++){
      seed=(seed*1664525+1013904223)>>>0;const x=(seed%500)+6;
      seed=(seed*1664525+1013904223)>>>0;const y=48+(seed%62);
      seed=(seed*1664525+1013904223)>>>0;const radius=26+(seed%54);
      const gradient=context.createRadialGradient(x,y,0,x,y,radius);
      gradient.addColorStop(0,'rgba(225,235,242,.33)');gradient.addColorStop(1,'rgba(18,31,44,0)');
      context.fillStyle=gradient;context.fillRect(x-radius,y-radius,radius*2,radius*2);
    }
    const texture=new THREE.CanvasTexture(canvas);texture.colorSpace=THREE.SRGBColorSpace;return texture;
  }

  function buildLights() {
    scene.add(new THREE.HemisphereLight(0xb4d0e4,0x22262b,2.45));
    scene.add(new THREE.AmbientLight(0x7590a5,.62));
    const moon=new THREE.DirectionalLight(0xcbdff0,9.6);
    moon.position.set(-26,44,30);
    moon.target.position.set(0,7,0);scene.add(moon.target);
    moon.castShadow=atmosphere.highQuality;
    moon.shadow.mapSize.set(1024,1024);moon.shadow.bias=-.00022;moon.shadow.normalBias=.035;
    moon.shadow.camera.left=-30;moon.shadow.camera.right=30;moon.shadow.camera.top=34;moon.shadow.camera.bottom=-16;
    moon.shadow.camera.near=8;moon.shadow.camera.far=95;
    scene.add(moon);
    const rim=new THREE.DirectionalLight(0x789fc1,1.45);
    rim.position.set(30,22,-26);
    scene.add(rim);
    const architecturalLights=[
      [0,5,18,32,26],[-10,4,16,19,20],[10,4,16,19,20],
      [0,2,24,22,19],[-17,3,13,14,16],[17,3,13,14,16],
      [0,8,6,24,22],[-11,8,6,16,17],[11,8,6,16,17],
      [-19,7,1,13,15],[19,7,1,13,15],
      [-12,13,-6,14,16],[0,16,-8,17,18],[12,13,-6,14,16],
    ];
    architecturalLights
      .slice(0,atmosphere.highQuality?architecturalLights.length:10)
      .forEach(([x,y,z,intensity,distance])=>{
      const warm=new THREE.PointLight(0xffa34d,intensity,distance,2.15);
      warm.position.set(x,y,z);scene.add(warm);atmosphere.warmLights.push(warm);
    });
    if(atmosphere.highQuality){
      addArchitecturalSpot([0,12,25],[0,5,12],0xffa45b,34,.58);
      addArchitecturalSpot([-15,15,13],[-8,5,7],0xffb06a,22,.52);
    }
    document.body.dataset.warmLightCount=String(atmosphere.warmLights.length);
    document.body.dataset.moonIntensity=String(moon.intensity);
  }

  function addArchitecturalSpot(position,target,colour,intensity,angle) {
    const light=new THREE.SpotLight(colour,intensity,38,angle,.72,1.65);
    light.position.fromArray(position);light.target.position.fromArray(target);
    light.castShadow=true;light.shadow.mapSize.set(1024,1024);
    light.shadow.bias=-.00018;light.shadow.normalBias=.045;
    light.shadow.camera.near=3;light.shadow.camera.far=48;
    scene.add(light,light.target);atmosphere.warmLights.push(light);
  }

  function loadCastle() {
    return new Promise((resolve,reject)=>{
      new GLTFLoader().load(CASTLE_URL,gltf=>{
        if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}
        castleRoot=gltf.scene;
        let meshCount=0;
        castleRoot.traverse(object=>{
          if(object.isMesh){
            meshCount++;
            object.castShadow=atmosphere.highQuality;
            object.receiveShadow=atmosphere.highQuality;
            const materials=Array.isArray(object.material)?object.material:[object.material];
            materials.filter(Boolean).forEach(material=>{
              if(!material.isMeshStandardMaterial&&!material.isMeshPhysicalMaterial)return;
              const subtlyDamp=/(bridge|court|floor|ground|path|stair|walk)/i.test(
                `${object.name||''} ${material.name||''}`,
              );
              material.roughness=clamp(material.roughness??.86,subtlyDamp ? .64 : .7,.94);
              material.metalness=clamp(material.metalness??0,0,.08);
              material.envMapIntensity=atmosphere.highQuality ? .62 : .44;
              if(material.emissive?.getHex()!==0){
                material.emissiveIntensity=clamp((material.emissiveIntensity||1)*1.18,.6,2.2);
              }
              material.needsUpdate=true;
            });
          }
        });
        const bounds=new THREE.Box3().setFromObject(castleRoot);
        const size=bounds.getSize(new THREE.Vector3());
        const center=bounds.getCenter(new THREE.Vector3());
        const scale=42/Math.max(size.x,size.z,.001);
        castleRoot.scale.setScalar(scale);
        castleRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
        scene.add(castleRoot);
        castleRoot.updateMatrixWorld(true);
        state.surfaceAnchors=deriveSurfaceAnchors(84);
        document.body.dataset.castleMeshCount=String(meshCount);
        document.body.dataset.castleAnimations=String(gltf.animations.length);
        document.body.dataset.surfaceAnchorCount=String(state.surfaceAnchors.length);
        if(state.surfaceAnchors.length<84){
          reject(new Error(`Only ${state.surfaceAnchors.length} castle surface anchors were found.`));
          return;
        }
        resolve();
      },event=>{
        if(event.total)document.body.dataset.modelProgress=
          String(Math.round(event.loaded/event.total*100));
      },reject);
    });
  }

  function loadInterior(){
    return new Promise((resolve,reject)=>{
      new GLTFLoader().load(INTERIOR_URL,gltf=>{
        if(state.disposed){disposeObject(gltf.scene);reject(new Error('disposed'));return}
        interiorRoot=gltf.scene;
        interiorRoot.visible=false;
        interiorRoot.traverse(object=>{
          if(!object.isMesh)return;
          object.castShadow=atmosphere.highQuality;
          object.receiveShadow=atmosphere.highQuality;
          const materials=Array.isArray(object.material)?object.material:[object.material];
          materials.filter(Boolean).forEach(material=>{
            if(!material.isMeshStandardMaterial&&!material.isMeshPhysicalMaterial)return;
            material.roughness=clamp(material.roughness??.82,.58,.96);
            material.metalness=clamp(material.metalness??0,0,.14);
            material.needsUpdate=true;
          });
        });
        const bounds=new THREE.Box3().setFromObject(interiorRoot);
        const size=bounds.getSize(new THREE.Vector3());
        const center=bounds.getCenter(new THREE.Vector3());
        const scale=34/Math.max(size.x,size.z,.001);
        interiorRoot.scale.setScalar(scale);
        interiorRoot.position.set(-center.x*scale,-bounds.min.y*scale,-center.z*scale);
        scene.add(interiorRoot);
        state.interiorReady=true;
        document.body.dataset.interiorReady='true';
        document.body.dataset.interiorAnimations=String(gltf.animations.length);
        resolve(interiorRoot);
      },undefined,reject);
    });
  }

  function disposeObject(rootObject) {
    rootObject?.traverse(object=>{
      object.geometry?.dispose?.();
      const items=Array.isArray(object.material)?object.material:[object.material];
      items.filter(Boolean).forEach(material=>{
        Object.values(material).forEach(value=>value?.isTexture&&value.dispose());
        material.dispose?.();
      });
    });
  }

  function deriveSurfaceAnchors(limit) {
    const candidates=[];
    const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3();
    const ab=new THREE.Vector3(),ac=new THREE.Vector3();
    const center=new THREE.Vector3(),normal=new THREE.Vector3(),radial=new THREE.Vector3();
    const establishingDirection=new THREE.Vector3(Math.sin(.72),0,Math.cos(.72));
    castleRoot.traverse(object=>{
      if(!object.isMesh||!object.geometry?.attributes?.position)return;
      const geometry=object.geometry,position=geometry.attributes.position,index=geometry.index;
      const triangleCount=Math.floor((index?.count||position.count)/3);
      const stride=Math.max(1,Math.floor(triangleCount/42000));
      for(let triangle=0;triangle<triangleCount;triangle+=stride){
        const offset=triangle*3;
        const ia=index?index.getX(offset):offset;
        const ib=index?index.getX(offset+1):offset+1;
        const ic=index?index.getX(offset+2):offset+2;
        a.fromBufferAttribute(position,ia).applyMatrix4(object.matrixWorld);
        b.fromBufferAttribute(position,ib).applyMatrix4(object.matrixWorld);
        c.fromBufferAttribute(position,ic).applyMatrix4(object.matrixWorld);
        ab.subVectors(b,a);ac.subVectors(c,a);normal.crossVectors(ab,ac);
        if(normal.lengthSq()<1e-7)continue;
        normal.normalize();center.copy(a).add(b).add(c).multiplyScalar(1/3);
        if(center.y<1.5||center.y>22||Math.abs(normal.y)>.58)continue;
        radial.set(center.x,0,center.z);
        if(radial.lengthSq()<2)continue;
        radial.normalize();
        if(normal.dot(radial)<0)normal.negate();
        if(normal.dot(radial)<.16)continue;
        candidates.push({
          position:center.clone().addScaledVector(normal,.045),
          normal:normal.clone(),
          score:normal.dot(establishingDirection)+center.y*.006,
          sector:(Math.floor((Math.atan2(center.x,center.z)+Math.PI)/(Math.PI*2)*12)+12)%12,
          level:clamp(Math.floor((center.y-1.5)/3),0,6),
        });
      }
    });
    candidates.sort((left,right)=>right.score-left.score);
    const out=[];
    const usedBuckets=new Set();
    for(const candidate of candidates){
      const bucket=`${candidate.sector}:${candidate.level}`;
      if(usedBuckets.has(bucket))continue;
      usedBuckets.add(bucket);out.push(candidate);
      if(out.length>=limit)return out;
    }
    for(const spacing of [2.2,1.75,1.35]){
      const minimum=spacing*spacing;
      for(const candidate of candidates){
        if(out.includes(candidate))continue;
        if(out.some(anchor=>anchor.position.distanceToSquared(candidate.position)<minimum))continue;
        out.push(candidate);
        if(out.length>=limit)return out;
      }
    }
    return out;
  }

  function seeded(cards,seed) {
    const copy=cards.slice();let value=seed||1;
    for(let i=copy.length-1;i>0;i--){
      value=(value*1664525+1013904223)>>>0;
      const j=value%(i+1);[copy[i],copy[j]]=[copy[j],copy[i]];
    }
    return copy;
  }

  function clearCards() {
    state.generation++;
    state.meshes.forEach(mesh=>{
      [...new Set(mesh.material)].forEach(material=>material.dispose());
      cardGroup.remove(mesh);
    });
    state.meshes=[];state.loadQueue=[];state.activeLoads=0;
  }

  function setCards(cards,focusedCardId,shuffleSeed,animateFocus=false,activeCategory='ALL') {
    state.cards=cards;state.focusedCardId=focusedCardId;state.shuffleSeed=shuffleSeed;
    state.activeCategory=activeCategory;
    document.body.dataset.cardCount=String(cards.length);
    document.body.dataset.activeCategory=activeCategory;
    document.body.dataset.cardCategories=[...new Set(
      cards.map(card=>card.category.toUpperCase()),
    )].join('|');
    document.body.dataset.textureCount='0';
    document.body.dataset.textureErrorCount='0';
    document.body.dataset.textureRequestCount='0';
    document.body.dataset.firstCardId=cards[0]?.id||'';
    document.body.dataset.firstTextureUrl='';
    if(!state.ready||!state.surfaceAnchors.length)return;
    clearCards();
    const points=state.surfaceAnchors;
    seeded(cards,shuffleSeed).slice(0,points.length)
      .forEach((card,index)=>addCard(card,points[index],index));
    updateSceneCount();
    if(animateFocus&&focusedCardId){
      const mesh=state.meshes.find(candidate=>candidate.userData.card.id===focusedCardId);
      if(mesh)focusMesh(mesh);
    }
  }

  function addCard(card,anchor,index) {
    const mats=[
      new THREE.MeshStandardMaterial({color:0xb4a997,roughness:.68,metalness:.025}),
      new THREE.MeshStandardMaterial({color:0x0c1115,roughness:.77}),
      new THREE.MeshStandardMaterial({color:0x0c1115,roughness:.77}),
      new THREE.MeshStandardMaterial({color:0x0c1115,roughness:.77}),
      new THREE.MeshStandardMaterial({color:0x0c1115,roughness:.77}),
      new THREE.MeshStandardMaterial({color:0xf0eadf,roughness:.69}),
    ];
    const mesh=new THREE.Mesh(cardGeometry,mats);
    mesh.userData.card=card;
    const scale=1.5+(index%7)*.04;
    mesh.scale.setScalar(scale);
    mesh.position.copy(anchor.position);
    orientOnSurface(mesh,anchor.normal);
    mesh.renderOrder=2;
    mesh.castShadow=atmosphere.highQuality;
    mesh.receiveShadow=atmosphere.highQuality;
    cardGroup.add(mesh);state.meshes.push(mesh);
    queueTexture(mesh,card.imagePath,state.generation);
  }

  function orientOnSurface(mesh,normal) {
    const up=Math.abs(normal.y)>.9?new THREE.Vector3(0,0,1):new THREE.Vector3(0,1,0);
    const right=new THREE.Vector3().crossVectors(up,normal).normalize();
    const correctedUp=new THREE.Vector3().crossVectors(normal,right).normalize();
    const matrix=new THREE.Matrix4().makeBasis(right,correctedUp,normal);
    mesh.quaternion.setFromRotationMatrix(matrix);
    if(cardForward.clone().applyQuaternion(mesh.quaternion).dot(normal)<.98){
      mesh.rotateY(Math.PI);
    }
  }

  function queueTexture(mesh,path,generation) {
    const url=assetUrl(path);
    document.body.dataset.textureRequestCount=String(
      Number(document.body.dataset.textureRequestCount||0)+1,
    );
    if(!document.body.dataset.firstTextureUrl)document.body.dataset.firstTextureUrl=url;
    state.loadQueue.push({mesh,url,generation});pumpTextureQueue();
  }

  function pumpTextureQueue() {
    while(state.activeLoads<8&&state.loadQueue.length){
      const job=state.loadQueue.shift();
      if(job.generation!==state.generation||!job.mesh.parent)continue;
      state.activeLoads++;
      loadTexture(job.url)
        .then(texture=>{
          if(job.generation!==state.generation||!job.mesh.parent)return;
          const current=job.mesh.material[4];
          job.mesh.material[4]=new THREE.MeshStandardMaterial({map:texture,roughness:.68,metalness:.015});
          current.dispose();
        })
        .catch(()=>{
          document.body.dataset.textureErrorCount=String(
            Number(document.body.dataset.textureErrorCount||0)+1,
          );
        })
        .finally(()=>{state.activeLoads--;pumpTextureQueue()});
    }
  }

  function loadTexture(url) {
    if(state.textures.has(url))return state.textures.get(url);
    const promise=new Promise((resolve,reject)=>{
      new THREE.TextureLoader().load(url,texture=>{
        texture.colorSpace=THREE.SRGBColorSpace;
        texture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);
        document.body.dataset.textureCount=String(
          Number(document.body.dataset.textureCount||0)+1,
        );
        resolve(texture);
      },undefined,reject);
    });
    state.textures.set(url,promise);return promise;
  }

  function assetUrl(path) {
    const clean=String(path||'').replace(/^\/+/, '');
    const normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;
    return new URL(`../${normalized}`,document.baseURI).href;
  }

  function focusMesh(mesh) {
    const direction=new THREE.Vector3(0,0,1).applyQuaternion(mesh.quaternion);
    state.targetLook=mesh.position.clone();
    state.targetCamera=mesh.position.clone().addScaledVector(direction,5.5).add(new THREE.Vector3(0,.3,0));
  }

  function updateSceneCount() {
    const visible=state.meshes.filter(mesh=>mesh.visible).length;
    document.body.dataset.visibleCardCount=String(visible);
  }

  function switchToInterior(){
    if(!state.interiorReady||!interiorRoot)return false;
    state.sceneMode='interior';
    document.body.dataset.sceneMode='interior';
    castleRoot.visible=false;
    interiorRoot.visible=true;
    cardGroup.visible=false;
    orbit.yaw=.15;orbit.pitch=.18;orbit.distance=29;orbit.target.set(0,6.7,0);
    updateOrbit();
    return true;
  }

  function pointerToNdc(event) {
    const rect=renderer.domElement.getBoundingClientRect();
    pointer.set(
      ((event.clientX-rect.left)/rect.width)*2-1,
      -((event.clientY-rect.top)/rect.height)*2+1,
    );
  }

  function hitCard(event) {
    pointerToNdc(event);raycaster.setFromCamera(pointer,camera);
    const hits=raycaster.intersectObjects(state.meshes,false);
    return hits[0]?.object||null;
  }

  function cameraForwardHit() {
    raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
    const hits=raycaster.intersectObject(castleRoot,true);
    return hits[0]||null;
  }

  function maybeEnterCastle(){
    if(state.sceneMode!=='exterior'||!castleRoot)return false;
    const hit=cameraForwardHit();
    if(!hit)return false;
    const center=new THREE.Vector3();new THREE.Box3().setFromObject(castleRoot).getCenter(center);
    const nearDoor=Math.abs(hit.point.x-center.x)<5.4&&hit.point.y<9.5&&hit.point.z>center.z+5;
    document.body.classList.toggle('castle-door-hover',nearDoor);
    return nearDoor;
  }

  function beginEntranceSequence(){
    if(document.body.classList.contains('entrance-video-active'))return;
    document.body.classList.add('entrance-video-active');
    entranceTransition.setAttribute('aria-hidden','false');
    entranceVideo.src=ENTRANCE_VIDEO_URL;
    entranceVideo.currentTime=0;
    const finish=()=>{
      entranceVideo.pause();
      entranceVideo.removeAttribute('src');entranceVideo.load();
      document.body.classList.remove('entrance-video-active');
      entranceTransition.setAttribute('aria-hidden','true');
      switchToInterior();
    };
    entranceVideo.onended=finish;
    entranceVideo.onerror=finish;
    entranceVideo.play().catch(finish);
  }

  function installEvents() {
    listen(renderer.domElement,'pointerdown',event=>{
      if(event.pointerType==='touch')state.touches.set(event.pointerId,{x:event.clientX,y:event.clientY});
      state.pointerDown={x:event.clientX,y:event.clientY,time:performance.now(),card:hitCard(event)};
      state.dragging=false;
      clearTimeout(state.longPressTimer);
      if(state.pointerDown.card){
        state.longPressTimer=setTimeout(()=>{
          emit('cardLongPress',{cardId:state.pointerDown?.card?.userData?.card?.id});
          state.pointerDown=null;
        },LONG_PRESS_MS);
      }
    });
    listen(renderer.domElement,'pointermove',event=>{
      if(event.pointerType==='touch'&&state.touches.has(event.pointerId)){
        state.touches.set(event.pointerId,{x:event.clientX,y:event.clientY});
      }
      if(state.pointerDown){
        const dx=event.clientX-state.pointerDown.x,dy=event.clientY-state.pointerDown.y;
        if(Math.hypot(dx,dy)>TAP_SLOP_PX){clearTimeout(state.longPressTimer);state.dragging=true}
        if(state.dragging&&state.touches.size<2){
          orbit.yaw-=dx*.0048;orbit.pitch=clamp(orbit.pitch+dy*.0038,-.12,1.08);
          state.pointerDown.x=event.clientX;state.pointerDown.y=event.clientY;updateOrbit();
        }
      } else maybeEnterCastle();
      if(state.touches.size===2){
        const pair=[...state.touches.values()];
        const distance=Math.hypot(pair[0].x-pair[1].x,pair[0].y-pair[1].y);
        if(state.pinch)orbit.distance=clamp(state.pinch.distance*state.pinch.span/distance,12,86);
        else state.pinch={span:distance,distance:orbit.distance};
        updateOrbit();
      }
    });
    listen(renderer.domElement,'pointerup',event=>{
      clearTimeout(state.longPressTimer);
      if(event.pointerType==='touch')state.touches.delete(event.pointerId);
      if(state.touches.size<2)state.pinch=null;
      const down=state.pointerDown;state.pointerDown=null;
      if(!down||state.dragging)return;
      const card=hitCard(event);
      if(card&&card===down.card){focusMesh(card);emit('cardTap',{cardId:card.userData.card.id});return}
      if(maybeEnterCastle())beginEntranceSequence();
    });
    listen(renderer.domElement,'pointercancel',event=>{
      clearTimeout(state.longPressTimer);state.pointerDown=null;state.dragging=false;
      if(event.pointerType==='touch')state.touches.delete(event.pointerId);
      if(state.touches.size<2)state.pinch=null;
    });
    listen(renderer.domElement,'wheel',event=>{
      event.preventDefault();orbit.distance=clamp(orbit.distance+event.deltaY*.022,12,86);updateOrbit();
    },{passive:false});
    listen(window,'keydown',event=>{
      keys.add(event.key.toLowerCase());
      if(event.key==='Escape'&&document.fullscreenElement)document.exitFullscreen();
    });
    listen(window,'keyup',event=>keys.delete(event.key.toLowerCase()));
    listen(document,'fullscreenchange',()=>{
      state.fullscreenActive=Boolean(document.fullscreenElement);
      document.body.classList.toggle('fullscreen-castle',state.fullscreenActive);
      setTimeout(resize,0);
    });
    document.getElementById('castle-reset')?.addEventListener('click',()=>{
      orbit.yaw=.72;orbit.pitch=.34;orbit.distance=59;orbit.target.set(0,8,0);updateOrbit();
    },{signal:abort.signal});
    document.getElementById('enter-fullscreen')?.addEventListener('click',()=>{
      document.documentElement.requestFullscreen?.();
    },{signal:abort.signal});
    document.getElementById('exit-fullscreen')?.addEventListener('click',()=>{
      document.exitFullscreen?.();
    },{signal:abort.signal});
    document.getElementById('back-to-categories')?.addEventListener('click',()=>emit('backToCategories'),{signal:abort.signal});
    listen(window,'message',event=>{
      if(event.origin!==location.origin)return;
      let message=event.data;
      if(typeof message==='string')try{message=JSON.parse(message)}catch(_){return}
      if(!message||typeof message!=='object')return;
      if(message.type==='setCards'){
        setCards(message.cards||[],message.focusedCardId||null,message.shuffleSeed||0,false,message.activeCategory||'ALL');
      } else if(message.type==='focusCard'){
        const mesh=state.meshes.find(candidate=>candidate.userData.card.id===message.cardId);
        if(mesh)focusMesh(mesh);
      } else if(message.type==='resetView'){
        orbit.yaw=.72;orbit.pitch=.34;orbit.distance=59;orbit.target.set(0,8,0);updateOrbit();
      }
    });
  }

  function updateOrbit() {
    if(!camera)return;
    const cosPitch=Math.cos(orbit.pitch);
    camera.position.set(
      orbit.target.x+Math.sin(orbit.yaw)*cosPitch*orbit.distance,
      orbit.target.y+Math.sin(orbit.pitch)*orbit.distance,
      orbit.target.z+Math.cos(orbit.yaw)*cosPitch*orbit.distance,
    );
    camera.lookAt(orbit.target);
  }

  function resize() {
    if(!renderer||!camera)return;
    const width=Math.max(1,root.clientWidth),height=Math.max(1,root.clientHeight);
    renderer.setSize(width,height,false);camera.aspect=width/height;camera.updateProjectionMatrix();
  }

  function animate(time=0) {
    if(state.disposed||!state.visible)return;
    const delta=Math.min((time-state.lastFrame)/1000,.05)||.016;state.lastFrame=time;state.frame++;
    if(state.targetCamera){
      camera.position.lerp(state.targetCamera,1-Math.pow(.00035,delta));
      orbit.target.lerp(state.targetLook,1-Math.pow(.00035,delta));camera.lookAt(orbit.target);
      if(camera.position.distanceTo(state.targetCamera)<.04){state.targetCamera=null;state.targetLook=null}
    } else if(keys.size){
      const speed=delta*8;
      if(keys.has('arrowleft')||keys.has('a'))orbit.yaw+=speed*.16;
      if(keys.has('arrowright')||keys.has('d'))orbit.yaw-=speed*.16;
      if(keys.has('arrowup')||keys.has('w'))orbit.distance=clamp(orbit.distance-speed,12,86);
      if(keys.has('arrowdown')||keys.has('s'))orbit.distance=clamp(orbit.distance+speed,12,86);
      updateOrbit();
    }
    atmosphere.mist.forEach((mist,index)=>{
      mist.position.x+=Math.sin(time*.00006+index)*delta*.08;
      mist.material.opacity*=.99995+Math.sin(time*.0002+index)*.00005;
    });
    atmosphere.warmLights.forEach((light,index)=>{
      const base=Number(light.userData.baseIntensity||light.intensity);
      if(!light.userData.baseIntensity)light.userData.baseIntensity=base;
      light.intensity=base*(.92+.08*Math.sin(time*.004+index*1.73));
    });
    renderer.render(scene,camera);requestAnimationFrame(animate);
  }

  function resume(){if(!state.disposed)requestAnimationFrame(animate)}
  function pause(){state.lastFrame=0}

  function dispose() {
    if(state.disposed)return;state.disposed=true;abort.abort();
    resizeObserver?.disconnect();intersectionObserver?.disconnect();clearTimeout(state.longPressTimer);
    clearCards();cardGeometry.dispose();
    scene?.traverse(object=>{
      if(object===castleRoot||object===interiorRoot)return;
      object.geometry?.dispose?.();
      const materials=Array.isArray(object.material)?object.material:[object.material];
      materials.filter(Boolean).forEach(material=>{
        Object.values(material).forEach(value=>value?.isTexture&&value.dispose());
        material.dispose?.();
      });
    });
    disposeObject(castleRoot);disposeObject(interiorRoot);
    renderer?.dispose();
  }

  init();
  </script>
</body>
</html>
