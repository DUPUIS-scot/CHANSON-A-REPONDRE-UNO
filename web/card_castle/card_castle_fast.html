<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'no-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  const isIOS=/iP(?:hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isAndroid=/Android/i.test(navigator.userAgent);
  const isMobile=isIOS||isAndroid;
  const isWindows=/Windows/i.test(navigator.userAgent);

  source=source.replace(
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';",
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';"
  );
  source=source.replace(
    "  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
    "  window.DRACOLoader=DRACOLoader;window.__castleSharedDraco={decoderPath:'https://www.gstatic.com/draco/versioned/decoders/1.5.7/',decoderType:"+(isIOS?"'js'":"'wasm'")+',workerLimit:'+(isMobile?1:2)+"};const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath(window.__castleSharedDraco.decoderPath);dracoLoader.setDecoderConfig({type:window.__castleSharedDraco.decoderType});dracoLoader.setWorkerLimit(window.__castleSharedDraco.workerLimit);dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);"
  );
  source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
  source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');

  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");
  source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");
  source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");

  // Android uses castle_cards_direct.js as the single card-texture owner.
  // Keep the legacy meshes available for compatibility, but prevent their
  // four-way TextureLoader queue from competing with environment and jester
  // decoding during startup.
  source=source.replace(
    'function pumpTextureQueue(){while(state.activeLoads<4&&state.loadQueue.length){',
    'function pumpTextureQueue(){const legacyLimit='+String(isAndroid?0:4)+';document.body.dataset.legacyCardTextureConcurrency=String(legacyLimit);while(state.activeLoads<legacyLimit&&state.loadQueue.length){'
  );

  const inlineJesterScript='<script type="module" src="./castle_jester_overlay.js"></scr'+'ipt>';
  source=source.replace(inlineJesterScript,'');

  if(isMobile){
    const pixelRatioCap=isIOS?1.1:1.15;
    source=source.replace("renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));",`renderer.setPixelRatio(Math.min(devicePixelRatio||1,${pixelRatioCap}));`);
    source=source.replace("atmosphere.highQuality=matchMedia('(min-width: 1100px)').matches&&(navigator.hardwareConcurrency||4)>=6&&devicePixelRatio<=1.75;","atmosphere.highQuality=false;");
  }

  if(isIOS){
    const baseExteriorView="function setDefaultView(){orbit.yaw=0;orbit.pitch=.14;orbit.distance=58;orbit.target.set(0,6.2,5.5);updateOrbit()}";
    const iosExteriorView="function setDefaultView(){const portrait=innerHeight>innerWidth;orbit.yaw=0;orbit.pitch=portrait?0.12:0.14;orbit.distance=58;orbit.target.set(0,portrait?6.7:6.2,portrait?4.5:5.5);updateOrbit();document.body.dataset.exteriorStartingView=portrait?'ios-portrait-balanced-v39':'ios-landscape-default-v39'}";
    source=source.replace(baseExteriorView,iosExteriorView);
  }

  const originalInteriorPreload="    state.interiorLoadPromise=loadInterior().catch(error=>{document.body.dataset.interiorReady='false';document.body.dataset.interiorError=String(error?.message||error);return null});";
  const deferredInterior=isWindows
    ? "    state.interiorLoadPromise=null;document.body.dataset.interiorReady='windows-deferred-after-jester';window.__castlePreloadInterior=()=>{if(state.disposed||state.interiorReady||state.interiorLoadPromise)return state.interiorLoadPromise;document.body.dataset.interiorReady='windows-preloading';return ensureInteriorReady()};"
    : "    state.interiorLoadPromise=null;document.body.dataset.interiorReady='deferred-until-entrance';";
  source=source.replace(originalInteriorPreload,deferredInterior);

  source=source.replace(
    "interiorRoot.rotation.y=Math.PI*2.5;",
    "interiorRoot.rotation.y=Math.PI*3.5;document.body.dataset.interiorRotation='current-plus-180-v35';"
  );

  source=source.replace(
    "    #fullscreen-controls{display:none}",
    "    #return-exterior{display:none}\n    body[data-scene-mode=\"interior\"] #return-exterior{display:flex}\n    #fullscreen-controls{display:none}"
  );
  source=source.replace(
    '</span></button></div>\n    <div id="castle-controls" class="castle-toolbar-group">',
    '</span></button><button id="return-exterior" class="castle-control" type="button" aria-label="Retour au château extérieur"><span class="control-medallion">←</span><span class="control-copy"><span class="control-title">EXTÉRIEUR</span><span class="control-subtitle">Retour au château</span></span></button></div>\n    <div id="castle-controls" class="castle-toolbar-group">'
  );

  const performanceLoader=isIOS
    ? 'ios-draco-direct-v40'
    : (isAndroid
        ? 'android-draco-mobile-v41-staged-cards'
        : (isWindows?'windows-draco-direct-v40':'draco-direct-v40'));
  source=source.replace(
    '<body data-renderer-status="loading">',
    `<body data-renderer-status="loading" data-performance-loader="${performanceLoader}">`
  );

  const loaderArtwork=new URL('../assets/assets/images/castle_jester_loading_bar.png',document.baseURI).href;
  const loaderMarkup=`<div id="castle-jester-loader" aria-live="polite"><div class="castle-loader-shell"><div class="castle-loader-artwork" style="--castle-loader-art:url('${loaderArtwork}')"><div class="castle-loader-artwork-base"></div><div class="castle-loader-progress-track"><div id="castle-loader-fill" class="castle-loader-progress-fill"></div></div></div><div id="castle-loader-percent">0%</div><div id="castle-loader-stage">INITIALISATION</div></div></div>`;
  const loaderStyles=`<style>
    #castle-jester-loader{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,rgba(66,6,5,.42),rgba(2,6,11,.96) 58%,#02060b);transition:opacity .42s ease,visibility .42s ease;pointer-events:auto}
    #castle-jester-loader.is-done{opacity:0;visibility:hidden;pointer-events:none}
    .castle-loader-shell{width:min(96vw,1280px);text-align:center;padding:18px}
    .castle-loader-artwork{position:relative;width:100%;aspect-ratio:3/1;margin:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7));overflow:visible}
    .castle-loader-artwork-base{position:absolute;inset:0;background-image:var(--castle-loader-art);background-repeat:no-repeat;background-position:center;background-size:contain;pointer-events:none;filter:brightness(.5) saturate(.68)}
    .castle-loader-progress-track{position:absolute;left:5.4%;right:5.4%;top:45%;height:11%;border-radius:999px;overflow:hidden;pointer-events:none;z-index:2;box-shadow:inset 0 0 12px rgba(0,0,0,.92)}
    .castle-loader-progress-track:after{content:'';position:absolute;left:41.5%;right:41.5%;top:-48%;bottom:-48%;background-image:var(--castle-loader-art);background-repeat:no-repeat;background-position:center;background-size:90vw auto;pointer-events:none;z-index:4}
    .castle-loader-progress-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:repeating-linear-gradient(90deg,#66100d 0 18px,#9d1a11 18px 36px,#d43217 36px 54px,#ff7d2d 54px 72px);box-shadow:inset 0 0 18px rgba(255,175,70,.75),0 0 18px rgba(255,64,18,.62);transition:width .28s ease;z-index:3}
    #castle-loader-percent{margin-top:8px;color:#e8b660;font:600 clamp(26px,4vw,44px)/1.1 Georgia,serif;text-shadow:0 2px 12px rgba(0,0,0,.8)}
    #castle-loader-stage{margin-top:8px;color:#d7c8b0;font:600 clamp(13px,2vw,18px)/1.2 Georgia,serif;letter-spacing:.18em;text-transform:uppercase}
    @media(max-width:700px){#castle-jester-loader{align-items:center}.castle-loader-shell{width:96vw;padding:8px}.castle-loader-artwork{aspect-ratio:3/1}.castle-loader-progress-track{left:5.8%;right:5.8%;top:45%;height:11%}.castle-loader-progress-track:after{left:39%;right:39%;top:-70%;bottom:-70%;background-size:96vw auto}#castle-loader-percent{margin-top:2px;font-size:clamp(24px,8vw,34px)}#castle-loader-stage{font-size:clamp(12px,3.6vw,16px);letter-spacing:.12em}}
  </style>`;
  source=source.replace('</head>',loaderStyles+'</head>');
  source=source.replace(/<body([^>]*)>/,match=>match+loaderMarkup);

  const directVersion=new URLSearchParams(location.search).get('v');
  const directSuffix=directVersion?`?v=${encodeURIComponent(directVersion)}`:'';
  const directScripts=
    '<script src="./castle_environment_direct.js'+directSuffix+'"></scr'+'ipt>'+
    '<script src="./castle_ios_uno_preview_fix.js'+directSuffix+'"></scr'+'ipt>'+
    '<script src="./castle_cards_direct.js'+directSuffix+'"></scr'+'ipt>';
  const loaderScript='<script>(function(){const root=document.getElementById("castle-jester-loader"),fill=document.getElementById("castle-loader-fill"),percent=document.getElementById("castle-loader-percent"),stage=document.getElementById("castle-loader-stage");if(!root||!fill||!percent||!stage)return;let current=0,target=3,done=false,jesterTimeoutArmed=false;const stages=[[0,"INITIALISATION"],[18,"CHÂTEAU LOADING"],[60,"ENVIRONMENT LOADING"],[75,"JESTER LOADING"],[95,"ACTIVATING INTERACTION"],[100,"READY"]];function setTarget(value,label){target=Math.max(target,Math.min(100,value));if(label)stage.textContent=label}function stageFor(value){let result=stages[0][1];for(const pair of stages)if(value>=pair[0])result=pair[1];return result}function finish(label,fallback){if(done)return;done=true;target=100;fill.style.width="100%";percent.textContent="100%";stage.dataset.locked="true";stage.textContent=label||"READY";root.style.pointerEvents="none";if(fallback)document.body.dataset.castleLoaderFallback=fallback;setTimeout(()=>root.classList.add("is-done"),260);setTimeout(()=>root.remove(),1050)}function tick(){if(done)return;current+=(target-current)*.09;if(target-current<.2)current=target;fill.style.width=Math.max(0,Math.min(100,current))+"%";percent.textContent=Math.round(current)+"%";if(!stage.dataset.locked)stage.textContent=stageFor(current);requestAnimationFrame(tick)}requestAnimationFrame(tick);const body=document.body;const observer=new MutationObserver(()=>{const renderer=body.dataset.rendererStatus,environment=body.dataset.exteriorEnvironment,jester=body.dataset.castleJester;if(renderer==="ready")setTarget(60,"ENVIRONMENT LOADING");if(renderer==="failed"){stage.dataset.locked="true";stage.textContent="3D CASTLE UNAVAILABLE";setTimeout(()=>finish("CASTLE FALLBACK","renderer-failed"),900)}if(environment==="ready"){setTarget(75,"JESTER LOADING");if(!jesterTimeoutArmed){jesterTimeoutArmed=true;setTimeout(()=>{if(done||body.dataset.castleJester==="ready")return;finish("CASTLE READY","jester-timeout")},90000)}}if(jester==="ready"){stage.dataset.locked="true";stage.textContent="ACTIVATING INTERACTION";setTarget(100);setTimeout(()=>finish("READY"),260)}if(jester==="failed"){stage.dataset.locked="true";stage.textContent="JESTER LOAD FAILED";setTimeout(()=>finish("CASTLE READY","jester-failed"),650)}});observer.observe(body,{attributes:true,attributeFilter:["data-renderer-status","data-exterior-environment","data-castle-jester"]});window.addEventListener("castleRuntimeReady",()=>setTarget(60,"ENVIRONMENT LOADING"),{once:true});setTimeout(()=>setTarget(18,"CHÂTEAU LOADING"),120)})();</scr'+'ipt>';
  source=source.replace('</body>',loaderScript+directScripts+'</body>');

  document.open();
  document.write(source);
  document.close();
})().catch(error=>{
  console.error('Castle loader failed.',error);
  document.body.dataset.loaderError=String(error&&error.message||error);
});
</script>
</body>
</html>
