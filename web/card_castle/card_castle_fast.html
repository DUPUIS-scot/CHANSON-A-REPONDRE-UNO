<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'force-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  const isIOS=/iP(?:hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isWindows=/Windows/i.test(navigator.userAgent);
  const params=new URLSearchParams(location.search);
  const iosRetry=isIOS&&params.get('iosRetry')==='1';
  const textureConcurrency=isIOS?1:(isWindows?5:4);
  const xSamples=isIOS?8:(isWindows?18:20);
  const ySamples=isIOS?4:7;
  const zSamples=isIOS?5:(isWindows?12:14);
  const interiorIdleTimeout=isIOS?14000:3500;
  const interiorFallbackDelay=isIOS?9000:1600;

  source=source.replace("import { GLTFLoader } from '../vendor/GLTFLoader.js';","import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';");
  source=source.replace("  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);","  const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');dracoLoader.setDecoderConfig({type:"+(isIOS?"'js'":"'wasm'")+"});dracoLoader.setWorkerLimit("+(isIOS?1:2)+");dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);");
  source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
  source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');
  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");
  source=source.replace('body.fullscreen-castle #enter-fullscreen{display:none}','body.fullscreen-castle #enter-fullscreen{display:none}#return-exterior{display:none}body[data-scene-mode="interior"] #return-exterior{display:flex}');
  source=source.replace('<button id="castle-reset" class="castle-control" type="button" aria-label="Réinitialiser la vue">','<button id="return-exterior" class="castle-control" type="button" aria-label="Retour à l’extérieur"><span class="control-medallion">↩</span><span class="control-copy"><span class="control-title">EXTÉRIEUR</span><span class="control-subtitle">Retour au château</span></span></button>\n      <button id="castle-reset" class="castle-control" type="button" aria-label="Réinitialiser la vue">');
  source=source.replace("function switchToInterior(){if(!state.interiorReady||!interiorRoot)return false;state.sceneMode='interior';document.body.dataset.sceneMode='interior';castleRoot.visible=false;interiorRoot.visible=true;cardGroup.visible=false;orbit.yaw=.15;orbit.pitch=.18;orbit.distance=29;orbit.target.set(0,6.7,0);updateOrbit();return true}","function setInteriorStartingView(){orbit.yaw=0;orbit.pitch=.10;orbit.distance=24;orbit.target.set(0,7.9,-1.8);state.targetCamera=null;state.targetLook=null;updateOrbit();document.body.dataset.interiorStartingView='construction-panel-staircase-throne'}function switchToInterior(){if(!state.interiorReady||!interiorRoot)return false;state.sceneMode='interior';document.body.dataset.sceneMode='interior';castleRoot.visible=false;interiorRoot.visible=true;cardGroup.visible=false;setInteriorStartingView();return true}function switchToExterior(){if(!castleRoot)return false;state.sceneMode='exterior';state.entranceStarted=false;document.body.dataset.sceneMode='exterior';castleRoot.visible=true;if(interiorRoot)interiorRoot.visible=false;cardGroup.visible=true;state.targetCamera=null;state.targetLook=null;setDefaultView();updateSceneCount();return true}");
  source=source.replace("document.getElementById('castle-reset')?.addEventListener","document.getElementById('return-exterior')?.addEventListener('click',()=>switchToExterior(),{signal:abort.signal});document.getElementById('castle-reset')?.addEventListener");
  source=source.replace('queueTexture(mesh,card.imagePath,state.generation)','queueTexture(mesh,castleRectoUrl(card.rectoUrl||card.imagePath),state.generation)');
  source=source.replace("function assetUrl(path){const clean=String(path||'').replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}","function castleRectoUrl(path){const value=String(path||'');try{const url=new URL(value,document.baseURI);if(url.origin===location.origin&&url.pathname.includes('/assets/')&&!url.pathname.includes('/assets/assets/'))url.pathname=url.pathname.replace('/assets/','/assets/assets/');return url.href}catch(_){return value}}function assetUrl(path){const value=String(path||'');if(/^(https?:|blob:|data:)/i.test(value))return value;const clean=value.replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}");
  source=source.replace('state.loadQueue.push({mesh,url,generation});pumpTextureQueue()','state.loadQueue.push({mesh,url,generation,retries:0});pumpTextureQueue()');source=source.replace('while(state.activeLoads<4&&state.loadQueue.length)',`while(state.activeLoads<${textureConcurrency}&&state.loadQueue.length)`);source=source.replace('},undefined,()=>{state.activeLoads--;pumpTextureQueue()})}}',"},undefined,()=>{if(job.retries<2){job.retries++;setTimeout(()=>{if(job.generation===state.generation&&job.mesh.parent){state.loadQueue.push(job);pumpTextureQueue()}},260*job.retries)}state.activeLoads--;pumpTextureQueue()})}}");
  source=source.replace(/function deriveSurfaceAnchors\(limit\)\{[\s\S]*?return out\.slice\(0,limit\)\}/,`function deriveSurfaceAnchors(limit){const out=[];const bounds=new THREE.Box3().setFromObject(castleRoot);const size=bounds.getSize(new THREE.Vector3());const ray=new THREE.Raycaster();const minY=bounds.min.y+size.y*.47,maxY=bounds.min.y+size.y*.94,minSpacingSq=1.35*1.35;const addHit=(hit,outward)=>{if(!hit||out.length>=limit||hit.point.y<minY||hit.point.y>maxY)return;const normal=hit.face?.normal?hit.face.normal.clone().transformDirection(hit.object.matrixWorld):outward.clone();if(normal.dot(outward)<0)normal.negate();if(Math.abs(normal.y)>.72)return;normal.y=THREE.MathUtils.clamp(normal.y,-.18,.28);normal.normalize();const position=hit.point.clone().addScaledVector(normal,.12);if(out.some(anchor=>anchor.position.distanceToSquared(position)<minSpacingSq))return;out.push({position,normal})};const meshes=[];castleRoot.traverse(object=>{if(object.isMesh&&object.visible!==false&&!object.userData?.hiddenAsOutlier)meshes.push(object)});const cast=(origin,direction,outward)=>{ray.set(origin,direction);ray.near=0;ray.far=Math.max(size.x,size.z)*2.6;const hits=ray.intersectObjects(meshes,false);for(const hit of hits){if(hit.point.y>=minY&&hit.point.y<=maxY){addHit(hit,outward);break}}};const xSamples=${xSamples},ySamples=${ySamples},zSamples=${zSamples};const frontZ=bounds.max.z+Math.max(8,size.z*.45);for(let yi=0;yi<ySamples&&out.length<limit;yi++){const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));for(let xi=0;xi<xSamples&&out.length<limit;xi++){const x=THREE.MathUtils.lerp(bounds.min.x+size.x*.04,bounds.max.x-size.x*.04,xi/(xSamples-1));cast(new THREE.Vector3(x,y,frontZ),new THREE.Vector3(0,0,-1),new THREE.Vector3(0,0,1))}}for(const side of[-1,1]){const x=side<0?bounds.min.x-Math.max(8,size.x*.35):bounds.max.x+Math.max(8,size.x*.35),direction=new THREE.Vector3(-side,0,0),outward=new THREE.Vector3(side,0,0);for(let yi=0;yi<ySamples&&out.length<limit;yi++){const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));for(let zi=0;zi<zSamples&&out.length<limit;zi++){const z=THREE.MathUtils.lerp(bounds.min.z+size.z*.06,bounds.max.z-size.z*.06,zi/(zSamples-1));cast(new THREE.Vector3(x,y,z),direction,outward)}}}document.body.dataset.surfaceAnchorMode='platform-fast-raycasts-v24';document.body.dataset.surfaceAnchorCount=String(out.length);return out.slice(0,limit)}`);
  source=source.replace('    state.interiorLoadPromise=loadInterior()',`    window.__castleSearchRuntime={scene,camera,renderer,orbit,updateOrbit,get castleRoot(){return castleRoot},get interiorRoot(){return interiorRoot}};window.dispatchEvent(new CustomEvent('castleRuntimeReady'));state.interiorLoadPromise=null;const preloadInterior=()=>{if(state.disposed||state.interiorReady||state.interiorLoadPromise)return;state.interiorLoadPromise=loadInterior().catch(error=>{document.body.dataset.interiorReady='false';document.body.dataset.interiorError=String(error?.message||error);state.interiorLoadPromise=null;return null})};if('requestIdleCallback'in window)requestIdleCallback(preloadInterior,{timeout:${interiorIdleTimeout}});else setTimeout(preloadInterior,${interiorFallbackDelay})`);
  source=source.replace("  const ENTRANCE_VIDEO_URL=new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;","  const ENTRANCE_VIDEO_URL=new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;\n  const EXTERIOR_GROUND_URL=new URL('../assets/assets/images/castle_exterior_ground.png',document.baseURI).href;\n  const EXTERIOR_ATMOSPHERE_URL=new URL('../assets/assets/images/castle_exterior_atmosphere.png',document.baseURI).href;");
  source=source.replace(/function buildEnvironment\(\)\{[\s\S]*?document\.body\.dataset\.logoForecourt='front-centred-upright-plaza';\n  \}/,`function buildEnvironment(){const groundTexture=new THREE.TextureLoader().load(EXTERIOR_GROUND_URL,tex=>{tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),4);tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;tex.center.set(.5,.5);tex.rotation=Math.PI;tex.needsUpdate=true});const plaza=new THREE.Mesh(new THREE.CircleGeometry(38,96),new THREE.MeshStandardMaterial({map:groundTexture,color:0xffffff,roughness:.78,metalness:.01}));plaza.rotation.x=-Math.PI/2;plaza.position.set(0,-.035,15.8);plaza.scale.set(1,.78,1);plaza.receiveShadow=atmosphere.highQuality;scene.add(plaza);const surround=new THREE.Mesh(new THREE.RingGeometry(37.8,74,96),new THREE.MeshStandardMaterial({color:0x09131c,roughness:.97,metalness:.01}));surround.rotation.x=-Math.PI/2;surround.position.y=-.055;surround.receiveShadow=atmosphere.highQuality;scene.add(surround);const atmosphereTexture=new THREE.TextureLoader().load(EXTERIOR_ATMOSPHERE_URL,tex=>{tex.colorSpace=THREE.SRGBColorSpace;tex.needsUpdate=true});const sky=new THREE.Mesh(new THREE.SphereGeometry(130,32,20),new THREE.MeshBasicMaterial({map:atmosphereTexture,side:THREE.BackSide,fog:false}));sky.rotation.y=Math.PI;scene.add(sky);document.body.dataset.logoForecourt='uno-front-of-gate-rotated-180-v24';document.body.dataset.exteriorGround='grey-surface-reduced-to-dark-surround';document.body.dataset.exteriorAtmosphere='uploaded-moon-cloud-artwork'}`);
  source=source.replace("scene.fog=new THREE.FogExp2(0x08131e,.0062)","scene.fog=new THREE.FogExp2(0x07111d,.0048)");source=source.replace("const moon=new THREE.DirectionalLight(0xd9ecff,7.8);moon.position.set(-18,38,4)","const moon=new THREE.DirectionalLight(0xcfe5ff,8.8);moon.position.set(-24,42,6)");
  source=source.replace('<body data-renderer-status="loading">',`<body data-renderer-status="loading" data-performance-loader="${isIOS?(iosRetry?'ios-draco-js-retry-v24':'ios-draco-js-v24'):(isWindows?'windows-draco-wasm-v24':'draco-wasm-v24')}">`);
  if(isIOS){source=source.replace('<script type="module">',`<script>setTimeout(function(){if(!document.body.classList.contains('ready')&&document.body.dataset.rendererStatus!=='ready'){var retry=new URL('./card_castle_fast.html',document.baseURI);retry.searchParams.set('iosRetry','1');var attempt=Math.max(0,Number(new URLSearchParams(location.search).get('iosAttempt')||'0'))+1;retry.searchParams.set('iosAttempt',String(attempt));retry.searchParams.set('v',Date.now().toString());location.replace(retry.href)}},25000);<\/script>\n  <script type="module">`)}
  document.open();document.write(source);document.close();
})().catch(error=>{console.error('Castle loader failed.',error);const isIOS=/iP(?:hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const params=new URLSearchParams(location.search);if(isIOS){const retry=new URL('./card_castle_fast.html',document.baseURI);retry.searchParams.set('iosRetry','1');const attempt=Math.max(0,Number(params.get('iosAttempt')||'0'))+1;retry.searchParams.set('iosAttempt',String(attempt));retry.searchParams.set('v',Date.now().toString());location.replace(retry.href);return}document.body.dataset.loaderError=String(error?.message||error)});
</script>
</body>
</html>
