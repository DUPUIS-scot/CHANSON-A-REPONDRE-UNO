<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'no-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  source=source.replace(
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';",
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';",
  );

  source=source.replace(
    "  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
    "  const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');dracoLoader.setWorkerLimit(2);dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
  );

  source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
  source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');
  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");
  source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");
  source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");

  // Flutter sends each published card image as rectoUrl. The old renderer still
  // looked for imagePath, so meshes were created but their preview textures never
  // loaded. Prefer rectoUrl and keep imagePath as a compatibility fallback.
  source=source.replace(
    'queueTexture(mesh,card.imagePath,state.generation)',
    'queueTexture(mesh,card.rectoUrl||card.imagePath,state.generation)',
  );

  // Allow already-resolved absolute card URLs to pass straight through instead
  // of incorrectly prepending another assets/ segment.
  source=source.replace(
    "function assetUrl(path){const clean=String(path||'').replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
    "function assetUrl(path){const value=String(path||'');if(/^(https?:|blob:|data:)/i.test(value))return value;const clean=value.replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
  );

  // The reduced-poly castle combines large architectural sections, so mesh-centre
  // anchors land inside the building. Raycast from a visitor-facing shell onto
  // the actual visible geometry instead, giving every card a real facade point
  // and an outward-facing normal.
  source=source.replace(
    "function deriveSurfaceAnchors(limit){const out=[];castleRoot.traverse(object=>{if(out.length>=limit||!object.isMesh||object.visible===false)return;const box=new THREE.Box3().setFromObject(object),center=box.getCenter(new THREE.Vector3());if(center.y>1.5&&center.y<22){const normal=center.clone().setY(0).normalize();if(normal.lengthSq())out.push({position:center.clone().addScaledVector(normal,.08),normal})}});while(out.length<limit){const i=out.length,a=i/limit*Math.PI*2;out.push({position:new THREE.Vector3(Math.sin(a)*18,4+(i%5)*2,Math.cos(a)*18),normal:new THREE.Vector3(Math.sin(a),0,Math.cos(a)).normalize()})}return out.slice(0,limit)}",
    "function deriveSurfaceAnchors(limit){const out=[];const bounds=new THREE.Box3().setFromObject(castleRoot),size=bounds.getSize(new THREE.Vector3()),center=bounds.getCenter(new THREE.Vector3()),ray=new THREE.Raycaster(),radius=Math.max(size.x,size.z)*.78+8;const heights=[.16,.26,.36,.47,.58,.69,.80];const angles=[];for(let i=0;i<17;i++)angles.push(-1.18+i*(2.36/16));for(const h of heights){const y=bounds.min.y+size.y*h;for(const angle of angles){if(out.length>=limit)break;const origin=new THREE.Vector3(center.x+Math.sin(angle)*radius,y,center.z+Math.cos(angle)*radius);const target=new THREE.Vector3(center.x,y,center.z);const direction=target.sub(origin).normalize();ray.set(origin,direction);ray.near=0;ray.far=radius*2.2;const hits=ray.intersectObject(castleRoot,true).filter(hit=>hit.object?.isMesh&&hit.object.visible!==false&&!hit.object.userData?.hiddenAsOutlier);const hit=hits[0];if(!hit)continue;const normal=hit.face?.normal?hit.face.normal.clone().transformDirection(hit.object.matrixWorld):origin.clone().sub(center).setY(0).normalize();if(normal.dot(direction)>0)normal.negate();normal.y=THREE.MathUtils.clamp(normal.y,-.2,.35);normal.normalize();const position=hit.point.clone().addScaledVector(normal,.16);if(out.some(anchor=>anchor.position.distanceToSquared(position)<2.2))continue;out.push({position,normal})}}if(out.length<limit){const frontZ=bounds.max.z+.18;const cols=10,rows=7;for(let r=0;r<rows&&out.length<limit;r++){for(let c=0;c<cols&&out.length<limit;c++){const x=THREE.MathUtils.lerp(bounds.min.x+size.x*.12,bounds.max.x-size.x*.12,c/(cols-1));const y=THREE.MathUtils.lerp(bounds.min.y+size.y*.18,bounds.min.y+size.y*.78,r/(rows-1));out.push({position:new THREE.Vector3(x,y,frontZ),normal:new THREE.Vector3(0,0,1)})}}}document.body.dataset.surfaceAnchorMode='raycast-facades';return out.slice(0,limit)}",
  );

  source=source.replace(
    '<body data-renderer-status="loading">',
    '<body data-renderer-status="loading" data-performance-loader="draco-exterior-v7-card-anchors">',
  );
  document.open();
  document.write(source);
  document.close();
})().catch(error=>{
  console.error('Castle loader failed; falling back to direct renderer.',error);
  const fallback=new URL('./card_castle.html',document.baseURI);
  fallback.search=location.search;
  location.replace(fallback.href);
});
</script>
</body>
</html>
