<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'force-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  const isIOS=/iP(?:hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const isWindows=/Windows/i.test(navigator.userAgent);
  const params=new URLSearchParams(location.search);
  const iosRetry=isIOS&&params.get('iosRetry')==='1';
  const textureConcurrency=isIOS?1:(isWindows?5:4);
  const xSamples=isIOS?8:(isWindows?18:20);
  const ySamples=isIOS?4:7;
  const zSamples=isIOS?5:(isWindows?12:14);

  source=source.replace("import { GLTFLoader } from '../vendor/GLTFLoader.js';","import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';");
  source=source.replace("  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);","  const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');dracoLoader.setDecoderConfig({type:"+(isIOS?"'js'":"'wasm'")+"});dracoLoader.setWorkerLimit("+(isIOS?1:2)+");dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);");
  source=source.replace("renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));",`renderer.setPixelRatio(Math.min(devicePixelRatio||1,${isIOS?1.1:1.35}));`);
  if(isIOS){source=source.replace("atmosphere.highQuality=matchMedia('(min-width: 1100px)').matches&&(navigator.hardwareConcurrency||4)>=6&&devicePixelRatio<=1.75;","atmosphere.highQuality=false;")}
  source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
  source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');
  source=source.replace("function loadCastle(){return new Promise((resolve,reject)=>{castleAssetLoader.load(CASTLE_URL,gltf=>{","function loadCastle(){window.__castleLoadState={startedAt:Date.now(),lastProgressAt:Date.now(),loaded:0,total:0,phase:'request',error:''};document.body.dataset.castleLoadPhase='request';return new Promise((resolve,reject)=>{castleAssetLoader.load(CASTLE_URL,gltf=>{window.__castleLoadState.phase='ready';window.__castleLoadState.lastProgressAt=Date.now();document.body.dataset.castleLoadPhase='ready';");
  source=source.replace("document.body.dataset.castleAnimations=String(gltf.animations.length);resolve()},undefined,reject)})}","document.body.dataset.castleAnimations=String(gltf.animations.length);resolve()},event=>{const loadState=window.__castleLoadState;if(!loadState)return;const now=Date.now(),loaded=Number(event&&event.loaded||0),total=Number(event&&event.total||0);if(loaded>loadState.loaded)loadState.lastProgressAt=now;loadState.loaded=loaded;if(total>0)loadState.total=total;loadState.phase=total>0&&loaded>=total?'decode':'download';document.body.dataset.castleLoadPhase=loadState.phase;document.body.dataset.castleLoadLoaded=String(loaded);if(total>0){document.body.dataset.castleLoadTotal=String(total);document.body.dataset.castleLoadProgress=String(Math.min(100,Math.round(loaded/total*100)))}},error=>{const loadState=window.__castleLoadState;if(loadState){loadState.error=String(error&&error.message||error);loadState.phase='error';loadState.lastProgressAt=Date.now()}document.body.dataset.castleLoadPhase='error';document.body.dataset.castleLoadError=String(error&&error.message||error);if(window.__castleReloadForLoadFailure){window.__castleReloadForLoadFailure('gltf-error');return}reject(error)})})}");
  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");
  source=source.replace('body.fullscreen-castle #enter-fullscreen{display:none}','body.fullscreen-castle #enter-fullscreen{display:none}#return-exterior{display:none}body[data-scene-mode="interior"] #return-exterior{display:flex}');
  source=source.replace('<button id="castle-reset" class="castle-control" type="button" aria-label="Réinitialiser la vue">','<button id="return-exterior" class="castle-control" type="button" aria-label="Retour à l’extérieur"><span class="control-medallion">↩</span><span class="control-copy"><span class="control-title">EXTÉRIEUR</span><span class="control-subtitle">Retour au château</span></span></button>\n      <button id="castle-reset" class="castle-control" type="button" aria-label="Réinitialiser la vue">');
  source=source.replace("function switchToInterior(){if(!state.interiorReady||!interiorRoot)return false;state.sceneMode='interior';document.body.dataset.sceneMode='interior';castleRoot.visible=false;interiorRoot.visible=true;cardGroup.visible=false;orbit.yaw=.15;orbit.pitch=.18;orbit.distance=29;orbit.target.set(0,6.7,0);updateOrbit();return true}","function setInteriorStartingView(){orbit.yaw=0;orbit.pitch=.10;orbit.distance=24;orbit.target.set(0,7.9,-1.8);state.targetCamera=null;state.targetLook=null;updateOrbit();document.body.dataset.interiorStartingView='construction-panel-staircase-throne'}function switchToInterior(){if(!state.interiorReady||!interiorRoot)return false;state.sceneMode='interior';document.body.dataset.sceneMode='interior';castleRoot.visible=false;interiorRoot.visible=true;cardGroup.visible=false;setInteriorStartingView();return true}function switchToExterior(){if(!castleRoot)return false;state.sceneMode='exterior';state.entranceStarted=false;document.body.dataset.sceneMode='exterior';castleRoot.visible=true;if(interiorRoot)interiorRoot.visible=false;cardGroup.visible=true;state.targetCamera=null;state.targetLook=null;setDefaultView();updateSceneCount();return true}");
  source=source.replace("document.getElementById('castle-reset')?.addEventListener","document.getElementById('return-exterior')?.addEventListener('click',()=>switchToExterior(),{signal:abort.signal});document.getElementById('castle-reset')?.addEventListener");
  source=source.replace('queueTexture(mesh,card.imagePath,state.generation)','queueTexture(mesh,castleRectoUrl(card.rectoUrl||card.imagePath),state.generation)');
  source=source.replace("function assetUrl(path){const clean=String(path||'').replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}","function castleRectoUrl(path){const value=String(path||'');try{const url=new URL(value,document.baseURI);if(url.origin===location.origin&&url.pathname.includes('/assets/')&&!url.pathname.includes('/assets/assets/'))url.pathname=url.pathname.replace('/assets/','/assets/assets/');return url.href}catch(_){return value}}function assetUrl(path){const value=String(path||'');if(/^(https?:|blob:|data:)/i.test(value))return value;const clean=value.replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}");
  source=source.replace('state.loadQueue.push({mesh,url,generation});pumpTextureQueue()','state.loadQueue.push({mesh,url,generation,retries:0});pumpTextureQueue()');source=source.replace('while(state.activeLoads<4&&state.loadQueue.length)',`while(state.activeLoads<${textureConcurrency}&&state.loadQueue.length)`);source=source.replace('},undefined,()=>{state.activeLoads--;pumpTextureQueue()})}}',"},undefined,()=>{if(job.retries<2){job.retries++;setTimeout(()=>{if(job.generation===state.generation&&job.mesh.parent){state.loadQueue.push(job);pumpTextureQueue()}},260*job.retries)}state.activeLoads--;pumpTextureQueue()})}}");
  source=source.replace(/function deriveSurfaceAnchors\(limit\)\{[\s\S]*?return out\.slice\(0,limit\)\}/,`function deriveSurfaceAnchors(limit){const out=[];const bounds=new THREE.Box3().setFromObject(castleRoot);const size=bounds.getSize(new THREE.Vector3());const ray=new THREE.Raycaster();const minY=bounds.min.y+size.y*.47,maxY=bounds.min.y+size.y*.94,minSpacingSq=1.35*1.35;const addHit=(hit,outward)=>{if(!hit||out.length>=limit||hit.point.y<minY||hit.point.y>maxY)return;const normal=hit.face?.normal?hit.face.normal.clone().transformDirection(hit.object.matrixWorld):outward.clone();if(normal.dot(outward)<0)normal.negate();if(Math.abs(normal.y)>.72)return;normal.y=THREE.MathUtils.clamp(normal.y,-.18,.28);normal.normalize();const position=hit.point.clone().addScaledVector(normal,.12);if(out.some(anchor=>anchor.position.distanceToSquared(position)<minSpacingSq))return;out.push({position,normal})};const meshes=[];castleRoot.traverse(object=>{if(object.isMesh&&object.visible!==false&&!object.userData?.hiddenAsOutlier)meshes.push(object)});const cast=(origin,direction,outward)=>{ray.set(origin,direction);ray.near=0;ray.far=Math.max(size.x,size.z)*2.6;const hits=ray.intersectObjects(meshes,false);for(const hit of hits){if(hit.point.y>=minY&&hit.point.y<=maxY){addHit(hit,outward);break}}};const xSamples=${xSamples},ySamples=${ySamples},zSamples=${zSamples};const frontZ=bounds.max.z+Math.max(8,size.z*.45);for(let yi=0;yi<ySamples&&out.length<limit;yi++){const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));for(let xi=0;xi<xSamples&&out.length<limit;xi++){const x=THREE.MathUtils.lerp(bounds.min.x+size.x*.04,bounds.max.x-size.x*.04,xi/(xSamples-1));cast(new THREE.Vector3(x,y,frontZ),new THREE.Vector3(0,0,-1),new THREE.Vector3(0,0,1))}}for(const side of[-1,1]){const x=side<0?bounds.min.x-Math.max(8,size.x*.35):bounds.max.x+Math.max(8,size.x*.35),direction=new THREE.Vector3(-side,0,0),outward=new THREE.Vector3(side,0,0);for(let yi=0;yi<ySamples&&out.length<limit;yi++){const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));for(let zi=0;zi<zSamples&&out.length<limit;zi++){const z=THREE.MathUtils.lerp(bounds.min.z+size.z*.06,bounds.max.z-size.z*.06,zi/(zSamples-1));cast(new THREE.Vector3(x,y,z),direction,outward)}}}document.body.dataset.surfaceAnchorMode='platform-fast-raycasts-v26';document.body.dataset.surfaceAnchorCount=String(out.length);return out.slice(0,limit)}`);

  const originalInteriorPreload="    state.interiorLoadPromise=loadInterior().catch(error=>{document.body.dataset.interiorReady='false';document.body.dataset.interiorError=String(error?.message||error);return null});";
  source=source.replace(originalInteriorPreload,"    state.interiorLoadPromise=null;document.body.dataset.interiorReady='deferred-until-entrance';");

  source=source.replace("  const ENTRANCE_VIDEO_URL=new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;","  const ENTRANCE_VIDEO_URL=new URL('../assets/assets/videos/castle_entrance.mp4',document.baseURI).href;\n  const EXTERIOR_GROUND_URL=new URL('../assets/assets/images/castle_exterior_ground.png',document.baseURI).href;\n  const EXTERIOR_ATMOSPHERE_URL=new URL('../assets/assets/images/castle_exterior_atmosphere.png',document.baseURI).href;");
  source=source.replace(/function buildEnvironment\(\)\{[\s\S]*?document\.body\.dataset\.logoForecourt='[^']+';\n  \}/,`function buildEnvironment(){const base=new THREE.Mesh(new THREE.CircleGeometry(72,64),new THREE.MeshStandardMaterial({color:0x081119,roughness:.98,metalness:.01}));base.rotation.x=-Math.PI/2;base.position.y=-.14;scene.add(base);const startupSky=new THREE.Mesh(new THREE.SphereGeometry(130,16,10),new THREE.MeshBasicMaterial({color:0x081522,side:THREE.BackSide,fog:false}));scene.add(startupSky);document.body.dataset.logoForecourt='startup-minimal-exterior-first';document.body.dataset.exteriorEnvironment='deferred'}function loadDeferredEnvironment(){if(document.body.dataset.exteriorEnvironment==='loading'||document.body.dataset.exteriorEnvironment==='ready')return;document.body.dataset.exteriorEnvironment='loading';let remaining=2;const done=()=>{remaining--;if(remaining<=0){document.body.dataset.exteriorEnvironment='ready';window.dispatchEvent(new CustomEvent('castleExteriorEnvironmentReady'))}};new THREE.TextureLoader().load(EXTERIOR_GROUND_URL,groundTexture=>{groundTexture.colorSpace=THREE.SRGBColorSpace;groundTexture.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),isIOS?2:4);groundTexture.wrapS=groundTexture.wrapT=THREE.ClampToEdgeWrapping;groundTexture.center.set(.5,.5);groundTexture.rotation=Math.PI;groundTexture.needsUpdate=true;const plaza=new THREE.Mesh(new THREE.CircleGeometry(38,72),new THREE.MeshStandardMaterial({map:groundTexture,color:0xffffff,roughness:.78,metalness:.01}));plaza.rotation.x=-Math.PI/2;plaza.position.set(0,-.035,15.8);plaza.scale.set(1,.78,1);scene.add(plaza);document.body.dataset.exteriorGround='uploaded-ground-deferred';done()},undefined,done);new THREE.TextureLoader().load(EXTERIOR_ATMOSPHERE_URL,atmosphereTexture=>{atmosphereTexture.colorSpace=THREE.SRGBColorSpace;atmosphereTexture.needsUpdate=true;const sky=new THREE.Mesh(new THREE.SphereGeometry(130,24,14),new THREE.MeshBasicMaterial({map:atmosphereTexture,side:THREE.BackSide,fog:false}));sky.rotation.y=Math.PI;scene.add(sky);document.body.dataset.exteriorAtmosphere='uploaded-atmosphere-deferred';done()},undefined,done)}`);
  source=source.replace("resume();emit('rendererReady');",`resume();emit('rendererReady');const deferExterior=()=>loadDeferredEnvironment();if('requestIdleCallback'in window)requestIdleCallback(deferExterior,{timeout:${isIOS?1200:500}});else setTimeout(deferExterior,${isIOS?500:100});`);
  source=source.replace("scene.fog=new THREE.FogExp2(0x08131e,.0062)","scene.fog=new THREE.FogExp2(0x07111d,.0048)");source=source.replace("const moon=new THREE.DirectionalLight(0xd9ecff,7.8);moon.position.set(-18,38,4)","const moon=new THREE.DirectionalLight(0xcfe5ff,8.8);moon.position.set(-24,42,6)");
  source=source.replace('<body data-renderer-status="loading">',`<body data-renderer-status="loading" data-performance-loader="${isIOS?(iosRetry?'ios-draco-exterior-first-retry-v26':'ios-draco-exterior-first-v26'):(isWindows?'windows-draco-wasm-v26':'draco-wasm-v26')}">`);
  if(isIOS){source=source.replace('<script type="module">',`<script>(function(){var bootStarted=Date.now(),reloading=false;function reload(reason){if(reloading||document.body.classList.contains('ready')||document.body.dataset.rendererStatus==='ready')return;reloading=true;var retry=new URL('./card_castle_fast.html',document.baseURI);retry.searchParams.set('iosRetry','1');var attempt=Math.max(0,Number(new URLSearchParams(location.search).get('iosAttempt')||'0'))+1;retry.searchParams.set('iosAttempt',String(attempt));retry.searchParams.set('retryReason',String(reason||'load-failure'));retry.searchParams.set('v',Date.now().toString());location.replace(retry.href)}window.__castleReloadForLoadFailure=reload;var timer=setInterval(function(){if(document.body.classList.contains('ready')||document.body.dataset.rendererStatus==='ready'){clearInterval(timer);return}var loadState=window.__castleLoadState;if(!loadState){if(Date.now()-bootStarted>60000)reload('boot-stall');return}if(loadState.error){reload('gltf-error');return}var idle=Date.now()-(loadState.lastProgressAt||loadState.startedAt||bootStarted);var stallLimit=loadState.phase==='decode'?180000:60000;if(idle>stallLimit)reload('stalled-'+String(loadState.phase||'load'))},10000)})();<\/script>\n  <script type="module">`)}
  document.open();document.write(source);document.close();
})().catch(error=>{console.error('Castle loader failed.',error);const isIOS=/iP(?:hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const params=new URLSearchParams(location.search);if(isIOS){const retry=new URL('./card_castle_fast.html',document.baseURI);retry.searchParams.set('iosRetry','1');const attempt=Math.max(0,Number(params.get('iosAttempt')||'0'))+1;retry.searchParams.set('iosAttempt',String(attempt));retry.searchParams.set('retryReason','bootstrap-error');retry.searchParams.set('v',Date.now().toString());location.replace(retry.href);return}document.body.dataset.loaderError=String(error?.message||error)});
</script>
</body>
</html>
