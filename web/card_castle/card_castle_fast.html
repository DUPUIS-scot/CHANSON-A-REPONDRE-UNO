<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'no-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  source=source.replace(
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';",
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';",
  );

  source=source.replace(
    "  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
    "  const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');dracoLoader.setWorkerLimit(2);dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
  );

  source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
  source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');
  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");
  source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");
  source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");

  source=source.replace(
    '<body data-renderer-status="loading">',
    '<body data-renderer-status="loading" data-performance-loader="draco-exterior-v6">',
  );
  document.open();
  document.write(source);
  document.close();
})().catch(error=>{
  console.error('Castle loader failed; falling back to direct renderer.',error);
  const fallback=new URL('./card_castle.html',document.baseURI);
  fallback.search=location.search;
  location.replace(fallback.href);
});
</script>
</body>
</html>
