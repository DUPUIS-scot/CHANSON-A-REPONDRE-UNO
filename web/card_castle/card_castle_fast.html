<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'no-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  source=source.replace(
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';",
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';",
  );

  source=source.replace(
    "  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
    "  const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');dracoLoader.setWorkerLimit(2);dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
  );

  source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
  source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');
  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");
  source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");
  source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");

  // Flutter now supplies a correctly resolved rectoUrl. Use that exact URL.
  source=source.replace(
    'queueTexture(mesh,card.imagePath,state.generation)',
    'queueTexture(mesh,card.rectoUrl||card.imagePath,state.generation)',
  );
  source=source.replace(
    "function assetUrl(path){const clean=String(path||'').replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
    "function assetUrl(path){const value=String(path||'');if(/^(https?:|blob:|data:)/i.test(value))return value;const clean=value.replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
  );

  // Sample real upper castle geometry only. Every anchor is an actual raycast hit
  // on a rampart/parapet surface; no synthetic floating wall is generated.
  source=source.replace(
    /function deriveSurfaceAnchors\(limit\)\{[\s\S]*?return out\.slice\(0,limit\)\}/,
    `function deriveSurfaceAnchors(limit){
      const out=[];
      const bounds=new THREE.Box3().setFromObject(castleRoot);
      const size=bounds.getSize(new THREE.Vector3());
      const center=bounds.getCenter(new THREE.Vector3());
      const ray=new THREE.Raycaster();
      const minY=bounds.min.y+size.y*.47;
      const maxY=bounds.min.y+size.y*.94;
      const minSpacingSq=1.35*1.35;
      const addHit=(hit,outward)=>{
        if(!hit||out.length>=limit)return;
        if(hit.point.y<minY||hit.point.y>maxY)return;
        const normal=hit.face?.normal
          ? hit.face.normal.clone().transformDirection(hit.object.matrixWorld)
          : outward.clone();
        if(normal.dot(outward)<0)normal.negate();
        if(Math.abs(normal.y)>.72)return;
        normal.y=THREE.MathUtils.clamp(normal.y,-.18,.28);
        normal.normalize();
        const position=hit.point.clone().addScaledVector(normal,.12);
        if(out.some(anchor=>anchor.position.distanceToSquared(position)<minSpacingSq))return;
        out.push({position,normal});
      };
      const meshes=[];
      castleRoot.traverse(object=>{if(object.isMesh&&object.visible!==false&&!object.userData?.hiddenAsOutlier)meshes.push(object)});
      const cast=(origin,direction,outward)=>{
        ray.set(origin,direction);
        ray.near=0;ray.far=Math.max(size.x,size.z)*2.6;
        const hits=ray.intersectObjects(meshes,false);
        for(const hit of hits){
          if(hit.point.y>=minY&&hit.point.y<=maxY){addHit(hit,outward);break}
        }
      };
      const xSamples=30,ySamples=10,zSamples=24;
      const frontZ=bounds.max.z+Math.max(8,size.z*.45);
      for(let yi=0;yi<ySamples&&out.length<limit;yi++){
        const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));
        for(let xi=0;xi<xSamples&&out.length<limit;xi++){
          const x=THREE.MathUtils.lerp(bounds.min.x+size.x*.04,bounds.max.x-size.x*.04,xi/(xSamples-1));
          cast(new THREE.Vector3(x,y,frontZ),new THREE.Vector3(0,0,-1),new THREE.Vector3(0,0,1));
        }
      }
      for(const side of [-1,1]){
        const x=side<0?bounds.min.x-Math.max(8,size.x*.35):bounds.max.x+Math.max(8,size.x*.35);
        const direction=new THREE.Vector3(-side,0,0);
        const outward=new THREE.Vector3(side,0,0);
        for(let yi=0;yi<ySamples&&out.length<limit;yi++){
          const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));
          for(let zi=0;zi<zSamples&&out.length<limit;zi++){
            const z=THREE.MathUtils.lerp(bounds.min.z+size.z*.06,bounds.max.z-size.z*.06,zi/(zSamples-1));
            cast(new THREE.Vector3(x,y,z),direction,outward);
          }
        }
      }
      document.body.dataset.surfaceAnchorMode='real-rampart-raycasts-v10';
      document.body.dataset.surfaceAnchorCount=String(out.length);
      return out.slice(0,limit);
    }`,
  );

  source=source.replace(
    '<body data-renderer-status="loading">',
    '<body data-renderer-status="loading" data-performance-loader="draco-rampart-raycast-v10">',
  );
  document.open();
  document.write(source);
  document.close();
})().catch(error=>{
  console.error('Castle loader failed; falling back to direct renderer.',error);
  const fallback=new URL('./card_castle.html',document.baseURI);
  fallback.search=location.search;
  location.replace(fallback.href);
});
</script>
</body>
</html>
