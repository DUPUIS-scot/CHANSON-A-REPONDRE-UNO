<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  const response=await fetch(sourceUrl,{cache:'force-cache'});
  if(!response.ok) throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  const replace=(label,before,after)=>{
    if(!source.includes(before)) throw new Error(`Castle performance patch missing: ${label}`);
    source=source.replace(before,after);
  };

  replace('state performance fields',"    sceneMode:'exterior', interiorReady:false, interiorLoadPromise:null,\n","    sceneMode:'exterior', interiorReady:false, interiorLoadPromise:null,\n    interiorLoadStarted:false, performanceEnhanced:false,\n");
  replace('initial pixel ratio',"    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));","    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.25));");
  replace('initial shadows',"    renderer.shadowMap.enabled=atmosphere.highQuality;","    renderer.shadowMap.enabled=false;");
  replace('defer logo',"    scene.add(ground);\n    buildLogoForecourt();","    scene.add(ground);\n    scheduleIdle(()=>buildLogoForecourt(),900);");
  replace('defer exterior atmosphere',"    halo.position.copy(moon.position);halo.scale.set(27,27,1);scene.add(halo);\n\n    const cloudTexture=buildCloudTexture();","    halo.position.copy(moon.position);halo.scale.set(27,27,1);scene.add(halo);\n    scheduleIdle(buildDeferredAtmosphere,650);\n    return;\n\n    const cloudTexture=buildCloudTexture();");
  replace('defer architectural lights',"    rim.position.set(30,22,-26);\n    scene.add(rim);\n    const architecturalLights=[","    rim.position.set(30,22,-26);\n    scene.add(rim);\n    scheduleIdle(buildDeferredArchitecturalLights,750);\n    return;\n    const architecturalLights=[");

  const immediateInterior=`    state.interiorLoadPromise=loadInterior().catch(error=>{\n      document.body.dataset.interiorReady='false';\n      document.body.dataset.interiorError=String(error?.message||error);\n      console.warn('Castle interior GLB failed to preload.',{url:INTERIOR_URL,error});\n      return null;\n    });`;
  replace('defer interior preload',immediateInterior,"    document.body.dataset.interiorReady='deferred';");
  replace('cached surface anchors',"        state.surfaceAnchors=deriveSurfaceAnchors(84);","        const cachedAnchors=restoreCachedAnchors();\n        state.surfaceAnchors=cachedAnchors||deriveSurfaceAnchors(84);\n        if(!cachedAnchors)persistCachedAnchors(state.surfaceAnchors);\n        document.body.dataset.surfaceAnchorSource=cachedAnchors?'cache':'geometry';");
  replace('texture priority queue',"    state.loadQueue.push({mesh,url,generation});pumpTextureQueue();","    const toCamera=mesh.position.distanceToSquared(camera.position);\n    const viewDirection=new THREE.Vector3();camera.getWorldDirection(viewDirection);\n    const toward=mesh.position.clone().sub(camera.position).normalize().dot(viewDirection);\n    const priority=toCamera-(toward>.35?1200:0)-(state.meshes.indexOf(mesh)<12?5000:0);\n    state.loadQueue.push({mesh,url,generation,priority});\n    state.loadQueue.sort((a,b)=>a.priority-b.priority);\n    pumpTextureQueue();");
  replace('texture concurrency',"    while(state.activeLoads<8&&state.loadQueue.length){","    const limit=state.frame<120?3:6;\n    while(state.activeLoads<limit&&state.loadQueue.length){");
  replace('entrance preloads interior',"  function beginEntranceSequence(){\n    if(document.body.classList.contains('entrance-video-active'))return;","  function beginEntranceSequence(){\n    if(document.body.classList.contains('entrance-video-active'))return;\n    ensureInteriorPreload();");
  replace('wait for interior after transition',"      switchToInterior();","      if(!switchToInterior()){\n        state.interiorLoadPromise?.then(()=>switchToInterior());\n      }");
  replace('ready enhancements',"    resume();\n    emit('rendererReady');","    resume();\n    emit('rendererReady');\n    scheduleIdle(enableEnhancedQuality,1400);\n    scheduleIdle(()=>ensureInteriorPreload(),2600);");

  const helpers=`\n  function scheduleIdle(callback,timeout=1000){\n    if(state.disposed)return;\n    if('requestIdleCallback' in window){\n      requestIdleCallback(()=>{if(!state.disposed)callback();},{timeout});\n    }else{\n      setTimeout(()=>{if(!state.disposed)callback();},Math.min(timeout,900));\n    }\n  }\n\n  function buildDeferredAtmosphere(){\n    if(state.disposed||document.body.dataset.deferredAtmosphere==='ready')return;\n    document.body.dataset.deferredAtmosphere='loading';\n    const cloudTexture=buildCloudTexture();\n    [\n      [-62,20,-37,42,12,.62],[-78,15,-34,34,9,.42],\n      [-45,26,-49,38,10,.26],[28,19,-76,54,13,.18],\n    ].forEach(([x,y,z,w,h,opacity])=>{\n      const cloud=new THREE.Sprite(new THREE.SpriteMaterial({\n        map:cloudTexture,transparent:true,opacity,depthWrite:false,\n        color:0x708399,fog:false,toneMapped:false,\n      }));\n      cloud.position.set(x,y,z);cloud.scale.set(w,h,1);scene.add(cloud);\n    });\n    const mistTexture=radialTexture('rgba(153,181,198,.38)',512,128);\n    [\n      [-26,2,-4,42,8,.18],[24,3,-8,46,9,.15],[-14,6,-22,54,10,.12],\n      [7,1,23,36,7,.11],\n    ].forEach(([x,y,z,w,h,opacity])=>{\n      const mist=new THREE.Sprite(new THREE.SpriteMaterial({\n        map:mistTexture,transparent:true,opacity,depthWrite:false,\n        color:0x8ea9bb,fog:true,toneMapped:false,\n      }));\n      mist.position.set(x,y,z);mist.scale.set(w,h,1);scene.add(mist);atmosphere.mist.push(mist);\n    });\n    document.body.dataset.deferredAtmosphere='ready';\n  }\n\n  function buildDeferredArchitecturalLights(){\n    if(state.disposed||document.body.dataset.deferredLights==='ready')return;\n    const architecturalLights=[\n      [0,5,18,32,26],[-10,4,16,19,20],[10,4,16,19,20],\n      [0,2,24,22,19],[-17,3,13,14,16],[17,3,13,14,16],\n      [0,8,6,24,22],[-11,8,6,16,17],[11,8,6,16,17],\n      [-19,7,1,13,15],[19,7,1,13,15],\n      [-12,13,-6,14,16],[0,16,-8,17,18],[12,13,-6,14,16],\n    ];\n    architecturalLights.slice(0,atmosphere.highQuality?architecturalLights.length:8).forEach(([x,y,z,intensity,distance])=>{\n      const warm=new THREE.PointLight(0xffa34d,intensity,distance,2.15);\n      warm.position.set(x,y,z);scene.add(warm);atmosphere.warmLights.push(warm);\n    });\n    if(atmosphere.highQuality){\n      addArchitecturalSpot([0,12,25],[0,5,12],0xffa45b,34,.58);\n      addArchitecturalSpot([-15,15,13],[-8,5,7],0xffb06a,22,.52);\n    }\n    document.body.dataset.warmLightCount=String(atmosphere.warmLights.length);\n    document.body.dataset.deferredLights='ready';\n  }\n\n  function enableEnhancedQuality(){\n    if(state.performanceEnhanced||state.disposed)return;\n    state.performanceEnhanced=true;\n    renderer.shadowMap.enabled=atmosphere.highQuality;\n    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));\n    resize();\n    document.body.dataset.performanceEnhanced='true';\n  }\n\n  function anchorCacheKey(){return 'castle-surface-anchors-v3-search-castle';}\n\n  function restoreCachedAnchors(){\n    try{\n      const parsed=JSON.parse(localStorage.getItem(anchorCacheKey())||'null');\n      if(!Array.isArray(parsed)||parsed.length<84)return null;\n      return parsed.slice(0,84).map(item=>({\n        position:new THREE.Vector3(...item.p),normal:new THREE.Vector3(...item.n),\n        score:item.s||0,sector:item.c||0,level:item.l||0,\n      }));\n    }catch(_){return null}\n  }\n\n  function persistCachedAnchors(anchors){\n    try{\n      localStorage.setItem(anchorCacheKey(),JSON.stringify(anchors.slice(0,84).map(anchor=>({\n        p:anchor.position.toArray(),n:anchor.normal.toArray(),s:anchor.score||0,c:anchor.sector||0,l:anchor.level||0,\n      }))));\n    }catch(_){}\n  }\n\n  function ensureInteriorPreload(){\n    if(state.interiorReady)return Promise.resolve(interiorRoot);\n    if(state.interiorLoadPromise)return state.interiorLoadPromise;\n    state.interiorLoadStarted=true;\n    document.body.dataset.interiorReady='loading';\n    state.interiorLoadPromise=loadInterior().catch(error=>{\n      document.body.dataset.interiorReady='false';\n      document.body.dataset.interiorError=String(error?.message||error);\n      console.warn('Castle interior GLB failed to preload.',{url:INTERIOR_URL,error});\n      return null;\n    });\n    return state.interiorLoadPromise;\n  }\n`;
  replace('performance helpers',"  function loadInterior(){",helpers+"\n  function loadInterior(){");
  source=source.replace('<body data-renderer-status="loading">','<body data-renderer-status="loading" data-performance-loader="staged-v3">');
  document.open();document.write(source);document.close();
})().catch(error=>{\n  console.error('Fast Castle loader failed; falling back to direct Castle.',error);\n  location.replace(new URL('./card_castle.html',document.baseURI).href);\n});
</script>
</body>
</html>
