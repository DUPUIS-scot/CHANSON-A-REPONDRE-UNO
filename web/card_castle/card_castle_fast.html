<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="//unpkg.com">
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'force-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  const isIOS=/iP(?:hone|ad|od)/.test(navigator.userAgent)||
    (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

  if(isIOS){
    source=source.replace(
      '../assets/assets/models/castle_exterior.glb',
      '../assets/assets/models/search_castle.glb',
    );
  }else{
    source=source.replace(
      "import { GLTFLoader } from '../vendor/GLTFLoader.js';",
      "import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';",
    );
    source=source.replace(
      "  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
      "  const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');dracoLoader.setWorkerLimit(2);dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
    );
    source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
    source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');
  }

  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");
  source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");
  source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");

  source=source.replace(
    'queueTexture(mesh,card.imagePath,state.generation)',
    'queueTexture(mesh,castleRectoUrl(card.rectoUrl||card.imagePath),state.generation)',
  );
  source=source.replace(
    "function assetUrl(path){const clean=String(path||'').replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
    "function castleRectoUrl(path){const value=String(path||'');try{const url=new URL(value,document.baseURI);if(url.origin===location.origin&&url.pathname.includes('/assets/')&&!url.pathname.includes('/assets/assets/'))url.pathname=url.pathname.replace('/assets/','/assets/assets/');return url.href}catch(_){return value}}function assetUrl(path){const value=String(path||'');if(/^(https?:|blob:|data:)/i.test(value))return value;const clean=value.replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
  );

  // Keep card texture decoding from competing too aggressively with first paint.
  source=source.replace(
    'state.loadQueue.push({mesh,url,generation});pumpTextureQueue()',
    'state.loadQueue.push({mesh,url,generation,retries:0});pumpTextureQueue()',
  );
  source=source.replace(
    'while(state.activeLoads<4&&state.loadQueue.length)',
    'while(state.activeLoads<2&&state.loadQueue.length)',
  );
  source=source.replace(
    '},undefined,()=>{state.activeLoads--;pumpTextureQueue()})}}',
    "},undefined,()=>{if(job.retries<2){job.retries++;setTimeout(()=>{if(job.generation===state.generation&&job.mesh.parent){state.loadQueue.push(job);pumpTextureQueue()}},220*job.retries)}state.activeLoads--;pumpTextureQueue()})}}",
  );

  // Derive real rampart anchors with a smaller sampling grid. This keeps the
  // same surface-based placement while removing hundreds of startup raycasts.
  source=source.replace(
    /function deriveSurfaceAnchors\(limit\)\{[\s\S]*?return out\.slice\(0,limit\)\}/,
    `function deriveSurfaceAnchors(limit){
      const out=[];
      const bounds=new THREE.Box3().setFromObject(castleRoot);
      const size=bounds.getSize(new THREE.Vector3());
      const ray=new THREE.Raycaster();
      const minY=bounds.min.y+size.y*.47;
      const maxY=bounds.min.y+size.y*.94;
      const minSpacingSq=1.35*1.35;
      const addHit=(hit,outward)=>{
        if(!hit||out.length>=limit)return;
        if(hit.point.y<minY||hit.point.y>maxY)return;
        const normal=hit.face?.normal?hit.face.normal.clone().transformDirection(hit.object.matrixWorld):outward.clone();
        if(normal.dot(outward)<0)normal.negate();
        if(Math.abs(normal.y)>.72)return;
        normal.y=THREE.MathUtils.clamp(normal.y,-.18,.28);
        normal.normalize();
        const position=hit.point.clone().addScaledVector(normal,.12);
        if(out.some(anchor=>anchor.position.distanceToSquared(position)<minSpacingSq))return;
        out.push({position,normal});
      };
      const meshes=[];
      castleRoot.traverse(object=>{if(object.isMesh&&object.visible!==false&&!object.userData?.hiddenAsOutlier)meshes.push(object)});
      const cast=(origin,direction,outward)=>{
        ray.set(origin,direction);ray.near=0;ray.far=Math.max(size.x,size.z)*2.6;
        const hits=ray.intersectObjects(meshes,false);
        for(const hit of hits){if(hit.point.y>=minY&&hit.point.y<=maxY){addHit(hit,outward);break}}
      };
      const xSamples=22,ySamples=8,zSamples=16;
      const frontZ=bounds.max.z+Math.max(8,size.z*.45);
      for(let yi=0;yi<ySamples&&out.length<limit;yi++){
        const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));
        for(let xi=0;xi<xSamples&&out.length<limit;xi++){
          const x=THREE.MathUtils.lerp(bounds.min.x+size.x*.04,bounds.max.x-size.x*.04,xi/(xSamples-1));
          cast(new THREE.Vector3(x,y,frontZ),new THREE.Vector3(0,0,-1),new THREE.Vector3(0,0,1));
        }
      }
      for(const side of [-1,1]){
        const x=side<0?bounds.min.x-Math.max(8,size.x*.35):bounds.max.x+Math.max(8,size.x*.35);
        const direction=new THREE.Vector3(-side,0,0),outward=new THREE.Vector3(side,0,0);
        for(let yi=0;yi<ySamples&&out.length<limit;yi++){
          const y=THREE.MathUtils.lerp(minY,maxY,yi/(ySamples-1));
          for(let zi=0;zi<zSamples&&out.length<limit;zi++){
            const z=THREE.MathUtils.lerp(bounds.min.z+size.z*.06,bounds.max.z-size.z*.06,zi/(zSamples-1));
            cast(new THREE.Vector3(x,y,z),direction,outward);
          }
        }
      }
      document.body.dataset.surfaceAnchorMode='real-rampart-raycasts-v15';
      document.body.dataset.surfaceAnchorCount=String(out.length);
      return out.slice(0,limit);
    }`,
  );

  // Exterior first: expose a usable castle immediately and preload the interior
  // only once the browser has had an idle window. Gate entry can still trigger
  // loadInterior immediately through ensureInteriorReady when needed.
  source=source.replace(
    '    state.interiorLoadPromise=loadInterior()',
    "    window.__castleSearchRuntime={scene,camera,renderer,orbit,updateOrbit,get castleRoot(){return castleRoot},get interiorRoot(){return interiorRoot}};window.dispatchEvent(new CustomEvent('castleRuntimeReady'));\n    state.interiorLoadPromise=null;const preloadInterior=()=>{if(state.disposed||state.interiorReady||state.interiorLoadPromise)return;state.interiorLoadPromise=loadInterior().catch(error=>{document.body.dataset.interiorReady='false';document.body.dataset.interiorError=String(error?.message||error);state.interiorLoadPromise=null;return null})};if('requestIdleCallback'in window)requestIdleCallback(preloadInterior,{timeout:4500});else setTimeout(preloadInterior,2200)",
  );
  source=source.replace(
    '<body data-renderer-status="loading">',
    `<body data-renderer-status="loading" data-performance-loader="${isIOS?'ios-legacy-exterior-v15':'draco-exterior-v15'}">`,
  );
  document.open();
  document.write(source);
  document.close();
})().catch(error=>{
  console.error('Castle loader failed; falling back to direct renderer.',error);
  const fallback=new URL('./card_castle.html',document.baseURI);
  fallback.search=location.search;
  location.replace(fallback.href);
});
</script>
</body>
</html>
