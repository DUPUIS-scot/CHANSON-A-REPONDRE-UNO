<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(() => {
  // Emergency compatibility loader. The previous transform wrapper embedded a
  // literal closing script tag inside its own script source, causing browsers
  // to terminate this script early and render the remaining JavaScript as text.
  // Route directly to the stable Castle document while preserving query args.
  const target = new URL('./card_castle.html', document.baseURI);
  target.search = location.search;
  location.replace(target.href);
})();
</script>
</body>
</html>
