<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Castle loader</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060b}</style>
</head>
<body>
<script>
(async()=>{
  const sourceUrl=new URL('./card_castle.html',document.baseURI);
  sourceUrl.search=location.search;
  const response=await fetch(sourceUrl,{cache:'no-cache'});
  if(!response.ok)throw new Error(`Castle source ${response.status}`);
  let source=await response.text();

  source=source.replace(
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';",
    "import { GLTFLoader } from '../vendor/GLTFLoader.js';\n  import { DRACOLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/DRACOLoader.js';",
  );

  source=source.replace(
    "  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
    "  const dracoLoader=new DRACOLoader();dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');dracoLoader.setWorkerLimit(2);dracoLoader.preload();const castleAssetLoader=new GLTFLoader();castleAssetLoader.setDRACOLoader(dracoLoader);\n  const cardGeometry=new THREE.BoxGeometry(1.08,1.62,.035),cardForward=new THREE.Vector3(0,0,1);",
  );

  source=source.replaceAll('new GLTFLoader().load(CASTLE_URL','castleAssetLoader.load(CASTLE_URL');
  source=source.replaceAll('new GLTFLoader().load(INTERIOR_URL','castleAssetLoader.load(INTERIOR_URL');
  source=source.replaceAll("emit('cardTap'","emit('cardSelected'");
  source=source.replaceAll("emit('cardLongPress'","emit('cardLongPressed'");
  source=source.replaceAll("emit('backToCategories'","emit('categoriesRequested'");

  // Flutter supplies rectoUrl. Some existing URLs contain a deliberately encoded
  // percent sequence that the Dart bridge encoded once more. Decode only that
  // extra layer here, then load the exact public recto URL.
  source=source.replace(
    'queueTexture(mesh,card.imagePath,state.generation)',
    "queueTexture(mesh,String(card.rectoUrl||card.imagePath||'').replace(/%25/g,'%'),state.generation)",
  );
  source=source.replace(
    "function assetUrl(path){const clean=String(path||'').replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
    "function assetUrl(path){const value=String(path||'');if(/^(https?:|blob:|data:)/i.test(value))return value;const clean=value.replace(/^\\/+/,''),normalized=clean.startsWith('assets/')?clean:`assets/${clean}`;return new URL(`../${normalized}`,document.baseURI).href}",
  );

  // The lightweight castle is made from large merged meshes. Mesh-centre and
  // general facade raycasts therefore put cards on the lower drum walls. Build
  // deterministic upper-rampart bands instead: front parapets first, then left
  // and right upper flanks, then the crown. Positions remain relative to the
  // fitted castle bounds so they survive future GLB optimisation.
  source=source.replace(
    /function deriveSurfaceAnchors\(limit\)\{[\s\S]*?return out\.slice\(0,limit\)\}/,
    `function deriveSurfaceAnchors(limit){
      const out=[];
      const bounds=new THREE.Box3().setFromObject(castleRoot),size=bounds.getSize(new THREE.Vector3());
      const min=bounds.min,max=bounds.max;
      const push=(x,y,z,nx,ny,nz)=>{if(out.length>=limit)return;out.push({position:new THREE.Vector3(x,y,z),normal:new THREE.Vector3(nx,ny,nz).normalize()})};
      const frontZ=max.z+.28;
      const backZ=min.z-.28;
      const leftX=min.x-.28;
      const rightX=max.x+.28;
      const rows=[.57,.68,.79,.88];
      for(const fy of rows){
        const y=min.y+size.y*fy;
        const cols=14;
        for(let c=0;c<cols&&out.length<limit;c++){
          const t=cols===1?.5:c/(cols-1);
          const x=THREE.MathUtils.lerp(min.x+size.x*.12,max.x-size.x*.12,t);
          push(x,y,frontZ,0,0,1);
        }
      }
      for(const fy of [.61,.73,.84]){
        const y=min.y+size.y*fy;
        const cols=6;
        for(let c=0;c<cols&&out.length<limit;c++){
          const t=(c+1)/(cols+1);
          const z=THREE.MathUtils.lerp(min.z+size.z*.18,max.z-size.z*.18,t);
          push(leftX,y,z,-1,0,0);
          push(rightX,y,z,1,0,0);
        }
      }
      const crownY=min.y+size.y*.93;
      for(let c=0;c<12&&out.length<limit;c++){
        const t=(c+.5)/12;
        const x=THREE.MathUtils.lerp(min.x+size.x*.2,max.x-size.x*.2,t);
        push(x,crownY,backZ,0,0,-1);
      }
      document.body.dataset.surfaceAnchorMode='upper-ramparts-v8';
      return out.slice(0,limit);
    }`,
  );

  source=source.replace(
    '<body data-renderer-status="loading">',
    '<body data-renderer-status="loading" data-performance-loader="draco-ramparts-v8">',
  );
  document.open();
  document.write(source);
  document.close();
})().catch(error=>{
  console.error('Castle loader failed; falling back to direct renderer.',error);
  const fallback=new URL('./card_castle.html',document.baseURI);
  fallback.search=location.search;
  location.replace(fallback.href);
});
</script>
</body>
</html>
