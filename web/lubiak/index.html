<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080504" />
  <title>LUBIAK — Freak Street, June 2001</title>
  <style>
    html,body,#stage{width:100%;height:100%;margin:0;overflow:hidden}
    html,body{background:#050303}
    #stage{background:#050303 url('lubiak-kathmandu-night.svg') center center/cover no-repeat fixed}
    #stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,8,15,.08) 0%,rgba(6,4,3,.03) 48%,rgba(5,3,2,.16) 100%)}
    body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#f0d7ad}
    canvas{position:relative;z-index:1;display:block;width:100%;height:100%;touch-action:none;opacity:.90}
    #hud{position:fixed;inset:0;pointer-events:none}
    .top{position:absolute;left:18px;top:18px;padding:10px 13px;border:1px solid #c47b3d66;background:#080504cc;backdrop-filter:blur(8px)}
    .title{letter-spacing:.18em;font-weight:800}.sub{margin-top:4px;font-size:11px;opacity:.72}
    #home{pointer-events:auto;position:absolute;right:18px;top:18px;color:#f0d7ad;text-decoration:none;border:1px solid #c47b3d88;background:#080504dd;padding:9px 12px}
    #bandcamp{pointer-events:auto;position:absolute;z-index:50;left:max(18px,env(safe-area-inset-left));right:auto;bottom:max(18px,env(safe-area-inset-bottom));width:min(430px,calc(100vw - 190px));min-width:220px;height:42px;overflow:hidden;border:1px solid #c47b3d66;background:#080504dd;backdrop-filter:blur(8px);transition:opacity .25s}
    #bandcamp iframe{display:block;border:0;width:100%;height:42px}
    #circus-youtube{position:absolute;left:8vw;top:21vh;width:min(39vw,620px);aspect-ratio:16/9;opacity:0;visibility:hidden;pointer-events:none;transform:perspective(1100px) rotateY(7deg) rotateZ(-.5deg);transform-origin:center;transition:opacity .28s,visibility .28s;filter:drop-shadow(0 10px 30px #000a);border:1px solid #e9c49a66;background:#080504}
    #circus-youtube.is-visible{opacity:1;visibility:visible;pointer-events:auto}
    #circus-youtube iframe{display:block;width:100%;height:100%;border:0;background:#000}
    #progress{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:min(460px,72vw);height:3px;background:#2b1710;transition:opacity .4s}
    #bar{height:100%;width:0;background:#d68a43;transition:width .15s linear}
    #status{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;white-space:nowrap;transition:opacity .4s}
    #help{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:205px;font-size:10px;opacity:.55;text-align:right}
    @media (max-width:900px){#circus-youtube{left:7vw;top:24vh;width:52vw}}
    @media (max-width:720px){#bandcamp{left:max(12px,env(safe-area-inset-left));right:auto;bottom:max(12px,env(safe-area-inset-bottom));width:min(54vw,330px);min-width:180px}#help{right:max(14px,env(safe-area-inset-right));bottom:182px}#circus-youtube{left:8vw;top:28vh;width:62vw}}
  </style>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script>
</head>
<body>
  <div id="stage"></div>

    <div class="top"><div class="title">LUBIAK</div><div class="sub">FREAK STREET → KUMARI GHAR PLACE · JUNE 2001 · NIGHT</div></div>
    <a id="home" href="../#/home">HOME</a>
    <div id="bandcamp"><iframe src="https://bandcamp.com/EmbeddedPlayer/album=3240607156/size=small/bgcol=ffffff/linkcol=0687f5/transparent=true/" seamless title="Rock manouche too:too by DJ Who"><a href="https://djwho.bandcamp.com/album/rock-manouche-too-too">Rock manouche too:too by DJ Who</a></iframe></div>
    <div id="circus-youtube" aria-hidden="true"><iframe src="https://www.youtube-nocookie.com/embed/24rx276VBk0?rel=0&playsinline=1" title="LUBIAK circus screen" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
    <div id="status">LOADING DISTRICT</div><div id="progress"><div id="bar"></div></div>
    <div id="help">DRAG · LOOK &nbsp; WHEEL / ↑↓ · MOVE &nbsp; A/D · STRAFE</div>
  </div>

</html>
