<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interactive Detective Statue</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090604}body{touch-action:none;user-select:none}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;cursor:grab}canvas.dragging{cursor:grabbing}#loading{position:fixed;inset:0;background:#090604;transition:opacity .35s;pointer-events:none}#loading.hidden{opacity:0}</style><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body><div id="stage" aria-label="Interactive 3D detective statue"></div><div id="loading" aria-hidden="true"></div><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'../vendor/GLTFLoader.js';import{MeshoptDecoder}from'../vendor/meshopt_decoder.module.js';
const stage=document.querySelector('#stage'),loading=document.querySelector('#loading'),scene=new THREE.Scene();scene.background=new THREE.Color(0x090604);scene.fog=new THREE.FogExp2(0x090604,.55);const camera=new THREE.PerspectiveCamera(34,1,.01,20);camera.position.set(0,.58,2.05);camera.lookAt(0,.5,0);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.enabled=true;stage.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe7bd,0x190605,1.65));const key=new THREE.DirectionalLight(0xffd39b,4.2);key.position.set(2.1,3.2,2.4);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x9bb9ff,2);rim.position.set(-2.2,1.6,-2.4);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(.82,96),new THREE.MeshStandardMaterial({color:0x210a06,roughness:.78,metalness:.18}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const root=new THREE.Group();root.rotation.y=-Math.PI/2;scene.add(root);const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);const load=u=>new Promise((a,b)=>loader.load(u,a,undefined,b));
const defs={head:['Head',18,30,12],torso:['Spine02',12,20,10],leftArm:['L_Upperarm',45,38,45],rightArm:['R_Upperarm',45,38,45],leftHand:['L_Hand',22,18,20],rightHand:['R_Hand',22,18,20]},targets=new Map(),extra=new Map(),meshes=[];const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),p=new THREE.Vector3(),bp=new THREE.Vector3(),q=new THREE.Quaternion(),e=new THREE.Euler();let selected=null,drag=false,px=0,py=0,ready=false;const clamp=(v,d)=>THREE.MathUtils.clamp(v,-THREE.MathUtils.degToRad(d),THREE.MathUtils.degToRad(d)),smooth=v=>v*v*(3-2*v),ramp=(t,a,b)=>smooth(THREE.MathUtils.clamp((t-a)/(b-a),0,1)),pulse=(t,a,b,c,d)=>ramp(t,a,b)*(1-ramp(t,c,d));
function register(s){for(const[id,d]of Object.entries(defs)){const bone=s.getObjectByName(d[0]);if(bone)targets.set(id,{bone,base:bone.quaternion.clone(),user:new THREE.Vector3(),limits:d.slice(1)});}for(const[id,n]of Object.entries({rightForearm:'R_Forearm',leftForearm:'L_Forearm'})){const bone=s.getObjectByName(n);if(bone)extra.set(id,{bone,base:bone.quaternion.clone()});}}
function offsets(t){const bow=pulse(t,3,7.5,12,15.5),flourish=pulse(t,9,11.5,17,20.5),breath=Math.sin(t*Math.PI*2/7)*.018;return{head:new THREE.Vector3(-.07*bow,.09*flourish+breath,-.025*bow),torso:new THREE.Vector3(.12*bow,-.035*flourish,breath*.55),leftArm:new THREE.Vector3(-.07*bow,.035*flourish,.10*bow),rightArm:new THREE.Vector3(-.12*flourish,.055*flourish,-.13*flourish),leftHand:new THREE.Vector3(.035*bow,-.025*flourish,.018*bow),rightHand:new THREE.Vector3(-.08*flourish,.025*flourish,-.025*flourish),rightForearm:new THREE.Vector3(.18*flourish,0,.018*flourish),leftForearm:new THREE.Vector3(-.08*bow,0,-.015*bow)}}
function pose(t){const a=offsets(t);for(const[id,x]of targets){const o=a[id]||p.set(0,0,0);e.set(o.x,o.y,o.z,'XYZ');x.bone.quaternion.copy(x.base).multiply(q.setFromEuler(e));e.set(x.user.x,x.user.y,x.user.z,'XYZ');x.bone.quaternion.multiply(q.setFromEuler(e));}for(const[id,x]of extra){const o=a[id];e.set(o.x,o.y,o.z,'XYZ');x.bone.quaternion.copy(x.base).multiply(q.setFromEuler(e));}}
function resolve(ev){const r=renderer.domElement.getBoundingClientRect();pointer.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(meshes,false)[0];if(!hit)return null;p.copy(hit.point);let best=null,dist=Infinity;for(const[id,x]of targets){x.bone.getWorldPosition(bp);const d=bp.distanceToSquared(p);if(d<dist){dist=d;best=id}}return dist<.11?best:null}
renderer.domElement.addEventListener('pointerdown',ev=>{if(!ready)return;selected=resolve(ev);drag=true;px=ev.clientX;py=ev.clientY;renderer.domElement.setPointerCapture(ev.pointerId);renderer.domElement.classList.add('dragging')});renderer.domElement.addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-px,dy=ev.clientY-py;px=ev.clientX;py=ev.clientY;if(!selected){root.rotation.y+=dx*.009;return}const x=targets.get(selected);if(selected==='head'||selected==='torso'){x.user.y+=dx*.005;x.user.x+=dy*.005}else if(selected.endsWith('Arm')){x.user.y+=dx*.0045;x.user.z+=dy*.0045}else{x.user.y+=dx*.004;x.user.x+=dy*.004}x.user.x=clamp(x.user.x,x.limits[0]);x.user.y=clamp(x.user.y,x.limits[1]);x.user.z=clamp(x.user.z,x.limits[2])});function end(ev){drag=false;selected=null;renderer.domElement.classList.remove('dragging');if(renderer.domElement.hasPointerCapture(ev.pointerId))renderer.domElement.releasePointerCapture(ev.pointerId)}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);resize();try{const g=await load('../assets/assets/models/detective_statue_rigged_web.glb');root.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;meshes.push(o)}});register(g.scene);ready=true;loading.classList.add('hidden')}catch(err){console.error(err);loading.classList.add('hidden')}const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);if(ready)pose(clock.getElapsedTime()%30);renderer.render(scene,camera)}frame();
</script></body></html>
