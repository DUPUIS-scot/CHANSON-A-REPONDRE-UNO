const defs={head:['Head',18,30,12],torso:['Spine02',12,20,10],leftArm:['L_Upperarm',45,38,45],rightArm:['R_Upperarm',45,38,45],leftHand:['L_Hand',22,18,20],rightHand:['R_Hand',22,18,20]},targets=new Map(),passive=new Map(),meshes=[];const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),p=new THREE.Vector3(),bp=new THREE.Vector3(),q=new THREE.Quaternion(),e=new THREE.Euler();const handWorldQ=new THREE.Quaternion(),rootWorldQ=new THREE.Quaternion(),gripQ=new THREE.Quaternion();let selected=null,drag=false,px=0,py=0,sx=0,sy=0,swipeSent=false,ready=false,coneHolder=null,leftHandBone=null;const clamp=(v,d)=>THREE.MathUtils.clamp(v,-THREE.MathUtils.degToRad(d),THREE.MathUtils.degToRad(d)),smooth=v=>v*v*(3-2*v),ramp=(t,a,b)=>smooth(THREE.MathUtils.clamp((t-a)/(b-a),0,1)),rad=d=>THREE.MathUtils.degToRad(d);
