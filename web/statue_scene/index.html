<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interactive Detective Statue</title><style>*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090604}body{touch-action:none;user-select:none}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;cursor:grab}canvas.dragging{cursor:grabbing}#loading{position:fixed;inset:0;background:#090604;transition:opacity .35s;pointer-events:none}#loading.hidden{opacity:0}</style><script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body><div id="stage" aria-label="Interactive 3D detective statue"></div><div id="loading" aria-hidden="true"></div><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'../vendor/GLTFLoader.js';import{MeshoptDecoder}from'../vendor/meshopt_decoder.module.js';
const stage=document.querySelector('#stage'),loading=document.querySelector('#loading'),scene=new THREE.Scene();scene.background=new THREE.Color(0x090604);scene.fog=new THREE.FogExp2(0x090604,.55);const camera=new THREE.PerspectiveCamera(34,1,.01,20);camera.position.set(0,.58,2.05);camera.lookAt(0,.5,0);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.enabled=true;stage.append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffe7bd,0x190605,1.65));const key=new THREE.DirectionalLight(0xffd39b,4.2);key.position.set(2.1,3.2,2.4);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x9bb9ff,2);rim.position.set(-2.2,1.6,-2.4);scene.add(rim);const floor=new THREE.Mesh(new THREE.CircleGeometry(.82,96),new THREE.MeshStandardMaterial({color:0x210a06,roughness:.78,metalness:.18}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const root=new THREE.Group();root.rotation.y=-Math.PI/2;scene.add(root);const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);const load=u=>new Promise((a,b)=>loader.load(u,a,undefined,b));
const defs={head:['Head',18,30,12],torso:['Spine02',12,20,10],leftArm:['L_Upperarm',45,38,45],rightArm:['R_Upperarm',45,38,45],leftHand:['L_Hand',22,18,20],rightHand:['R_Hand',22,18,20]},targets=new Map(),extra=new Map(),meshes=[];const ray=new THREE.Raycaster(),pointer=new THREE.Vector2(),p=new THREE.Vector3(),bp=new THREE.Vector3(),q=new THREE.Quaternion(),e=new THREE.Euler();const handWorldQ=new THREE.Quaternion(),rootWorldQ=new THREE.Quaternion(),gripQ=new THREE.Quaternion();let selected=null,drag=false,px=0,py=0,ready=false,coneHolder=null,leftHandBone=null;const clamp=(v,d)=>THREE.MathUtils.clamp(v,-THREE.MathUtils.degToRad(d),THREE.MathUtils.degToRad(d)),smooth=v=>v*v*(3-2*v),ramp=(t,a,b)=>smooth(THREE.MathUtils.clamp((t-a)/(b-a),0,1)),pulse=(t,a,b,c,d)=>ramp(t,a,b)*(1-ramp(t,c,d));
function register(s){for(const[id,d]of Object.entries(defs)){const bone=s.getObjectByName(d[0]);if(bone)targets.set(id,{bone,base:bone.quaternion.clone(),user:new THREE.Vector3(),limits:d.slice(1)});}for(const[id,n]of Object.entries({rightForearm:'R_Forearm',leftForearm:'L_Forearm'})){const bone=s.getObjectByName(n);if(bone)extra.set(id,{bone,base:bone.quaternion.clone()});}leftHandBone=s.getObjectByName('L_Hand')||null;}
function attachCone(cone){if(!leftHandBone)return;const box=new THREE.Box3().setFromObject(cone),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),height=Math.max(size.y,.001);cone.position.set(-center.x,-box.min.y,-center.z);cone.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});coneHolder=new THREE.Group();coneHolder.add(cone);coneHolder.scale.setScalar(.34/height);coneHolder.position.set(0,.012,0);gripQ.setFromEuler(new THREE.Euler(0,0,0,'XYZ'));leftHandBone.add(coneHolder);}
function damagedOffsets(t){const power=ramp(t,6,10.8),strike=ramp(t,11,11.55),hold=ramp(t,11.55,12.2)*(1-ramp(t,23,24.2)),collapse=ramp(t,23,25.6),reboot=t>=6&&t<11?Math.sin((t-6)*48)*(.038*(1-(t-6)/5)):0;const struggle=t>=15&&t<23?(Math.sin((t-15)*9)*.035+Math.sin((t-15)*23)*.012):0;const drop=t>=15&&t<23?(pulse(t,16.1,16.5,17.0,17.45)*.16+pulse(t,19.0,19.35,20.0,20.45)*.22+pulse(t,21.5,21.8,22.25,22.7)*.28):0;const salute=Math.max(0,(strike*hold)*(1-drop-collapse));const idleSag=.18*(1-power)+.08*power;const chest=t>=15&&t<23?Math.sin((t-15)*Math.PI*1.15)*.055:0;const stepped=t>=6&&t<11?Math.floor((t-6)*4)/20:0;return{head:new THREE.Vector3(.18*(1-power)+.04*collapse-reboot*.8,.015*reboot+stepped*.04,0),torso:new THREE.Vector3(idleSag+.20*collapse+chest,reboot*.55,.035*reboot),leftArm:new THREE.Vector3(-.18+reboot*.45,.05+reboot*.25,-1.48+reboot*.55-.18*collapse),rightArm:new THREE.Vector3(-.10*salute+reboot*.5,.08*salute+reboot*.25,-1.08*salute+struggle+reboot*.6+.95*collapse),leftHand:new THREE.Vector3(.22+reboot*.25,.05,-.08),rightHand:new THREE.Vector3(-.10*salute+struggle*.5,.06*salute,-.05*salute),rightForearm:new THREE.Vector3(1.18*salute+struggle*2.4-reboot*.6,0,.04*salute),leftForearm:new THREE.Vector3(-.58+reboot*.35,0,-.06)};}
function pose(t){const a=damagedOffsets(t);for(const[id,x]of targets){const o=a[id]||p.set(0,0,0);e.set(o.x,o.y,o.z,'XYZ');x.bone.quaternion.copy(x.base).multiply(q.setFromEuler(e));e.set(x.user.x,x.user.y,x.user.z,'XYZ');x.bone.quaternion.multiply(q.setFromEuler(e));}for(const[id,x]of extra){const o=a[id];if(!o)continue;e.set(o.x,o.y,o.z,'XYZ');x.bone.quaternion.copy(x.base).multiply(q.setFromEuler(e));}const collapse=ramp(t,23,25.6);const shudder=t>=6&&t<11?Math.sin((t-6)*54)*.012:0;root.position.y=-.055*collapse+shudder;root.rotation.x=.035+.10*collapse+shudder*.4;root.rotation.z=-.035*(1-ramp(t,6,11))-.085*collapse+shudder*.6;if(coneHolder&&leftHandBone){leftHandBone.getWorldQuaternion(handWorldQ);root.getWorldQuaternion(rootWorldQ);coneHolder.quaternion.copy(handWorldQ).invert().multiply(rootWorldQ).multiply(gripQ);}}
function resolve(ev){const r=renderer.domElement.getBoundingClientRect();pointer.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(meshes,false)[0];if(!hit)return null;p.copy(hit.point);let best=null,dist=Infinity;for(const[id,x]of targets){x.bone.getWorldPosition(bp);const d=bp.distanceToSquared(p);if(d<dist){dist=d;best=id}}return dist<.11?best:null}
renderer.domElement.addEventListener('pointerdown',ev=>{if(!ready)return;selected=resolve(ev);drag=true;px=ev.clientX;py=ev.clientY;renderer.domElement.setPointerCapture(ev.pointerId);renderer.domElement.classList.add('dragging')});renderer.domElement.addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-px,dy=ev.clientY-py;px=ev.clientX;py=ev.clientY;if(!selected){root.rotation.y+=dx*.009;return}const x=targets.get(selected);if(selected==='head'||selected==='torso'){x.user.y+=dx*.005;x.user.x+=dy*.005}else if(selected.endsWith('Arm')){x.user.y+=dx*.0045;x.user.z+=dy*.0045}else{x.user.y+=dx*.004;x.user.x+=dy*.004}x.user.x=clamp(x.user.x,x.limits[0]);x.user.y=clamp(x.user.y,x.limits[1]);x.user.z=clamp(x.user.z,x.limits[2])});function end(ev){drag=false;selected=null;renderer.domElement.classList.remove('dragging');if(renderer.domElement.hasPointerCapture(ev.pointerId))renderer.domElement.releasePointerCapture(ev.pointerId)}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}addEventListener('resize',resize);resize();try{const g=await load('../assets/assets/models/detective_statue_rigged_web.glb');root.add(g.scene);g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;meshes.push(o)}});register(g.scene);try{const cone=await load('../assets/assets/models/traffic_cone_web.glb');attachCone(cone.scene)}catch(coneErr){console.error('Cone load failed',coneErr)}ready=true;loading.classList.add('hidden')}catch(err){console.error(err);loading.classList.add('hidden')}const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);if(ready)pose(clock.getElapsedTime()%30);renderer.render(scene,camera)}frame();
</script></body></html>
