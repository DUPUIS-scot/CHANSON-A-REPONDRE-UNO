  <script>
    window.requestTurnstileToken = async function(siteKey) {
      if (!siteKey) throw new Error('Turnstile site key is missing.');

      for (let attempt = 0; attempt < 100 && !window.turnstile; attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
      if (!window.turnstile) throw new Error('Turnstile did not load.');

      return new Promise((resolve, reject) => {
        const container = document.createElement('div');
        container.setAttribute('aria-label', 'Security verification');
        Object.assign(container.style, {
          position: 'fixed',
          left: '50%',
          top: '50%',
          transform: 'translate(-50%, -50%)',
          zIndex: '2147483647'
        });
        document.body.appendChild(container);

        let widgetId;
        const cleanup = () => {
          try {
            if (widgetId !== undefined) window.turnstile.remove(widgetId);
          } catch (_) {}
          container.remove();
        };

        try {
          widgetId = window.turnstile.render(container, {
            sitekey: siteKey,
            execution: 'execute',
            appearance: 'interaction-only',
            theme: 'auto',
            callback: (token) => {
              cleanup();
              resolve(token);
            },
            'error-callback': (code) => {
              cleanup();
              reject(new Error(`Turnstile verification failed: ${code || 'unknown'}`));
            },
            'expired-callback': () => {
              cleanup();
              reject(new Error('Turnstile verification expired.'));
            },
            'timeout-callback': () => {
              cleanup();
              reject(new Error('Turnstile verification timed out.'));
            }
          });
          window.turnstile.execute(widgetId);
        } catch (error) {
          cleanup();
          reject(error);
        }
      });
    };
  </script>
