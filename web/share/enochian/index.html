<body><main class="card"><div class="hero" role="img" aria-label="Chanson à Répondre UNO social preview"></div><section class="body"><div class="eyebrow">CHANSON À RÉPONDRE UNO · ENOCHIAN TERMINAL</div><div class="title" id="trackName">DJ WHO · LAST 15 SEC</div><div class="meta" id="meta">DJ WHO · ENOCHIAN SIGNAL CAPTURE</div><div class="range" id="range">00:00.0 → 00:15.0</div><audio id="clip" controls preload="metadata"></audio><div class="controls"><button class="btn primary" id="play">▶ PLAY 15 SEC</button><a class="btn" href="/enochian-terminal/">OPEN TERMINAL</a></div><div class="status" id="status"></div></section><div class="foot">Chanson à Répondre UNO! · shared from the live Enochian Terminal</div></main>
<script>(function(){
 const tracks=[['AI Comptroller','/assets/assets/audio/ai_comptroller.mp3'],['Caesar-Spitter','/assets/assets/audio/caesar_spitter.mp3'],['The Kraken','/assets/assets/audio/the_kraken.mp3'],['HELIOGABAL//DESIGN','/assets/assets/audio/heliogabal_design.mp3'],['Vivid Void','/assets/assets/audio/vivid_void.mp3']];
 const p=new URLSearchParams(location.search);let i=parseInt(p.get('track')||'0',10);if(!Number.isFinite(i)||i<0||i>=tracks.length)i=0;let start=Math.max(0,Number(p.get('start'))||0),end=Math.max(start,Number(p.get('end'))||start+15);if(end-start>15.25)start=Math.max(0,end-15);
 const audio=document.getElementById('clip'),play=document.getElementById('play'),status=document.getElementById('status'),meta=document.getElementById('meta');audio.src=tracks[i][1];
 const fmt=t=>{t=Math.max(0,Number(t)||0);const m=Math.floor(t/60),s=(t-m*60).toFixed(1).padStart(4,'0');return String(m).padStart(2,'0')+':'+s};
 document.getElementById('trackName').textContent='DJ WHO · '+tracks[i][0];document.getElementById('range').textContent=fmt(start)+' → '+fmt(end)+' · 15 SEC';
 function decodeFx(v){try{if(!v)return[];v=v.replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';const bin=atob(v),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0)),data=JSON.parse(new TextDecoder().decode(bytes));return data&&data.v===1&&Array.isArray(data.r)?data.r:[]}catch(_){return[]}}
 const fx=decodeFx(p.get('fx'));meta.textContent=fx.length?'DJ WHO · ENOCHIAN SIGNAL CAPTURE · FX RECORDED':'DJ WHO · ENOCHIAN SIGNAL CAPTURE · DRY LEGACY LINK';
 let ctx,src,low,mid,high,filter,drive,delay,fb,wet,dry,master,fxTimer=0,startedAt=0;
 function curve(v){if(v<=0)return null;const arr=new Float32Array(1024),k=v*40;for(let j=0;j<arr.length;j++){const x=j*2/arr.length-1;arr[j]=(1+k)*x/(1+k*Math.abs(x))}return arr}
 async function ensureGraph(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();src=ctx.createMediaElementSource(audio);low=ctx.createBiquadFilter();low.type='lowshelf';low.frequency.value=160;mid=ctx.createBiquadFilter();mid.type='peaking';mid.frequency.value=1000;high=ctx.createBiquadFilter();high.type='highshelf';high.frequency.value=6500;filter=ctx.createBiquadFilter();filter.type='lowpass';drive=ctx.createWaveShaper();delay=ctx.createDelay(1);fb=ctx.createGain();wet=ctx.createGain();dry=ctx.createGain();master=ctx.createGain();dry.gain.value=1;master.gain.value=1;src.connect(low).connect(mid).connect(high).connect(filter).connect(drive);drive.connect(dry).connect(master);drive.connect(delay).connect(fb).connect(delay);delay.connect(wet).connect(master);master.connect(ctx.destination)}if(ctx.state!=='running')await ctx.resume()}
 function applyFrame(r){if(!r||!ctx)return;low.gain.value=Number(r[1])||0;mid.gain.value=Number(r[2])||0;high.gain.value=Number(r[3])||0;const f=Number(r[4]);filter.frequency.value=80*Math.pow(250,(Number.isFinite(f)?f:1000)/1000);drive.curve=curve((Number(r[5])||0)/100);delay.delayTime.value=Math.max(0,Math.min(1,Number(r[6])||0));fb.gain.value=Math.max(0,Math.min(.95,Number(r[7])||0));wet.gain.value=Math.max(0,Math.min(1,Number(r[8])||0));audio.playbackRate=Math.max(.25,Math.min(4,Number(r[9])||1));}
 function startFxReplay(){clearInterval(fxTimer);if(!fx.length)return;startedAt=performance.now();let k=0;applyFrame(fx[0]);fxTimer=setInterval(()=>{const elapsed=performance.now()-startedAt;while(k+1<fx.length&&fx[k+1][0]<=elapsed)k++;applyFrame(fx[k]);if(k>=fx.length-1&&elapsed>fx[k][0]+500)clearInterval(fxTimer)},40)}
 function cue(){try{audio.currentTime=start}catch(_){}}
 audio.addEventListener('loadedmetadata',()=>{end=Math.min(end,audio.duration||end);start=Math.min(start,end);cue()});
 audio.addEventListener('timeupdate',()=>{if(audio.currentTime>=end-.03){audio.pause();clearInterval(fxTimer);cue();play.textContent='▶ REPLAY 15 SEC';status.textContent=fx.length?'ENOCHIAN FX CAPTURE COMPLETE':'ENOCHIAN CAPTURE COMPLETE'}});
 audio.addEventListener('play',()=>{play.textContent='❚❚ PAUSE';status.textContent=fx.length?'PLAYING RECORDED FX PERFORMANCE':'PLAYING SHARED ENOCHIAN CAPTURE'});audio.addEventListener('pause',()=>{if(audio.currentTime<end-.03)play.textContent='▶ PLAY 15 SEC'});
 play.addEventListener('click',async()=>{if(!audio.paused){audio.pause();clearInterval(fxTimer);return}if(audio.currentTime<start||audio.currentTime>=end-.03)cue();try{await ensureGraph();startFxReplay();await audio.play()}catch(_){status.textContent='PRESS THE AUDIO PLAYER TO START'}});
 audio.addEventListener('play',async()=>{try{await ensureGraph();startFxReplay()}catch(_){}});
