name: uno_chanson_2
description: "Chanson à Répondre UNO — the certified v3.072 card experience."
publish_to: 'none'
version: 3.7.2+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  go_router: 17.0.1
  video_player: ^2.13.0
  video_player_media_kit: ^2.0.0
  media_kit_libs_windows_video: any
  media_kit_libs_linux: any
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  http: ^1.6.0
  http_parser: ^4.1.2
  mime: ^2.0.0
  flutter_markdown: ^0.7.7+1
  flutter_staggered_grid_view: ^0.7.0
  animations: ^2.2.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  path: ^1.9.1
  supabase_flutter: ^2.16.0
  youtube_player_iframe: 6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  objective_c: 9.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/utility_background.png
    - assets/models/
    - assets/cards/final_import/
    - assets/cards/category_versos/
    - assets/decks/chanson_a_repondre_brio/
    - assets/decks/chanson_a_repondre_brio/cards/
    - assets/hp/
    - assets/videos/
    - assets/audio/
    - assets/json/cards.json
    - assets/json/ai_comptroller_enochian.json
    - assets/json/caesar_spitter_enochian_compact.json
    - assets/json/the_kraken_enochian_compact.json
    - assets/json/heliogabal_design_enochian_compact.json
    - assets/json/vivid_void_enochian_compact.json
